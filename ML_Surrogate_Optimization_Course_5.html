    [MC('q2a', 'Model properties', 'Which surrogate is piecewise constant and therefore has zero gradient almost everywhere?', ['Random forest', 'Gaussian process with squared-exponential kernel', 'Cubic RBF', 'Quadratic polynomial'], 0, 'Trees predict constants per region.', ['Correct.', 'Smooth.', 'Smooth.', 'Smooth.']),
     MC('q2b', 'Model properties', 'Which surrogate provides a built-in predictive uncertainty?', ['Gaussian process', 'Cubic RBF interpolant', 'Ordinary quadratic response surface (prediction only)', 'Single regression tree'], 0, 'GPs give a predictive distribution.', ['Correct.', 'No uncertainty by default.', 'Only via additional statistical analysis.', 'No.'])],
    [MS('q3a', 'Model choice', 'You have 25 noise-free FEA runs of a smooth stress response in 2 variables and want to optimize with gradients. Select ALL suitable choices.', ['Gaussian process', 'Cubic RBF', 'Quadratic polynomial as a baseline', 'Random forest as the main surrogate'], [0, 1, 2], 'Smooth models suit smooth deterministic data and gradient-based optimization.', ['Suitable.', 'Suitable.', 'A good baseline.', 'Non-smooth; poor for gradients.']),
     MS('q3b', 'Model choice', 'Select ALL situations favouring a random forest over a GP.', ['Hundreds of noisy shop-floor records with categorical machine IDs', 'Many input variables of mixed types', 'Twenty noise-free CFD runs of a smooth response', 'Need for a smooth, differentiable surrogate'], [0, 1], 'Forests handle noise, categories and many variables; GPs suit small smooth deterministic data.', ['Favours forest.', 'Favours forest.', 'Favours GP/RBF.', 'Favours GP/RBF/polynomial.'])],
    [GEN('q4g', 'Network parameters', rng => { const h = 3 + rng.int(6); return { stem: `A neural network has 2 inputs, one hidden layer of ${h} neurons, and 1 output (fully connected, with biases). How many trainable parameters?`, answer: 2 * h + h + h + 1, tolAbs: 0.01, unit: 'parameters', explain: `Weights 2×${h} + ${h}×1 = ${3 * h}; biases ${h} + 1 = ${h + 1}; total ${4 * h + 1}.` }; }),

const GPX = (() => { const ell = 0.5, k12 = Math.exp(-1 / (2 * ell * ell)), ks = Math.exp(-0.25 / (2 * ell * ell)); const det = 1 - k12 * k12; const a1 = (1 - k12 * 0) / det, a2 = (-k12 * 1) / det; const mu = ks * (a1 + a2); const v = ks * (1 - k12) / det; const var_ = 1 - 2 * ks * v; return { ell, k12, ks, det, a1, a2, mu, var: var_, sd: Math.sqrt(var_) }; })();

  id: 'm09', num: 9, title: 'Gaussian processes and uncertainty', short: 'Mean prediction and predictive uncertainty; kernels and length scales; observation noise vs limited knowledge; scaling and assumptions; a numerical example.', mins: 50,

  objectives: ['Explain the GP mean and predictive standard deviation and how they change with data.', 'Describe the role of the kernel and length scale.', 'Distinguish observation noise from uncertainty due to limited data.', 'Compute a small GP prediction by hand.', 'Explain why GP uncertainty bands depend on assumptions and are not guarantees.'],
  intro: '<p>Gaussian processes are the standard surrogate for expensive simulators because they say not only “what” but also “how sure” — according to their assumptions.</p>',

    { id: 'm09l1', title: 'Mean prediction and predictive uncertainty', mins: 11, html: C({
      title: 'A best guess and a band of plausible values',
      intuition: '<p>A GP predicts at each input a <b>mean</b> μ(<b>x</b>) (best guess) and a <b>standard deviation</b> σ(<b>x</b>) (how uncertain the model is). With noise-free data, σ = 0 at the samples and grows between and beyond them. Adding a sample shrinks uncertainty around it.</p>',
      visual: V('gp-1d', 'Interactive GP: tap or click to add observations; adjust the length scale and nugget; the band is μ ± 1.96σ.', 'One-dimensional plot of R versus fin gap with observations, the GP mean line and a shaded band. The band pinches to zero width at noise-free observations and widens between and beyond them. Sliders change length scale and nugget; clicking adds observations.'),
      math: '<p>With training inputs <b>X</b>, standardized targets <b>y</b>, kernel matrix <b>K</b> (<span class="iv">K</span><sub>ij</sub> = <span class="iv">k</span>(<b>x</b><sub>i</sub>, <b>x</b><sub>j</sub>)) and a new input <b>x</b>*:</p>' + EQ('<var>μ</var>(<b>x</b>*) = <b>k</b><sub>*</sub><sup>T</sup> (<b>K</b> + <var>σ</var><sub>n</sub><sup>2</sup><b>I</b>)<sup>−1</sup> <b>y</b>, &nbsp;&nbsp; <var>σ</var><sup>2</sup>(<b>x</b>*) = <var>k</var>(<b>x</b>*, <b>x</b>*) − <b>k</b><sub>*</sub><sup>T</sup> (<b>K</b> + <var>σ</var><sub>n</sub><sup>2</sup><b>I</b>)<sup>−1</sup> <b>k</b><sub>*</sub>') + SYM([['k<sub>*</sub>', 'vector of kernel values k(x<sub>i</sub>, x*)', '—'], ['σ<sub>n</sub>²', 'observation-noise variance (nugget); ≈0 for deterministic simulators', '(units of y)²'], ['I', 'identity matrix', '—']]) + '<p>Implementations solve these with a Cholesky factorization instead of an explicit inverse. This page centres outputs on their mean and divides by their standard deviation; predictions are transformed back.</p>',
      app: '<p>In the heat-sink study the GP band is widest in gaps between samples and beyond the outermost samples — often near the steep small-gap edge, where <span class="iv">R</span> rises quickly. That is exactly where you should not trust predictions, and where sequential sampling may add points.</p>',
      predict: ['For a noise-free GP, what is σ at an observed input?', 'Zero (up to the tiny numerical nugget): the model reproduces the observed value exactly.'],
      mis: ['The 95% band contains the true function with 95% probability, guaranteed.', 'Only if the GP assumptions (kernel, length scale, mean, stationarity) match reality. With a wrong length scale the true curve can lie far outside the band.'],
      tip: '<p>Always overlay validation points on the band: if far more than ~5% fall outside the 95% band, the uncertainty is poorly calibrated.</p>',
      take: 'GP gives μ(x) and σ(x); σ is zero at noise-free data and grows away from them.'
    }) },
    { id: 'm09l2', title: 'Kernels, length scales and scaling', mins: 10, html: C({
      title: 'How the kernel encodes “nearby means similar”',
      intuition: '<p>The <b>kernel</b> (covariance function) states how strongly outputs at two inputs are correlated. The squared-exponential (SE, also RBF) kernel says correlation decays smoothly with distance. The <b>length scale</b> ℓ sets how far “nearby” extends: short ℓ → wiggly functions and fast-growing uncertainty between samples; long ℓ → smooth functions and confident interpolation.</p>',
      visual: V('kernel-shape', 'Left: kernel correlation versus distance for three length scales. Right: random functions drawn from the GP prior with those length scales.', 'Left: three bell-shaped decay curves, narrow for ℓ = 0.05, wider for 0.15 and 0.40. Right: three random curves — very wiggly for ℓ = 0.05, moderately smooth for 0.15, gently varying for 0.40.'),
      math: EQ('<var>k</var>(<b>x</b>, <b>x</b>′) = <var>σ</var><sub>f</sub><sup>2</sup> exp( − ' + FR('1', '2') + ' Σ<sub><var>j</var></sub> ' + FR('(<var>x</var><sub><var>j</var></sub> − <var>x</var>′<sub><var>j</var></sub>)<sup>2</sup>', '<var>ℓ</var><sub><var>j</var></sub><sup>2</sup>') + ' )') + SYM([['σ<sub>f</sub>²', 'signal variance: typical squared deviation of f from its mean', '(units of y)²'], ['ℓ<sub>j</sub>', 'length scale for variable j (anisotropic if different per variable)', 'units of x<sub>j</sub> (scaled units here)']]) + '<p>Hyperparameters (σ<sub>f</sub>, ℓ<sub>j</sub>, σ<sub>n</sub>) are usually chosen by maximizing the <b>marginal likelihood</b>; this page uses a simple grid search over ℓ (disclosed in each demo). Because ℓ is measured in input units, <b>scaling inputs</b> to [0, 1] makes one default sensible for all variables; otherwise a single ℓ is meaningless when units differ.</p>',
      app: '<p>For the heat sink, fitted length scales in scaled units are typically around 0.2–0.5 in both directions. A process with a sharp transition (e.g., onset of laminar–turbulent transition, or AM keyhole porosity) breaks the SE assumption of uniform smoothness; special kernels or input transformations are then needed.</p>',
      predict: ['You set ℓ = 0.03 (scaled) with 6 samples over [0, 1]. What will the GP mean look like between samples?', 'It will quickly revert to the overall mean between samples (spiky “bumps” at the data) and the uncertainty band will be wide almost everywhere — the length scale is far shorter than the sample spacing.'],
      mis: ['The kernel choice is a minor detail.', 'The kernel is the GP’s core assumption about the function; it controls both predictions and uncertainty.'],
      tip: '<p>Use anisotropic length scales (one per variable) on scaled inputs; inspect the fitted values — a very large ℓ suggests the variable barely matters.</p>',
      take: 'Kernel + length scale = assumed smoothness; scale inputs so length scales are comparable.'
    }) },
    { id: 'm09l3', title: 'Noise versus limited knowledge, and a numerical example', mins: 12, html: C({
      title: 'Two sources of uncertainty',
      intuition: '<p><b>Aleatory</b> uncertainty (observation noise): repeat the experiment and you get a different value. <b>Epistemic</b> uncertainty (limited knowledge): you have not observed the function there yet; more samples reduce it. Deterministic simulators have (essentially) no noise, so GP uncertainty is epistemic. Experiments have both. The nugget term σ<sub>n</sub>² lets the GP stop chasing noise.</p>',
      visual: V('gp-noise', 'The same noisy data fitted with a near-zero nugget (forced interpolation) and with a noise term.', 'Two panels. Left: the GP mean passes through every noisy point, wiggling, with a narrow band at the points. Right: with a noise term, the mean is smoother and closer to the true curve and the band does not pinch to zero at the data.'),
      math: '<p><b>Worked example (noise-free, zero prior mean, σ<sub>f</sub> = 1, ℓ = 0.5).</b> Observations: <span class="iv">y</span>(0) = 1, <span class="iv">y</span>(1) = 0. Predict at <span class="iv">x</span>* = 0.5.</p>' +
        `<ol><li>Kernel between the observations: k(0,1) = exp(−1²/(2·0.5²)) = e<sup>−2</sup> = ${GPX.k12.toFixed(4)}. So <b>K</b> = [[1, ${GPX.k12.toFixed(4)}], [${GPX.k12.toFixed(4)}, 1]].</li>
         <li>Kernel to the query: k(0, 0.5) = k(1, 0.5) = exp(−0.25/0.5) = e<sup>−0.5</sup> = ${GPX.ks.toFixed(4)}.</li>
         <li><b>α</b> = <b>K</b><sup>−1</sup><b>y</b>: det = 1 − ${GPX.k12.toFixed(4)}² = ${GPX.det.toFixed(4)}; α = (1/det)·[1, −${GPX.k12.toFixed(4)}] = [${GPX.a1.toFixed(4)}, ${GPX.a2.toFixed(4)}].</li>
         <li>Mean: μ(0.5) = ${GPX.ks.toFixed(4)} × (${GPX.a1.toFixed(4)} + (${GPX.a2.toFixed(4)})) = <b>${GPX.mu.toFixed(4)}</b>.</li>
         <li>Variance: σ² = 1 − <b>k</b><sub>*</sub><sup>T</sup><b>K</b><sup>−1</sup><b>k</b><sub>*</sub> = 1 − 2 × ${GPX.ks.toFixed(4)}² × (1 − ${GPX.k12.toFixed(4)})/det = <b>${GPX.var.toFixed(4)}</b>, so σ = ${GPX.sd.toFixed(4)}.</li></ol>` +
        '<p>Interpretation: the GP mean is a <b>covariance-weighted combination</b> of the observations, μ(x*) = <b>w</b><sup>T</sup><b>y</b> with weights <b>w</b> = <b>K</b><sup>−1</sup><b>k</b><sub>*</sub> = [' + (GPX.ks * (1 - GPX.k12) / GPX.det).toFixed(4) + ', ' + (GPX.ks * (1 - GPX.k12) / GPX.det).toFixed(4) + ']. By symmetry both observations get the same weight, but the weights are <i>not</i> required to sum to 1 (here they sum to ' + (2 * GPX.ks * (1 - GPX.k12) / GPX.det).toFixed(3) + '), so the prediction is not an arithmetic average: μ(0.5) = ' + GPX.mu.toFixed(4) + ', slightly <i>above</i> 0.5. The weights depend on how strongly the query correlates with each observation (k<sub>*</sub>) and how the observations correlate with each other (<b>K</b>). Far from all data the weights shrink towards 0 and μ returns to the prior mean. The uncertainty here is substantial because ℓ is comparable to the spacing.</p>',
      app: '<p>Noisy experiments (AM porosity, machining roughness): include a noise term and estimate it, ideally checked against repeat tests. Deterministic CFD: use a tiny nugget for numerical stability only — but note that CFD can show small “numerical noise” from meshing and convergence, which a small fitted nugget can absorb.</p>',
      predict: ['Single observation y(0) = 2 with zero prior mean, σ<sub>f</sub> = 1, ℓ = 1, no noise. What is μ(1)?', 'μ(1) = k(1,0)·y/k(0,0) = e<sup>−0.5</sup> × 2 ≈ 1.213. The prediction decays toward the prior mean 0 with distance.'],
      mis: ['A wider uncertainty band means the simulator is noisier there.', 'For deterministic simulators, the band reflects lack of data and model assumptions, not noise.'],
      tip: '<p>Report which uncertainty the GP represents (epistemic only, or including noise) and how hyperparameters were chosen. Uncertainty bands are model-dependent and are not guarantees.</p>',
      take: 'Noise (aleatory) vs limited data (epistemic); GP bands reflect assumptions — verify and calibrate.'
    }) }
  ],
  flashcards: [
    FC('What two quantities does a GP predict at each input?', 'A mean μ(x) and a standard deviation σ(x).', 'μ is the surrogate prediction; σ guides sampling.'),
    FC('What is σ(x) at a noise-free observation?', 'Zero (up to numerical nugget).', 'GP interpolates deterministic simulator data.'),
    FC('What does the length scale ℓ control?', 'How quickly correlation decays with distance: smoothness of functions and growth of uncertainty between samples.', 'Fitted ℓ ≈ 0.2–0.5 (scaled) for the heat sink.'),
    FC('Why scale inputs before fitting a GP?', 'Length scales are in input units; scaling makes them comparable and defaults sensible.', 'mm vs kg would otherwise distort distances.'),
    FC('Distinguish aleatory and epistemic uncertainty.', 'Aleatory: inherent randomness/noise. Epistemic: lack of knowledge, reducible by more data.', 'CFD surrogate uncertainty is mainly epistemic.'),
    FC('What is the nugget in a GP?', 'A diagonal term σₙ² added to K representing observation noise and improving numerical stability.', 'Use a fitted nugget for noisy experiments.'),
    FC('Is a GP 95% band a guarantee?', 'No — it is valid only if the GP assumptions match the function; check calibration with validation data.', 'Wrong ℓ → overconfident bands.'),
    FC('How are GP hyperparameters usually chosen?', 'By maximizing the (log) marginal likelihood, sometimes with priors or multiple restarts.', 'scikit-learn does this in fit().'),
    FC('In the worked example, why is the GP mean midway between y(0)=1 and y(1)=0 equal to about 0.534 rather than 0.5?', 'The GP mean is a covariance-weighted combination wᵀy with w = K⁻¹k*. Each observation gets weight ≈ 0.534; the weights need not sum to 1, so the result is not an arithmetic average. Far from the data the weights shrink and μ returns to the prior mean (0).', 'Kriging-type predictors weight data by correlation, not by simple averaging.'),
    FC('Give the predictive mean formula of a GP.', 'μ(x*) = k*ᵀ (K + σₙ²I)⁻¹ y.', 'Computed via Cholesky in practice.')
  ],
  quiz: [
    [GEN('q1g', 'One-point GP', rng => { const y = [1, 2, 3][rng.int(3)], ell = [0.5, 1, 2][rng.int(3)], x = [0.5, 1][rng.int(2)]; const k = Math.exp(-(x * x) / (2 * ell * ell)); return { stem: `A noise-free GP with zero prior mean, σ_f = 1 and SE kernel ℓ = ${ell} has one observation y(0) = ${y}. Compute the predictive mean μ(${x}).`, answer: k * y, tolAbs: 0.003, unit: '', explain: `k(${x},0) = exp(−${x}²/(2·${ell}²)) = ${k.toFixed(4)}; μ = k·y/k(0,0) = ${k.toFixed(4)} × ${y} = ${(k * y).toFixed(4)}.` }; }),
     GEN('q1h', 'One-point GP', rng => { const ell = [0.5, 1, 2][rng.int(3)], x = [0.5, 1, 1.5][rng.int(3)]; const k = Math.exp(-(x * x) / (2 * ell * ell)); return { stem: `Same setting (noise-free, σ_f = 1, ℓ = ${ell}, one observation at x = 0). What is the predictive standard deviation σ at x = ${x}?`, answer: Math.sqrt(1 - k * k), tolAbs: 0.003, unit: '', explain: `σ² = 1 − k² with k = ${k.toFixed(4)} → σ = √(1 − ${(k * k).toFixed(4)}) = ${Math.sqrt(1 - k * k).toFixed(4)}.` }; })],
    [MC('q2a', 'Uncertainty behaviour', 'For a noise-free GP, where is the predictive standard deviation largest within the plotted range?', ['Far from all observations', 'At the observations', 'Where the mean is largest', 'Uniform everywhere'], 0, 'Uncertainty grows with distance from data.', ['Correct.', 'It is zero there.', 'Unrelated to the mean value.', 'It varies.']),
     MC('q2b', 'Uncertainty behaviour', 'Adding a new noise-free observation at x₀ does what to σ(x) for x near x₀?', ['Reduces it (to zero at x₀)', 'Increases it', 'Leaves it unchanged', 'Makes it negative'], 0, 'New information reduces epistemic uncertainty locally.', ['Correct.', 'No.', 'No.', 'Variances cannot be negative.'])],
    [MC('q3a', 'Length scale', 'Compared with ℓ = 0.4, a GP with ℓ = 0.05 (scaled units, samples spaced 0.2 apart) will…', ['revert toward the mean between samples and show wide bands there', 'produce a smoother mean curve', 'have narrower bands everywhere', 'ignore the data'], 0, 'Short ℓ means little correlation between samples spaced far apart relative to ℓ.', ['Correct.', 'Smoother corresponds to longer ℓ.', 'Wider bands between samples.', 'It still interpolates the data.']),
     MC('q3b', 'Length scale', 'A fitted anisotropic GP gives ℓ_t = 25 (scaled units) for one input. What does this suggest?', ['The output varies very little with that input over its range', 'That input is the most important', 'The fit failed', 'The input must be removed from the bounds'], 0, 'A length scale much longer than the range means near-constant dependence.', ['Correct.', 'The opposite.', 'Not necessarily.', 'Not implied.'])],
    [MC('q4a', 'Noise vs knowledge', 'A deterministic CFD-based GP shows a wide band at small fin gaps. The best interpretation is…', ['Limited data/steep behaviour there: epistemic uncertainty', 'CFD is noisy at small gaps', 'The heat sink is unsafe there', 'The GP is overfitting'], 0, 'Deterministic data imply epistemic uncertainty.', ['Correct.', 'Deterministic solver.', 'Uncertainty is about the model, not safety.', 'Not indicated.']),
     MC('q4b', 'Noise vs knowledge', 'For noisy AM porosity measurements, what should the GP include?', ['A noise (nugget) term estimated from data or repeats', 'Zero nugget to interpolate every measurement', 'A shorter length scale', 'A neural network instead'], 0, 'A noise term prevents chasing measurement scatter.', ['Correct.', 'Interpolating noise is overfitting.', 'Would worsen noise-chasing.', 'Not necessary.'])],
    [MS('q5a', 'Assumptions', 'Select ALL factors that change a GP’s uncertainty band.', ['Kernel choice', 'Length-scale values', 'Input scaling', 'Locations of observations'], [0, 1, 2, 3], 'All of these affect σ(x).', ['Yes.', 'Yes.', 'Yes.', 'Yes.']),
     MS('q5b', 'Assumptions', 'Select ALL correct statements about GP 95% bands.', ['They are conditional on the model assumptions', 'They can be checked against validation data', 'They guarantee containment of the true function 95% of the time', 'For deterministic simulators they mainly represent epistemic uncertainty'], [0, 1, 3], 'No guarantee without correct assumptions.', ['Correct.', 'Correct.', 'Not guaranteed.', 'Correct.'])],
    [GEN('q6g', 'Calibration', rng => { const n = [40, 60, 100][rng.int(3)]; const out = Math.round(n * [0.05, 0.25, 0.4][rng.int(3)]); return { stem: `Of ${n} validation points, ${out} fall outside the GP’s 95% band. What percentage fall outside?`, answer: 100 * out / n, tolAbs: 0.1, unit: '%', explain: `${out}/${n} = ${(100 * out / n).toFixed(1)}%. ${100 * out / n > 10 ? 'Much more than ~5%: the bands are overconfident (poorly calibrated).' : 'Close to the nominal 5%: reasonably calibrated.'}` }; }),
     MC('q6b', 'Calibration', 'If 35% of validation points fall outside a GP’s nominal 95% band, the bands are…', ['overconfident (too narrow)', 'underconfident (too wide)', 'perfectly calibrated', 'irrelevant to optimization'], 0, 'Too many misses → bands too narrow.', ['Correct.', 'Underconfident bands would contain nearly all points.', 'Nominal is ~5% outside.', 'Uncertainty drives Bayesian optimization.'])]
  ]
});

COURSE.modules.push({
  id: 'm10', num: 10, title: 'Optimization foundations', short: 'Objectives, bounds and constraints; minimization vs maximization; local vs global optima; gradient-based vs derivative-free methods; Pareto fronts; surrogate optimum vs true optimum.', mins: 50,
  prereq: ['Module 3 (gradients)', 'Module 6 (problem formulation)'], prereqModules: ['m06'],
  objectives: ['Write an optimization problem in standard form with bounds and constraints.', 'Convert maximization to minimization.', 'Distinguish local and global optima and choose between gradient-based and derivative-free methods.', 'Interpret a Pareto front for two competing objectives.', 'Explain the difference between optimizing a surrogate and finding the true physical optimum.'],
  intro: '<p>Before combining surrogates with optimizers, we need the optimizer’s view of the world: objectives, constraints and the shapes of landscapes.</p>',
  labs: ['lab07'],
  lessons: [
    { id: 'm10l1', title: 'Objectives, bounds, constraints; minimization and maximization', mins: 10, html: C({
      title: 'Standard form and feasibility',
      intuition: '<p>Optimizers solve problems in a standard form: minimize an objective subject to inequality constraints <span class="iv">g</span> ≤ 0, equality constraints <span class="iv">h</span> = 0 and bounds. To maximize efficiency, minimize its negative. A design satisfying every constraint is <b>feasible</b>; the feasible region can be much smaller than the bounded box — in the heat sink only about one-tenth of it.</p>',
      visual: V('case-map', 'Objective contours, infeasible regions and the constrained optimum of the heat-sink problem.', 'Map of R with contours, red-shaded infeasible regions bounded by the mass limit (solid red) and air-temperature limit (dashed red), and the constrained optimum star on the mass boundary.'),
      math: EQ('min<sub><b>x</b></sub> <var>f</var>(<b>x</b>) &nbsp; s.t. &nbsp; <var>g</var><sub><var>j</var></sub>(<b>x</b>) ≤ 0, &nbsp; <var>h</var><sub><var>k</var></sub>(<b>x</b>) = 0, &nbsp; <b>x</b><sub>L</sub> ≤ <b>x</b> ≤ <b>x</b><sub>U</sub>; &nbsp;&nbsp; max <var>η</var>(<b>x</b>) ⇔ min [−<var>η</var>(<b>x</b>)]') + '<p>Penalty approach (used in this page’s demos): minimize <span class="iv">f</span>(<b>x</b>) + Σ<sub>j</sub> <span class="iv">c</span><sub>j</sub> max(0, <span class="iv">g</span><sub>j</sub>(<b>x</b>)/<span class="iv">g</span><sub>j,ref</sub>), with normalized constraints and large weights <span class="iv">c</span><sub>j</sub>. SciPy’s <code>minimize(method="SLSQP")</code> handles constraints directly.</p>',
      app: '<p>Pump design: maximize efficiency η ⇒ minimize −η, subject to head ≥ required (written as required − head ≤ 0) and NPSH margin constraints. Structural: minimize mass subject to stress − allowable ≤ 0.</p>',
      predict: ['You want to maximize heat-exchanger effectiveness ε. What do you pass to a minimizer?', '−ε (or 1 − ε). The optimum design is the same; only the sign of the objective changes.'],
      mis: ['Bounds and constraints are the same thing.', 'Bounds are simple box limits on variables; constraints are general functions of the design (often expensive responses).'],
      tip: '<p>Normalize constraints by their limits (e.g., <span class="iv">m</span>/0.070 − 1 ≤ 0) so that violations of different units are comparable.</p>',
      take: 'Standard form: minimize f subject to g ≤ 0 and bounds; maximize by minimizing the negative.'
    }) },
    { id: 'm10l2', title: 'Local vs global optima; gradient-based vs derivative-free methods', mins: 12, html: C({
      title: 'Landscapes with more than one valley',
      intuition: '<p>A <b>local minimum</b> is lowest within its neighbourhood; the <b>global minimum</b> is lowest over the whole feasible region. <b>Gradient-based</b> methods (gradient descent, quasi-Newton BFGS, SLSQP) follow slopes efficiently to a nearby local minimum. <b>Derivative-free</b> methods (Nelder–Mead, pattern search, grid/random search, evolutionary algorithms) use only function values; some explore globally but need many evaluations — affordable on a cheap surrogate, unaffordable on CFD.</p>',
      visual: V('multimodal-1d', 'Interactive: gradient descent from different starting points on a synthetic multimodal function.', 'A wavy curve with several valleys. Points trace gradient-descent iterates from a chosen start to the nearest valley bottom; a star marks the global minimum found by a dense grid. Some starts reach it; others are trapped in local minima.'),
      math: EQ('gradient step: &nbsp; <b>x</b><sub><var>k</var>+1</sub> = <b>x</b><sub><var>k</var></sub> − <var>α</var> ∇<var>f</var>(<b>x</b><sub><var>k</var></sub>)') + SYM([['α', 'step size (learning rate)', 'units of x² per unit f'], ['∇f', 'gradient', 'units of f per unit x']]) + '<p>Necessary condition for an interior local minimum: ∇<span class="iv">f</span> = 0. At a constrained minimum, the objective gradient is balanced by active-constraint gradients (Karush–Kuhn–Tucker conditions) — no need to compute these by hand here.</p>',
      app: '<p><b>Multi-start</b> strategy: run a local optimizer from many starting points (e.g., an LHS of starts) and keep the best — cheap on a surrogate. This page’s surrogate optimizer uses a dense grid followed by Nelder–Mead refinement from the best few grid points.</p>',
      predict: ['On a smooth surrogate with one valley, which is more efficient: Nelder–Mead or BFGS with analytic gradients?', 'BFGS with gradients typically converges in far fewer evaluations on smooth problems. Derivative-free methods shine when gradients are unavailable or the function is noisy or non-smooth.'],
      mis: ['A converged optimizer has found the global optimum.', 'Convergence means a local stopping criterion was met. Without global search or problem structure (e.g., convexity), global optimality is not established.'],
      tip: '<p>Never claim global optimality from a single local run. Say “best design found” and describe the search (multi-start, grid, budget).</p>',
      take: 'Gradient methods: fast, local. Derivative-free/global methods: more robust, more evaluations — fine on surrogates.'
    }) },
    { id: 'm10l3', title: 'Multi-objective optimization and Pareto fronts', mins: 10, html: C({
      title: 'When two goals conflict',
      intuition: '<p>Often two objectives compete: lower thermal resistance versus lower mass. A design is <b>Pareto-optimal</b> (non-dominated) if no other design is at least as good in both objectives and strictly better in one. The set of such designs is the <b>Pareto front</b> — the menu of best trade-offs from which an engineer chooses.</p>',
      visual: V('pareto', 'Heat-sink designs (grey) and the Pareto front of mass vs thermal resistance (gold); dashed line at the 0.070 kg mass limit.', 'Scatter of designs with mass on the x-axis and R on the y-axis. The lower-left boundary of the cloud is highlighted in gold as the Pareto front: lighter designs have higher R. A vertical dashed line marks 0.070 kg; the constrained single-objective optimum is where the front meets this line.'),
      math: EQ('<b>x</b><sup>a</sup> dominates <b>x</b><sup>b</sup> ⇔ <var>f</var><sub><var>i</var></sub>(<b>x</b><sup>a</sup>) ≤ <var>f</var><sub><var>i</var></sub>(<b>x</b><sup>b</sup>) ∀<var>i</var> &nbsp; and &nbsp; <var>f</var><sub><var>i</var></sub>(<b>x</b><sup>a</sup>) < <var>f</var><sub><var>i</var></sub>(<b>x</b><sup>b</sup>) for some <var>i</var>') + '<p>Scalarizations: weighted sum min <span class="iv">w</span><sub>1</sub><span class="iv">f</span><sub>1</sub> + <span class="iv">w</span><sub>2</sub><span class="iv">f</span><sub>2</sub> (misses non-convex parts of fronts), or ε-constraint min <span class="iv">f</span><sub>1</sub> s.t. <span class="iv">f</span><sub>2</sub> ≤ ε — our mass-limited problem is exactly one ε-constraint point.</p>',
      app: '<p>Machining: surface roughness vs material removal rate. Structures: mass vs deflection. Fluid machinery: efficiency vs operating range. Each needs a trade-off decision informed by the front, not a single “optimum”.</p>',
      predict: ['Design A: m = 0.06 kg, R = 0.62 K/W. Design B: m = 0.07 kg, R = 0.60 K/W. Does either dominate?', 'No — A is lighter, B has lower R. Both can be Pareto-optimal; the choice depends on priorities.'],
      mis: ['Multi-objective optimization gives one best design.', 'It gives a set of trade-offs. Choosing among them needs engineering judgement or extra criteria.'],
      tip: '<p>Plot the front with the constraint limits overlaid; decision-makers understand trade-offs better from the picture than from a single number.</p>',
      take: 'Pareto front = non-dominated trade-offs; single-objective optima are points on it.'
    }) },
    { id: 'm10l4', title: 'Optimizing a surrogate is not finding the true optimum', mins: 8, html: C({
      title: 'Two different minima',
      intuition: '<p>An optimizer applied to a surrogate finds the minimum of the <b>surrogate</b>. If the surrogate is wrong near that point, the true performance there can be worse than predicted, and the true optimum may lie elsewhere. Only original-model evaluation tells you which.</p>',
      visual: V('sur-vs-true-opt', 'Interactive: a quadratic surrogate’s optimum (hollow) versus its verified value (red ×) and the true optimum (star) on a heat-sink slice.', 'Plot of true R versus fin gap at t = 0.35 mm and a quadratic surrogate from a few samples. The surrogate minimum is marked; a vertical red segment connects its predicted value to the verified true value at the same design; a star marks the true minimum. Increasing samples moves the surrogate minimum closer.'),
      math: EQ('<b>x̂</b>* = arg min <var>f̂</var>(<b>x</b>), &nbsp; prediction error at candidate: <var>f̂</var>(<b>x̂</b>*) − <var>f</var>(<b>x̂</b>*), &nbsp; optimality gap: <var>f</var>(<b>x̂</b>*) − <var>f</var>(<b>x</b>*)') + '<p>Because the optimizer specifically seeks low predictions, <span class="iv">f̂</span>(<b>x̂</b>*) tends to be <b>optimistic</b> (biased low for minimization) — a selection effect.</p>',
      app: '<p>In the heat sink the true constrained optimum is known only because the model is cheap — in practice you never know <span class="iv">f</span>(<b>x</b>*); you know only verified values at the designs you evaluated.</p>',
      predict: ['Why is the predicted value at the surrogate optimum more likely to be too low than too high?', 'The optimizer searches for the lowest prediction; points where the surrogate happens to under-predict are favoured, so errors at the chosen point skew optimistic.'],
      mis: ['If the surrogate optimum is feasible according to the surrogate, it is feasible.', 'Constraint surrogates have errors too; verify feasibility with the original model.'],
      tip: '<p>Report predicted and verified objective and constraint values side by side for every candidate.</p>',
      take: 'Surrogate optimum ≠ true optimum; predictions at the optimum are optimistic; verify.'
    }) }
  ],
  flashcards: [
    FC('How do you maximize with a minimizer?', 'Minimize the negative of the objective (or a complementary quantity like 1 − ε).', 'Maximize pump efficiency → minimize −η.'),
    FC('Write a constraint “head ≥ 30 m” in standard form.', 'g(x) = 30 m − head(x) ≤ 0.', 'Pump design.'),
    FC('Distinguish bounds from constraints.', 'Bounds are box limits on variables; constraints are general functions of the design.', '0.8 ≤ s ≤ 3.0 mm vs mass ≤ 0.070 kg.'),
    FC('What is a local minimum?', 'A point with no lower value in its neighbourhood; not necessarily the lowest overall.', 'Gradient descent stops at local minima.'),
    FC('When are derivative-free methods preferred?', 'When gradients are unavailable, the function is noisy or non-smooth, or evaluations are cheap enough for many calls.', 'Nelder–Mead on a surrogate.'),
    FC('What is multi-start optimization?', 'Running a local optimizer from many starting points and keeping the best result.', 'Cheap on a surrogate.'),
    FC('Define Pareto dominance.', 'A dominates B if A is no worse in all objectives and strictly better in at least one.', 'Mass vs thermal resistance.'),
    FC('Why can a weighted-sum method miss Pareto designs?', 'It cannot reach non-convex parts of the front.', 'Use ε-constraint instead.'),
    FC('Why is the predicted objective at a surrogate optimum often optimistic?', 'The optimizer selects points where the surrogate is low, including where it under-predicts (selection effect).', 'Verified R is usually higher than predicted.'),
    FC('What claim can you make after a single local optimization run?', 'That you found a locally optimal (or best found) design under your search — not global optimality.', 'Report search method and budget.')
  ],
  quiz: [
    [MC('q1a', 'Standard form', 'Which is the correct standard-form constraint for “efficiency must be at least 80%”?', ['g(x) = 0.80 − η(x) ≤ 0', 'g(x) = η(x) − 0.80 ≤ 0', 'g(x) = η(x) ≤ 0.80', 'g(x) = −η(x) ≥ 0'], 0, 'g ≤ 0 must express the requirement η ≥ 0.80.', ['Correct.', 'This says η ≤ 0.80.', 'Same as the previous error.', 'Wrong sign and form.']),
     MC('q1b', 'Standard form', 'To maximize turbine power P(x) with a minimizer, the objective passed should be…', ['−P(x)', 'P(x)', '1/P(x) always', '|P(x)|'], 0, 'Negation converts maximization to minimization.', ['Correct.', 'This would minimize power.', 'Works only for positive P and changes curvature; negation is standard.', 'Not equivalent.'])],
    [GEN('q2g', 'Constraint normalization', rng => { const m = [0.060, 0.068, 0.072, 0.080][rng.int(4)]; return { stem: `With the normalized mass constraint g = m/0.070 − 1 ≤ 0, what is g for a design of mass ${m.toFixed(3)} kg?`, answer: m / 0.07 - 1, tolAbs: 0.0015, unit: '', explain: `g = ${m.toFixed(3)}/0.070 − 1 = ${(m / 0.07 - 1).toFixed(4)} → ${m <= 0.07 ? 'feasible' : 'infeasible'}.` }; }),
     GEN('q2h', 'Penalty', rng => { const f = [0.58, 0.60, 0.62][rng.int(3)], m = [0.072, 0.075, 0.077][rng.int(3)], c = [5, 10, 50][rng.int(3)]; const pen = f + c * Math.max(0, m / 0.07 - 1); return { stem: `A penalty objective is P = R + c·max(0, m/0.070 − 1) with c = ${c}. For R = ${f} K/W and m = ${m} kg, compute P.`, answer: pen, tolAbs: 0.003, unit: 'K/W (penalized)', explain: `Violation = ${m}/0.070 − 1 = ${(m / 0.07 - 1).toFixed(4)}; P = ${f} + ${c} × ${(m / 0.07 - 1).toFixed(4)} = ${pen.toFixed(4)}.` }; })],
    [MC('q3a', 'Local vs global', 'Gradient descent from x₀ = 0.15 stops at a valley with f = 0.71, while a dense grid finds f = 0.52 elsewhere. What happened?', ['The method converged to a local minimum', 'The gradient was computed incorrectly', 'The grid search is wrong because it uses no gradients', 'The function has no global minimum'], 0, 'Local methods find the nearest valley.', ['Correct.', 'Not necessarily.', 'Grids can find global minima on cheap 1-D functions.', 'It does.']),
     MC('q3b', 'Local vs global', 'Which strategy most improves the chance of finding the global minimum of a cheap multimodal surrogate?', ['Multi-start local optimization from many spread-out starting points', 'One gradient run with a smaller step size', 'Using a single start at the centre', 'Stopping earlier'], 0, 'Multiple starts explore several valleys.', ['Correct.', 'Still local.', 'Still local.', 'Worse.'])],
    [MC('q4a', 'Method choice', 'Which situation favours a derivative-free method?', ['The objective is a random-forest surrogate (piecewise constant)', 'A smooth GP surrogate with analytic gradients', 'A convex quadratic objective', 'A linear objective with linear constraints'], 0, 'Zero gradients almost everywhere defeat gradient methods.', ['Correct.', 'Gradient methods are efficient here.', 'Gradient methods are ideal.', 'Linear programming is ideal.']),
     MC('q4b', 'Method choice', 'Why are evolutionary algorithms often unsuitable for direct use on expensive CFD?', ['They typically need thousands of evaluations', 'They cannot handle constraints at all', 'They only work in one dimension', 'They require gradients'], 0, 'High evaluation counts are prohibitive with CFD.', ['Correct.', 'Constraint handling exists.', 'False.', 'They do not.'])],
    [MS('q5a', 'Pareto', 'Designs (m kg, R K/W): A (0.06, 0.70), B (0.07, 0.60), C (0.07, 0.65), D (0.08, 0.58). Select ALL Pareto-optimal designs (minimize both).', ['A', 'B', 'C', 'D'], [0, 1, 3], 'C is dominated by B (same mass, higher R).', ['Non-dominated.', 'Non-dominated.', 'Dominated by B.', 'Non-dominated.']),
     MS('q5b', 'Pareto', 'Select ALL true statements about Pareto fronts.', ['Each point is a trade-off where improving one objective worsens another', 'The front contains a single best design', 'A constrained single-objective optimum can lie on the front', 'Weighted-sum methods can miss non-convex parts'], [0, 2, 3], 'The front is a set of trade-offs.', ['Correct.', 'False.', 'Correct (ε-constraint).', 'Correct.'])],
    [MC('q6a', 'Surrogate vs true optimum', 'A surrogate predicts R̂ = 0.558 K/W at its optimum; verification gives 0.581 K/W. What is the prediction error at the candidate?', ['−0.023 K/W (optimistic prediction)', '+0.023 K/W (pessimistic)', '0 K/W', 'Cannot be computed without the true optimum'], 0, 'f̂ − f = 0.558 − 0.581 = −0.023 K/W.', ['Correct.', 'Sign reversed.', 'They differ.', 'Only the optimality gap needs the true optimum.']),
     MC('q6b', 'Surrogate vs true optimum', 'Which quantity can you NOT normally compute in a real expensive study?', ['The optimality gap f(x̂*) − f(x*)', 'The prediction error at the candidate', 'The verified objective value', 'The surrogate’s predicted value'], 0, 'f(x*) is unknown in practice.', ['Correct.', 'Computable after verification.', 'Computable by evaluation.', 'Computable.'])]
  ]
});
COURSE.glossary.push(['Local optimum', 'Best point within a neighbourhood.'], ['Global optimum', 'Best point over the whole feasible region.'], ['Gradient-based optimization', 'Methods using derivatives (e.g., BFGS, SLSQP).'], ['Derivative-free optimization', 'Methods using only function values (e.g., Nelder–Mead, grid search).'], ['Multi-start', 'Running a local optimizer from many starting points.'], ['Pareto front', 'Set of non-dominated trade-off designs.'], ['Penalty method', 'Adding constraint-violation terms to the objective.']);

/* ---------------- Module 11 ---------------- */
COURSE.modules.push({
  id: 'm11', num: 11, title: 'Surrogate-based optimization', short: 'Fit → optimize → evaluate → update; predicted vs verified; constraint surrogates; optimizer exploitation; stopping criteria; fair comparisons.', mins: 55,
  prereq: ['Modules 8 and 10'], prereqModules: ['m10'],
  objectives: ['Carry out the surrogate-based optimization loop including verification.', 'Report predicted versus verified objective and constraint values.', 'Model expensive constraints with surrogates and compute cheap ones exactly.', 'Recognize optimizer exploitation of surrogate errors.', 'Choose stopping criteria and compare methods fairly by original-model evaluations.'],
  intro: '<p>Here the pieces come together. You will run the full loop on the heat sink in your browser.</p>',
  labs: ['lab07', 'lab08'],
  lessons: [
    { id: 'm11l1', title: 'The loop: fit, optimize, verify, update', mins: 14, html: C({
      title: 'Running surrogate-based optimization',
      intuition: '<p>Start with a space-filling sample. Fit surrogates for the expensive responses (here log₁₀<span class="iv">R</span> and log₁₀Δ<span class="iv">T</span><sub>air</sub>); compute cheap responses (mass) exactly. Optimize the surrogate problem. Evaluate the candidate with the original model. Add it to the data and refit. Each iteration teaches the surrogate most where it matters — near promising designs.</p>',
      visual: V('sao-loop', 'The SBO loop.', 'Cycle diagram of initial design, original-model runs, surrogate fitting, surrogate optimization, verification and stopping decision.') + V('sbo-demo', 'Interactive SBO: choose surrogate type and initial sample size; press ① to optimize the surrogate and ② to verify and add the point. A table records predicted vs verified values.', 'Map of the surrogate prediction of R with true constraint lines and the true optimum star. Evaluated designs are orange dots; the current candidate is a hollow circle. A table logs each iteration: design, predicted and verified R, predicted and verified air-temperature rise, mass and feasibility.'),
      math: '<p>Iteration <span class="iv">k</span>:</p>' + EQ('<b>x</b><sub><var>k</var></sub> = arg min<sub><b>x</b> ∈ box</sub> <var>R̂</var><sub><var>k</var></sub>(<b>x</b>) &nbsp; s.t. &nbsp; <var>m</var>(<b>x</b>) ≤ 0.070, &nbsp; <var>T̂</var><sub><var>k</var></sub>(<b>x</b>) ≤ 12; &nbsp; then evaluate <var>R</var>(<b>x</b><sub><var>k</var></sub>), Δ<var>T</var><sub>air</sub>(<b>x</b><sub><var>k</var></sub>)') + '<p>Keep a table of: iteration, evaluations used, design, predicted and verified objective, predicted and verified constraints, feasibility. The best <b>verified feasible</b> design is the result.</p>',
      app: '<p>Typical observation in the demo: with 8 initial LHS points, the first candidate’s predicted <span class="iv">R</span> differs from the verified value by a few thousandths to a few hundredths of a K/W; after about 3–5 updates the best verified design typically lies on the mass boundary within 1% of <span class="iv">R</span>* (author’s check: within 0.5% after 5 updates for 8 of 8 seeds). Results depend on the seed — try several.</p>',
      predict: ['After adding a verified candidate and refitting, should the next candidate be identical to the last one?', 'Usually not: the new data point changes the surrogate locally. If the optimizer keeps returning the same point, the surrogate is already exact there — a sign of convergence (or a need to explore elsewhere).'],
      mis: ['One surrogate fit followed by one optimization is enough.', 'A one-shot approach relies entirely on initial accuracy near the optimum. Sequential updates concentrate accuracy where it matters.'],
      tip: '<p>Do not re-evaluate a design already in the data; with a deterministic model it adds nothing. If the optimizer proposes one, explore elsewhere.</p>',
      take: 'Fit → optimize → verify → update; the best verified feasible design is the answer.'
    }) },
    { id: 'm11l2', title: 'Constraint surrogates and optimizer exploitation', mins: 11, html: C({
      title: 'When the optimizer finds the surrogate’s mistakes',
      intuition: '<p>An optimizer is a relentless searcher for the lowest predicted value. If the surrogate has a spurious dip — from overfitting, an outlier, or extrapolation — the optimizer will find and <b>exploit</b> it. The same applies to constraint surrogates: an under-predicted constraint makes an infeasible design look feasible.</p>',
      visual: V('exploit-demo', 'Interactive: a cubic fitted to five samples dives beyond the last sample; the optimizer picks that unsampled edge.', 'Plot of true R versus fin gap with five samples between 0.9 and 2.7 mm and a cubic surrogate. Beyond 2.7 mm (shaded, no data) the cubic falls steeply; the optimizer chooses s = 3.0 mm with a predicted R near 0.42 K/W, while the verified value (red ×) is about 0.79 K/W.'),
      math: '<p>Safeguards:</p><ul><li>Prefer smooth, validated surrogates; avoid excessive flexibility with few points.</li><li>Constrain the optimizer to the sampled region or a trust region around the best verified design.</li><li>Use a <b>constraint margin</b>: require <span class="iv">ĝ</span>(<b>x</b>) + <span class="iv">k</span>·σ<sub>g</sub>(<b>x</b>) ≤ 0 (with a GP), or a fixed safety margin.</li><li>Always verify candidates; add them to the data.</li></ul>',
      app: '<p>Heat sink: Δ<span class="iv">T</span><sub>air</sub> rises steeply at small gaps. If its surrogate under-predicts there, the optimizer may pick an infeasible small-gap design. Mass is computed exactly, so it cannot be exploited — a strong argument for computing cheap responses exactly.</p>',
      predict: ['The optimizer’s candidate lies right at a corner of the bounds where there are no samples, with a remarkably low predicted R. What should you suspect?', 'Exploitation of extrapolation error. Verify, and consider a trust region or more samples near that corner.'],
      mis: ['A better optimizer will fix bad surrogate predictions.', 'A better optimizer finds surrogate errors more effectively. Fix the surrogate (data, model, margins), not the optimizer.'],
      tip: '<p>Plot candidates on the error/uncertainty map; candidates in high-uncertainty regions deserve scepticism (or deliberate exploration, Module 12).</p>',
      take: 'Optimizers exploit surrogate errors; use smooth models, margins, trust regions and verification.'
    }) },
    { id: 'm11l3', title: 'Stopping criteria and fair comparisons', mins: 10, html: C({
      title: 'When to stop, and how to compare methods honestly',
      intuition: '<p>Stop when the evaluation budget is used, when verified improvement over several iterations is negligible, or when candidates repeat. To compare methods (random search, one-shot surrogate, sequential SBO, Bayesian optimization), plot the <b>best verified feasible objective versus the number of original-model evaluations</b>, averaged over several seeds — never compare by iterations or by predicted values.</p>',
      visual: V('convergence-plot', 'Computed live: median gap to the reference optimum versus original-model evaluations for random search, sequential SBO and Bayesian optimization (5 seeds each).', 'Three descending curves of best feasible R minus R* versus number of evaluations. Random search improves slowly; sequential SBO and BO drop quickly after the initial 8 samples. Differences between SBO and BO are small on this smooth problem.'),
      math: EQ('stop if &nbsp; <var>k</var> ≥ <var>B</var> &nbsp; or &nbsp; ' + FR('<var>f</var><sub>best</sub><sup>(<var>k</var>−<var>w</var>)</sup> − <var>f</var><sub>best</sub><sup>(<var>k</var>)</sup>', '|<var>f</var><sub>best</sub><sup>(<var>k</var>)</sup>|') + ' < <var>ε</var>') + SYM([['B', 'budget of original-model evaluations', 'count'], ['w', 'window of recent iterations', 'count'], ['ε', 'relative improvement tolerance, e.g. 0.001', '—']]) + '<p>Fair comparison: same total original-model evaluations (including initial samples), same initial design where applicable, several seeds, report median and spread, and include computational cost of fitting if it is not negligible.</p>',
      app: '<p>In CFD-based studies the cost is dominated by simulations, so “evaluations” is the right x-axis. If a surrogate method takes hours of fitting time per iteration (e.g., large neural networks), that cost must be reported too.</p>',
      predict: ['Method A reaches its best design after 5 iterations of 4 evaluations each; method B after 12 iterations of 1 evaluation each. Which used fewer original-model evaluations?', 'B: 12 evaluations vs A’s 20. Compare by evaluations, not iterations.'],
      mis: ['Comparing best predicted values is fine because the surrogate is accurate.', 'Only verified values are evidence; predicted values are biased optimistic at optima.'],
      tip: '<p>Include random search with the same budget as a baseline. If your method does not beat it clearly, reconsider.</p>',
      take: 'Stop on budget or stagnation; compare by verified best value vs original-model evaluations over several seeds.'
    }) }
  ],
  flashcards: [
    FC('What is the result of a surrogate-based optimization study?', 'The best verified feasible design (with its verified values), not the best prediction.', 'Report predicted and verified side by side.'),
    FC('Which heat-sink responses need surrogates?', 'R and ΔT_air (expensive flow solution); mass is computed exactly.', 'Compute cheap responses exactly.'),
    FC('What is optimizer exploitation?', 'The optimizer deliberately finds regions where the surrogate under-predicts (spurious minima) or under-predicts constraints.', 'Overfitted polynomial dip.'),
    FC('Name three safeguards against exploitation.', 'Smooth validated surrogates; trust regions/sampled region limits; constraint margins; verification and updating.', 'Use GP σ for margins.'),
    FC('Why compute mass exactly rather than surrogate it?', 'It is cheap and exact; a surrogate would only add error and exploitable mistakes.', 'Geometry-only constraints.'),
    FC('Give two stopping criteria.', 'Budget exhausted; negligible verified improvement over a window of iterations (or repeated candidates).', 'B = 30 evaluations.'),
    FC('What is the correct x-axis for comparing optimization methods?', 'Number of original-model evaluations (including initial samples).', 'Not iterations or wall time alone.'),
    FC('Why include random search as a baseline?', 'It shows whether the surrogate method adds value for the same evaluation budget.', 'Fair comparison.'),
    FC('Why repeat comparisons with several seeds?', 'Results vary with initial samples; one run may be lucky or unlucky.', 'Report median and range.'),
    FC('What does a constraint margin ĝ + kσ_g ≤ 0 achieve?', 'It requires feasibility with some confidence under the constraint surrogate’s uncertainty.', 'Reduces infeasible candidates.')
  ],
  quiz: [
    [MC('q1a', 'Loop order', 'Which order describes one iteration of sequential SBO?', ['Optimize surrogate → evaluate candidate with original model → add to data → refit', 'Evaluate original model everywhere → fit surrogate → stop', 'Fit surrogate → report predicted optimum → stop', 'Refit → delete old data → optimize'], 0, 'Verification and updating are part of each iteration.', ['Correct.', 'That is not surrogate-based.', 'No verification.', 'Old data should be kept.']),
     MC('q1b', 'Reporting', 'Which value should be reported as the recommended design’s thermal resistance?', ['The verified original-model value', 'The surrogate’s predicted value', 'The mean of predicted and verified values', 'The lowest value in the initial sample'], 0, 'Verified values are evidence.', ['Correct.', 'A hypothesis only.', 'Not meaningful.', 'Not the recommended design.'])],
    [GEN('q2g', 'Predicted vs verified', rng => { const p = [0.560, 0.565, 0.571][rng.int(3)], v = +(p + [0.006, 0.012, 0.021][rng.int(3)]).toFixed(3); return { stem: `A candidate has predicted R = ${p.toFixed(3)} K/W and verified R = ${v.toFixed(3)} K/W. What is the relative prediction error (predicted − verified)/verified in percent?`, answer: 100 * (p - v) / v, tolAbs: 0.05, unit: '%', explain: `(${p.toFixed(3)} − ${v.toFixed(3)})/${v.toFixed(3)} × 100 = ${(100 * (p - v) / v).toFixed(2)}% (negative: optimistic).` }; }),
     GEN('q2h', 'Optimality gap', rng => { const v = +(0.5771 + [0.002, 0.006, 0.012, 0.02][rng.int(4)]).toFixed(4); return { stem: `For teaching, the reference constrained optimum is R* = 0.5771 K/W. Your verified best feasible design has R = ${v} K/W. What is the relative gap (R − R*)/R* in percent?`, answer: 100 * (v - 0.5771) / 0.5771, tolAbs: 0.03, unit: '%', explain: `(${v} − 0.5771)/0.5771 × 100 = ${(100 * (v - 0.5771) / 0.5771).toFixed(2)}%.` }; })],
    [MC('q3a', 'Exploitation', 'The optimizer returns a candidate at an unsampled corner with predicted R = 0.40 K/W — far below every observed value. Most likely explanation?', ['The optimizer is exploiting extrapolation error in the surrogate', 'A breakthrough design has been found', 'The constraints are inactive', 'The surrogate is underfitted'], 0, 'Unusually good predictions in unsampled regions are suspect.', ['Correct.', 'Verify before believing.', 'Irrelevant.', 'Underfitting rarely produces deep spurious minima.']),
     MC('q3b', 'Exploitation', 'Which change most directly reduces exploitation of surrogate errors?', ['Restrict the search to a trust region around the best verified design and verify every candidate', 'Use a more aggressive global optimizer', 'Increase the polynomial degree', 'Report predicted instead of verified values'], 0, 'Trust regions and verification limit exploitation.', ['Correct.', 'Finds errors more effectively.', 'More flexibility, more spurious features.', 'Hides the problem.'])],
    [MS('q4a', 'Constraint handling', 'Select ALL good practices for constraints in SBO.', ['Compute cheap constraints exactly', 'Use surrogates for expensive constraints', 'Verify feasibility with the original model', 'Assume surrogate-feasible means feasible'], [0, 1, 2], 'Feasibility must be verified.', ['Correct.', 'Correct.', 'Correct.', 'Incorrect.']),
     MS('q4b', 'Constraint handling', 'Select ALL reasons a surrogate-feasible candidate may be infeasible.', ['The constraint surrogate under-predicts near the boundary', 'The candidate lies in a poorly sampled region', 'The optimizer pushes designs onto constraint boundaries where small errors flip feasibility', 'The mass is computed exactly'], [0, 1, 2], 'Exact mass cannot cause this.', ['Yes.', 'Yes.', 'Yes.', 'Exact computation is reliable.'])],
    [MC('q5a', 'Fair comparison', 'Method A: 20 initial + 10 iterations × 1 evaluation. Method B: 10 initial + 5 iterations × 4 evaluations. Which used more original-model evaluations?', ['They used the same (30 each)', 'A', 'B', 'Cannot tell'], 0, 'A: 20 + 10 = 30. B: 10 + 20 = 30.', ['Correct.', 'Equal.', 'Equal.', 'It can be computed.']),
     MC('q5b', 'Fair comparison', 'Which plot is appropriate to compare optimization methods on an expensive problem?', ['Best verified feasible objective vs number of original-model evaluations, median over seeds', 'Best predicted objective vs iteration, single seed', 'Surrogate R² vs iteration', 'Wall time of the optimizer on the surrogate'], 0, 'Evaluations dominate cost; verified values are evidence; seeds show variability.', ['Correct.', 'Predictions and single seeds mislead.', 'Not the objective of optimization.', 'Negligible relative to simulations.'])],
    [MC('q6a', 'Stopping', 'Over the last 4 iterations the best verified R improved from 0.5785 to 0.5783 K/W, and the budget has 6 evaluations left. A reasonable decision is…', ['Stop or switch to exploration: improvement is negligible (~0.03%)', 'Continue until the budget is exhausted no matter what', 'Restart from scratch', 'Report the predicted optimum instead'], 0, 'Stagnation suggests stopping or exploring elsewhere.', ['Correct.', 'Possible but not required.', 'Wasteful.', 'Not evidence.']),
     MC('q6b', 'Stopping', 'The optimizer proposes a design already in the dataset (deterministic simulator). What does this indicate?', ['The surrogate is exact there and sees no better point — converged locally; consider exploring', 'The simulator is noisy', 'The surrogate is broken', 'You should evaluate it again to confirm'], 0, 'Re-evaluation adds nothing for a deterministic model.', ['Correct.', 'Deterministic.', 'Not necessarily.', 'Wasteful.'])]
  ]
});
COURSE.glossary.push(['Surrogate-based optimization (SBO)', 'Optimization using a surrogate with verification and updating.'], ['Verification', 'Evaluating a candidate with the original model.'], ['Infill point', 'A new sample added to improve the surrogate where useful.'], ['Optimizer exploitation', 'Optimizer selecting designs because of surrogate errors.'], ['Trust region', 'Limited region around a trusted design within which the optimizer may move.'], ['Constraint margin', 'Safety allowance added to a predicted constraint.']);

/* ---------------- Module 12 ---------------- */
COURSE.modules.push({
  id: 'm12', num: 12, title: 'Sequential learning and Bayesian optimization', short: 'Exploration vs exploitation; acquisition functions; expected improvement (with σ = 0); choosing the next sample; noise, batches and constraints.', mins: 50,
  prereq: ['Modules 9 and 11'], prereqModules: ['m11'],
  objectives: ['Explain the exploration–exploitation trade-off.', 'State and compute expected improvement for minimization, including σ = 0.', 'Use an acquisition function to choose the next sample.', 'Describe conceptually how noise, batches and constraints are handled.', 'Identify which uncertainty and assumptions an acquisition function relies on.'],
  intro: '<p>Bayesian optimization (BO) uses a GP’s uncertainty to decide where to sample next — balancing improvement now against learning for later.</p>',
  labs: ['lab09'],
  lessons: [
    { id: 'm12l1', title: 'Exploration versus exploitation', mins: 9, html: C({
      title: 'Sample where it looks good, or where you know little?',
      intuition: '<p><b>Exploitation</b>: sample where the surrogate predicts the best value (lowest μ). <b>Exploration</b>: sample where uncertainty σ is highest, to learn. Pure exploitation can get stuck refining a local valley; pure exploration wastes evaluations on regions that are clearly poor. Good strategies balance both.</p>',
      visual: V('explore-exploit', 'A GP fitted to four samples of a synthetic multimodal function: the pure-exploitation, pure-exploration and expected-improvement choices differ.', 'GP mean and band over a 1-D design variable. Three vertical lines: “exploit: min μ” near the best observed sample, “explore: max σ” in the largest gap, and “EI balances both” at an intermediate location.'),
      math: '<p>Lower confidence bound (for minimization) makes the trade-off explicit:</p>' + EQ('LCB(<b>x</b>) = <var>μ</var>(<b>x</b>) − <var>κ</var> <var>σ</var>(<b>x</b>), &nbsp; next sample = arg min LCB') + SYM([['κ', 'exploration weight: 0 = pure exploitation; large = mostly exploration', '—']]),
      app: '<p>In a turbomachinery study with 40 CFD runs, early iterations benefit from exploration (find the right region), later ones from exploitation (refine the best design).</p>',
      predict: ['With κ = 0, which point does LCB select?', 'The minimum of the GP mean — pure exploitation.'],
      mis: ['Exploration wastes evaluations.', 'Without it, the search can miss a better region entirely; exploration is an investment.'],
      tip: '<p>If successive candidates cluster tightly while large regions remain unexplored, increase exploration (κ, or ξ in EI).</p>',
      take: 'Exploit (low μ) vs explore (high σ); acquisition functions balance them.'
    }) },
    { id: 'm12l2', title: 'Acquisition functions and expected improvement', mins: 14, html: C({
      title: 'Expected improvement for minimization',
      intuition: '<p>Let <span class="iv">f</span><sub>best</sub> be the best (lowest) value observed so far. At each candidate <b>x</b>, the GP says the unknown value is roughly normal with mean μ and standard deviation σ. <b>Expected improvement (EI)</b> is the average amount by which it would beat <span class="iv">f</span><sub>best</sub>, counting “no improvement” as zero. EI is large where μ is low (exploitation) or σ is large (exploration).</p>',
      visual: V('ei-demo', 'Interactive Bayesian optimization in 1-D: the GP (top), the acquisition function (bottom) and the next sample (green line). Adjust ξ or switch to LCB, then press “Evaluate next point”.', 'Top: GP mean, band, hidden true function and samples, with a horizontal line at the best observed value and a green vertical line at the next sample. Bottom: the EI curve, zero at existing samples and peaking at the chosen point. Increasing ξ shifts the peak toward unexplored regions.'),
      math: '<p>For a candidate <b>x</b>, the GP says the unknown value is <span class="iv">Y</span> ~ N(μ, σ²). With an optional margin ξ ≥ 0, define the improvement random variable <span class="iv">I</span><sub>ξ</sub> = max(<span class="iv">f</span><sub>best</sub> − <span class="iv">Y</span> − ξ, 0) and EI = E[<span class="iv">I</span><sub>ξ</sub>]:</p>' + EQ('EI(<b>x</b>) = (<var>f</var><sub>best</sub> − <var>μ</var> − <var>ξ</var>) Φ(<var>z</var>) + <var>σ</var> φ(<var>z</var>), &nbsp; <var>z</var> = ' + FR('<var>f</var><sub>best</sub> − <var>μ</var> − <var>ξ</var>', '<var>σ</var>') + ', &nbsp; for <var>σ</var> > 0') + EQ('EI(<b>x</b>) = max(<var>f</var><sub>best</sub> − <var>μ</var> − <var>ξ</var>, 0) &nbsp; for <var>σ</var> = 0 &nbsp; (then <var>Y</var> = <var>μ</var> with certainty, so <var>I</var><sub><var>ξ</var></sub> is deterministic)') + SYM([['Φ, φ', 'standard normal CDF and PDF', '—'], ['ξ ≥ 0', 'optional margin: larger ξ demands bigger improvement → more exploration', 'units of f'], ['z', 'standardized improvement', '—']]) + '<p><b>σ = 0 must be handled separately</b>: the formula divides by σ. With σ = 0 the outcome is certain, so the improvement is deterministic. At an existing noise-free sample μ = <span class="iv">y</span><sub>i</sub> ≥ <span class="iv">f</span><sub>best</sub>, hence EI = 0 — BO never re-samples a known point. In code, treat σ below a tiny threshold as zero.</p>',
      app: '<p>Heat-sink slice option in the demo: EI quickly concentrates samples around the minimum near <span class="iv">s</span> ≈ 1.9 mm. Synthetic multimodal option: with ξ = 0 EI may refine a local valley; with ξ ≈ 0.05 it explores other valleys first. (Fitting to log₁₀<span class="iv">R</span> in Lab 9 means EI is computed on the log scale.)</p>',
      predict: ['At a candidate, μ = 0.60, σ = 0.05, f_best = 0.62, ξ = 0. Is EI larger or smaller than 0.02?', 'Larger. The deterministic part alone gives 0.02·Φ(0.4) ≈ 0.0131; adding σφ(0.4) = 0.05 × 0.368 ≈ 0.0184 gives EI ≈ 0.0315 — uncertainty adds expected upside.'],
      mis: ['EI is the probability of improvement.', 'Probability of improvement (PI) is Φ(z); EI weights by how much improvement, which usually explores better.'],
      tip: '<p>Maximize EI with a multi-start or dense grid: EI is often flat (near zero) over large regions with narrow peaks.</p>',
      take: 'EI = (f_best − μ − ξ)Φ(z) + σφ(z); handle σ = 0 as max(f_best − μ − ξ, 0).'
    }) },
    { id: 'm12l3', title: 'Noise, batches, constraints — and the assumptions behind BO', mins: 10, html: C({
      title: 'Extensions and honest caveats',
      intuition: '<p><b>Noisy evaluations</b> (experiments): use a GP with a noise term. A simple <i>incumbent heuristic</i> is to take <span class="iv">f</span><sub>best</sub> as the lowest GP mean at sampled points rather than the luckiest noisy observation. This is a pragmatic plug-in, not a complete noise-aware method: proper noisy-EI variants (e.g., noisy or augmented EI, or knowledge-gradient) account for the noise in both the incumbent and the candidate and are beyond this course. <b>Batch selection</b>: when several simulations can run in parallel, choose several points per iteration (e.g., by temporarily “fantasizing” outcomes or penalizing nearby points). <b>Constrained BO</b>: multiply EI by the probability of feasibility from constraint GPs.</p>',
      visual: V('constrained-ei', 'Synthetic illustration: EI, probability of feasibility (PoF) and their product.', 'Three curves over a 1-D variable: EI with peaks in several places, PoF rising from 0 to 1 near x = 0.55, and their product, which suppresses EI peaks in the infeasible region.'),
      math: EQ('PoF(<b>x</b>) = Π<sub><var>j</var></sub> Φ( ' + FR('0 − <var>μ</var><sub><var>g</var><sub><var>j</var></sub></sub>(<b>x</b>)', '<var>σ</var><sub><var>g</var><sub><var>j</var></sub></sub>(<b>x</b>)') + ' ), &nbsp;&nbsp; acquisition = EI(<b>x</b>) · PoF(<b>x</b>)') + '<p>The product form assumes independent constraint GPs. Cheap constraints (mass) are enforced exactly by excluding infeasible designs from the search instead.</p>',
      app: '<p>Lab 9 implements constrained EI for the heat sink: EI on log₁₀<span class="iv">R</span>, PoF from a GP of log₁₀Δ<span class="iv">T</span><sub>air</sub> with limit log₁₀12, and exact mass exclusion. In the course’s convergence study, BO and simple sequential SBO perform similarly on this smooth 2-D problem — BO’s advantages are larger on multimodal problems.</p>',
      predict: ['Which uncertainty does EI rely on?', 'The GP’s predictive σ — a model-based, mostly epistemic uncertainty that depends on kernel, length scales and scaling. If σ is badly calibrated, EI misjudges where to explore.'],
      mis: ['BO is guaranteed to find the global optimum efficiently.', 'Its efficiency depends on the GP being a reasonable model of the function. With a poor kernel or wrong length scale it can over-exploit or waste evaluations. Theoretical guarantees exist only under assumptions.'],
      tip: '<p>Refit GP hyperparameters as data accumulate and inspect them; track the best verified value per evaluation, and stop on budget or stagnation.</p>',
      take: 'BO extends to noise, batches and constraints, but relies on the GP’s assumptions and calibration.'
    }) }
  ],

     GEN('q1h', 'Expected improvement', rng => { const fb = 1.0, mu = 1.0, sd = [0.1, 0.2, 0.4][rng.int(3)]; return { stem: `f_best = 1.0, μ = 1.0, σ = ${sd}, ξ = 0. Compute EI (hint: z = 0, φ(0) = 0.3989).`, answer: sd * ST.phi(0), tolAbs: 0.0005, unit: '', explain: `z = 0 so the first term vanishes; EI = σφ(0) = ${sd} × 0.3989 = ${(sd * 0.3989).toFixed(4)}.` }; })],

    [MC('q4a', 'Existing samples', 'In noise-free BO, what is EI at an already-evaluated design?', ['0 — the value is known and is not below f_best', 'Maximal', 'Equal to σφ(0)', 'Undefined'], 0, 'σ = 0 and μ = y_i ≥ f_best → EI = 0.', ['Correct.', 'No.', 'σ = 0 there.', 'Defined via the σ = 0 case.']),

  id: 'm13', num: 13, title: 'Reproducible engineering research', short: 'Provenance, seeds, versions, units and budgets; baselines and fair comparisons; repeats and variability; honest reporting; synthetic vs experimental evidence; ethical AI use.', mins: 45,

  intro: '<p>Results matter only if others can check and rely on them. This module turns your study into evidence.</p>',

  lessons: [
    { id: 'm13l1', title: 'Provenance: seeds, versions, units and budgets', mins: 10, html: C({
      title: 'Leave a trail someone else can follow',
      intuition: '<p><b>Provenance</b> is the record of where every number came from: which model (and version), which sampling plan (method, seed, bounds), which data file (units, date), which code and package versions, and how many expensive evaluations were spent. Missing links make results unverifiable.</p>',
      visual: V('provenance-chain', 'The provenance chain from model to results.', 'Five linked boxes: model/experiment with version and assumptions; sampling plan with method, seed and bounds; data file with units, date and hash; code and environment with package versions; results with verified values.'),
      math: '<p>A minimal reproducibility record (example):</p><pre data-copy>model:        pedagogical plate-fin heat sink v1.0 (course notebook, Q = 30 W, dp = 5 Pa)\nvariables:    s_mm in [0.8, 3.0], t_mm in [0.2, 1.5]; scaled by bounds\nsampling:     scipy.stats.qmc.LatinHypercube(d=2, seed=7), n = 12\nsurrogate:    sklearn GaussianProcessRegressor(ConstantKernel*RBF(ls=[.3,.3]), normalize_y=True, n_restarts=5, random_state=0) on log10(R)\noptimizer:    SLSQP, 20 multi-starts (seed 0), exact mass, GP for log10(dT_air)\nbudget:       12 initial + 8 infill = 20 original-model evaluations\nenvironment:  Python 3.12, numpy 2.x, scipy 1.x, scikit-learn 1.x (print exact versions)</pre>',
      app: '<p>A reviewer of a CFD-surrogate paper should be able to regenerate the sample plan from the seed, check the units of every column, and count the CFD runs. The same discipline applies to a lab report.</p>',

      mis: ['Saving the final plot is enough documentation.', 'Plots show results, not how to regenerate them. Record inputs, seeds, versions and budgets.'],
      tip: '<p>Print versions and the full configuration in the first cells of every notebook; save data with units in column names.</p>',

    }) },
    { id: 'm13l2', title: 'Baselines, fair comparisons, repeated experiments and variability', mins: 10, html: C({
      title: 'One run is an anecdote',
      intuition: '<p>Surrogate-optimization results depend on the initial sample, the optimizer start points and hyperparameter fits. One run can be lucky or unlucky. Repeat with several seeds, compare against simple baselines with the same evaluation budget, and report the spread.</p>',
      visual: V('repeat-boxplot', 'Computed live: final optimality gap of random search and sequential SBO over 12 seeds each, with a 16-evaluation budget.', 'Box plots with individual points: random search shows a wide spread of gaps; sequential SBO shows a lower median and narrower spread, though individual runs vary.'),
      math: '<p>Summaries for <span class="iv">r</span> repeated runs with final gaps Δ<sub>1</sub>…Δ<sub>r</sub>: median, interquartile range, min–max, and the fraction of runs reaching a target (e.g., within 1% of the best known). Avoid reporting only the best run.</p>',

      title: 'Claims proportional to evidence',
      intuition: '<p>A good report states what was done, what was found, and what it does <i>not</i> show. Evidence has levels: a surrogate prediction is weakest; verification with a simplified model shows something about that model; verification with validated CFD/FEA is stronger; physical tests with uncertainty are strongest for real-world claims.</p>',

      app: '<p><b>Ethical use of AI in study and research:</b> follow any rules that apply to you (e.g., your institution’s or employer’s); disclose AI assistance (e.g., code suggestions, text drafting); you remain responsible for correctness — check AI-generated code and claims against sources and calculations; never fabricate data, results or citations; do not present AI-generated text as your own original analysis where that is prohibited; protect confidential or proprietary data (do not paste it into external tools without permission). Engineering decisions affecting safety need qualified human review.</p>',

/* ===== qbank_v2.js ===== */
/* ==========================================================================
   qbank_v2.js — question-bank revision for course v2.0.0 (review items R07, R08, R11–R13).
   Each slot's variants are written to assess the same concept at a similar cognitive level
   (an authoring intention; equivalence has NOT been checked with student data).
   Where a v1 slot mixed two different concepts, one concept keeps the slot (with a new parallel
   variant) and the other is moved to a new slot with its own parallel variant.
   ========================================================================== */
function qbSlots(mod) { return mod === 'final' ? COURSE.final.slots : COURSE.modules.find(m => m.id === mod).quiz; }
function qbFind(mod, id) { for (const sl of qbSlots(mod)) for (let i = 0; i < sl.length; i++) if (sl[i].id === id) return [sl, i]; throw new Error('qbank: missing ' + mod + '/' + id); }
function qbReplace(mod, id, q) { const [sl, i] = qbFind(mod, id); sl[i] = q; }
function qbTake(mod, id, newId) { const [sl, i] = qbFind(mod, id); return Object.assign({}, sl[i], { id: newId }); }
function qbAdd(mod, slot) { qbSlots(mod).push(slot); }
function qbPatch(mod, id, fields) { const [sl, i] = qbFind(mod, id); sl[i] = Object.assign({}, sl[i], fields); }
const pickOf = (rng, arr) => arr[rng.int(arr.length)];

s 3.0.5, matplotlib 3.11.2, scipy 1.18.1, scikit-learn 1.9.1; Linux-6.18.44-fc-v70-x86_64-with-glibc2.39); wall time 3 s. Other package versions were not tested; numerical outputs may differ slightly.\n","\n","**Starter notebooks** intentionally stop at the first unfinished `# TODO` (they raise `NotImplementedError`). Every code cell of both versions is checked to be valid Python syntax, but starters were not executed end-to-end."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Setup: imports, versions and reproducibility\n","import sys, time\n","import numpy as np\n","import pandas as pd\n","import matplotlib.pyplot as plt\n","import scipy, sklearn\n","print(\"Python\", sys.version.split()[0], \"| numpy\", np.__version__, \"| pandas\", pd.__version__,\n","      \"| scipy\", scipy.__version__, \"| scikit-learn\", sklearn.__version__)\n","SEED = 7                                  # change this to test sensitivity to sampling luck\n","rng = np.random.default_rng(SEED)         # one generator for the whole notebook\n","plt.rcParams[\"figure.figsize\"] = (6.4, 4.2)\n","# Gaussian-process hyperparameter fits on small deterministic datasets often emit ConvergenceWarnings from the\n","# L-BFGS optimizer. We silence them to keep output readable and judge models by validation instead.\n","# Remove this filter if you want to see them.\n","import warnings\n","from sklearn.exceptions import ConvergenceWarning\n","warnings.filterwarnings(\"ignore\", category=ConvergenceWarning)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Pedagogical plate-fin heat-sink model: a transparent stand-in for an expensive CFD simulation.\n","# Inputs: fin gap s_mm and fin thickness t_mm (millimetres). Deterministic: no measurement noise.\n","BOUNDS = np.array([[0.8, 3.0],    # s_mm: fin gap (mm)\n","                   [0.2, 1.5]])   # t_mm: fin thickness (mm)\n","MASS_MAX_KG = 0.070               # constraint g1: mass <= 0.070 kg  (cheap: geometry only)\n","DTAIR_MAX_K = 12.0                # constraint g2: air temperature rise <= 12 K (needs flow solution)\n","\n","def heat_sink(s_mm, t_mm):\n","    \"\"\"Return dict with R (K/W), mass (kg), dT_air (K), Re (-). Accepts scalars or NumPy arrays.\"\"\"\n","    W, L, H, tb = 0.050, 0.050, 0.040, 0.004          # base width, flow length, fin height, base thickness (m)\n","    ks, rho_al = 150.0, 2700.0                         # aluminium alloy: W/(m K), kg/m^3\n","    rho, mu, cp, ka = 1.16, 1.85e-5, 1007.0, 0.026     # air: kg/m^3, Pa s, J/(kg K), W/(m K)\n","    dp, Q, Nu = 5.0, 30.0, 7.54                        # fan pressure (Pa), heat load (W), Nusselt (-)\n","    s = np.asarray(s_mm, dtype=float) * 1e-3           # mm -> m  (unit conversion!)\n","    t = np.asarray(t_mm, dtype=float) * 1e-3\n","    N = W / (s + t)                                    # number of fins (continuous)\n","    u = dp * s**2 / (12 * mu * L)                      # laminar parallel-plate channel velocity (m/s)\n","    mdot = rho * u * s * H * N                         # air mass flow (kg/s)\n","    h = Nu * ka / (2 * s)                              # heat-transfer coefficient (W/m^2 K)\n","    m = np.sqrt(2 * h / (ks * t))                      # fin parameter (1/m)\n","    eta = np.tanh(m * H) / (m * H)                     # fin efficiency (-)\n","    UA = h * N * L * (2 * H * eta + s)                 # conductance (W/K)\n","    NTU = UA / (mdot * cp)\n","    R = 1 / (mdot * cp * (1 - np.exp(-NTU))) + tb / (ks * W * L)\n","    mass = rho_al * (N * t * H * L + W * L * tb)\n","    dT_air = Q / (mdot * cp)\n","    Re = rho * u * 2 * s / mu\n","    return {\"R\": R, \"mass\": mass, \"dT_air\": dT_air, \"Re\": Re}\n","\n","def to_unit(X_mm):\n","    \"\"\"Scale physical designs (n, 2) in mm to the unit square using the bounds.\"\"\"\n","    return (np.asarray(X_mm) - BOUNDS[:, 0]) / (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","def from_unit(Z):\n","    \"\"\"Map unit-square points (n, 2) back to physical designs in mm.\"\"\"\n","    return BOUNDS[:, 0] + np.asarray(Z) * (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","R_STAR, S_STAR, T_STAR = 0.57705, 1.8525, 0.3509   # reference constrained optimum (teaching only)\n","assert abs(heat_sink(2.0, 0.8)[\"R\"] - 0.58738853) < 1e-6, \"model check failed - did you edit the model?\"\n","print(\"Model OK. Example: s=2.0 mm, t=0.8 mm ->\", {k: round(float(v), 4) for k, v in heat_sink(2.0, 0.8).items()})"]},{"cell_type":"markdown","metadata":{},"source":["## 1. Generate 30 random designs\n","We draw designs uniformly within the bounds. Each row is one sample (one 'simulation run')."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["n = 30\n","Z = rng.random((n, 2))                    # unit-square points\n","X = from_unit(Z)                          # physical designs in mm\n","out = heat_sink(X[:, 0], X[:, 1])\n","df = pd.DataFrame({\"s_mm\": X[:, 0], \"t_mm\": X[:, 1],\n","                   \"R_KperW\": out[\"R\"], \"mass_kg\": out[\"mass\"], \"dTair_K\": out[\"dT_air\"], \"Re\": out[\"Re\"]})\n","df.head()"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output:** a table whose first five rows have `s_mm` in 0.8–3.0, `t_mm` in 0.2–1.5 and `R_KperW` roughly between 0.57 and 4 K/W."]},{"cell_type":"markdown","metadata":{},"source":["## 2. Summary statistics and unit checks"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["display(df.describe().round(4))\n","# Unit / range checks: these should never fail for correct data\n","assert df.s_mm.between(0.8, 3.0).all() and df.t_mm.between(0.2, 1.5).all()\n","assert (df.R_KperW > 0.5).all() and (df.R_KperW < 10).all(), \"R outside plausible range - unit error?\"\n","assert (df.Re < 2300).all(), \"flow must stay laminar for this model\"\n","print(\"Range checks passed.\")"]},{"cell_type":"markdown","metadata":{},"source":["## 3. Feasibility\n","A design is feasible if mass ≤ 0.070 kg **and** ΔT_air ≤ 12 K."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# TODO: Create a boolean column df[\"feasible\"] that is True when both constraints are satisfied\n","# (replace the next line with your code)\n","raise NotImplementedError('TODO: Create a boolean column df[\"feasible\"] that is True when both constrai')\n","print(df.feasible.sum(), \"of\", len(df), \"designs are feasible\")\n","best = df[df.feasible].sort_values(\"R_KperW\").head(3)\n","best"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output:** only a minority of random designs are feasible (the feasible region is roughly 10% of the box)."]},{"cell_type":"markdown","metadata":{},"source":["## 4. Plots\n","Scatter of R against fin gap, coloured by fin thickness, and a contour map on a grid."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["fig, ax = plt.subplots()\n","sc = ax.scatter(df.s_mm, df.R_KperW, c=df.t_mm, cmap=\"viridis\")\n","fig.colorbar(sc, label=\"t (mm)\")\n","ax.set(xlabel=\"fin gap s (mm)\", ylabel=\"R (K/W)\", yscale=\"log\", title=\"Random designs\")\n","plt.show()\n","\n","s_grid, t_grid = np.meshgrid(np.linspace(*BOUNDS[0], 200), np.linspace(*BOUNDS[1], 200))\n","G = heat_sink(s_grid, t_grid)\n","fig, ax = plt.subplots()\n","cs = ax.contourf(s_grid, t_grid, np.log10(G[\"R\"]), 30, cmap=\"viridis\")\n","fig.colorbar(cs, label=\"log10 R\")\n","ax.contour(s_grid, t_grid, G[\"mass\"], [MASS_MAX_KG], colors=\"red\")\n","ax.contour(s_grid, t_grid, G[\"dT_air\"], [DTAIR_MAX_K], colors=\"red\", linestyles=\"--\")\n","ax.plot(S_STAR, T_STAR, \"*\", ms=15, color=\"gold\", mec=\"k\")\n","ax.set(xlabel=\"s (mm)\", ylabel=\"t (mm)\", title=\"True response, constraints (red), optimum (star)\")\n","plt.show()"]},{"cell_type":"markdown","metadata":{},"source":["## 5. A 1-D slice\n","Plot R versus s for t = 0.6 mm using 200 points."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs"
