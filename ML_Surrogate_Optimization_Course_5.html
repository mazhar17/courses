    # fin parameter (1/m)\n","    eta = np.tanh(m * H) / (m * H)                     # fin efficiency (-)\n","    UA = h * N * L * (2 * H * eta + s)                 # conductance (W/K)\n","    NTU = UA / (mdot * cp)\n","    R = 1 / (mdot * cp * (1 - np.exp(-NTU))) + tb / (ks * W * L)\n","    mass = rho_al * (N * t * H * L + W * L * tb)\n","    dT_air = Q / (mdot * cp)\n","    Re = rho * u * 2 * s / mu\n","    return {\"R\": R, \"mass\": mass, \"dT_air\": dT_air, \"Re\": Re}\n","\n","def to_unit(X_mm):\n","    \"\"\"Scale physical designs (n, 2) in mm to the unit square using the bounds.\"\"\"\n","    return (np.asarray(X_mm) - BOUNDS[:, 0]) / (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","def from_unit(Z):\n","    \"\"\"Map unit-square points (n, 2) back to physical designs in mm.\"\"\"\n","    return BOUNDS[:, 0] + np.asarray(Z) * (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","R_STAR, S_STAR, T_STAR = 0.57705, 1.8525, 0.3509   # reference constrained optimum (teaching only)\n","assert abs(heat_sink(2.0, 0.8)[\"R\"] - 0.58738853) < 1e-6, \"model check failed - did you edit the model?\"\n","print(\"Model OK. Example: s=2.0 mm, t=0.8 mm ->\", {k: round(float(v), 4) for k, v in heat_sink(2.0, 0.8).items()})"]},{"cell_type":"markdown","metadata":{},"source":["## 1. Shared data\n","20 LHS training designs (fit on log10 R) and 300 random validation designs (scored in K/W)."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from scipy.stats import qmc\n","Ztr = qmc.LatinHypercube(d=2, seed=SEED).random(20)\n","Zva = np.random.default_rng(4242).random((300, 2))\n","Xtr, Xva = from_unit(Ztr), from_unit(Zva)\n","ytr = np.log10(heat_sink(Xtr[:, 0], Xtr[:, 1])[\"R\"])\n","Rva = heat_sink(Xva[:, 0], Xva[:, 1])[\"R\"]"]},{"cell_type":"markdown","metadata":{},"source":["## 2. Candidate surrogates (all use scaled inputs Z)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from sklearn.dummy import DummyRegressor\n","from sklearn.pipeline import make_pipeline\n","from sklearn.preprocessing import PolynomialFeatures\n","from sklearn.linear_model import LinearRegression\n","from sklearn.ensemble import RandomForestRegressor\n","from sklearn.gaussian_process import GaussianProcessRegressor\n","from sklearn.gaussian_process.kernels import ConstantKernel, RBF\n","from sklearn.neural_network import MLPRegressor\n","from scipy.interpolate import RBFInterpolator\n","\n","class RBFModel:\n","    \"\"\"Thin wrapper so scipy's RBFInterpolator has fit/predict like scikit-learn.\"\"\"\n","    def fit(self, Z, y): self.f = RBFInterpolator(Z, y, kernel=\"cubic\", degree=1); return self\n","    def predict(self, Z): return self.f(Z)\n","\n","models = {\n","    \"constant (baseline)\": DummyRegressor(),\n","    \"quadratic\": make_pipeline(PolynomialFeatures(2), LinearRegression()),\n","    \"cubic\": make_pipeline(PolynomialFeatures(3), LinearRegression()),\n","    \"cubic RBF\": RBFModel(),\n","    \"random forest\": RandomForestRegressor(n_estimators=300, random_state=0),\n","    \"Gaussian process\": GaussianProcessRegressor(ConstantKernel() * RBF([0.3, 0.3], (1e-2, 1e2)), normalize_y=True,\n","                                                 n_restarts_optimizer=3, random_state=0),\n","    \"neural network (MLP)\": MLPRegressor(hidden_layer_sizes=(32, 32), max_iter=5000, random_state=0),\n","}"]},{"cell_type":"markdown","metadata":{},"source":["## 3. Fit, time and score"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["rows = {}\n","for name, m in models.items():\n","    t0 = time.perf_counter(); m.fit(Ztr, ytr); t1 = time.perf_counter()\n","    Rhat = 10 ** m.predict(Zva); t2 = time.perf_counter()\n","    err = Rhat - Rva\n","    rows[name] = {\"RMSE (K/W)\": np.sqrt(np.mean(err**2)), \"MAE (K/W)\": np.mean(np.abs(err)),\n","                  \"max |err| (K/W)\": np.max(np.abs(err)), \"fit (ms)\": 1e3 * (t1 - t0)}\n","table = pd.DataFrame(rows).T.sort_values(\"RMSE (K/W)\")\n","table.round(4)"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output (indicative; depends on versions and seed):** in the author's run (seed 7) the cubic polynomial and the GP had the lowest RMSE (≈0.03 and ≈0.06 K/W), the cubic RBF and quadratic were worse, and the random forest, the small-data MLP and the constant baseline were worst. Rankings among the top models change with the sample — section 5 checks this over seeds (author's run: median GP RMSE ≈ 0.02 K/W vs quadratic ≈ 0.14 K/W). Fit times depend on your machine."]},{"cell_type":"markdown","metadata":{},"source":["## 4. Where does the best model err?"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["best_name = table.index[0]; best = models[best_name]\n","sg, tg = np.meshgrid(np.linspace(*BOUNDS[0], 120), np.linspace(*BOUNDS[1], 120))\n","Zg = to_unit(np.c_[sg.ravel(), tg.ravel()])\n","E = (10 ** best.predict(Zg) - heat_sink(sg.ravel(), tg.ravel())[\"R\"]).reshape(sg.shape)\n","lim = np.abs(E).max()\n","plt.pcolormesh(sg, tg, E, cmap=\"RdBu_r\", vmin=-lim, vmax=lim, shading=\"auto\"); plt.colorbar(label=\"error (K/W)\")\n","plt.plot(Xtr[:, 0], Xtr[:, 1], \"ko\", ms=4); plt.title(f\"{best_name}: signed error\"); plt.xlabel(\"s (mm)\"); plt.ylabel(\"t (mm)\"); plt.show()"]},{"cell_type":"markdown","metadata":{},"source":["## 5. Exercise: robustness over seeds\n","Repeat the GP vs quadratic comparison for LHS seeds 0–4 and report the median RMSE of each."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["res = {\"quadratic\": [], \"Gaussian process\": []}\n","for sd in range(5):\n","    Z = qmc.LatinHypercube(d=2, seed=sd).random(20); X = from_unit(Z); yy = np.log10(heat_sink(X[:, 0], X[:, 1])[\"R\"])\n","    for name in res:\n","        m = sklearn.base.clone(models[name]).fit(Z, yy)\n","        res[name].append(np.sqrt(np.mean((10 ** m.predict(Zva) - Rva) ** 2)))\n","print({k: round(float(np.median(v)), 5) for k, v in res.items()})"]},{"cell_type":"markdown","metadata":{},"source":["## Interpretation task\n","1. Which model would you use for gradient-based optimization, and why not the random forest?\n","2. Is the MLP result evidence that neural networks are bad surrogates in general?\n","3. Where are the errors of the best model largest, and what would you do about it?"]},{"cell_type":"markdown","metadata":{},"source":["**Reference answers.** (1) A smooth model that validates well across seeds — here the GP (or the cubic polynomial, which also did well); forests are piecewise constant (zero gradients). (2) No — it shows that a data-hungry model with 20 samples and default settings underperforms here. (3) Usually near the steep small-gap edge and in sampling gaps; add samples there or sample sequentially near promising designs."]},{"cell_type":"markdown","metadata":{},"source":["### Debugging tips\n","- `NameError`: a cell above was not run (run all cells from the top) or a name is misspelled.\n","- `ValueError` about shapes: print `.shape`; scikit-learn needs `X` with shape `(n_samples, n_features)` — use `x.reshape(-1, 1)` for one feature.\n","- Implausible numbers (e.g., R = 0.0004 K/W): check units — the model expects **millimetres**.\n","- `ModuleNotFoundError`: install the package in the environment that runs this notebook's kernel.\n","- Results change every run: make sure all randomness uses `rng` or a fixed `random_state`."]}],"metadata":{"kernelspec":{"display_name":"Python 3","language":"python","name":"python3"},"language_info":{"name":"python"},"mlso":{"course_version":"3.0.0","lab":"lab05","variant":"reference"}},"nbformat":4,"nbformat_minor":4},"tested":true,"testNote":"For course version 3.0.0 this reference notebook was executed top-to-bottom without errors on 2026-10-06 by the course maintainer, in a freshly created virtual environment (python 3.13.16, numpy 2.5.3, pandas 3.0.5, matplotlib 3.11.2, scipy 1.18.1, scikit-learn 1.9.1; Linux-6.18.44-fc-v70-x86_64-with-glibc2.39); wall time 3 s. Other package versions were not tested; numerical outputs may differ slightly.","deps":"numpy, pandas, matplotlib, scipy (≥ 1.8 required for Lab 10), scikit-learn, jupyterlab. Tested configuration: python 3.13.16, numpy 2.5.3, pandas 3.0.5, matplotlib 3.11.2, scipy 1.18.1, scikit-learn 1.9.1."},"lab06":{"starter":{"cells":[{"cell_type":"markdown","metadata":{},"source":["# Lab 6 — Gaussian-process regression and uncertainty (starter)\n","**Course:** Machine Learning Fundamentals for Surrogate-Based Engineering Optimization — Module 9\n","**Estimated time:** 90 minutes\n","\n","**Purpose.** Implement GP prediction equations by hand, check them against scikit-learn, fit hyperparameters in 2-D, and test whether uncertainty bands are calibrated.\n","\n","**Expected learning outcome.** You can compute GP means and variances, explain length scales and noise terms, and check uncertainty calibration on validation data.\n","\n","**How to use this notebook.** Run cells from top to bottom with *Shift+Enter*. Cells marked `# TODO` are exercises: replace the `raise NotImplementedError(...)` line with your code. When you finish (and before comparing with the reference notebook), use *Kernel → Restart Kernel and Run All Cells*.\n","\n","**Dependencies.** numpy, pandas, matplotlib, scipy, scikit-learn, jupyterlab. The exact configuration in which the reference notebooks were executed is given in the downloadable environment specification on the course’s Labs page (and in the testing-status cell below). Minimum versions: SciPy ≥ 1.8 is required (Lab 10 uses `LatinHypercube(optimization=\"random-cd\")`, which first appears in SciPy 1.8.0 — checked against the SciPy release source); scikit-learn ≥ 1.0 and Python ≥ 3.10 are expected to work but lower versions were **not** executed.\n","\n","**About the model.** The heat-sink function below is a simplified *pedagogical* analytical model standing in for an expensive CFD simulation. Results describe this model, not real hardware."]},{"cell_type":"markdown","metadata":{},"source":["**Testing status.** For course version 3.0.0 this reference notebook was executed top-to-bottom without errors on 2026-10-06 by the course maintainer, in a freshly created virtual environment (python 3.13.16, numpy 2.5.3, pandas 3.0.5, matplotlib 3.11.2, scipy 1.18.1, scikit-learn 1.9.1; Linux-6.18.44-fc-v70-x86_64-with-glibc2.39); wall time 3 s. Other package versions were not tested; numerical outputs may differ slightly.\n","\n","**Starter notebooks** intentionally stop at the first unfinished `# TODO` (they raise `NotImplementedError`). Every code cell of both versions is checked to be valid Python syntax, but starters were not executed end-to-end."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Setup: imports, versions and reproducibility\n","import sys, time\n","import numpy as np\n","import pandas as pd\n","import matplotlib.pyplot as plt\n","import scipy, sklearn\n","print(\"Python\", sys.version.split()[0], \"| numpy\", np.__version__, \"| pandas\", pd.__version__,\n","      \"| scipy\", scipy.__version__, \"| scikit-learn\", sklearn.__version__)\n","SEED = 7                                  # change this to test sensitivity to sampling luck\n","rng = np.random.default_rng(SEED)         # one generator for the whole notebook\n","plt.rcParams[\"figure.figsize\"] = (6.4, 4.2)\n","# Gaussian-process hyperparameter fits on small deterministic datasets often emit ConvergenceWarnings from the\n","# L-BFGS optimizer. We silence them to keep output readable and judge models by validation instead.\n","# Remove this filter if you want to see them.\n","import warnings\n","from sklearn.exceptions import ConvergenceWarning\n","warnings.filterwarnings(\"ignore\", category=ConvergenceWarning)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Pedagogical plate-fin heat-sink model: a transparent stand-in for an expensive CFD simulation.\n","# Inputs: fin gap s_mm and fin thickness t_mm (millimetres). Deterministic: no measurement noise.\n","BOUNDS = np.array([[0.8, 3.0],    # s_mm: fin gap (mm)\n","                   [0.2, 1.5]])   # t_mm: fin thickness (mm)\n","MASS_MAX_KG = 0.070               # constraint g1: mass <= 0.070 kg  (cheap: geometry only)\n","DTAIR_MAX_K = 12.0                # constraint g2: air temperature rise <= 12 K (needs flow solution)\n","\n","def heat_sink(s_mm, t_mm):\n","    \"\"\"Return dict with R (K/W), mass (kg), dT_air (K), Re (-). Accepts scalars or NumPy arrays.\"\"\"\n","    W, L, H, tb = 0.050, 0.050, 0.040, 0.004          # base width, flow length, fin height, base thickness (m)\n","    ks, rho_al = 150.0, 2700.0                         # aluminium alloy: W/(m K), kg/m^3\n","    rho, mu, cp, ka = 1.16, 1.85e-5, 1007.0, 0.026     # air: kg/m^3, Pa s, J/(kg K), W/(m K)\n","    dp, Q, Nu = 5.0, 30.0, 7.54                        # fan pressure (Pa), heat load (W), Nusselt (-)\n","    s = np.asarray(s_mm, dtype=float) * 1e-3           # mm -> m  (unit conversion!)\n","    t = np.asarray(t_mm, dtype=float) * 1e-3\n","    N = W / (s + t)                                    # number of fins (continuous)\n","    u = dp * s**2 / (12 * mu * L)                      # laminar parallel-plate channel velocity (m/s)\n","    mdot = rho * u * s * H * N                         # air mass flow (kg/s)\n","    h = Nu * ka / (2 * s)                              # heat-transfer coefficient (W/m^2 K)\n","    m = np.sqrt(2 * h / (ks * t))                      # fin parameter (1/m)\n","    eta = np.tanh(m * H) / (m * H)                     # fin efficiency (-)\n","    UA = h * N * L * (2 * H * eta + s)                 # conductance (W/K)\n","    NTU = UA / (mdot * cp)\n","    R = 1 / (mdot * cp * (1 - np.exp(-NTU))) + tb / (ks * W * L)\n","    mass = rho_al * (N * t * H * L + W * L * tb)\n","    dT_air = Q / (mdot * cp)\n","    Re = rho * u * 2 * s / mu\n","    return {\"R\": R, \"mass\": mass, \"dT_air\": dT_air, \"Re\": Re}\n","\n","def to_unit(X_mm):\n","    \"\"\"Scale physical designs (n, 2) in mm to the unit square using the bounds.\"\"\"\n","    return (np.asarray(X_mm) - BOUNDS[:, 0]) / (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","def from_unit(Z):\n","    \"\"\"Map unit-square points (n, 2) back to physical designs in mm.\"\"\"\n","    return BOUNDS[:, 0] + np.asarray(Z) * (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","R_STAR, S_STAR, T_STAR = 0.57705, 1.8525, 0.3509   # reference constrained optimum (teaching only)\n","assert abs(heat_sink(2.0, 0.8)[\"R\"] - 0.58738853) < 1e-6, \"model check failed - did you edit the model?\"\n","print(\"Model OK. Example: s=2.0 mm, t=0.8 mm ->\", {k: round(float(v), 4) for k, v in heat_sink(2.0, 0.8).items()})"]},{"cell_type":"markdown","metadata":{},"source":["## 1. GP by hand in 1-D (slice t = 0.6 mm)\n","Squared-exponential kernel k(x, x') = σf² exp(−(x−x')²/(2ℓ²)) on scaled x ∈ [0, 1]; outputs standardized."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["def se_kernel(A, B, ell, sf2=1.0):\n","    return sf2 * np.exp(-0.5 * (A[:, None] - B[None, :]) ** 2 / ell ** 2)\n","\n","x_tr = np.array([0.05, 0.3, 0.55, 0.9]); s_tr = from_unit(np.c_[x_tr, np.zeros(4)])[:, 0]\n","y_raw = heat_sink(s_tr, 0.6)[\"R\"]; ym, ys = y_raw.mean(), y_raw.std()\n","y = (y_raw - ym) / ys                                  # standardized targets\n","x_te = np.linspace(0, 1, 200); ell, nugget = 0.25, 1e-8\n","\n","K = se_kernel(x_tr, x_tr, ell) + nugget * np.eye(len(x_tr))\n","Ks = se_kernel(x_te, x_tr, ell)\n","L = np.linalg.cholesky(K)\n","alpha = np.linalg.solve(L.T, np.linalg.solve(L, y))\n","mu = Ks @ alpha\n","# TODO: Compute the predictive variance var = k(x*,x*) - v^T v with v = L^{-1} k*, clipped at 0\n","# (replace the next line with your code)\n","raise NotImplementedError('TODO: Compute the predictive variance var = k(x*,x*) - v^T v with v = L^{-1}')\n","mu_R, sd_R = ym + ys * mu, ys * np.sqrt(var)\n","s_te = from_unit(np.c_[x_te, np.zeros_like(x_te)])[:, 0]\n","plt.fill_between(s_te, mu_R - 1.96 * sd_R, mu_R + 1.96 * sd_R, alpha=0.3, label=\"±1.96σ\")\n","plt.plot(s_te, mu_R, label=\"GP mean\"); plt.plot(s_te, heat_sink(s_te, 0.6)[\"R\"], \"k--\", label=\"true\"); plt.plot(s_tr, y_raw, \"o\")\n","plt.xlabel(\"s (mm)\"); plt.ylabel(\"R (K/W)\"); plt.legend(); plt.ylim(0, 3); plt.show()"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output:** the band pinches to (almost) zero at the four samples and widens between and beyond them."]},{"cell_type":"markdown","metadata":{},"source":["## 2. Check against scikit-learn with the same fixed kernel"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from sklearn.gaussian_process import GaussianProcessRegressor\n","from sklearn.gaussian_process.kernels import RBF, ConstantKernel, WhiteKernel\n","gp = GaussianProcessRegressor(RBF(ell), alpha=nugget, optimizer=None).fit(x_tr[:, None], y)\n","mu_sk, sd_sk = gp.predict(x_te[:, None], return_std=True)\n","print(\"max |mean difference|:\", np.abs(mu_sk - mu).max(), \" max |sd difference|:\", np.abs(sd_sk - np.sqrt(var)).max())\n","assert np.allclose(mu_sk, mu, atol=1e-6) and np.allclose(sd_sk, np.sqrt(var), atol=1e-4)"]},{"cell_type":"markdown","metadata":{},"source":["## 3. 2-D GP with fitted hyperparameters (anisotropic length scales)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from scipy.stats import qmc\n","Ztr = qmc.LatinHypercube(d=2, seed=SEED).random(16); Xtr = from_unit(Ztr)\n","ytr = np.log10(heat_sink(Xtr[:, 0], Xtr[:, 1])[\"R\"])\n","kernel = ConstantKernel(1.0) * RBF([0.3, 0.3], (1e-2, 1e2))\n","gp2 = GaussianProcessRegressor(kernel, normalize_y=True, n_restarts_optimizer=5, random_state=0).fit(Ztr, ytr)\n","print(\"fitted kernel:\", gp2.kernel_)"]},{"cell_type":"markdown","metadata":{},"source":["## 4. Calibration check\n","What fraction of 300 validation points (log10 R) fall inside the 95% band? Ideally about 95%."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["Zva = np.random.default_rng(5).random((300, 2)); Xva = from_unit(Zva)\n","yva = np.log10(heat_sink(Xva[:, 0], Xva[:, 1])[\"R\"])\n","m, s = gp2.predict(Zva, return_std=True)\n","# TODO: Compute coverage = fraction of validation points with |yva - m| <= 1.96 s, and the standardized errors z = (yva - m)/s\n","# (replace the next line with your code)\n","raise NotImplementedError('TODO: Compute coverage = fraction of validation points with |yva - m| <= 1.9')\n","print(f\"coverage of nominal 95% band: {100 * coverage:.1f}%\")\n","plt.hist(z, bins=30, density=True); xx = np.linspace(-4, 4, 200); plt.plot(xx, np.exp(-xx**2 / 2) / np.sqrt(2 * np.pi))\n","plt.xlabel(\"standardized error z\"); plt.title(\"Should resemble N(0,1) if well calibrated\"); plt.show()"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output:** coverage well **below** 95% (author's runs: 40–70% with 16–30 points). The bands are overconfident: the squared-exponential kernel assumes the function is equally smooth everywhere, but log10 R changes steeply near small gaps. This is an important, honest result: GP bands are model-based, not guarantees. *Exercise:* replace `RBF` with `Matern(nu=2.5)` (from `sklearn.gaussian_process.kernels`) and compare coverage (author's run: ≈86% with 16 points)."]},{"cell_type":"markdown","metadata":{},"source":["## 5. Noise term (synthetic noise, clearly labelled)\n","We take 30 LHS designs, add Gaussian noise σ = 0.03 (log10 units) to imitate noisy experiments, then fit with and without a `WhiteKernel` noise term."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["Z30 = qmc.LatinHypercube(d=2, seed=SEED).random(30); X30 = from_unit(Z30)\n","ynoisy = np.log10(heat_sink(X30[:, 0], X30[:, 1])[\"R\"]) + 0.03 * np.random.default_rng(3).standard_normal(30)   # synthetic noise\n","gp_nf = GaussianProcessRegressor(ConstantKernel() * RBF([0.3, 0.3], (1e-2, 1e2)), alpha=1e-10, normalize_y=True, n_restarts_optimizer=3, random_state=0).fit(Z30, ynoisy)\n","gp_n = GaussianProcessRegressor(ConstantKernel() * RBF([0.3, 0.3], (1e-2, 1e2)) + WhiteKernel(1e-2, (1e-6, 1)), normalize_y=True, n_restarts_optimizer=3, random_state=0).fit(Z30, ynoisy)\n","for name, g in [(\"no noise term\", gp_nf), (\"with WhiteKernel\", gp_n)]:\n","    print(f\"{name:18s} validation RMSE (log10): {np.sqrt(np.mean((g.predict(Zva) - yva) ** 2)):.4f}   kernel: {g.kernel_}\")"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output:** the model without a noise term chases the noise (short length scale, larger validation error; author's run ≈0.064); with `WhiteKernel` it estimates the noise and generalizes better (≈0.028)."]},{"cell_type":"markdown","metadata":{},"source":["## Interpretation task\n","1. In section 1, what happens to the band if you set `ell = 0.05`? Explain.\n","2. Which length scale (for s or for t) did the 2-D GP fit as shorter, and what does that say about the response?\n","3. Is the 95% band a guarantee? What did your calibration check show?"]},{"cell_type":"markdown","metadata":{},"source":["### Debugging tips\n","- `NameError`: a cell above was not run (run all cells from the top) or a name is misspelled.\n","- `ValueError` about shapes: print `.shape`; scikit-learn needs `X` with shape `(n_samples, n_features)` — use `x.reshape(-1, 1)` for one feature.\n","- Implausible numbers (e.g., R = 0.0004 K/W): check units — the model expects **millimetres**.\n","- `ModuleNotFoundError`: install the package in the environment that runs this notebook's kernel.\n","- Results change every run: make sure all randomness uses `rng` or a fixed `random_state`."]}],"metadata":{"kernelspec":{"display_name":"Python 3","language":"python","name":"python3"},"language_info":{"name":"python"},"mlso":{"course_version":"3.0.0","lab":"lab06","variant":"starter"}},"nbformat":4,"nbformat_minor":4},"reference":{"cells":[{"cell_type":"markdown","metadata":{},"source":["# Lab 6 — Gaussian-process regression and uncertainty (reference solution)\n","**Course:** Machine Learning Fundamentals for Surrogate-Based Engineering Optimization — Module 9\n","**Estimated time:** 90 minutes\n","\n","**Purpose.** Implement GP prediction equations by hand, check them against scikit-learn, fit hyperparameters in 2-D, and test whether uncertainty bands are calibrated.\n","\n","**Expected learning outcome.** You can compute GP means and variances, explain length scales and noise terms, and check uncertainty calibration on validation data.\n","\n","**How to use this notebook.** Run cells from top to bottom with *Shift+Enter*. Cells marked `# TODO` are exercises: replace the `raise NotImplementedError(...)` line with your code. When you finish (and before comparing with the reference notebook), use *Kernel → Restart Kernel and Run All Cells*.\n","\n","**Dependencies.** numpy, pandas, matplotlib, scipy, scikit-learn, jupyterlab. The exact configuration in which the reference notebooks were executed is given in the downloadable environment specification on the course’s Labs page (and in the testing-status cell below). Minimum versions: SciPy ≥ 1.8 is required (Lab 10 uses `LatinHypercube(optimization=\"random-cd\")`, which first appears in SciPy 1.8.0 — checked against the SciPy release source); scikit-learn ≥ 1.0 and Python ≥ 3.10 are expected to work but lower versions were **not** executed.\n","\n","**About the model.** The heat-sink function below is a simplified *pedagogical* analytical model standing in for an expensive CFD simulation. Results describe this model, not real hardware."]},{"cell_type":"markdown","metadata":{},"source":["**Testing status.** For course version 3.0.0 this reference notebook was executed top-to-bottom without errors on 2026-10-06 by the course maintainer, in a freshly created virtual environment (python 3.13.16, numpy 2.5.3, pandas 3.0.5, matplotlib 3.11.2, scipy 1.18.1, scikit-learn 1.9.1; Linux-6.18.44-fc-v70-x86_64-with-glibc2.39); wall time 3 s. Other package versions were not tested; numerical outputs may differ slightly.\n","\n","**Starter notebooks** intentionally stop at the first unfinished `# TODO` (they raise `NotImplementedError`). Every code cell of both versions is checked to be valid Python syntax, but starters were not executed end-to-end."]},{"cell_type":"markdown","metadata":{},"source":["> **Reference solution.** This version contains worked solutions. Try the starter notebook first."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Setup: imports, versions and reproducibility\n","import sys, time\n","import numpy as np\n","import pandas as pd\n","import matplotlib.pyplot as plt\n","import scipy, sklearn\n","print(\"Python\", sys.version.split()[0], \"| numpy\", np.__version__, \"| pandas\", pd.__version__,\n","      \"| scipy\", scipy.__version__, \"| scikit-learn\", sklearn.__version__)\n","SEED = 7                                  # change this to test sensitivity to sampling luck\n","rng = np.random.default_rng(SEED)         # one generator for the whole notebook\n","plt.rcParams[\"figure.figsize\"] = (6.4, 4.2)\n","# Gaussian-process hyperparameter fits on small deterministic datasets often emit ConvergenceWarnings from the\n","# L-BFGS optimizer. We silence them to keep output readable and judge models by validation instead.\n","# Remove this filter if you want to see them.\n","import warnings\n","from sklearn.exceptions import ConvergenceWarning\n","warnings.filterwarnings(\"ignore\", category=ConvergenceWarning)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Pedagogical plate-fin heat-sink model: a transparent stand-in for an expensive CFD simulation.\n","# Inputs: fin gap s_mm and fin thickness t_mm (millimetres). Deterministic: no measurement noise.\n","BOUNDS = np.array([[0.8, 3.0],    # s_mm: fin gap (mm)\n","                   [0.2, 1.5]])   # t_mm: fin thickness (mm)\n","MASS_MAX_KG = 0.070               # constraint g1: mass <= 0.070 kg  (cheap: geometry only)\n","DTAIR_MAX_K = 12.0                # constraint g2: air temperature rise <= 12 K (needs flow solution)\n","\n","def heat_sink(s_mm, t_mm):\n","    \"\"\"Return dict with R (K/W), mass (kg), dT_air (K), Re (-). Accepts scalars or NumPy arrays.\"\"\"\n","    W, L, H, tb = 0.050, 0.050, 0.040, 0.004          # base width, flow length, fin height, base thickness (m)\n","    ks, rho_al = 150.0, 2700.0                         # aluminium alloy: W/(m K), kg/m^3\n","    rho, mu, cp, ka = 1.16, 1.85e-5, 1007.0, 0.026     # air: kg/m^3, Pa s, J/(kg K), W/(m K)\n","    dp, Q, Nu = 5.0, 30.0, 7.54                        # fan pressure (Pa), heat load (W), Nusselt (-)\n","    s = np.asarray(s_mm, dtype=float) * 1e-3           # mm -> m  (unit conversion!)\n","    t = np.asarray(t_mm, dtype=float) * 1e-3\n","    N = W / (s + t)                                    # number of fins (continuous)\n","    u = dp * s**2 / (12 * mu * L)                      # laminar parallel-plate channel velocity (m/s)\n","    mdot = rho * u * s * H * N                         # air mass flow (kg/s)\n","    h = Nu * ka / (2 * s)                              # heat-transfer coefficient (W/m^2 K)\n","    m = np.sqrt(2 * h / (ks * t))                      # fin parameter (1/m)\n","    eta = np.tanh(m * H) / (m * H)                     # fin efficiency (-)\n","    UA = h * N * L * (2 * H * eta + s)                 # conductance (W/K)\n","    NTU = UA / (mdot * cp)\n","    R = 1 / (mdot * cp * (1 - np.exp(-NTU))) + tb / (ks * W * L)\n","    mass = rho_al * (N * t * H * L + W * L * tb)\n","    dT_air = Q / (mdot * cp)\n","    Re = rho * u * 2 * s / mu\n","    return {\"R\": R, \"mass\": mass, \"dT_air\": dT_air, \"Re\": Re}\n","\n","def to_unit(X_mm):\n","    \"\"\"Scale physical designs (n, 2) in mm to the unit square using the bounds.\"\"\"\n","    return (np.asarray(X_mm) - BOUNDS[:, 0]) / (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","def from_unit(Z):\n","    \"\"\"Map unit-square points (n, 2) back to physical designs in mm.\"\"\"\n","    return BOUNDS[:, 0] + np.asarray(Z) * (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","R_STAR, S_STAR, T_STAR = 0.57705, 1.8525, 0.3509   # reference constrained optimum (teaching only)\n","assert abs(heat_sink(2.0, 0.8)[\"R\"] - 0.58738853) < 1e-6, \"model check failed - did you edit the model?\"\n","print(\"Model OK. Example: s=2.0 mm, t=0.8 mm ->\", {k: round(float(v), 4) for k, v in heat_sink(2.0, 0.8).items()})"]},{"cell_type":"markdown","metadata":{},"source":["## 1. GP by hand in 1-D (slice t = 0.6 mm)\n","Squared-exponential kernel k(x, x') = σf² exp(−(x−x')²/(2ℓ²)) on scaled x ∈ [0, 1]; outputs standardized."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["def se_kernel(A, B, ell, sf2=1.0):\n","    return sf2 * np.exp(-0.5 * (A[:, None] - B[None, :]) ** 2 / ell ** 2)\n","\n","x_tr = np.array([0.05, 0.3, 0.55, 0.9]); s_tr = from_unit(np.c_[x_tr, np.zeros(4)])[:, 0]\n","y_raw = heat_sink(s_tr, 0.6)[\"R\"]; ym, ys = y_raw.mean(), y_raw.std()\n","y = (y_raw - ym) / ys                                  # standardized targets\n","x_te = np.linspace(0, 1, 200); ell, nugget = 0.25, 1e-8\n","\n","K = se_kernel(x_tr, x_tr, ell) + nugget * np.eye(len(x_tr))\n","Ks = se_kernel(x_te, x_tr, ell)\n","L = np.linalg.cholesky(K)\n","alpha = np.linalg.solve(L.T, np.linalg.solve(L, y))\n","mu = Ks @ alpha\n","v = np.linalg.solve(L, Ks.T)\n","var = np.clip(1.0 - np.sum(v ** 2, axis=0), 0, None)\n","mu_R, sd_R = ym + ys * mu, ys * np.sqrt(var)\n","s_te = from_unit(np.c_[x_te, np.zeros_like(x_te)])[:, 0]\n","plt.fill_between(s_te, mu_R - 1.96 * sd_R, mu_R + 1.96 * sd_R, alpha=0.3, label=\"±1.96σ\")\n","plt.plot(s_te, mu_R, label=\"GP mean\"); plt.plot(s_te, heat_sink(s_te, 0.6)[\"R\"], \"k--\", label=\"true\"); plt.plot(s_tr, y_raw, \"o\")\n","plt.xlabel(\"s (mm)\"); plt.ylabel(\"R (K/W)\"); plt.legend(); plt.ylim(0, 3); plt.show()"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output:** the band pinches to (almost) zero at the four samples and widens between and beyond them."]},{"cell_type":"markdown","metadata":{},"source":["## 2. Check against scikit-learn with the same fixed kernel"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from sklearn.gaussian_process import GaussianProcessRegressor\n","from sklearn.gaussian_process.kernels import RBF, ConstantKernel, WhiteKernel\n","gp = GaussianProcessRegressor(RBF(ell), alpha=nugget, optimizer=None).fit(x_tr[:, None], y)\n","mu_sk, sd_sk = gp.predict(x_te[:, None], return_std=True)\n","print(\"max |mean difference|:\", np.abs(mu_sk - mu).max(), \" max |sd difference|:\", np.abs(sd_sk - np.sqrt(var)).max())\n","assert np.allclose(mu_sk, mu, atol=1e-6) and np.allclose(sd_sk, np.sqrt(var), atol=1e-4)"]},{"cell_type":"markdown","metadata":{},"source":["## 3. 2-D GP with fitted hyperparameters (anisotropic length scales)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from scipy.stats import qmc\n","Ztr = qmc.LatinHypercube(d=2, seed=SEED).random(16); Xtr = from_unit(Ztr)\n","ytr = np.log10(heat_sink(Xtr[:, 0], Xtr[:, 1])[\"R\"])\n","kernel = ConstantKernel(1.0) * RBF([0.3, 0.3], (1e-2, 1e2))\n","gp2 = GaussianProcessRegressor(kernel, normalize_y=True, n_restarts_optimizer=5, random_state=0).fit(Ztr, ytr)\n","print(\"fitted kernel:\", gp2.kernel_)"]},{"cell_type":"markdown","metadata":{},"source":["## 4. Calibration check\n","What fraction of 300 validation points (log10 R) fall inside the 95% band? Ideally about 95%."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["Zva = np.random.default_rng(5).random((300, 2)); Xva = from_unit(Zva)\n","yva = np.log10(heat_sink(Xva[:, 0], Xva[:, 1])[\"R\"])\n","m, s = gp2.predict(Zva, return_std=True)\n","coverage = np.mean(np.abs(yva - m) <= 1.96 * s)\n","z = (yva - m) / s\n","print(f\"coverage of nominal 95% band: {100 * coverage:.1f}%\")\n","plt.hist(z, bins=30, density=True); xx = np.linspace(-4, 4, 200); plt.plot(xx, np.exp(-xx**2 / 2) / np.sqrt(2 * np.pi))\n","plt.xlabel(\"standardized error z\"); plt.title(\"Should resemble N(0,1) if well calibrated\"); plt.show()"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output:** coverage well **below** 95% (author's runs: 40–70% with 16–30 points). The bands are overconfident: the squared-exponential kernel assumes the function is equally smooth everywhere, but log10 R changes steeply near small gaps. This is an important, honest result: GP bands are model-based, not guarantees. *Exercise:* replace `RBF` with `Matern(nu=2.5)` (from `sklearn.gaussian_process.kernels`) and compare coverage (author's run: ≈86% with 16 points)."]},{"cell_type":"markdown","metadata":{},"source":["## 5. Noise term (synthetic noise, clearly labelled)\n","We take 30 LHS designs, add Gaussian noise σ = 0.03 (log10 units) to imitate noisy experiments, then fit with and without a `WhiteKernel` noise term."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["Z30 = qmc.LatinHypercube(d=2, seed=SEED).random(30); X30 = from_unit(Z30)\n","ynoisy = np.log10(heat_sink(X30[:, 0], X30[:, 1])[\"R\"]) + 0.03 * np.random.default_rng(3).standard_normal(30)   # synthetic noise\n","gp_nf = GaussianProcessRegressor(ConstantKernel() * RBF([0.3, 0.3], (1e-2, 1e2)), alpha=1e-10, normalize_y=True, n_restarts_optimizer=3, random_state=0).fit(Z30, ynoisy)\n","gp_n = GaussianProcessRegressor(ConstantKernel() * RBF([0.3, 0.3], (1e-2, 1e2)) + WhiteKernel(1e-2, (1e-6, 1)), normalize_y=True, n_restarts_optimizer=3, random_state=0).fit(Z30, ynoisy)\n","for name, g in [(\"no noise term\", gp_nf), (\"with WhiteKernel\", gp_n)]:\n","    print(f\"{name:18s} validation RMSE (log10): {np.sqrt(np.mean((g.predict(Zva) - yva) ** 2)):.4f}   kernel: {g.kernel_}\")"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output:** the model without a noise term chases the noise (short length scale, larger validation error; author's run ≈0.064); with `WhiteKernel` it estimates the noise and generalizes better (≈0.028)."]},{"cell_type":"markdown","metadata":{},"source":["## Interpretation task\n","1. In section 1, what happens to the band if you set `ell = 0.05`? Explain.\n","2. Which length scale (for s or for t) did the 2-D GP fit as shorter, and what does that say about the response?\n","3. Is the 95% band a guarantee? What did your calibration check show?"]},{"cell_type":"markdown","metadata":{},"source":["**Reference answers.** (1) Correlation decays within 0.05 scaled units, far less than the sample spacing: the mean reverts to the average between samples and the band becomes wide. (2) Typically the s length scale is shorter because R varies more strongly with fin gap. (3) No; it depends on the kernel and hyperparameters. In the author's runs the SE-kernel bands covered only 40–70% of validation points (overconfident); a Matérn kernel was better calibrated. Always check coverage before relying on σ (e.g., in Bayesian optimization)."]},{"cell_type":"markdown","metadata":{},"source":["### Debugging tips\n","- `NameError`: a cell above was not run (run all cells from the top) or a name is misspelled.\n","- `ValueError` about shapes: print `.shape`; scikit-learn needs `X` with shape `(n_samples, n_features)` — use `x.reshape(-1, 1)` for one feature.\n","- Implausible numbers (e.g., R = 0.0004 K/W): check units — the model expects **millimetres**.\n","- `ModuleNotFoundError`: install the package in the environment that runs this notebook's kernel.\n","- Results change every run: make sure all randomness uses `rng` or a fixed `random_state`."]}],"metadata":{"kernelspec":{"display_name":"Python 3","language":"python","name":"python3"},"language_info":{"name":"python"},"mlso":{"course_version":"3.0.0","lab":"lab06"," judge models by validation instead.\n","# Remove this filter if you want to see them.\n","import warnings\n","from sklearn.exceptions import ConvergenceWarning\n","warnings.filterwarnings(\"ignore\", category=ConvergenceWarning)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Pedagogical plate-fin heat-sink model: a transparent stand-in for an expensive CFD simulation.\n","# Inputs: fin gap s_mm and fin thickness t_mm (millimetres). Deterministic: no measurement noise.\n","BOUNDS = np.array([[0.8, 3.0],    # s_mm: fin gap (mm)\n","                   [0.2, 1.5]])   # t_mm: fin thickness (mm)\n","MASS_MAX_KG = 0.070               # constraint g1: mass <= 0.070 kg  (cheap: geometry only)\n","DTAIR_MAX_K = 12.0                # constraint g2: air temperature rise <= 12 K (needs flow solution)\n","\n","def heat_sink(s_mm, t_mm):\n","    \"\"\"Return dict with R (K/W), mass (kg), dT_air (K), Re (-). Accepts scalars or NumPy arrays.\"\"\"\n","    W, L, H, tb = 0.050, 0.050, 0.040, 0.004          # base width, flow length, fin height, base thickness (m)\n","    ks, rho_al = 150.0, 2700.0                         # aluminium alloy: W/(m K), kg/m^3\n","    rho, mu, cp, ka = 1.16, 1.85e-5, 1007.0, 0.026     # air: kg/m^3, Pa s, J/(kg K), W/(m K)\n","    dp, Q, Nu = 5.0, 30.0, 7.54                        # fan pressure (Pa), heat load (W), Nusselt (-)\n","    s = np.asarray(s_mm, dtype=float) * 1e-3           # mm -> m  (unit conversion!)\n","    t = np.asarray(t_mm, dtype=float) * 1e-3\n","    N = W / (s + t)                                    # number of fins (continuous)\n","    u = dp * s**2 / (12 * mu * L)                      # laminar parallel-plate channel velocity (m/s)\n","    mdot = rho * u * s * H * N                         # air mass flow (kg/s)\n","    h = Nu * ka / (2 * s)                              # heat-transfer coefficient (W/m^2 K)\n","    m = np.sqrt(2 * h / (ks * t))                      # fin parameter (1/m)\n","    eta = np.tanh(m * H) / (m * H)                     # fin efficiency (-)\n","    UA = h * N * L * (2 * H * eta + s)                 # conductance (W/K)\n","    NTU = UA / (mdot * cp)\n","    R = 1 / (mdot * cp * (1 - np.exp(-NTU))) + tb / (ks * W * L)\n","    mass = rho_al * (N * t * H * L + W * L * tb)\n","    dT_air = Q / (mdot * cp)\n","    Re = rho * u * 2 * s / mu\n","    return {\"R\": R, \"mass\": mass, \"dT_air\": dT_air, \"Re\": Re}\n","\n","def to_unit(X_mm):\n","    \"\"\"Scale physical designs (n, 2) in mm to the unit square using the bounds.\"\"\"\n","    return (np.asarray(X_mm) - BOUNDS[:, 0]) / (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","def from_unit(Z):\n","    \"\"\"Map unit-square points (n, 2) back to physical designs in mm.\"\"\"\n","    return BOUNDS[:, 0] + np.asarray(Z) * (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","R_STAR, S_STAR, T_STAR = 0.57705, 1.8525, 0.3509   # reference constrained optimum (teaching only)\n","assert abs(heat_sink(2.0, 0.8)[\"R\"] - 0.58738853) < 1e-6, \"model check failed - did you edit the model?\"\n","print(\"Model OK. Example: s=2.0 mm, t=0.8 mm ->\", {k: round(float(v), 4) for k, v in heat_sink(2.0, 0.8).items()})"]},{"cell_type":"markdown","metadata":{},"source":["## 1. Initial design and surrogates\n","Expensive responses (R, ΔT_air) get GP surrogates on log10 scale; mass is computed exactly."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from scipy.stats import qmc\n","from scipy.optimize import minimize\n","from sklearn.gaussian_process import GaussianProcessRegressor\n","from sklearn.gaussian_process.kernels import ConstantKernel, RBF\n","\n","def fit_gp(Z, y):\n","    k = ConstantKernel(1.0) * RBF([0.3, 0.3], (1e-2, 1e2))\n","    return GaussianProcessRegressor(k, normalize_y=True, n_restarts_optimizer=3, random_state=0).fit(Z, y)\n","\n","Z = qmc.LatinHypercube(d=2, seed=SEED).random(16); X = from_unit(Z); out = heat_sink(X[:, 0], X[:, 1])\n","gp_R, gp_T = fit_gp(Z, np.log10(out[\"R\"])), fit_gp(Z, np.log10(out[\"dT_air\"]))\n","n_evals = len(Z)          # original-model evaluations used so far\n","print(\"evaluations used:\", n_evals)"]},{"cell_type":"markdown","metadata":{},"source":["## 2. The surrogate problem in scaled variables z ∈ [0, 1]²\n","minimize log10 R̂(z) subject to m(z) ≤ 0.070 kg (exact) and log10 T̂(z) ≤ log10 12."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["def obj(z):     return gp_R.predict(z.reshape(1, -1))[0]\n","def c_mass(z):  x = from_unit(z); return 1 - heat_sink(x[0], x[1])[\"mass\"] / MASS_MAX_KG      # >= 0 feasible\n","def c_dT(z):    return np.log10(DTAIR_MAX_K) - gp_T.predict(z.reshape(1, -1))[0]               # >= 0 feasible\n","cons = [{\"type\": \"ineq\", \"fun\": c_mass}, {\"type\": \"ineq\", \"fun\": c_dT}]\n","\n","def multistart(n_starts=20, seed=0):\n","    starts = qmc.LatinHypercube(d=2, seed=seed).random(n_starts)\n","    best = None\n","    # TODO: Run SLSQP from each start with bounds [(0,1),(0,1)] and cons; keep the feasible result with the lowest fun\n","    # (replace the next line with your code)\n","    raise NotImplementedError('TODO: Run SLSQP from each start with bounds [(0,1),(0,1)] and cons; keep the')\n","    return best\n","\n","res = multistart()\n","z_hat = res.x; x_hat = from_unit(z_hat)\n","print(f\"surrogate optimum: s = {x_hat[0]:.3f} mm, t = {x_hat[1]:.3f} mm\")\n","print(f\"PREDICTED R = {10 ** res.fun:.4f} K/W, predicted dT_air = {10 ** gp_T.predict(z_hat[None])[0]:.2f} K, exact mass = {heat_sink(*x_hat)['mass']:.4f} kg\")"]},{"cell_type":"markdown","metadata":{},"source":["## 3. For teaching only: the true-model optimum\n","In a real study you could not afford this. Here it lets us measure the surrogate’s optimality gap."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["def true_obj(z): x = from_unit(z); return np.log10(heat_sink(x[0], x[1])[\"R\"])\n","def true_dT(z):  x = from_unit(z); return np.log10(DTAIR_MAX_K) - np.log10(heat_sink(x[0], x[1])[\"dT_air\"])\n","best_true = min((minimize(true_obj, z0, method=\"SLSQP\", bounds=[(0, 1), (0, 1)],\n","                          constraints=[{\"type\": \"ineq\", \"fun\": c_mass}, {\"type\": \"ineq\", \"fun\": true_dT}])\n","                 for z0 in qmc.LatinHypercube(d=2, seed=1).random(20)), key=lambda r: r.fun)\n","x_true = from_unit(best_true.x)\n","print(f\"true optimum: s = {x_true[0]:.4f} mm, t = {x_true[1]:.4f} mm, R* = {10 ** best_true.fun:.5f} K/W (course reference {R_STAR})\")"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output:** the true optimum agrees with the course reference (s ≈ 1.85 mm, t ≈ 0.35 mm, R* ≈ 0.5771 K/W). The surrogate optimum is usually close but not identical."]},{"cell_type":"markdown","metadata":{},"source":["## Interpretation task\n","1. Why is mass computed exactly rather than surrogated?\n","2. Why do we use many starts?\n","3. Is the predicted R evidence of performance? What must happen next? (→ Lab 8)"]},{"cell_type":"markdown","metadata":{},"source":["### Debugging tips\n","- `NameError`: a cell above was not run (run all cells from the top) or a name is misspelled.\n","- `ValueError` about shapes: print `.shape`; scikit-learn needs `X` with shape `(n_samples, n_features)` — use `x.reshape(-1, 1)` for one feature.\n","- Implausible numbers (e.g., R = 0.0004 K/W): check units — the model expects **millimetres**.\n","- `ModuleNotFoundError`: install the package in the environment that runs this notebook's kernel.\n","- Results change every run: make sure all randomness uses `rng` or a fixed `random_state`."]}],"metadata":{"kernelspec":{"display_name":"Python 3","language":"python","name":"python3"},"language_info":{"name":"python"},"mlso":{"course_version":"3.0.0","lab":"lab07","variant":"starter"}},"nbformat":4,"nbformat_minor":4},"reference":{"cells":[{"cell_type":"markdown","metadata":{},"source":["# Lab 7 — Bounded, constrained surrogate optimization (refer rministic: no measurement noise.\n","BOUNDS = np.array([[0.8, 3.0],    # s_mm: fin gap (mm)\n","                   [0.2, 1.5]])   # t_mm: fin thickness (mm)\n","MASS_MAX_KG = 0.070               # constraint g1: mass <= 0.070 kg  (cheap: geometry only)\n","DTAIR_MAX_K = 12.0                # constraint g2: air temperature rise <= 12 K (needs flow solution)\n","\n","def heat_sink(s_mm, t_mm):\n","    \"\"\"Return dict with R (K/W), mass (kg), dT_air (K), Re (-). Accepts scalars or NumPy arrays.\"\"\"\n","    W, L, H, tb = 0.050, 0.050, 0.040, 0.004          # base width, flow length, fin height, base thickness (m)\n","    ks, rho_al = 150.0, 2700.0                         # aluminium alloy: W/(m K), kg/m^3\n","    rho, mu, cp, ka = 1.16, 1.85e-5, 1007.0, 0.026     # air: kg/m^3, Pa s, J/(kg K), W/(m K)\n","    dp, Q, Nu = 5.0, 30.0, 7.54                        # fan pressure (Pa), heat load (W), Nusselt (-)\n","    s = np.asarray(s_mm, dtype=float) * 1e-3           # mm -> m  (unit conversion!)\n","    t = np.asarray(t_mm, dtype=float) * 1e-3\n","    N = W / (s + t)                                    # number of fins (continuous)\n","    u = dp * s**2 / (12 * mu * L)                      # laminar parallel-plate channel velocity (m/s)\n","    mdot = rho * u * s * H * N                         # air mass flow (kg/s)\n","    h = Nu * ka / (2 * s)                              # heat-transfer coefficient (W/m^2 K)\n","    m = np.sqrt(2 * h / (ks * t))                      # fin parameter (1/m)\n","    eta = np.tanh(m * H) / (m * H)                     # fin efficiency (-)\n","    UA = h * N * L * (2 * H * eta + s)                 # conductance (W/K)\n","    NTU = UA / (mdot * cp)\n","    R = 1 / (mdot * cp * (1 - np.exp(-NTU))) + tb / (ks * W * L)\n","    mass = rho_al * (N * t * H * L + W * L * tb)\n","    dT_air = Q / (mdot * cp)\n","    Re = rho * u * 2 * s / mu\n","    return {\"R\": R, \"mass\": mass, \"dT_air\": dT_air, \"Re\": Re}\n","\n","def to_unit(X_mm):\n","    \"\"\"Scale physical designs (n, 2) in mm to the unit square using the bounds.\"\"\"\n","    return (np.asarray(X_mm) - BOUNDS[:, 0]) / (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","def from_unit(Z):\n","    \"\"\"Map unit-square points (n, 2) back to physical designs in mm.\"\"\"\n","    return BOUNDS[:, 0] + np.asarray(Z) * (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","R_STAR, S_STAR, T_STAR = 0.57705, 1.8525, 0.3509   # reference constrained optimum (teaching only)\n","assert abs(heat_sink(2.0, 0.8)[\"R\"] - 0.58738853) < 1e-6, \"model check failed - did you edit the model?\"\n","print(\"Model OK. Example: s=2.0 mm, t=0.8 mm ->\", {k: round(float(v), 4) for k, v in heat_sink(2.0, 0.8).items()})"]},{"cell_type":"markdown","metadata":{},"source":["## 1. Helpers (from Lab 7) and an evaluation counter"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from scipy.stats import qmc\n","from scipy.optimize import minimize\n","from sklearn.gaussian_process import GaussianProcessRegressor\n","from sklearn.gaussian_process.kernels import ConstantKernel, RBF\n","\n","def fit_gp(Z, y):\n","    k = ConstantKernel(1.0) * RBF([0.3, 0.3], (1e-2, 1e2))\n","    return GaussianProcessRegressor(k, normalize_y=True, n_restarts_optimizer=2, random_state=0).fit(Z, y)\n","\n","class Simulator:\n","    \"\"\"Wraps the 'expensive' model and counts evaluations.\"\"\"\n","    def __init__(self): self.n = 0\n","    def __call__(self, Z):\n","        Z = np.atleast_2d(Z); self.n += len(Z); X = from_unit(Z); return heat_sink(X[:, 0], X[:, 1])\n","\n","def mass_ok(z):   # >= 0 when feasible; tiny 1e-6 margin so round-off on the active boundary is not judged infeasible\n","    x = from_unit(z); return 1 - 1e-6 - heat_sink(x[0], x[1])[\"mass\"] / MASS_MAX_KG\n","\n","def optimize_surrogate(gp_R, gp_T, seed=0, n_starts=12):\n","    cons = [{\"type\": \"ineq\", \"fun\": mass_ok}, {\"type\": \"ineq\", \"fun\": lambda z: np.log10(DTAIR_MAX_K) - gp_T.predict(z[None])[0]}]\n","    best = None\n","    for z0 in qmc.LatinHypercube(d=2, seed=seed).random(n_starts):\n","        r = minimize(lambda z: gp_R.predict(z[None])[0], z0, method=\"SLSQP\", bounds=[(0, 1)] * 2, constraints=cons)\n","        if r.success and all(c[\"fun\"](r.x) >= -1e-6 for c in cons) and (best is None or r.fun < best.fun): best = r\n","    return best.x if best is not None else np.random.default_rng(seed).random(2)\n","\n","def feasible(out): return (out[\"mass\"] <= MASS_MAX_KG + 1e-12) & (out[\"dT_air\"] <= DTAIR_MAX_K)"]},{"cell_type":"markdown","metadata":{},"source":["## 2. Sequential SBO with a verification table"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["def run_sbo(budget=24, n0=10, seed=SEED, tol=5e-4, window=4, verbose=False):\n","    sim = Simulator()\n","    Z = qmc.LatinHypercube(d=2, seed=seed).random(n0); out = sim(Z)\n","    yR, yT = list(np.log10(out[\"R\"])), list(np.log10(out[\"dT_air\"])); feas = list(feasible(out)); Rv = list(out[\"R\"])\n","    log, best_hist = [], []\n","    best = lambda: min([r for r, f in zip(Rv, feas) if f], default=np.inf)\n","    best_hist += [best()] * n0\n","    while sim.n < budget:\n","        gp_R, gp_T = fit_gp(Z, np.array(yR)), fit_gp(Z, np.array(yT))\n","        z = optimize_surrogate(gp_R, gp_T, seed=sim.n)\n","        if np.min(np.linalg.norm(Z - z, axis=1)) < 1e-6:        # already evaluated -> explore instead\n","            z = np.random.default_rng(sim.n).random(2)\n","        pred_R, pred_T = 10 ** gp_R.predict(z[None])[0], 10 ** gp_T.predict(z[None])[0]\n","        o = sim(z)                                              # VERIFY with the original model\n","        Z = np.vstack([Z, z]); yR.append(np.log10(o[\"R\"][0])); yT.append(np.log10(o[\"dT_air\"][0]))\n","        feas.append(bool(feasible(o)[0])); Rv.append(o[\"R\"][0]); best_hist.append(best())\n","        x = from_unit(z); log.append(dict(evals=sim.n, s_mm=x[0], t_mm=x[1], R_pred=pred_R, R_verified=o[\"R\"][0],\n","                                          dT_pred=pred_T, dT_verified=o[\"dT_air\"][0], mass_kg=o[\"mass\"][0], feasible=feas[-1]))\n","        # TODO: Stopping rule: stop if the relative improvement of the best verified feasible R over the last `window` evaluations is below tol\n","        # (replace the next line with your code)\n","        raise NotImplementedError('TODO: Stopping rule: stop if the relative improvement of the best verified f')\n","    return pd.DataFrame(log), np.array(best_hist)\n","\n","log, hist = run_sbo(verbose=True)\n","display(log.round(4))\n","print(\"best verified feasible R:\", round(float(hist[-1]), 5), \"K/W after\", len(hist), \"evaluations; gap to R*:\",\n","      f\"{100 * (hist[-1] - R_STAR) / R_STAR:.2f}%\")"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output:** a table in which predicted and verified R differ by small amounts that shrink as data accumulate; the best feasible R approaches 0.577 K/W. The loop may stop before the budget if improvement stagnates. Note the tiny mass margin in `mass_ok`: at an *active* constraint, round-off can otherwise push candidates a hair over the limit."]},{"cell_type":"markdown","metadata":{},"source":["## 3. Optimizer exploitation (1-D illustration)\n","Five noise-free samples on the slice t = 0.6 mm, none beyond s = 2.7 mm, fitted with a cubic. Let an optimizer search the whole bound range 0.8–3.0 mm."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["s5 = np.array([0.9, 1.2, 1.6, 2.1, 2.7]); R5 = heat_sink(s5, 0.6)[\"R\"]\n","coef = np.polyfit((s5 - 1.9) / 1.1, R5, 3); poly = lambda s: np.polyval(coef, (s - 1.9) / 1.1)\n","ss = np.linspace(*BOUNDS[0], 400); i = np.argmin(poly(ss))\n","print(f\"optimizer picks s = {ss[i]:.3f} mm: predicted R = {poly(ss[i]):.3f}, verified R = {heat_sink(ss[i], 0.6)['R']:.3f} K/W\")\n","plt.plot(ss, heat_sink(ss, 0.6)[\"R\"], \"k--\", label=\"true\"); plt.plot(ss, poly(ss), label=\"cubic surrogate\"); plt.plot(s5, R5, \"o\")\n","plt.axvspan(2.7, 3.0, alpha=0.15, color=\"red\", label=\"no data\"); plt.ylim(0, 3); plt.legend(); plt.xlabel(\"s (mm)\"); plt.ylabel(\"R (K/W)\"); plt.show()"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output:** the optimizer picks the unsampled edge s = 3.0 mm, where the cubic dives (predicted ≈ 0.42 K/W) but the verified value is ≈ 0.79 K/W — the optimizer exploited extrapolation error."]},{"cell_type":"markdown","metadata":{},"source":["## 4. Fair comparison: SBO vs random search, equal budget, 5 seeds"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["def run_random(budget=24, seed=0):\n","    sim = Simulator(); o = sim(np.random.default_rng(seed).random((budget, 2)))\n","    R = np.where(feasible(o), o[\"R\"], np.inf); return np.minimum.accumulate(R)\n","\n","B = 24\n","# TODO: For seeds 0..4 run run_sbo(budget=B, seed=sd, tol=0) and run_random(B, sd); collect final gaps (%) to R_STAR\n","# (replace the next line with your code)\n","raise NotImplementedError('TODO: For seeds 0..4 run run_sbo(budget=B, seed=sd, tol=0) and run_random(B,')\n","summary = pd.DataFrame(gaps).describe().loc[[\"min\", \"50%\", \"max\"]].rename(index={\"50%\": \"median\"})\n","summary.round(2)"]},{"cell_type":"markdown","metadata":{},"source":["## Interpretation task\n","1. Is the prediction error at candidates mostly positive or negative? Why?\n","2. Which stopping rule did your run trigger?\n","3. Write one sentence comparing SBO and random search that is supported by your 5-seed results (no over-claiming)."]},{"cell_type":"markdown","metadata":{},"source":["### Debugging tips\n","- `NameError`: a cell above was not run (run all cells from the top) or a name is misspelled.\n","- `ValueError` about shapes: print `.shape`; scikit-learn needs `X` with shape `(n_samples, n_features)` — use `x.reshape(-1, 1)` for one feature.\n","- Implausible numbers (e.g., R = 0.0004 K/W): check units — the model expects **millimet  h * N * L * (2 * H * eta + s)                 # conductance (W/K)\n","    NTU = UA / (mdot * cp)\n","    R = 1 / (mdot * cp * (1 - np.exp(-NTU))) + tb / (ks * W * L)\n","    mass = rho_al * (N * t * H * L + W * L * tb)\n","    dT_air = Q / (mdot * cp)\n","    Re = rho * u * 2 * s / mu\n","    return {\"R\": R, \"mass\": mass, \"dT_air\": dT_air, \"Re\": Re}\n","\n","def to_unit(X_mm):\n","    \"\"\"Scale physical designs (n, 2) in mm to the unit square using the bounds.\"\"\"\n","    return (np.asarray(X_mm) - BOUNDS[:, 0]) / (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","def from_unit(Z):\n","    \"\"\"Map unit-square points (n, 2) back to physical designs in mm.\"\"\"\n","    return BOUNDS[:, 0] + np.asarray(Z) * (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","R_STAR, S_STAR, T_STAR = 0.57705, 1.8525, 0.3509   # reference constrained optimum (teaching only)\n","assert abs(heat_sink(2.0, 0.8)[\"R\"] - 0.58738853) < 1e-6, \"model check failed - did you edit the model?\"\n","print(\"Model OK. Example: s=2.0 mm, t=0.8 mm ->\", {k: round(float(v), 4) for k, v in heat_sink(2.0, 0.8).items()})"]},{"cell_type":"markdown","metadata":{},"source":["## 1. Helpers (from Lab 7) and an evaluation counter"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from scipy.stats import qmc\n","from scipy.optimize import minimize\n","from sklearn.gaussian_process import GaussianProcessRegressor\n","from sklearn.gaussian_process.kernels import ConstantKernel, RBF\n","\n","def fit_gp(Z, y):\n","    k = ConstantKernel(1.0) * RBF([0.3, 0.3], (1e-2, 1e2))\n","    return GaussianProcessRegressor(k, normalize_y=True, n_restarts_optimizer=2, random_state=0).fit(Z, y)\n","\n","class Simulator:\n","    \"\"\"Wraps the 'expensive' model and counts evaluations.\"\"\"\n","    def __init__(self): self.n = 0\n","    def __call__(self, Z):\n","        Z = np.atleast_2d(Z); self.n += len(Z); X = from_unit(Z); return heat_sink(X[:, 0], X[:, 1])\n","\n","def mass_ok(z):   # >= 0 when feasible; tiny 1e-6 margin so round-off on the active boundary is not judged infeasible\n","    x = from_unit(z); return 1 - 1e-6 - heat_sink(x[0], x[1])[\"mass\"] / MASS_MAX_KG\n","\n","def optimize_surrogate(gp_R, gp_T, seed=0, n_starts=12):\n","    cons = [{\"type\": \"ineq\", \"fun\": mass_ok}, {\"type\": \"ineq\", \"fun\": lambda z: np.log10(DTAIR_MAX_K) - gp_T.predict(z[None])[0]}]\n","    best = None\n","    for z0 in qmc.LatinHypercube(d=2, seed=seed).random(n_starts):\n","        r = minimize(lambda z: gp_R.predict(z[None])[0], z0, method=\"SLSQP\", bounds=[(0, 1)] * 2, constraints=cons)\n","        if r.success and all(c[\"fun\"](r.x) >= -1e-6 for c in cons) and (best is None or r.fun < best.fun): best = r\n","    return best.x if best is not None else np.random.default_rng(seed).random(2)\n","\n","def feasible(out): return (out[\"mass\"] <= MASS_MAX_KG + 1e-12) & (out[\"dT_air\"] <= DTAIR_MAX_K)"]},{"cell_type":"markdown","metadata":{},"source":["## 2. Sequential SBO with a verification table"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["def run_sbo(budget=24, n0=10, seed=SEED, tol=5e-4, window=4, verbose=False):\n","    sim = Simulator()\n","    Z = qmc.LatinHypercube(d=2, seed=seed).random(n0); out = sim(Z)\n","    yR, yT = list(np.log10(out[\"R\"])), list(np.log10(out[\"dT_air\"])); feas = list(feasible(out)); Rv = list(out[\"R\"])\n","    log, best_hist = [], []\n","    best = lambda: min([r for r, f in zip(Rv, feas) if f], default=np.inf)\n","    best_hist += [best()] * n0\n","    while sim.n < budget:\n","        gp_R, gp_T = fit_gp(Z, np.array(yR)), fit_gp(Z, np.array(yT))\n","        z = optimize_surrogate(gp_R, gp_T, seed=sim.n)\n","        if np.min(np.linalg.norm(Z - z, axis=1)) < 1e-6:        # already evaluated -> explore instead\n","            z = np.random.default_rng(sim.n).random(2)\n","        pred_R, pred_T = 10 ** gp_R.predict(z[None])[0], 10 ** gp_T.predict(z[None])[0]\n","        o = sim(z)                                              # VERIFY with the original model\n","        Z = np.vstack([Z, z]); yR.append(np.log10(o[\"R\"][0])); yT.append(np.log10(o[\"dT_air\"][0]))\n","        feas.append(bool(feasible(o)[0])); Rv.append(o[\"R\"][0]); best_hist.append(best())\n","        x = from_unit(z); log.append(dict(evals=sim.n, s_mm=x[0], t_mm=x[1], R_pred=pred_R, R_verified=o[\"R\"][0],\n","                                          dT_pred=pred_T, dT_verified=o[\"dT_air\"][0], mass_kg=o[\"mass\"][0], feasible=feas[-1]))\n","        if len(best_hist) > window and np.isfinite(best_hist[-1 - window]) and \\\n","           (best_hist[-1 - window] - best_hist[-1]) / best_hist[-1] < tol and log[-1][\"feasible\"]:\n","            break\n","    return pd.DataFrame(log), np.array(best_hist)\n","\n","log, hist = run_sbo(verbose=True)\n","display(log.round(4))\n","print(\"best verified feasible R:\", round(float(hist[-1]), 5), \"K/W after\", len(hist), \"evaluations; gap to R*:\",\n","      f\"{100 * (hist[-1] - R_STAR) / R_STAR:.2f}%\")"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output:** a table in which predicted and verified R differ by small amounts that shrink as data accumulate; the best feasible R approaches 0.577 K/W. The loop may stop before the budget if improvement stagnates. Note the tiny mass margin in `mass_ok`: at an *active* constraint, round-off can otherwise push candidates a hair over the limit."]},{"cell_type":"markdown","metadata":{},"source":["## 3. Optimizer exploitation (1-D illustration)\n","Five noise-free samples on the slice t = 0.6 mm, none beyond s = 2.7 mm, fitted with a cubic. Let an optimizer search the whole bound range 0.8–3.0 mm."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["s5 = np.array([0.9, 1.2, 1.6, 2.1, 2.7]); R5 = heat_sink(s5, 0.6)[\"R\"]\n","coef = np.polyfit((s5 - 1.9) / 1.1, R5, 3); poly = lambda s: np.polyval(coef, (s - 1.9) / 1.1)\n","ss = np.linspace(*BOUNDS[0], 400); i = np.argmin(poly(ss))\n","print(f\"optimizer picks s = {ss[i]:.3f} mm: predicted R = {poly(ss[i]):.3f}, verified R = {heat_sink(ss[i], 0.6)['R']:.3f} K/W\")\n","plt.plot(ss, heat_sink(ss, 0.6)[\"R\"], \"k--\", label=\"true\"); plt.plot(ss, poly(ss), label=\"cubic surrogate\"); plt.plot(s5, R5, \"o\")\n","plt.axvspan(2.7, 3.0, alpha=0.15, color=\"red\", label=\"no data\"); plt.ylim(0, 3); plt.legend(); plt.xlabel(\"s (mm)\"); plt.ylabel(\"R (K/W)\"); plt.show()"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output:** the optimizer picks the unsampled edge s = 3.0 mm, where the cubic dives (predicted ≈ 0.42 K/W) but the verified value is ≈ 0.79 K/W — the optimizer exploited extrapolation error."]},{"cell_type":"markdown","metadata":{},"source":["## 4. Fair comparison: SBO vs random search, equal budget, 5 seeds"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["def run_random(budget=24, seed=0):\n","    sim = Simulator(); o = sim(np.random.default_rng(seed).random((budget, 2)))\n","    R = np.where(feasible(o), o[\"R\"], np.inf); return np.minimum.accumulate(R)\n","\n","B = 24\n","gaps = {\"SBO\": [], \"random\": []}\n","for sd in range(5):\n","    _, h = run_sbo(budget=B, seed=sd, tol=0.0)\n","    gaps[\"SBO\"].append(100 * (h[-1] - R_STAR) / R_STAR)\n","    gaps[\"random\"].append(100 * (run_random(B, sd)[-1] - R_STAR) / R_STAR)\n","summary = pd.DataFrame(gaps).describe().loc[[\"min\", \"50%\", \"max\"]].rename(index={\"50%\": \"median\"})\n","summary.round(2)"]},{"cell_type":"markdown","metadata":{},"source":["## Interpretation task\n","1. Is the prediction error at candidates mostly positive or negative? Why?\n","2. Which stopping rule did your run trigger?\n","3. Write one sentence comparing SBO and random search that is supported by your 5-seed results (no over-claiming)."]},{"cell_type":"markdown","metadata":{},"source":["**Reference answers.** (1) Mostly negative (predicted < verified): the optimizer selects where the surrogate is low — a selection effect. (2) Either the budget or stagnation. (3) E.g., “With 24 evaluations, sequential SBO reached a median gap of x% (range a–b%) versus y% (c–d%) for random search over 5 seeds on this pedagogical problem.”"]},{"cell_type":"markdown","metadata":{},"source":["### Debugging tips\n","- `NameError`: a cell above was not run (run all cells from the top) or a name is misspelled.\n","- `ValueError` about shapes: print `.shape`; scikit-learn needs `X` with shape `(n_samples, n_features)` — use `x.reshape(-1, 1)` for one feature.\n","- Implausible numbers (e.g., R = 0.0004 K/W): check units — the model expects **millimetres**.\n","- `ModuleNotFoundError`: install the package in the environment that runs this notebook's kernel.\n","- Results change every run: make sure all randomness uses `rng` or a fixed `random_state`."]}],"metadata":{"kernelspec":{"display_name":"Python 3","language":"python","name":"python3"},"language_info":{"name":"python"},"mlso":{"course_version":"3.0.0","lab":"lab08","variant":"reference"}},"nbformat":4,"nbformat_minor":4},"tested":true,"testNote":"For course version 3.0.0 this reference notebook was executed top-to-bottom without errors on 2026-10-06 by the course maintainer, in a freshly created virtual environment (python 3.13.16, numpy 2.5.3, pandas 3.0.5, matplotlib 3.11.2, scipy 1.18.1, scikit-learn 1.9.1; Linux-6.18.44-fc-v70-x86_64-with-glibc2.39); wall time 24 s. Other package versions were not tested; numerical outputs may differ slightly.","deps":"numpy, pandas, matplotlib, scipy (≥ 1.8 required for Lab 10), scikit-learn, jupyterlab. Tested configuration: python 3.13.16, numpy 2.5.3, pandas 3.0.5, matplotlib 3.11.2, scipy 1.18.1, scikit-learn 1.9.1."},"lab09":{"starter":{"cells":[{"cell_type":"markdown","metadata":{},"source":["# Lab 9 — A simple sequential Bayesian-optimization loop (starter)\n","**Course:** Machine Learning Fundamentals for Surrogate-Based Engineering Optimization — Module 12\n","**Estimated time:** 90 minutes\n","\n","**Purpose.** Implement expected improvement by hand (including σ = 0), run 1-D BO on a synthetic multimodal function, and run constrained BO on the heat sink with probability of feasibility.\n","\n","**Expected learning outcome.** You can implement and test EI, choose the next sample by maximizing an acquisition function, and run a constrained BO loop.\n","\n","**How to use this notebook.** Run cells from top to bottom with *Shift+Enter*. Cells marked `# TODO` are exercises: replace the `raise NotImplementedError(...)` line with your code. When you finish (and before comparing with the reference notebook), use *Kernel → Restart Kernel and Run All Cells*.\n","\n","**Dependencies.** numpy, pandas, matplotlib, scipy, scikit-learn, jupyterlab. The exact configuration in which the reference notebooks were executed is given in the downloadable environment specification on the course’s Labs page (and in the testing-status cell below). Minimum versions: SciPy ≥ 1.8 is required (Lab 10 uses `LatinHypercube(optimization=\"random-cd\")`, which first appears in SciPy 1.8.0 — checked against the SciPy release source); scikit-learn ≥ 1.0 and Python ≥ 3.10 are expected to work but lower versions were **not** executed.\n","\n","**About the model.** The heat-sink function below is a simplified *pedagogical* analytical model standing in for an expensive CFD simulation. Results describe this model, not real hardware."]},{"cell_type":"markdown","metadata":{},"source":["**Testing status.** For course version 3.0.0 this reference notebook was executed top-to-bottom without errors on 2026-10-06 by the course maintainer, in a freshly created virtual environment (python 3.13.16, numpy 2.5.3, pandas 3.0.5, matplotlib 3.11.2, scipy 1.18.1, scikit-learn 1.9.1; Linux-6.18.44-fc-v70-x86_64-with-glibc2.39); wall time 5 s. Other package versions were not tested; numerical outputs may differ slightly.\n","\n","**Starter notebooks** intentionally stop at the first unfinished `# TODO` (they raise `NotImplementedError`). Every code cell of both versions is checked to be valid Python syntax, but starters were not executed end-to-end."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Setup: imports, versions and reproducibility\n","import sys, time\n","import numpy as np\n","import pandas as pd\n","import matplotlib.pyplot as plt\n","import scipy, sklearn\n","print(\"Python\", sys.version.split()[0], \"| numpy\", np.__version__, \"| pandas\", pd.__version__,\n","      \"| scipy\", scipy.__version__, \"| scikit-learn\", sklearn.__version__)\n","SEED = 7                                  # change this to test sensitivity to sampling luck\n","rng = np.random.default_rng(SEED)         # one generator for the whole notebook\n","plt.rcParams[\"figure.figsize\"] = (6.4, 4.2)\n","# Gaussian-process hyperparameter fits on small deterministic datasets often emit ConvergenceWarnings from the\n","# L-BFGS optimizer. We silence them to keep output readable and judge models by validation instead.\n","# Remove this filter if you want to see them.\n","import warnings\n","from sklearn.exceptions import ConvergenceWarning\n","warnings.filterwarnings(\"ignore\", category=ConvergenceWarning)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Pedagogical plate-fin heat-sink model: a transparent stand-in for an expensive CFD simulation.\n","# Inputs: fin gap s_mm and fin thickness t_mm (millimetres). Deterministic: no measurement noise.\n","BOUNDS = np.array([[0.8, 3.0],    # s_mm: fin gap (mm)\n","                   [0.2, 1.5]])   # t_mm: fin thickness (mm)\n","MASS_MAX_KG = 0.070               # constraint g1: mass <= 0.070 kg  (cheap: geometry only)\n","DTAIR_MAX_K = 12.0                # constraint g2: air temperature rise <= 12 K (needs flow solution)\n","\n","def heat_sink(s_mm, t_mm):\n","    \"\"\"Return dict with R (K/W), mass (kg), dT_air (K), Re (-). Accepts scalars or NumPy arrays.\"\"\"\n","    W, L, H, tb = 0.050, 0.050, 0.040, 0.004          # base width, flow length, fin height, base thickness (m)\n","    ks, rho_al = 150.0, 2700.0                         # aluminium alloy: W/(m K), kg/m^3\n","    rho, mu, cp, ka = 1.16, 1.85e-5, 1007.0, 0.026     # air: kg/m^3, Pa s, J/(kg K), W/(m K)\n","    dp, Q, Nu = 5.0, 30.0, 7.54                        # fan pressure (Pa), heat load (W), Nusselt (-)\n","    s = np.asarray(s_mm, dtype=float) * 1e-3           # mm -> m  (unit conversion!)\n","    t = np.asarray(t_mm, dtype=float) * 1e-3\n","    N = W / (s + t)                                    # number of fins (continuous)\n","    u = dp * s**2 / (12 * mu * L)                      # laminar parallel-plate channel velocity (m/s)\n","    mdot = rho * u * s * H * N                         # air mass flow (kg/s)\n","    h = Nu * ka / (2 * s)                              # heat-transfer coefficient (W/m^2 K)\n","    m = np.sqrt(2 * h / (ks * t))                      # fin parameter (1/m)\n","    eta = np.tanh(m * H) / (m * H)                     # fin efficiency (-)\n","    UA = h * N * L * (2 * H * eta + s)                 # conductance (W/K)\n","    NTU = UA / (mdot * cp)\n","    R = 1 / (mdot * cp * (1 - np.exp(-NTU))) + tb / (ks * W * L)\n","    mass = rho_al * (N * t * H * L + W * L * tb)\n","    dT_air = Q / (mdot * cp)\n","    Re = rho * u * 2 * s / mu\n","    return {\"R\": R, \"mass\": mass, \"dT_air\": dT_air, \"Re\": Re}\n","\n","def to_unit(X_mm):\n","    \"\"\"Scale physical designs (n, 2) in mm to the unit square using the bounds.\"\"\"\n","    return (np.asarray(X_mm) - BOUNDS[:, 0]) / (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","def from_unit(Z):\n","    \"\"\"Map unit-square points (n, 2) back to physical designs in mm.\"\"\"\n","    return BOUNDS[:, 0] + np.asarray(Z) * (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","R_STAR, S_STAR, T_STAR = 0.57705, 1.8525, 0.3509   # reference constrained optimum (teaching only)\n","assert abs(heat_sink(2.0, 0.8)[\"R\"] - 0.58738853) < 1e-6, \"model check failed - did you edit the model?\"\n","print(\"Model OK. Example: s=2.0 mm, t=0.8 mm ->\", {k: round(float(v), 4) for k, v in heat_sink(2.0, 0.8).items()})"]},{"cell_type":"markdown","metadata":{},"source":["## 1. Expected improvement for minimization\n","EI = (f_best − μ − ξ)Φ(z) + σφ(z), z = (f_best − μ − ξ)/σ for σ > 0; EI = max(f_best − μ − ξ, 0) for σ = 0."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from scipy.stats import norm\n","def expected_improvement(mu, sigma, f_best, xi=0.0):\n","    mu, sigma = np.asarray(mu, float), np.asarray(sigma, float)\n","    imp = f_best - mu - xi\n","    # TODO: Return EI, handling sigma <= 1e-12 with the deterministic formula max(imp, 0)\n","    # (replace the next line with your code)\n","    raise NotImplementedError('TODO: Return EI, handling sigma <= 1e-12 with the deterministic formula max(')\n","\n","# Unit tests (should pass silently)\n","assert np.isclose(expected_improvement([0.6], [0.0], 0.62)[0], 0.02)\n","assert np.isclose(expected_improvement([0.7], [0.0], 0.62)[0], 0.0)\n","assert np.isclose(expected_improvement([1.0], [0.2], 1.0)[0], 0.2 * norm.pdf(0))\n","assert np.all(expected_improvement(np.linspace(0, 2, 50), np.full(50, 0.1), 1.0) >= 0)\n","print(\"EI tests passed.\")"]},{"cell_type":"markdown","metadata":{},"source":["## 2. 1-D BO on a synthetic multimodal function (not the heat sink)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from sklearn.gaussian_process import GaussianProcessRegressor\n","from sklearn.gaussian_process.kernels import ConstantKernel, RBF\n","f = lambda x: 0.9 + 0.35 * np.sin(11 * x) * np.exp(-0.5 * x) + 0.4 * (x - 0.65) ** 2   # synthetic test function\n","xg = np.linspace(0, 1, 501)\n","X1 = np.array([0.15, 0.5, 0.85]); y1 = f(X1)\n","for it in range(8):\n","    gp = GaussianProcessRegressor(ConstantKernel() * RBF(0.1, (1e-2, 1)), normalize_y=True, alpha=1e-8, n_restarts_optimizer=2, random_state=0).fit(X1[:, None], y1)\n","    mu, sd = gp.predict(xg[:, None], return_std=True)\n","    ei = expected_improvement(mu, sd, y1.min(), xi=0.01)\n","    x_next = xg[np.argmax(ei)]\n","    X1, y1 = np.append(X1, x_next), np.append(y1, f(x_next))\n","print(\"best found:\", round(float(X1[np.argmin(y1)]), 3), round(float(y1.min()), 4), \"| true min on grid:\", round(float(xg[np.argmin(f(xg))]), 3), round(float(f(xg).min()), 4))\n","fig, ax = plt.subplots(2, 1, figsize=(6.4, 5), sharex=True)\n","ax[0].plot(xg, f(xg), \"k--\"); ax[0].plot(xg, mu); ax[0].fill_between(xg, mu - 2 * sd, mu + 2 * sd, alpha=0.3); ax[0].plot(X1, y1, \"o\")\n","ax[1].plot(xg, ei); ax[1].set_xlabel(\"x\"); ax[0].set_ylabel(\"f\"); ax[1].set_ylabel(\"EI\"); plt.show()"]},{"cell_type":"markdown","metadata":{},"source":["## 3. Constrained BO on the heat sink\n","EI on log10 R × probability that log10 ΔT_air ≤ log10 12; mass excluded exactly; acquisition maximized on a 61×61 grid."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from scipy.stats import qmc\n","def fit_gp(Z, y):\n","    return GaussianProcessRegressor(ConstantKernel() * RBF([0.3, 0.3], (1e-2, 1e2)), normalize_y=True, n_restarts_optimizer=2, random_state=0).fit(Z, y)\n","Zg = np.array([[a, b] for a in np.linspace(0, 1, 61) for b in np.linspace(0, 1, 61)])\n","Xg = from_unit(Zg); mass_feasible = heat_sink(Xg[:, 0], Xg[:, 1])[\"mass\"] <= MASS_MAX_KG\n","\n","def run_bo(budget=24, n0=8, seed=SEED, xi=0.0):\n","    Z = qmc.LatinHypercube(d=2, seed=seed).random(n0); X = from_unit(Z); o = heat_sink(X[:, 0], X[:, 1])\n","    yR, yT = np.log10(o[\"R\"]), np.log10(o[\"dT_air\"]); ok = (o[\"mass\"] <= MASS_MAX_KG) & (o[\"dT_air\"] <= DTAIR_MAX_K)\n","    hist = [np.min(np.where(ok, 10 ** yR, np.inf)[:k + 1]) for k in range(n0)]\n","    while len(Z) < budget:\n","        gR, gT = fit_gp(Z, yR), fit_gp(Z, yT)\n","        mR, sR = gR.predict(Zg, return_std=True); mT, sT = gT.predict(Zg, return_std=True)\n","        f_best = yR[ok].min() if ok.any() else yR.max()\n","        # TODO: Compute acq = EI(mR, sR, f_best, xi) * PoF, with PoF = Phi((log10(12) - mT)/sT) (use sT clipped at 1e-12); set acq to 0 where mass is infeasible\n","        # (replace the next line with your code)\n","        raise NotImplementedError('TODO: Compute acq = EI(mR, sR, f_best, xi) * PoF, with PoF = Phi((log10(12) ')\n","        near = np.min(np.linalg.norm(Zg[:, None, :] - Z[None, :, :], axis=2), axis=1) < 1e-3\n","        acq[near] = 0.0                                        # never re-propose an evaluated design\n","        if acq.max() <= 1e-12:                                 # EI has collapsed: explore where sigma is largest\n","            acq = sR * pof; acq[~mass_feasible | near] = 0.0\n","        z = Zg[np.argmax(acq)]\n","        if np.min(np.linalg.norm(Z - z, axis=1)) < 1e-9: z = np.random.default_rng(len(Z)).random(2)\n","        x = from_unit(z); oz = heat_sink(x[0], x[1])\n","        Z = np.vstack([Z, z]); yR = np.append(yR, np.log10(oz[\"R\"])); yT = np.append(yT, np.log10(oz[\"dT_air\"]))\n","        ok = np.append(ok, (oz[\"mass\"] <= MASS_MAX_KG) and (oz[\"dT_air\"] <= DTAIR_MAX_K))\n","        hist.append(np.min(np.where(ok, 10 ** yR, np.inf)))\n","    return Z, np.array(hist)\n","\n","Zbo, hbo = run_bo()\n","print(f\"best verified feasible R = {hbo[-1]:.5f} K/W  (gap {100 * (hbo[-1] - R_STAR) / R_STAR:.2f}% to R*)\")\n","plt.plot(np.arange(1, len(hbo) + 1), hbo - R_STAR, \"o-\"); plt.yscale(\"log\"); plt.xlabel(\"original-model evaluations\"); plt.ylabel(\"best feasible R − R* (K/W)\"); plt.show()"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output:** the gap typically drops to well below 1% within 24 evaluations (seed dependent). The grid limits precision to its spacing (~0.017 in scaled units)."]},{"cell_type":"markdown","metadata":{},"source":["## Exercises\n","1. Rerun section 2 with `xi=0.0` and `xi=0.1`.
