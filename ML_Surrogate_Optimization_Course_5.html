TAR, \"*\", ms=15, color=\"gold\", mec=\"k\")\n","ax.set(xlabel=\"s (mm)\", ylabel=\"t (mm)\", title=\"True response, constraints (red), optimum (star)\")\n","plt.show()"]},{"cell_type":"markdown","metadata":{},"source":["## 5. A 1-D slice\n","Plot R versus s for t = 0.6 mm using 200 points."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["s_line = np.linspace(*BOUNDS[0], 200)\n","R_line = heat_sink(s_line, 0.6)[\"R\"]\n","plt.plot(s_line, R_line)\n","plt.xlabel(\"s (mm)\"); plt.ylabel(\"R (K/W)\"); plt.title(\"Slice at t = 0.6 mm\"); plt.show()\n","print(\"Minimum on this slice at s =\", round(float(s_line[np.argmin(R_line)]), 3), \"mm\")"]},{"cell_type":"markdown","metadata":{},"source":["## 6. Synthetic measurement noise (clearly labelled)\n","The model is deterministic. To *imitate* laboratory repeat tests, we add Gaussian noise with σ = 0.02 K/W to one design. This noise is our assumption, not part of the model."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["true_R = float(heat_sink(2.0, 0.6)[\"R\"])\n","repeats = true_R + 0.02 * rng.standard_normal(10)       # synthetic noise model: N(0, 0.02^2)\n","print(\"model value:\", round(true_R, 4))\n","print(\"mean:\", repeats.mean().round(4), \" sample std:\", repeats.std(ddof=1).round(4),\n","      \" standard error:\", (repeats.std(ddof=1) / np.sqrt(len(repeats))).round(4))"]},{"cell_type":"markdown","metadata":{},"source":["## Interpretation task\n","1. Why is R so large at the smallest fin gaps? (Hint: look at the channel velocity formula.)\n","2. Why do thick fins with small gaps violate the mass limit?\n","3. The sample std of the noisy repeats is not exactly 0.02. Why not?"]},{"cell_type":"markdown","metadata":{},"source":["**Reference answers.** (1) Channel velocity scales with s², so narrow channels pass little air; the caloric resistance 1/(ṁ c_p) dominates. (2) More fins (small s) and thicker fins both add aluminium. (3) A sample std from 10 draws is itself a random estimate of σ."]},{"cell_type":"markdown","metadata":{},"source":["### Debugging tips\n","- `NameError`: a cell above was not run (run all cells from the top) or a name is misspelled.\n","- `ValueError` about shapes: print `.shape`; scikit-learn needs `X` with shape `(n_samples, n_features)` — use `x.reshape(-1, 1)` for one feature.\n","- Implausible numbers (e.g., R = 0.0004 K/W): check units — the model expects **millimetres**.\n","- `ModuleNotFoundError`: install the package in the environment that runs this notebook's kernel.\n","- Results change every run: make sure all randomness uses `rng` or a fixed `random_state`."]}],"metadata":{"kernelspec":{"display_name":"Python 3","language":"python","name":"python3"},"language_info":{"name":"python"},"mlso":{"course_version":"3.0.0","lab":"lab01","variant":"reference"}},"nbformat":4,"nbformat_minor":4},"tested":true,"testNote":"For course version 3.0.0 this reference notebook was executed top-to-bottom without errors on 2026-10-06 by the course maintainer, in a freshly created virtual environment (python 3.13.16, numpy 2.5.3, pandas 3.0.5, matplotlib 3.11.2, scipy 1.18.1, scikit-learn 1.9.1; Linux-6.18.44-fc-v70-x86_64-with-glibc2.39); wall time 3 s. Other package versions were not tested; numerical outputs may differ slightly.","deps":"numpy, pandas, matplotlib, scipy (≥ 1.8 required for Lab 10), scikit-learn, jupyterlab. Tested configuration: python 3.13.16, numpy 2.5.3, pandas 3.0.5, matplotlib 3.11.2, scipy 1.18.1, scikit-learn 1.9.1."},"lab02":{"starter":{"cells":[{"cell_type":"markdown","metadata":{},"source":["# Lab 2 — Linear and polynomial regression (starter)\n","**Course:** Machine Learning Fundamentals for Surrogate-Based Engineering Optimization — Module 4\n","**Estimated time:** 75 minutes\n","\n","**Purpose.** Fit straight lines and polynomials by least squares, compute error metrics by hand, interpret coefficients with units, and compare against baselines.\n","\n","**Expected learning outcome.** You can fit and evaluate a regression model, explain its coefficients with units, and show whether it beats constant and physics baselines.\n","\n","**How to use this notebook.** Run cells from top to bottom with *Shift+Enter*. Cells marked `# TODO` are exercises: replace the `raise NotImplementedError(...)` line with your code. When you finish (and before comparing with the reference notebook), use *Kernel → Restart Kernel and Run All Cells*.\n","\n","**Dependencies.** numpy, pandas, matplotlib, scipy, scikit-learn, jupyterlab. The exact configuration in which the reference notebooks were executed is given in the downloadable environment specification on the course’s Labs page (and in the testing-status cell below). Minimum versions: SciPy ≥ 1.8 is required (Lab 10 uses `LatinHypercube(optimization=\"random-cd\")`, which first appears in SciPy 1.8.0 — checked against the SciPy release source); scikit-learn ≥ 1.0 and Python ≥ 3.10 are expected to work but lower versions were **not** executed.\n","\n","**About the model.** The heat-sink function below is a simplified *pedagogical* analytical model standing in for an expensive CFD simulation. Results describe this model, not real hardware."]},{"cell_type":"markdown","metadata":{},"source":["**Testing status.** For course version 3.0.0 this reference notebook was executed top-to-bottom without errors on 2026-10-06 by the course maintainer, in a freshly created virtual environment (python 3.13.16, numpy 2.5.3, pandas 3.0.5, matplotlib 3.11.2, scipy 1.18.1, scikit-learn 1.9.1; Linux-6.18.44-fc-v70-x86_64-with-glibc2.39); wall time 3 s. Other package versions were not tested; numerical outputs may differ slightly.\n","\n","**Starter notebooks** intentionally stop at the first unfinished `# TODO` (they raise `NotImplementedError`). Every code cell of both versions is checked to be valid Python syntax, but starters were not executed end-to-end."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Setup: imports, versions and reproducibility\n","import sys, time\n","import numpy as np\n","import pandas as pd\n","import matplotlib.pyplot as plt\n","import scipy, sklearn\n","print(\"Python\", sys.version.split()[0], \"| numpy\", np.__version__, \"| pandas\", pd.__version__,\n","      \"| scipy\", scipy.__version__, \"| scikit-learn\", sklearn.__version__)\n","SEED = 7                                  # change this to test sensitivity to sampling luck\n","rng = np.random.default_rng(SEED)         # one generator for the whole notebook\n","plt.rcParams[\"figure.figsize\"] = (6.4, 4.2)\n","# Gaussian-process hyperparameter fits on small deterministic datasets often emit ConvergenceWarnings from the\n","# L-BFGS optimizer. We silence them to keep output readable and judge models by validation instead.\n","# Remove this filter if you want to see them.\n","import warnings\n","from sklearn.exceptions import ConvergenceWarning\n","warnings.filterwarnings(\"ignore\", category=ConvergenceWarning)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Pedagogical plate-fin heat-sink model: a transparent stand-in for an expensive CFD simulation.\n","# Inputs: fin gap s_mm and fin thickness t_mm (millimetres). Deterministic: no measurement noise.\n","BOUNDS = np.array([[0.8, 3.0],    # s_mm: fin gap (mm)\n","                   [0.2, 1.5]])   # t_mm: fin thickness (mm)\n","MASS_MAX_KG = 0.070               # constraint g1: mass <= 0.070 kg  (cheap: geometry only)\n","DTAIR_MAX_K = 12.0                # constraint g2: air temperature rise <= 12 K (needs flow solution)\n","\n","def heat_sink(s_mm, t_mm):\n","    \"\"\"Return dict with R (K/W), mass (kg), dT_air (K), Re (-). Accepts scalars or NumPy arrays.\"\"\"\n","    W, L, H, tb = 0.050, 0.050, 0.040, 0.004          # base width, flow length, fin height, base thickness (m)\n","    ks, rho_al = 150.0, 2700.0                         # aluminium alloy: W/(m K), kg/m^3\n","    rho, mu, cp, ka = 1.16, 1.85e-5, 1007.0, 0.026     # air: kg/m^3, Pa s, J/(kg K), W/(m K)\n","    dp, Q, Nu = 5.0, 30.0, 7.54                        # fan pressure (Pa), heat load (W), Nusselt (-)\n","    s = np.asarray(s_mm, dtype=float) * 1e-3           # mm -> m  (unit conversion!)\n","    t = np.asarray(t_mm, dtype=float) * 1e-3\n","    N = W / (s + t)                                    # number of fins (continuous)\n","    u = dp * s**2 / (12 * mu * L)                      # laminar parallel-plate channel velocity (m/s)\n","    mdot = rho * u * s * H * N                         # air mass flow (kg/s)\n","    h = Nu * ka / (2 * s)                              # heat-transfer coefficient (W/m^2 K)\n","    m = np.sqrt(2 * h / (ks * t))                      # fin parameter (1/m)\n","    eta = np.tanh(m * H) / (m * H)                     # fin efficiency (-)\n","    UA = h * N * L * (2 * H * eta + s)                 # conductance (W/K)\n","    NTU = UA / (mdot * cp)\n","    R = 1 / (mdot * cp * (1 - np.exp(-NTU))) + tb / (ks * W * L)\n","    mass = rho_al * (N * t * H * L + W * L * tb)\n","    dT_air = Q / (mdot * cp)\n","    Re = rho * u * 2 * s / mu\n","    return {\"R\": R, \"mass\": mass, \"dT_air\": dT_air, \"Re\": Re}\n","\n","def to_unit(X_mm):\n","    \"\"\"Scale physical designs (n, 2) in mm to the unit square using the bounds.\"\"\"\n","    return (np.asarray(X_mm) - BOUNDS[:, 0]) / (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","def from_unit(Z):\n","    \"\"\"Map unit-square points (n, 2) back to physical designs in mm.\"\"\"\n","    return BOUNDS[:, 0] + np.asarray(Z) * (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","R_STAR, S_STAR, T_STAR = 0.57705, 1.8525, 0.3509   # reference constrained optimum (teaching only)\n","assert abs(heat_sink(2.0, 0.8)[\"R\"] - 0.58738853) < 1e-6, \"model check failed - did you edit the model?\"\n","print(\"Model OK. Example: s=2.0 mm, t=0.8 mm ->\", {k: round(float(v), 4) for k, v in heat_sink(2.0, 0.8).items()})"]},{"cell_type":"markdown","metadata":{},"source":["## 1. Synthetic bench-test data\n","Temperature rise ΔT (K) of a heat sink versus heater power P (W). **Synthetic:** ΔT = 1.5 K + 0.62 K/W · P + Gaussian noise (σ = 1.0 K), generated here to imitate a bench test."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["P = np.array([5, 8, 10, 13, 15, 18, 20, 23, 25, 28, 30, 33, 35, 38, 40], dtype=float)   # W\n","bench_rng = np.random.default_rng(2024)\n","dT = 1.5 + 0.62 * P + 1.0 * bench_rng.standard_normal(P.size)                          # K\n","train = np.arange(P.size) % 2 == 0          # even indices for fitting, odd for testing\n","plt.scatter(P[train], dT[train], label=\"train\"); plt.scatter(P[~train], dT[~train], marker=\"s\", label=\"test\")\n","plt.xlabel(\"P (W)\"); plt.ylabel(\"ΔT (K)\"); plt.legend(); plt.show()"]},{"cell_type":"markdown","metadata":{},"source":["## 2. Least squares by hand\n","b₁ = Σ(x−x̄)(y−ȳ)/Σ(x−x̄)², b₀ = ȳ − b₁x̄."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["x, y = P[train], dT[train]\n","# TODO: Compute b1 and b0 with the least-squares formulas\n","# (replace the next line with your code)\n","raise NotImplementedError('TODO: Compute b1 and b0 with the least-squares formulas')\n","print(f\"b0 = {b0:.3f} K,  b1 = {b1:.4f} K/W\")\n","from sklearn.linear_model import LinearRegression\n","lr = LinearRegression().fit(x.reshape(-1, 1), y)\n","print(f\"scikit-learn: b0 = {lr.intercept_:.3f} K,  b1 = {lr.coef_[0]:.4f} K/W  (should match)\")"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output:** b₁ close to (but not exactly) 0.62 K/W because of the noise; scikit-learn agrees with the hand calculation."]},{"cell_type":"markdown","metadata":{},"source":["## 3. Error metrics by hand"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["def mae(y, p):  return np.mean(np.abs(y - p))\n","# TODO: Implement rmse(y, p) and r2(y, p)\n","# (replace .1; Linux-6.18.44-fc-v70-x86_64-with-glibc2.39); wall time 3 s. Other package versions were not tested; numerical outputs may differ slightly.\n","\n","**Starter notebooks** intentionally stop at the first unfinished `# TODO` (they raise `NotImplementedError`). Every code cell of both versions is checked to be valid Python syntax, but starters were not executed end-to-end."]},{"cell_type":"markdown","metadata":{},"source":["> **Reference solution.** This version contains worked solutions. Try the starter notebook first."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Setup: imports, versions and reproducibility\n","import sys, time\n","import numpy as np\n","import pandas as pd\n","import matplotlib.pyplot as plt\n","import scipy, sklearn\n","print(\"Python\", sys.version.split()[0], \"| numpy\", np.__version__, \"| pandas\", pd.__version__,\n","      \"| scipy\", scipy.__version__, \"| scikit-learn\", sklearn.__version__)\n","SEED = 7                                  # change this to test sensitivity to sampling luck\n","rng = np.random.default_rng(SEED)         # one generator for the whole notebook\n","plt.rcParams[\"figure.figsize\"] = (6.4, 4.2)\n","# Gaussian-process hyperparameter fits on small deterministic datasets often emit ConvergenceWarnings from the\n","# L-BFGS optimizer. We silence them to keep output readable and judge models by validation instead.\n","# Remove this filter if you want to see them.\n","import warnings\n","from sklearn.exceptions import ConvergenceWarning\n","warnings.filterwarnings(\"ignore\", category=ConvergenceWarning)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Pedagogical plate-fin heat-sink model: a transparent stand-in for an expensive CFD simulation.\n","# Inputs: fin gap s_mm and fin thickness t_mm (millimetres). Deterministic: no measurement noise.\n","BOUNDS = np.array([[0.8, 3.0],    # s_mm: fin gap (mm)\n","                   [0.2, 1.5]])   # t_mm: fin thickness (mm)\n","MASS_MAX_KG = 0.070               # constraint g1: mass <= 0.070 kg  (cheap: geometry only)\n","DTAIR_MAX_K = 12.0                # constraint g2: air temperature rise <= 12 K (needs flow solution)\n","\n","def heat_sink(s_mm, t_mm):\n","    \"\"\"Return dict with R (K/W), mass (kg), dT_air (K), Re (-). Accepts scalars or NumPy arrays.\"\"\"\n","    W, L, H, tb = 0.050, 0.050, 0.040, 0.004          # base width, flow length, fin height, base thickness (m)\n","    ks, rho_al = 150.0, 2700.0                         # aluminium alloy: W/(m K), kg/m^3\n","    rho, mu, cp, ka = 1.16, 1.85e-5, 1007.0, 0.026     # air: kg/m^3, Pa s, J/(kg K), W/(m K)\n","    dp, Q, Nu = 5.0, 30.0, 7.54                        # fan pressure (Pa), heat load (W), Nusselt (-)\n","    s = np.asarray(s_mm, dtype=float) * 1e-3           # mm -> m  (unit conversion!)\n","    t = np.asarray(t_mm, dtype=float) * 1e-3\n","    N = W / (s + t)                                    # number of fins (continuous)\n","    u = dp * s**2 / (12 * mu * L)                      # laminar parallel-plate channel velocity (m/s)\n","    mdot = rho * u * s * H * N                         # air mass flow (kg/s)\n","    h = Nu * ka / (2 * s)                              # heat-transfer coefficient (W/m^2 K)\n","    m = np.sqrt(2 * h / (ks * t))                      # fin parameter (1/m)\n","    eta = np.tanh(m * H) / (m * H)                     # fin efficiency (-)\n","    UA = h * N * L * (2 * H * eta + s)                 # conductance (W/K)\n","    NTU = UA / (mdot * cp)\n","    R = 1 / (mdot * cp * (1 - np.exp(-NTU))) + tb / (ks * W * L)\n","    mass = rho_al * (N * t * H * L + W * L * tb)\n","    dT_air = Q / (mdot * cp)\n","    Re = rho * u * 2 * s / mu\n","    return {\"R\": R, \"mass\": mass, \"dT_air\": dT_air, \"Re\": Re}\n","\n","def to_unit(X_mm):\n","    \"\"\"Scale physical designs (n, 2) in mm to the unit square using the bounds.\"\"\"\n","    return (np.asarray(X_mm) - BOUNDS[:, 0]) / (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","def from_unit(Z):\n","    \"\"\"Map unit-square points (n, 2) back to physical designs in mm.\"\"\"\n","    return BOUNDS[:, 0] + np.asarray(Z) * (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","R_STAR, S_STAR, T_STAR = 0.57705, 1.8525, 0.3509   # reference constrained optimum (teaching only)\n","assert abs(heat_sink(2.0, 0.8)[\"R\"] - 0.58738853) < 1e-6, \"model check failed - did you edit the model?\"\n","print(\"Model OK. Example: s=2.0 mm, t=0.8 mm ->\", {k: round(float(v), 4) for k, v in heat_sink(2.0, 0.8).items()})"]},{"cell_type":"markdown","metadata":{},"source":["## 1. Synthetic bench-test data\n","Temperature rise ΔT (K) of a heat sink versus heater power P (W). **Synthetic:** ΔT = 1.5 K + 0.62 K/W · P + Gaussian noise (σ = 1.0 K), generated here to imitate a bench test."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["P = np.array([5, 8, 10, 13, 15, 18, 20, 23, 25, 28, 30, 33, 35, 38, 40], dtype=float)   # W\n","bench_rng = np.random.default_rng(2024)\n","dT = 1.5 + 0.62 * P + 1.0 * bench_rng.standard_normal(P.size)                          # K\n","train = np.arange(P.size) % 2 == 0          # even indices for fitting, odd for testing\n","plt.scatter(P[train], dT[train], label=\"train\"); plt.scatter(P[~train], dT[~train], marker=\"s\", label=\"test\")\n","plt.xlabel(\"P (W)\"); plt.ylabel(\"ΔT (K)\"); plt.legend(); plt.show()"]},{"cell_type":"markdown","metadata":{},"source":["## 2. Least squares by hand\n","b₁ = Σ(x−x̄)(y−ȳ)/Σ(x−x̄)², b₀ = ȳ − b₁x̄."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["x, y = P[train], dT[train]\n","b1 = np.sum((x - x.mean()) * (y - y.mean())) / np.sum((x - x.mean())**2)\n","b0 = y.mean() - b1 * x.mean()\n","print(f\"b0 = {b0:.3f} K,  b1 = {b1:.4f} K/W\")\n","from sklearn.linear_model import LinearRegression\n","lr = LinearRegression().fit(x.reshape(-1, 1), y)\n","print(f\"scikit-learn: b0 = {lr.intercept_:.3f} K,  b1 = {lr.coef_[0]:.4f} K/W  (should match)\")"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output:** b₁ close to (but not exactly) 0.62 K/W because of the noise; scikit-learn agrees with the hand calculation."]},{"cell_type":"markdown","metadata":{},"source":["## 3. Error metrics by hand"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["def mae(y, p):  return np.mean(np.abs(y - p))\n","def rmse(y, p): return np.sqrt(np.mean((y - p)**2))\n","def r2(y, p):   return 1 - np.sum((y - p)**2) / np.sum((y - np.mean(y))**2)\n","yt = dT[~train]\n","pred = {\"constant baseline\": np.full(yt.size, y.mean()),\n","        \"physics (0.65 K/W, no intercept)\": 0.65 * P[~train],\n","        \"linear regression\": b0 + b1 * P[~train]}\n","pd.DataFrame({k: {\"MAE (K)\": mae(yt, p), \"RMSE (K)\": rmse(yt, p), \"R2 (-)\": r2(yt, p)} for k, p in pred.items()}).T.round(3)"]},{"cell_type":"markdown","metadata":{},"source":["**Interpretation task.** Which model would you use? Is the improvement over the physics estimate worth it? Is the constant baseline's R² near 0 or negative on test data — why?"]},{"cell_type":"markdown","metadata":{},"source":["**Reference discussion.** The regression usually has the lowest RMSE, but the physics estimate is close — a strong, interpretable baseline. The constant baseline's test R² is about 0 or slightly negative because it predicts the training mean, not the test mean."]},{"cell_type":"markdown","metadata":{},"source":["## 4. Polynomial regression on the heat-sink slice\n","Target: R(s) at t = 0.6 mm. 10 training points (deterministic), 100 validation points."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from sklearn.preprocessing import PolynomialFeatures\n","from sklearn.pipeline import make_pipeline\n","s_tr = np.sort(from_unit(np.c_[rng.random(10), np.zeros(10)])[:, 0])\n","s_va = np.linspace(*BOUNDS[0], 100)\n","R_tr, R_va = heat_sink(s_tr, 0.6)[\"R\"], heat_sink(s_va, 0.6)[\"R\"]\n","rows = []\n","for deg in range(1, 10):\n","    model = make_pipeline(PolynomialFeatures(deg), LinearRegression())\n","    model.fit(s_tr.reshape(-1, 1), R_tr)\n","    e_tr = rmse(R_tr, model.predict(s_tr.reshape(-1, 1)))\n","    e_va = rmse(R_va, model.predict(s_va.reshape(-1, 1)))\n","    rows.append((deg, e_tr, e_va))\n","res = pd.DataFrame(rows, columns=[\"degree\", \"train RMSE (K/W)\", \"validation RMSE (K/W)\"])\n","display(res.round(5))\n","plt.semilogy(res.degree, res[\"train RMSE (K/W)\"], \"o-\", label=\"train\")\n","plt.semilogy(res.degree, res[\"validation RMSE (K/W)\"], \"s-\", label=\"validation\")\n","plt.xlabel(\"polynomial degree\"); plt.ylabel(\"RMSE (K/W)\"); plt.legend(); plt.show()"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output:** training RMSE falls steadily with degree (reaching ~0 at degree 9, which interpolates 10 points); validation RMSE first falls and then rises (or behaves erratically) at high degree."]},{"cell_type":"markdown","metadata":{},"source":["**Note on conditioning.** Raw powers of s become ill-conditioned at high degree. Scaling s to [−1, 1] before `PolynomialFeatures` helps; Lab 3 uses a pipeline with a scaler."]},{"cell_type":"markdown","metadata":{},"source":["## Exercise\n","Choose the degree with the lowest validation RMSE. Plot that fit together with the training points and the true curve. Does it look physically sensible between the samples?"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["best_deg = int(res.loc[res[\"validation RMSE (K/W)\"].idxmin(), \"degree\"])\n","best = make_pipeline(PolynomialFeatures(best_deg), LinearRegression()).fit(s_tr.reshape(-1, 1), R_tr)\n","plt.plot(s_va, R_va, \"k--\", label=\"true\")\n","plt.plot(s_va, best.predict(s_va.reshape(-1, 1)), label=f\"degree {best_deg}\")\n","plt.plot(s_tr, R_tr, \"o\", label=\"training samples\")\n","plt.xlabel(\"s (mm)\"); plt.ylabel(\"R (K/W)\"); plt.legend(); plt.show()"]},{ 026     # air: kg/m^3, Pa s, J/(kg K), W/(m K)\n","    dp, Q, Nu = 5.0, 30.0, 7.54                        # fan pressure (Pa), heat load (W), Nusselt (-)\n","    s = np.asarray(s_mm, dtype=float) * 1e-3           # mm -> m  (unit conversion!)\n","    t = np.asarray(t_mm, dtype=float) * 1e-3\n","    N = W / (s + t)                                    # number of fins (continuous)\n","    u = dp * s**2 / (12 * mu * L)                      # laminar parallel-plate channel velocity (m/s)\n","    mdot = rho * u * s * H * N                         # air mass flow (kg/s)\n","    h = Nu * ka / (2 * s)                              # heat-transfer coefficient (W/m^2 K)\n","    m = np.sqrt(2 * h / (ks * t))                      # fin parameter (1/m)\n","    eta = np.tanh(m * H) / (m * H)                     # fin efficiency (-)\n","    UA = h * N * L * (2 * H * eta + s)                 # conductance (W/K)\n","    NTU = UA / (mdot * cp)\n","    R = 1 / (mdot * cp * (1 - np.exp(-NTU))) + tb / (ks * W * L)\n","    mass = rho_al * (N * t * H * L + W * L * tb)\n","    dT_air = Q / (mdot * cp)\n","    Re = rho * u * 2 * s / mu\n","    return {\"R\": R, \"mass\": mass, \"dT_air\": dT_air, \"Re\": Re}\n","\n","def to_unit(X_mm):\n","    \"\"\"Scale physical designs (n, 2) in mm to the unit square using the bounds.\"\"\"\n","    return (np.asarray(X_mm) - BOUNDS[:, 0]) / (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","def from_unit(Z):\n","    \"\"\"Map unit-square points (n, 2) back to physical designs in mm.\"\"\"\n","    return BOUNDS[:, 0] + np.asarray(Z) * (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","R_STAR, S_STAR, T_STAR = 0.57705, 1.8525, 0.3509   # reference constrained optimum (teaching only)\n","assert abs(heat_sink(2.0, 0.8)[\"R\"] - 0.58738853) < 1e-6, \"model check failed - did you edit the model?\"\n","print(\"Model OK. Example: s=2.0 mm, t=0.8 mm ->\", {k: round(float(v), 4) for k, v in heat_sink(2.0, 0.8).items()})"]},{"cell_type":"markdown","metadata":{},"source":["## 1. Data: 40 Lat root_mean_squared_error\")\n","plt.plot(sizes, -tr.mean(1), \"o-\", label=\"training\"); plt.plot(sizes, -va.mean(1), \"s-\", label=\"validation (CV)\")\n","plt.xlabel(\"training samples\"); plt.ylabel(\"RMSE (log10 K/W)\"); plt.legend(); plt.show()"]},{"cell_type":"markdown","metadata":{},"source":["## 4. Grouped data: why random row splits mislead\n","**Synthetic experiment (labelled):** 12 test specimens, each built at one design (s, t) and **tested 5 times**. Each specimen has its own offset from the model (specimen-to-specimen variation, σ = 0.05 in log10 R) and each repeat test adds measurement noise (σ = 0.01). The model must predict for **new specimens**."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["g_rng = np.random.default_rng(11)\n","groups, Xg, yg = [], [], []\n","for b in range(12):\n","    offset = 0.05 * g_rng.standard_normal()                      # specimen-to-specimen variation (synthetic)\n","    Xb = np.repeat(from_unit(g_rng.random((1, 2))), 5, axis=0)   # 5 repeat tests of the same specimen\n","    yb = np.log10(heat_sink(Xb[:, 0], Xb[:, 1])[\"R\"]) + offset + 0.01 * g_rng.standard_normal(5)\n","    groups += [b] * 5; Xg.append(Xb); yg.append(yb)\n","Xg, yg, groups = np.vstack(Xg), np.concatenate(yg), np.array(groups)\n","from sklearn.ensemble import RandomForestRegressor\n","from sklearn.model_selection import GroupKFold\n","forest = RandomForestRegressor(n_estimators=200, random_state=0)\n","rand = -cross_val_score(forest, Xg, yg, cv=KFold(5, shuffle=True, random_state=0), scoring=\"neg_root_mean_squared_error\")\n","# TODO: Compute grp = group-wise CV RMSE using GroupKFold(n_splits=5) and the groups array\n","# (replace the next line with your code)\n","raise NotImplementedError('TODO: Compute grp = group-wise CV RMSE using GroupKFold(n_splits=5) and the ')\n","print(f\"random row split RMSE: {rand.mean():.4f}   group split RMSE: {grp.mean():.4f}\")"]},{"cell_type":"markdown","metadata":{},"source":["** ference solution)\n","**Course:** Machine Learning Fundamentals for Surrogate-Based Engineering Optimization — Module 5\n","**Estimated time:** 75 minutes\n","\n","**Purpose.** Use pipelines and cross-validation to choose model complexity without leakage, read a learning curve, and see how random row splits mislead when observations are grouped.\n","\n","**Expected learning outcome.** You can run leakage-free k-fold CV with pipelines, plot a learning curve, and use GroupKFold for grouped data.\n","\n","**How to use this notebook.** Run cells from top to bottom with *Shift+Enter*. Cells marked `# TODO` are exercises: replace the `raise NotImplementedError(...)` line with your code. When you finish (and before comparing with the reference notebook), use *Kernel → Restart Kernel and Run All Cells*.\n","\n","**Dependencies.** numpy, pandas, matplotlib, scipy, scikit-learn, jupyterlab. The exact configuration in which the reference notebooks were executed is given in the downloadable environment specification on the course’s Labs page (and in the testing-status cell below). Minimum versions: SciPy ≥ 1.8 is required (Lab 10 uses `LatinHypercube(optimization=\"random-cd\")`, which first appears in SciPy 1.8.0 — checked against the SciPy release source); scikit-learn ≥ 1.0 and Python ≥ 3.10 are expected to work but lower versions were **not** executed.\n","\n","**About the model.** The heat-sink function below is a simplified *pedagogical* analytical model standing in for an expensive CFD simulation. Results describe this model, not real hardware."]},{"cell_type":"markdown","metadata":{},"source":["**Testing status.** For course version 3.0.0 this reference notebook was executed top-to-bottom without errors on 2026-10-06 by the course maintainer, in a freshly created virtual environment (python 3.13.16, numpy 2.5.3, pandas 3.0.5, matplotlib 3.11.2, scipy 1.18.1, scikit-learn 1.9.1; Linux-6.18.44-fc-v70-x86_64-with-glibc2.39); wall time 4 s. Other package versions were not tested; numerical outputs may differ slightly.\n","\n","**Starter notebooks** intentionally stop at the first unfinished `# TODO` (they raise `NotImplementedError`). Every code cell of both versions is checked to be valid Python syntax, but starters were not executed end-to-end."]},{"cell_type":"markdown","metadata":{},"source":["> **Reference solution.** This version contains worked solutions. Try the starter notebook first."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Setup: imports, versions and reproducibility\n","import sys, time\n","import numpy as np\n","import pandas as pd\n","import matplotlib.pyplot as plt\n","import scipy, sklearn\n","print(\"Python\", sys.version.split()[0], \"| numpy\", np.__version__, \"| pandas\", pd.__version__,\n","      \"| scipy\", scipy.__version__, \"| scikit-learn\", sklearn.__version__)\n","SEED = 7                                  # change this to test sensitivity to sampling luck\n","rng = np.random.default_rng(SEED)         # one generator for the whole notebook\n","plt.rcParams[\"figure.figsize\"] = (6.4, 4.2)\n","# Gaussian-process hyperparameter fits on small deterministic datasets often emit ConvergenceWarnings from the\n","# L-BFGS optimizer. We silence them to keep output readable and judge models by validation instead.\n","# Remove this filter if you want to see them.\n","import warnings\n","from sklearn.exceptions import ConvergenceWarning\n","warnings.filterwarnings(\"ignore\", category=ConvergenceWarning)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Pedagogical plate-fin heat-sink model: a transparent stand-in for an expensive CFD simulation.\n","# Inputs: fin gap s_mm and fin thickness t_mm (millimetres). Deterministic: no measurement noise.\n","BOUNDS = np.array([[0.8, 3.0],    # s_mm: fin gap (mm)\n","                   [0.2, 1.5]])   # t_mm: fin thickness (mm)\n","MASS_MAX_KG = 0.070               # constraint g1: mass <= 0.070 kg  (cheap: geometry only)\n","DTAIR_MAX_K = 12.0                # constraint g2: air temperature rise <= 12 K (needs flow solution)\n","\n","def heat_sink(s_mm, t_mm):\n","    \"\"\"Return dict with R (K/W), mass (kg), dT_air (K), Re (-). Accepts scalars or NumPy arrays.\"\"\"\n","    W, L, H, tb = 0.050, 0.050, 0.040, 0.004          # base width, flow length, fin height, base thickness (m)\n","    ks, rho_al = 150.0, 2700.0                         # aluminium alloy: W/(m K), kg/m^3\n","    rho, mu, cp, ka = 1.16, 1.85e-5, 1007.0, 0.026     # air: kg/m^3, Pa s, J/(kg K), W/(m K)\n","    dp, Q, Nu = 5.0, 30.0, 7.54                        # fan pressure (Pa), heat load (W), Nusselt (-)\n","    s = np.asarray(s_mm, dtype=float) * 1e-3           # mm -> m  (unit conversion!)\n","    t = np.asarray(t_mm, dtype=float) * 1e-3\n","    N = W / (s + t)                                    # number of fins (continuous)\n","    u = dp * s**2 / (12 * mu * L)                      # laminar parallel-plate channel velocity (m/s)\n","    mdot = rho * u * s * H * N                         # air mass flow (kg/s)\n","    h = Nu * ka / (2 * s)                              # heat-transfer coefficient (W/m^2 K)\n","    m = np.sqrt(2 * h / (ks * t))                      # fin parameter (1/m)\n","    eta = np.tanh(m * H) / (m * H)                     # fin efficiency (-)\n","    UA = h * N * L * (2 * H * eta + s)                 # conductance (W/K)\n","    NTU = UA / (mdot * cp)\n","    R = 1 / (mdot * cp * (1 - np.exp(-NTU))) + tb / (ks * W * L)\n","    mass = rho_al * (N * t * H * L + W * L * tb)\n","    dT_air = Q / (mdot * cp)\n","    Re = rho * u * 2 * s / mu\n","    return {\"R\": R, \"mass\": mass, \"dT_air\": dT_air, \"Re\": Re}\n","\n","def to_unit(X_mm):\n","    \"\"\"Scale physical designs (n, 2) in mm to the unit square using the bounds.\"\"\"\n","    return (np.asarray(X_mm) - BOUNDS[:, 0]) / (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","def from_unit(Z):\n","    \"\"\"Map unit-square points (n, 2) back to physical designs in mm.\"\"\"\n","    return BOUNDS[:, 0] + np.asarray(Z) * (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","R_STAR, S_STAR, T_STAR = 0.57705, 1.8525, 0.3509   # reference constrained optimum (teaching only)\n","assert abs(heat_sink(2.0, 0.8)[\"R\"] - 0.58738853) < 1e-6, \"model check failed - did you edit the model?\"\n","print(\"Model OK. Example: s=2.0 mm, t=0.8 mm ->\", {k: round(float(v), 4) for k, v in heat_sink(2.0, 0.8).items()})"]},{"cell_type":"markdown","metadata":{},"source":["## 1. Data: 40 Latin-hypercube designs, target log10 R"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from scipy.stats import qmc\n","X = from_unit(qmc.LatinHypercube(d=2, seed=SEED).random(40))\n","y = np.log10(heat_sink(X[:, 0], X[:, 1])[\"R\"])\n","print(X.shape, y.shape)"]},{"cell_type":"markdown","metadata":{},"source":["## 2. Pipeline + 5-fold CV for polynomial degree\n","The scaler is fitted **inside** each fold because it is part of the pipeline."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from sklearn.pipeline import make_pipeline\n","from sklearn.preprocessing import StandardScaler, PolynomialFeatures\n","from sklearn.linear_model import LinearRegression\n","from sklearn.model_selection import KFold, cross_val_score\n","cv = KFold(n_splits=5, shuffle=True, random_state=SEED)\n","scores = {}\n","for deg in range(1, 7):\n","    pipe = make_pipeline(StandardScaler(), PolynomialFeatures(deg), LinearRegression())\n","    s = -cross_val_score(pipe, X, y, cv=cv, scoring=\"neg_root_mean_squared_error\")\n","    scores[deg] = (s.mean(), s.std())\n","pd.DataFrame(scores, index=[\"CV RMSE (log10 K/W)\", \"std across folds\"]).T.round(4)"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output:** CV RMSE drops from degree 1 to about degree 3–4 and then stops improving or rises."]},{"cell_type":"markdown","metadata":{},"source":["## 3. Learning curve"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from sklearn.model_selection import learning_curve\n","pipe = make_pipeline(StandardScaler(), PolynomialFeatures(3), LinearRegression())\n","sizes, tr, va = learning_curve(pipe, X, y, cv=cv, train_sizes=np.linspace(0.4, 1.0, 6),\n","                               scoring=\"neg_root_mean_squared_error\")\n","plt.plot(sizes, -tr.mean(1), \"o-\", label=\"training\"); plt.plot(sizes, -va.mean(1), \"s-\", label=\"validation (CV)\")\n","plt.xlabel(\"training samples\"); plt.ylabel(\"RMSE (log10 K/W)\"); plt.legend(); plt.show()"]},{"cell_type":"markdown","metadata":{},"source":["## 4. Grouped data: why random row splits mislead\n","**Synthetic experiment (labelled):** 12 test specimens, each built at one design (s, t) and **tested 5 times**. Each specimen has its own offset from the model (specimen-to-specimen variation, σ = 0.05 in log10 R) and each repeat test adds measurement noise (σ = 0.01). The model must predict for **new specimens**."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["g_rng = np.random.default_rng(11)\n","groups, Xg, yg = [], [], []\n","for b in range(12):\n","    offset = 0.05 * g_rng.standard_normal()                      # specimen-to-specimen variation (synthetic)\n","    Xb = np.repeat(from_unit(g_rng.random((1, 2))), 5, axis=0)   # 5 repeat tests of the same specimen\n","    yb = np.log10(heat_sink(Xb[:, 0], Xb[:, 1])[\"R\"]) + offset + 0.01 * g_rng.standard_normal(5)\n","    groups += [b] * 5; Xg.append(Xb); yg.append(yb)\n","Xg, yg, groups = np.vstack(Xg), np.concatenate(yg), np.array(groups)\n","from sklearn.ensemble import RandomForestRegressor\n","from sklearn.model_selection import GroupKFold\n","forest = RandomForestRegressor(n_estimators=200, random_state=0)\n","rand = -cross_val_score(forest, Xg, yg, cv=KFold(5, shuffle=True, random_state=0), scoring=\"neg_root_mean_squared_error\")\n","grp = -cross_val_score(forest, Xg, yg, cv=GroupKFold(n_splits=5), groups=groups, scoring=\"neg_root_mean_squared_error\")\n","print(f\"random row split RMSE: {rand.mean():.4f}   group split RMSE: {grp.mean():.4f}\")"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output:** the random-row-split error is several times smaller than the group-split error (author's run: about 0.015 vs 0.11 in log10 units), because repeat tests of the same specimen appear in both training and validation — the model simply recalls the specimen."]},{"cell_type":"markdown","metadata":{},"source":["## 5. Leakage pattern to avoid\n","```python\n","# WRONG: scaler sees validation data\n","Xs = StandardScaler().fit_transform(X)\n","cross_val_score(LinearRegression(), Xs, y, cv=cv)\n","# RIGHT: scaler inside the pipeline\n","cross_val_score(make_pipeline(StandardScaler(), LinearRegression()), X, y, cv=cv)\n","```\n","With bound-based scaling (`to_unit`) there is nothing to leak, because the bounds are fixed in advance."]},{"cell_type":"markdown","metadata":{},"source":["## Interpretation task\n","1. Which degree would you choose and why?\n","2. From the learning curve, would 80 samples help a degree-3 model much?\n","3. Which CV estimate would you report for predictions on a new AM build, and why?"]},{"cell_type":"markdown","metadata":{},"source":["**Reference answers.** (1) The degree with the lowest CV RMSE (typically 3–4) — simpler if differences are within the fold-to-fold std. (2) If the validation curve has flattened, more samples help little; a more flexible model (e.g., GP) would help more. (3) The group-split estimate: the use case is a new build."]},{"cell_type":"markdown","metadata":{},"source":["### Debugging tips\n","- `NameError`: a cell above was not run (run all cells from the top) or a name is misspelled.\n","- `ValueError` about shapes: print `.shape`; scikit-learn needs `X` with shape `(n_samples, n_features)` — use `x.reshape(-1, 1)` for one feature.\n","- Implausible numbers (e.g., R = 0.0004 K/W): check units — "]},{"cell_type":"markdown","metadata":{},"source":["**Testing status.** For course version 3.0.0 this reference notebook was executed top-to-bottom without errors on 2026-10-06 by the course maintainer, in a freshly created virtual environment (python 3.13.16, numpy 2.5.3, pandas 3.0.5, matplotlib 3.11.2, scipy 1.18.1, scikit-learn 1.9.1; Linux-6.18.44-fc-v70-x86_64-with-glibc2.39); wall time 3 s. Other package versions were not tested; numerical outputs may differ slightly.\n","\n","**Starter notebooks** intentionally stop at the first unfinished `# TODO` (they raise `NotImplementedError`). Every code cell of both versions is checked to be valid Python syntax, but starters were not executed end-to-end."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Setup: imports, versions and reproducibility\n","import sys, time\n","import numpy as np\n","import pandas as pd\n","import matplotlib.pyplot as plt\n","import scipy, sklearn\n","print(\"Python\", sys.version.split()[0], \"| numpy\", np.__version__, \"| pandas\", pd.__version__,\n","      \"| scipy\", scipy.__version__, \"| scikit-learn\", sklearn.__version__)\n","SEED = 7                                  # change this to test sensitivity to sampling luck\n","rng = np.random.default_rng(SEED)         # one generator for the whole notebook\n","plt.rcParams[\"figure.figsize\"] = (6.4, 4.2)\n","# Gaussian-process hyperparameter fits on small deterministic datasets often emit ConvergenceWarnings from the\n","# L-BFGS optimizer. We silence them to keep output readable and judge models by validation instead.\n","# Remove this filter if you want to see them.\n","import warnings\n","from sklearn.exceptions import ConvergenceWarning\n","warnings.filterwarnings(\"ignore\", category=ConvergenceWarning)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Pedagogical plate-fin heat-sink model: a transparent stand-in for an expensive CFD simulation.\n","# Inputs: fin gap s_mm and fin thickness t_mm (millimetres). Deterministic: no measurement noise.\n","BOUNDS = np.array([[0.8, 3.0],    # s_mm: fin gap (mm)\n","                   [0.2, 1.5]])   # t_mm: fin thickness (mm)\n","MASS_MAX_KG = 0.070               # constraint g1: mass <= 0.070 kg  (cheap: geometry only)\n","DTAIR_MAX_K = 12.0                # constraint g2: air temperature rise <= 12 K (needs flow solution)\n","\n","def heat_sink(s_mm, t_mm):\n","    \"\"\"Return dict with R (K/W), mass (kg), dT_air (K), Re (-). Accepts scalars or NumPy arrays.\"\"\"\n","    W, L, H, tb = 0.050, 0.050, 0.040, 0.004          # base width, flow length, fin height, base thickness (m)\n","    ks, rho_al = 150.0, 2700.0                         # aluminium alloy: W/(m K), kg/m^3\n","    rho, mu, cp, ka = 1.16, 1.85e-5, 1007.0, 0.026     # air: kg/m^3, Pa s, J/(kg K), W/(m K)\n","    dp, Q, Nu = 5.0, 30.0, 7.54                        # fan pressure (Pa), heat load (W), Nusselt (-)\n","    s = np.asarray(s_mm, dtype=float) * 1e-3           # mm -> m  (unit conversion!)\n","    t = np.asarray(t_mm, dtype=float) * 1e-3\n","    N = W / (s + t)                                    # number of fins (continuous)\n","    u = dp * s**2 / (12 * mu * L)                      # laminar parallel-plate channel velocity (m/s)\n","    mdot = rho * u * s * H * N                         # air mass flow (kg/s)\n","    h = Nu * ka / (2 * s)                              # heat-transfer coefficient (W/m^2 K)\n","    m = np.sqrt(2 * h / (ks * t))                      # fin parameter (1/m)\n","    eta = np.tanh(m * H) / (m * H)                     # fin efficiency (-)\n","    UA = h * N * L * (2 * H * eta + s)                 # conductance (W/K)\n","    NTU = UA / (mdot * cp)\n","    R = 1 / (mdot * cp * (1 - np.exp(-NTU))) + tb / (ks * W * L)\n","    mass = rho_al * (N * t * H * L + W * L * tb)\n","    dT_air = Q / (mdot * cp)\n","    Re = rho * u * 2 * s / mu\n","    return {\"R\": R, \"mass\": mass, \"dT_air\": dT_air, \"Re\": Re}\n","\n","def to_unit(X_mm):\n","    \"\"\"Scale physical designs (n, 2) in mm to the unit square using the bounds.\"\"\"\n","    return (np.asarray(X_mm) - BOUNDS[:, 0]) / (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","def from_unit(Z):\n","    \"\"\"Map unit-square points (n, 2) back to physical designs in mm.\"\"\"\n","    return BOUNDS[:, 0] + np.asarray(Z) * (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","R_STAR, S_STAR, T_STAR = 0.57705, 1.8525, 0.3509   # reference constrained optimum (teaching only)\n","assert abs(heat_sink(2.0, 0.8)[\"R\"] - 0.58738853) < 1e-6, \"model check failed - did you edit the model?\"\n","print(\"Model OK. Example: s=2.0 mm, t=0.8 mm ->\", {k: round(float(v), 4) for k, v in heat_sink(2.0, 0.8).items()})"]},{"cell_type":"markdown","metadata":{},"source":["## 1. Shared data\n","20 LHS training designs (fit on log10 R) and 300 random validation designs (scored in K/W)."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from scipy.stats import qmc\n","Ztr = qmc.LatinHypercube(d=2, seed=SEED).random(20)\n","Zva = np.random.default_rng(4242).random((300, 2))\n","Xtr, Xva = from_unit(Ztr), from_unit(Zva)\n","ytr = np.log10(heat_sink(Xtr[:, 0], Xtr[:, 1])[\"R\"])\n","Rva = heat_sink(Xva[:, 0], Xva[:, 1])[\"R\"]"]},{"cell_type":"markdown","metadata":{},"source":["## 2. Candidate surrogates (all use scaled inputs Z)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from sklearn.dummy import DummyRegressor\n","from sklearn.pipeline import make_pipeline\n","from sklearn.preprocessing import PolynomialFeatures\n","from sklearn.linear_model import LinearRegression\n","from sklearn.ensemble import RandomForestRegressor\n","from sklearn.gaussian_process import GaussianProcessRegressor\n","from sklearn.gaussian_process.kernels import ConstantKernel, RBF\n","from sklearn.neural_network import MLPRegressor\n","from scipy.interpolate import RBFInterpolator\n","\n","class RBFModel:\n","    \"\"\"Thin wrapper so scipy's RBFInterpolator has fit/predict like scikit-learn.\"\"\"\n","    def fit(self, Z, y): self.f = RBFInterpolator(Z, y, kernel=\"cubic\", degree=1); return self\n","    def predict(self, Z): return self.f(Z)\n","\n","models = {\n","    \"constant (baseline)\": DummyRegressor(),\n","    \"quadratic\": make_pipeline(PolynomialFeatures(2), LinearRegression()),\n","    \"cubic\": make_pipeline(PolynomialFeatures(3), LinearRegression()),\n","    \"cubic RBF\": RBFModel(),\n","    \"random forest\": RandomForestRegressor(n_estimators=300, random_state=0),\n","    \"Gaussian process\": GaussianProcessRegressor(ConstantKernel() * RBF([0.3, 0.3], (1e-2, 1e2)), normalize_y=True,\n","                                                 n_restarts_optimizer=3, random_state=0),\n","    \"neural network (MLP)\": MLPRegressor(hidden_layer_sizes=(32, 32), max_iter=5000, random_state=0),\n","}"]},{"cell_type":"markdown","metadata":{},"source":["## 3. Fit, time and score"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["rows = {}\n","for name, m in models.items():\n","    t0 = time.perf_counter(); m.fit(Ztr, ytr); t1 = time.perf_counter()\n","    Rhat = 10 ** m.predict(Zva); t2 = time.perf_counter()\n","    err = Rhat - Rva\n","    # TODO: Store RMSE, MAE and max |error| (all in K/W) plus fit time (ms) in rows[name]\n","    # (replace the next line with your code)\n","    raise NotImplementedError('TODO: Store RMSE, MAE and max |error| (all in K/W) plus fit time (ms) in row')\n","table = pd.DataFrame(rows).T.sort_values(\"RMSE (K/W)\")\n","table.round(4)"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output (indicative; depends on versions and seed):** in the author's run (seed 7) the cubic polynomial and the GP had the lowest RMSE (≈0.03 and ≈0.06 K/W), the cubic RBF and quadratic were worse, and the random forest, the small-data MLP and the constant baseline were worst. Rankings among the top models change with the sample — section 5 checks this over seeds (author's run: median GP RMSE ≈ 0.02 K/W vs quadratic ≈ 0.14 K/W). Fit times depend on your machine."]},{"cell_type":"markdown","metadata":{},"source":["## 4. Where does the best model err?"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["best_name = table.index[0]; best = models[best_name]\n","sg, tg = np.meshgrid(np.linspace(*BOUNDS[0], 120), np.linspace(*BOUNDS[1], 120))\n","Zg = to_unit(np.c_[sg.ravel(), tg.ravel()])\n","E = (10 ** best.predict(Zg) - heat_sink(sg.ravel(), tg.ravel())[\"R\"]).reshape(sg.shape)\n","lim = np.abs(E).max()\n","plt.pcolormesh(sg, tg, E, cmap=\"RdBu_r\", vmin=-lim, vmax=lim, shading=\"auto\"); plt.colorbar(label=\"error (K/W)\")\n","plt.plot(Xtr[:, 0], Xtr[:, 1], \"ko\", ms=4); plt.title(f\"{best_name}: signed error\"); plt.xlabel(\"s (mm)\"); plt.ylabel(\"t (mm)\"); plt.show()"]},{"cell_type":"markdown","metadata":{},"source":["## 5. Exercise: robustness over seeds\n","Repeat the GP vs quadratic comparison for LHS seeds 0–4 and report the median RMSE of each."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# TODO: Loop over seeds 0..4: new LHS(20), fit quadratic and GP, store validation RMSE; print medians\n","# (replace the next line with your code)\n","raise NotImplementedError('TODO: Loop over seeds 0..4: new LHS(20), fit quadratic and GP, store validat')"]},{"cell_type":"markdown","metadata":{},"source":["## Interpretation task\n","1. Which model would you use for gradient-based optimization, and why not the random forest?\n","2. Is the MLP result evidence that neural networks are bad surrogates in general?\n","3. Where are the errors of the best model largest, and what would you do about it?"]},{"cell_type":"markdown","metadata":{},"source":["### Debugging tips\n","- `NameError`: a cell above was not run (run all cells from the top) or a name is misspelled.\n","- `ValueError` about shapes: print `.shape`; scikit-learn needs `X` with shape `(n_samples, n_features)` — use `x.reshape(-1, 1)` for one feature.\n","- Implausible numbers (e.g., R = 0.0004 K/W): check units — the model expects **millimetres**.\n","- `ModuleNotFoundError`: install the package in the environment that runs this notebook's kernel.\n","- Results change every run: make sure all randomness uses `rng` or a fixed `random_state`."]}],"metadata":{"kernelspec":{"display_name":"Python 3","language":"python","name":"python3"},"language_info":{"name":"python"},"mlso":{"course_version":"3.0.0","lab":"lab05","variant":"starter"}},"nbformat":4,"nbformat_minor":4},"reference":{"cells":[{"cell_type":"markdown","metadata":{},"source":["# Lab 5 — Comparing surrogate model families (reference solution)\n","**Course:** Machine Learning Fundamentals for Surrogate-Based Engineering Optimization — Module 8\n","**Estimated time:** 90 minutes\n","\n","**Purpose.** Fit constant, polynomial, RBF, random-forest, Gaussian-process and neural-network surrogates to the same designs and compare accuracy and cost fairly.\n","\n","**Expected learning outcome.** You can run a fair surrogate comparison, report errors in engineering units, and justify a model choice for optimization.\n","\n","**How to use this notebook.** Run cells from top to bottom with *Shift+Enter*. Cells marked `# TODO` are exercises: replace the `raise NotImplementedError(...)` line with your code. When you finish (and before comparing with the reference notebook), use *Kernel → Restart Kernel and Run All Cells*.\n","\n","**Dependencies.** numpy, pandas, matplotlib, scipy, scikit-learn, jupyterlab. The exact configuration in which the reference notebooks were executed is given in the downloadable environment specification on the course’s Labs page (and in the testing-status cell below). Minimum versions: SciPy ≥ 1.8 is required (Lab 10 uses `LatinHypercube(optimization=\"random-cd\")`, which first appears in SciPy 1.8.0 — checked against the SciPy release so
