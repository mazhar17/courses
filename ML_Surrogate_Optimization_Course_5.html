<style>
/* ===== Design tokens ===== */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#f0f3f7; --ink:#18212b; --ink2:#46525f; --muted:#566270; --line:#d9dfe6;
  --brand:#1f5fa8; --brand2:#174a84; --brand-soft:#e5eef9; --accent:#b35c00; --ok:#1a6e3d; --ok-soft:#e3f3e9; --bad:#b3261e; --bad-soft:#fbe7e6; --warn:#8a5a00; --warn-soft:#fff3d6;

  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(20,30,50,.06);

  color-scheme:light;
}
:root[data-theme="dark"]{

  --brand:#6aa7ef; --brand2:#8cbbf3; --brand-soft:#1b2c42; --accent:#f0a24a; --ok:#5cc58a; --ok-soft:#173326; --bad:#ff8a80; --bad-soft:#3a1d1c; --warn:#f2c46b; --warn-soft:#3a2f14;
  --c-true:#e8ecf1; --c-sur:#6fa8f5; --c-sur-band:rgba(111,168,245,.22); --c-samp:#ff9a4d; --c-val:#c79bf0; --c-feas:#5cc58a; --c-infeas:#ff7a6e; --c-opt:#ffd04d; --c-ai:#9fb0c2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0f141a; --panel:#161d25; --panel2:#1d2630; --ink:#e7edf3; --ink2:#c2ccd6; --muted:#93a1af; --line:#2c3845;
  --brand:#6aa7ef; --brand2:#8cbbf3; --brand-soft:#1b2c42; --accent:#f0a24a; --ok:#5cc58a; --ok-soft:#173326; --bad:#ff8a80; --bad-soft:#3a1d1c; --warn:#f2c46b; --warn-soft:#3a2f14;
  --c-true:#e8ecf1; --c-sur:#6fa8f5; --c-sur-band:rgba(111,168,245,.22); --c-samp:#ff9a4d; --c-val:#c79bf0; --c-feas:#5cc58a; --c-infeas:#ff7a6e; --c-opt:#ffd04d; --c-ai:#9fb0c2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark; } }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} *,*::before,*::after{animation:none!important;transition:none!important} }
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.62 var(--font);-webkit-text-size-adjust:100%}
a{color:var(--brand)} a:hover{color:var(--brand2)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:0;background:var(--panel);padding:8px 12px;z-index:100}.skip:focus{left:8px}

p{margin:.55em 0} ul,ol{padding-left:1.4em} li{margin:.2em 0}
code,kbd,pre{font-family:var(--mono);font-size:.9em} code{background:var(--panel2);padding:.08em .35em;border-radius:5px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 .35em;background:var(--panel)}
table{border-collapse:collapse;width:100%;margin:.8em 0;font-size:.94rem} th,td{border:1px solid var(--line);padding:.42em .6em;text-align:left;vertical-align:top} th{background:var(--panel2)}
.tbl-wrap{overflow-x:auto}
/* ===== Layout ===== */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar .brand{font-weight:700;font-size:1.32rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.topbar .brand small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.layout{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:calc(100vh - 56px)}
.sidebar{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:12px 10px 40px}
.main{min-width:0;padding:22px clamp(14px,3vw,44px) 80px;max-width:1040px}
.navsec{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 8px 4px}
.nav a{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.92rem}
.nav a:hover{background:var(--panel2)} .nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand2);font-weight:600}
.nav .st{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;border:2px solid var(--line);color:var(--muted);margin-top:1px}
.nav .st.done{background:var(--ok);border-color:var(--ok);color:#fff} .nav .st.part{border-color:var(--brand);color:var(--brand)} .nav .st.fail{border-color:var(--bad);color:var(--bad)}
.progress-mini{margin:4px 8px 10px;font-size:.82rem;color:var(--muted)}
.bar{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)} .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--ok));width:0;transition:width .4s}
.btn.menu-btn{display:none}
[tabindex="-1"]:focus{outline:none}
@media (max-width:900px){
  .layout{grid-template-columns:1fr} .btn.menu-btn{display:inline-flex}
  .sidebar{position:fixed;left:0;top:56px;width:min(88vw,340px);z-index:40;transform:translateX(-105%);transition:transform .25s;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .main{padding:16px 16px 80px}
}
/* ===== Components ===== */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:.45em .9em;border-radius:9px;font:inherit;font-size:.92rem;cursor:pointer;text-decoration:none;line-height:1.3}
.btn:hover{background:var(--panel2)} .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff} .btn.primary:hover{background:var(--brand2)}
:root[data-theme="dark"] .btn.primary{color:#0b1520} @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0b1520}}
.btn.danger{border-color:var(--bad);color:var(--bad)} .btn.small{font-size:.82rem;padding:.3em .65em} .btn[disabled]{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:.8em 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:14px 0;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.pill{display:inline-block;font-size:.76rem;padding:.12em .6em;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);margin-right:4px}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent} .pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent} .pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent} .pill.info{background:var(--brand-soft);color:var(--brand2);border-color:transparent}
.notice{border-left:4px solid var(--brand);background:var(--brand-soft);padding:10px 14px;border-radius:8px;margin:12px 0}
.notice.warn{border-color:var(--warn);background:var(--warn-soft)} .notice.bad{border-color:var(--bad);background:var(--bad-soft)} .notice.ok{border-color:var(--ok);background:var(--ok-soft)}
.muted{color:var(--muted)} .small{font-size:.86rem} .center{text-align:center}
.crumb{font-size:.85rem;color:var(--muted);margin-bottom:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
/* ===== Lesson concept blocks ===== */
.concept{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin:20px 0;overflow:hidden;box-shadow:var(--shadow)}
.concept>h3{margin:0;padding:12px 18px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:1.08rem}
.concept .cb{padding:4px 18px 14px}
.cpart{margin:12px 0}
.cpart>.lab{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.cpart.math{background:var(--panel2);border-radius:10px;padding:10px 14px}
.cpart.mis{border-left:4px solid var(--bad);padding-left:12px} .cpart.tip{border-left:4px solid var(--ok);padding-left:12px} .cpart.take{background:var(--brand-soft);border-radius:10px;padding:10px 14px} .cpart.app{border-left:4px solid var(--accent);padding-left:12px}
.predict{border:1px dashed var(--brand);border-radius:10px;padding:10px 14px;background:color-mix(in srgb,var(--brand-soft) 50%,transparent)}
.predict .ans{margin-top:8px}
.eq{display:block;text-align:center;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.12rem;margin:.6em 0;overflow-x:auto;padding:2px}
.eq var,.iv{font-style:italic;font-family:"Cambria Math","Times New Roman",serif}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em}.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 .2em}.frac>span{line-height:1.25}
.symtab{font-size:.9rem} .symtab td:first-child{white-space:nowrap;font-family:"Cambria Math","Times New Roman",serif;font-style:italic}
figure.vis{margin:12px 0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
figure.vis figcaption{font-size:.86rem;color:var(--ink2);margin-top:6px}
figure.vis details{font-size:.85rem;margin-top:4px} figure.vis summary{cursor:pointer;color:var(--brand)}
.vis-host{width:100%} .vis-host svg{width:100%;height:auto;display:block}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:8px 0;font-size:.9rem}
.controls label{display:flex;gap:6px;align-items:center}
.controls input[type=range]{width:150px}
.readout{font-family:var(--mono);font-size:.85rem;background:var(--panel2);padding:8px 10px;border-radius:8px;margin-top:6px;white-space:pre-wrap}
.disclose{font-size:.8rem;color:var(--muted);font-style:italic;margin-top:4px}
/* plot styles */
svg.plot{font-family:var(--font)} .plot .tick{font-size:11px;fill:var(--muted)} .plot .alabel{font-size:13px;fill:var(--ink2)} .plot .frame{fill:none;stroke:var(--line)}
.plot .grid line{stroke:var(--line);stroke-width:.6;opacity:.7}
.l-true{stroke:var(--c-true);stroke-width:2.2} .l-true-d{stroke:var(--c-true);stroke-width:2;stroke-dasharray:6 4} .l-sur{stroke:var(--c-sur);stroke-width:2.6} .l-val{stroke:var(--c-val);stroke-width:2.2}
.l-resid{stroke:var(--c-infeas);stroke-width:1.5;stroke-dasharray:3 2} .l-guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4} .l-contour{stroke:rgba(255,255,255,.75);stroke-width:1} .l-contour-ink{stroke:var(--ink2);stroke-width:1;opacity:.6}
.l-cons{stroke:var(--c-infeas);stroke-width:2.4} .l-cons2{stroke:var(--c-infeas);stroke-width:2.4;stroke-dasharray:7 4} .l-ei{stroke:var(--c-feas);stroke-width:2.4} .l-acc{stroke:var(--accent);stroke-width:2.4}
.b-sur{fill:var(--c-sur-band)} .b-sampled{fill:var(--c-feas);opacity:.12} .b-extrap{fill:var(--c-infeas);opacity:.08} .b-ei{fill:var(--c-feas);opacity:.2}
.p-samp{fill:var(--c-samp);stroke:var(--panel);stroke-width:1.2} .p-val{fill:var(--c-val);stroke:var(--panel);stroke-width:1.2} .p-true{fill:var(--c-true)} .p-sur{fill:var(--c-sur);stroke:var(--panel);stroke-width:1.2}
.p-opt{fill:var(--c-opt);stroke:var(--ink);stroke-width:1} .p-ver{fill:none;stroke:var(--c-infeas);stroke-width:2.4} .p-hollow{fill:var(--panel);stroke:var(--c-sur);stroke-width:2} .p-new{fill:var(--c-feas);stroke:var(--ink);stroke-width:1}
.p-dom{fill:var(--muted);opacity:.45} .p-pareto{fill:var(--c-opt);stroke:var(--ink);stroke-width:.8}
.r-infeas{fill:var(--c-infeas);opacity:.45} .heat{image-rendering:pixelated}
.plot .annot{font-size:12px;fill:var(--ink)} .plot .annot-w{font-size:12px;fill:#fff;font-weight:600;paint-order:stroke;stroke:#000;stroke-width:2.5px} .plot .clabel{font-size:9.5px;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:2px}
.legend-bg{fill:var(--panel);stroke:var(--line);opacity:.93} .legend .ltext{font-size:11.5px;fill:var(--ink)}
/* diagram styles */
.dg-box{fill:var(--panel2);stroke:var(--line);stroke-width:1.5} .dg-box2{fill:var(--brand-soft);stroke:var(--brand);stroke-width:1.5} .dg-box3{fill:var(--ok-soft);stroke:var(--ok);stroke-width:1.5} .dg-box4{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.5} .dg-box5{fill:var(--bad-soft);stroke:var(--bad);stroke-width:1.5}
.dg-t{font-size:13px;fill:var(--ink)} .dg-tb{font-size:14px;font-weight:700;fill:var(--ink)} .dg-ts{font-size:11px;fill:var(--ink2)} .dg-arrow{stroke:var(--ink2);stroke-width:1.8;fill:none} .dg-arrowhead{fill:var(--ink2)}
/* ===== Quiz ===== */
.q{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:14px 0;background:var(--panel)}
.q.unanswered{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn-soft)}
.q .qhead{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}
.q fieldset{border:0;padding:0;margin:6px 0} .q legend{padding:0;font-weight:600;margin-bottom:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:9px;margin:6px 0;cursor:pointer;background:var(--panel)}
.opt:hover{background:var(--panel2)} .opt input{margin-top:5px;flex:none}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.missed{border-color:var(--ok);border-style:dashed}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .numrow input{font:inherit;padding:.35em .6em;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:12em}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--panel2);font-size:.92rem} .fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.optfb{font-size:.84rem;color:var(--ink2);margin:2px 0 0 28px}
.scorebox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bigscore{font-size:2.2rem;font-weight:800}
/* ===== Flashcards ===== */
.fc-stage{perspective:1200px;margin:12px 0}
.fc{position:relative;min-height:240px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s}
.fc.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;justify-content:center;overflow:auto}
.fc-back{transform:rotateY(180deg);background:var(--panel2)}
.fc-face .cue{font-size:1.15rem;font-weight:600}
@media (prefers-reduced-motion:reduce){ .fc{transform:none!important} .fc .fc-back{transform:none;display:none} .fc.flipped .fc-back{display:flex} .fc.flipped .fc-front{display:none} }
/* ===== Code ===== */
.code{position:relative;margin:10px 0} .code pre{background:#0f1720;color:#e6edf3;padding:14px;border-radius:10px;overflow:auto;max-height:520px;margin:0;font-size:.84rem;line-height:1.5}
.code .copy{position:absolute;top:8px;right:8px}
.nbcell-md{border-left:3px solid var(--line);padding:2px 12px;margin:10px 0}
/* ===== Course map ===== */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.mcard{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel);box-shadow:var(--shadow)}
.mcard:hover{border-color:var(--brand)} .mcard .num{font-size:.75rem;color:var(--muted);font-weight:700}
.mcard h4{margin:.2em 0 .3em}
/* ===== Certificate ===== */
.cert-wrap{max-width:900px;margin:0 auto} .cert-wrap svg{width:100%;height:auto;border:1px solid var(--line);background:#fff}
#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;color:#000}
  body.print-cert .topbar,body.print-cert .layout,body.print-cert .skip,body.print-cert #toast{display:none!important}
  body.print-cert #printArea{display:block!important}
  body.print-cert #printArea svg{width:100%;height:auto}
  body.print-report .topbar,body.print-report .sidebar,body.print-report .noprint,body.print-report #toast{display:none!important}
  body.print-report .layout{display:block} body.print-report .main{max-width:none;padding:0}
  .card,.concept{box-shadow:none;break-inside:avoid}
}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:90vw}
#toast.show{opacity:1}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:90;padding:16px}
.modal{background:var(--panel);color:var(--ink);border-radius:14px;max-width:560px;width:100%;padding:18px 20px;box-shadow:var(--shadow);border:1px solid var(--line)}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.4em .6em}
input[type=text]{width:100%;max-width:420px}
.formrow{margin:10px 0} .formrow label{display:block;font-weight:600;font-size:.9rem;margin-bottom:3px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel2);border-radius:10px;padding:10px 12px} .stat b{display:block;font-size:1.35rem}

<script>
/* ===== core.js ===== */
/* ==========================================================================
   core.js — utilities, numerical routines, heat-sink model, SVG plotting
   All computations run locally in the browser. No network access.
   ========================================================================== */
'use strict';

/* ---------- Small DOM + text helpers ---------- */
const U = {
  esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
  el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'text') e.textContent = v;
      else if (k === 'html') e.innerHTML = v; // only used with trusted course content
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (k === 'class') e.className = v;
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
    return e;
  },
  fmt(x, d = 3) {
    if (x == null || !isFinite(x)) return '—';
    const a = Math.abs(x);
    if (a !== 0 && (a < 1e-3 || a >= 1e5)) return x.toExponential(Math.max(1, d - 1));
    return Number(x.toFixed(d)).toString();
  },
  fixed(x, d = 1) { return (x == null || !isFinite(x)) ? '—' : x.toFixed(d); },
  clamp(x, a, b) { return Math.min(b, Math.max(a, x)); },
  linspace(a, b, n) { const r = []; for (let i = 0; i < n; i++) r.push(a + (b - a) * i / (n - 1)); return r; },
  download(filename, text, mime) {
    const blob = new Blob([text], { type: mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  },
  async copy(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
      ta.remove(); return ok;
    }
  },
  today() { const d = new Date(); return d.toISOString().slice(0, 10); },
  uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
};

/* ---------- Seeded RNG (mulberry32) and normal deviates ---------- */
function RNG(seed) {
  let a = (seed >>> 0) || 1;
  const next = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  return {
    random: next,
    uniform(lo, hi) { return lo + (hi - lo) * next(); },
    int(n) { return Math.floor(next() * n); },
    normal() { let u = 0, v = 0; while (u === 0) u = next(); v = next(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
    shuffle(arr) { const a2 = arr.slice(); for (let i = a2.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [a2[i], a2[j]] = [a2[j], a2[i]]; } return a2; }
  };
}

/* ---------- SHA-256 (pure JS; used only as a consistency checksum) ---------- */
function sha256hex(ascii) {
  const bytes = new TextEncoder().encode(ascii);
  const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  let H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const l = bytes.length, withPad = ((l + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(withPad); m.set(bytes); m[l] = 0x80;
  const bitLen = l * 8; const dv = new DataView(m.buffer);
  dv.setUint32(withPad - 4, bitLen >>> 0); dv.setUint32(withPad - 8, Math.floor(bitLen / 4294967296));
  const w = new Uint32Array(64); const r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let i = 0; i < withPad; i += 64) {
    for (let t = 0; t < 16; t++) w[t] = dv.getUint32(i + t * 4);
    for (let t = 16; t < 64; t++) { const s0 = r(w[t - 15], 7) ^ r(w[t - 15], 18) ^ (w[t - 15] >>> 3); const s1 = r(w[t - 2], 17) ^ r(w[t - 2], 19) ^ (w[t - 2] >>> 10); w[t] = (w[t - 16] + s0 + w[t - 7] + s1) | 0; }
    let [a, b, c, d, e, f, g, h] = H;
    for (let t = 0; t < 64; t++) {
      const S1 = r(e, 6) ^ r(e, 11) ^ r(e, 25), ch = (e & f) ^ (~e & g), t1 = (h + S1 + ch + K[t] + w[t]) | 0;
      const S0 = r(a, 2) ^ r(a, 13) ^ r(a, 22), mj = (a & b) ^ (a & c) ^ (b & c), t2 = (S0 + mj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H = [H[0] + a, H[1] + b, H[2] + c, H[3] + d, H[4] + e, H[5] + f, H[6] + g, H[7] + h].map(x => x | 0);
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

/* ---------- Linear algebra ---------- */
const LA = {
  /* Least squares min ||A x - b|| by Householder QR. A: array of rows. */
  lstsq(A, b) {
    const m = A.length, n = A[0].length;
    const R = A.map(r => r.slice()); const y = b.slice();
    const kmax = Math.min(m, n); // underdetermined systems (m < n) return a basic solution (extra coefficients = 0)
    for (let k = 0; k < kmax; k++) {
      let norm = 0; for (let i = k; i < m; i++) norm += R[i][k] * R[i][k]; norm = Math.sqrt(norm);
      if (norm === 0) continue;
      const alpha = R[k][k] > 0 ? -norm : norm;
      const v = new Array(m).fill(0); v[k] = R[k][k] - alpha; for (let i = k + 1; i < m; i++) v[i] = R[i][k];
      let vv = 0; for (let i = k; i < m; i++) vv += v[i] * v[i]; if (vv === 0) continue;
      for (let j = k; j < n; j++) { let s = 0; for (let i = k; i < m; i++) s += v[i] * R[i][j]; s = 2 * s / vv; for (let i = k; i < m; i++) R[i][j] -= s * v[i]; }
      let s = 0; for (let i = k; i < m; i++) s += v[i] * y[i]; s = 2 * s / vv; for (let i = k; i < m; i++) y[i] -= s * v[i];
    }
    const x = new Array(n).fill(0);
    for (let i = kmax - 1; i >= 0; i--) { let s = y[i]; for (let j = i + 1; j < n; j++) s -= R[i][j] * x[j]; x[i] = Math.abs(R[i][i]) < 1e-12 ? 0 : s / R[i][i]; }
    return x;
  },
  /* Cholesky; returns lower-triangular L or null */
  chol(K) {
    const n = K.length; const L = Array.from({ length: n }, () => new Array(n).fill(0));
    for (let i = 0; i < n; i++) for (let j = 0; j <= i; j++) {
      let s = K[i][j]; for (let k = 0; k < j; k++) s -= L[i][k] * L[j][k];
      if (i === j) { if (s <= 0) return null; L[i][i] = Math.sqrt(s); } else L[i][j] = s / L[j][j];
    }
    return L;
  },
  fwd(L, b) { const n = L.length, x = new Array(n); for (let i = 0; i < n; i++) { let s = b[i]; for (let k = 0; k < i; k++) s -= L[i][k] * x[k]; x[i] = s / L[i][i]; } return x; },
  bwdT(L, b) { const n = L.length, x = new Array(n); for (let i = n - 1; i >= 0; i--) { let s = b[i]; for (let k = i + 1; k < n; k++) s -= L[k][i] * x[k]; x[i] = s / L[i][i]; } return x; },
  /* Gaussian elimination with partial pivoting */
  solve(A, b) {
    const n = A.length; const M = A.map((r, i) => [...r, b[i]]);
    for (let k = 0; k < n; k++) {
      let p = k; for (let i = k + 1; i < n; i++) if (Math.abs(M[i][k]) > Math.abs(M[p][k])) p = i;
      [M[k], M[p]] = [M[p], M[k]]; if (Math.abs(M[k][k]) < 1e-14) M[k][k] = 1e-14;
      for (let i = k + 1; i < n; i++) { const f = M[i][k] / M[k][k]; for (let j = k; j <= n; j++) M[i][j] -= f * M[k][j]; }
    }
    const x = new Array(n); for (let i = n - 1; i >= 0; i--) { let s = M[i][n]; for (let j = i + 1; j < n; j++) s -= M[i][j] * x[j]; x[i] = s / M[i][i]; } return x;
  }
};

/* ---------- Statistics helpers ---------- */
const ST = {
  mean(a) { return a.reduce((s, v) => s + v, 0) / a.length; },
  variance(a, ddof = 0) { const m = ST.mean(a); return a.reduce((s, v) => s + (v - m) ** 2, 0) / (a.length - ddof); },
  mae(y, p) { return y.reduce((s, v, i) => s + Math.abs(v - p[i]), 0) / y.length; },
  rmse(y, p) { return Math.sqrt(y.reduce((s, v, i) => s + (v - p[i]) ** 2, 0) / y.length); },
  r2(y, p) { const m = ST.mean(y); const ss = y.reduce((s, v) => s + (v - m) ** 2, 0); const se = y.reduce((s, v, i) => s + (v - p[i]) ** 2, 0); return 1 - se / ss; },
  erf(x) { // Abramowitz & Stegun 7.1.26, |error| < 1.5e-7
    const s = Math.sign(x); x = Math.abs(x);
    const t = 1 / (1 + 0.3275911 * x);
    const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
    return s * y;
  },
  Phi(z) { return 0.5 * (1 + ST.erf(z / Math.SQRT2)); },
  phi(z) { return Math.exp(-0.5 * z * z) / Math.sqrt(2 * Math.PI); },
  /* Expected improvement for MINIMIZATION. fbest = best observed (lowest) value. xi >= 0 optional margin. */
  EI(mu, sigma, fbest, xi = 0) {
    const imp = fbest - mu - xi;
    if (!(sigma > 1e-12)) return Math.max(imp, 0); // zero predictive SD: improvement is deterministic
    const z = imp / sigma;
    return imp * ST.Phi(z) + sigma * ST.phi(z);
  }
};

/* ---------- Pedagogical heat-sink model (the "expensive simulator" stand-in) ---------- */
const HS = {
  P: { W: 0.050, L: 0.050, H: 0.040, tb: 0.004, ks: 150, rhoAl: 2700, rho: 1.16, mu: 1.85e-5, cp: 1007, ka: 0.026, dp: 5.0, Q: 30, Nu: 7.54 },
  bounds: { s: [0.8, 3.0], t: [0.2, 1.5] }, // mm
  limits: { mass: 0.070, dTair: 12 },      // kg, K
  ref: { s: 1.8525, t: 0.3509, R: 0.57705 }, // constrained optimum from SLSQP on the analytical model
  refUnc: { s: 1.885, t: 0.4888, R: 0.56969 },
  /* s_mm: fin gap (mm), t_mm: fin thickness (mm). Returns R (K/W), mass (kg), dTair (K), Re, and intermediates. */
  eval(s_mm, t_mm) {
    const p = HS.P; const s = s_mm * 1e-3, t = t_mm * 1e-3;
    const N = p.W / (s + t);
    const u = p.dp * s * s / (12 * p.mu * p.L);
    const mdot = p.rho * u * s * p.H * N;
    const h = p.Nu * p.ka / (2 * s);
    const m = Math.sqrt(2 * h / (p.ks * t)); const eta = Math.tanh(m * p.H) / (m * p.H);
    const UA = h * N * p.L * (2 * p.H * eta + s);
    const NTU = UA / (mdot * p.cp);
    const R = 1 / (mdot * p.cp * (1 - Math.exp(-NTU))) + p.tb / (p.ks * p.W * p.L);
    const mass = p.rhoAl * (N * t * p.H * p.L + p.W * p.L * p.tb);
    const dTair = p.Q / (mdot * p.cp);
    const Re = p.rho * u * 2 * s / p.mu;
    return { R, mass, dTair, Re, N, u, mdot, h, eta, NTU, UA };
  },
  R(s, t) { return HS.eval(s, t).R; },
  feasible(s, t) { const e = HS.eval(s, t); return e.mass <= HS.limits.mass && e.dTair <= HS.limits.dTair; },
  /* 1-D slice used in several demos: R as function of s with t fixed */
  slice(s, t = 0.6) { return HS.R(s, t); },
  toUnit(s, t) { const b = HS.bounds; return [(s - b.s[0]) / (b.s[1] - b.s[0]), (t - b.t[0]) / (b.t[1] - b.t[0])]; },
  fromUnit(u, v) { const b = HS.bounds; return [b.s[0] + u * (b.s[1] - b.s[0]), b.t[0] + v * (b.t[1] - b.t[0])]; }
};

/* ---------- Sampling plans (all in the unit square/interval) ---------- */
const SAMP = {
  random(n, d, rng) { return Array.from({ length: n }, () => Array.from({ length: d }, () => rng.random())); },
  lhs(n, d, rng) { // one point per stratum in each dimension; strata randomly paired
    const cols = []; for (let k = 0; k < d; k++) cols.push(rng.shuffle([...Array(n).keys()]).map(i => (i + rng.random()) / n));
    return Array.from({ length: n }, (_, i) => cols.map(c => c[i]));
  },
  factorial(levels, d = 2) { const g = U.linspace(0, 1, levels); const pts = []; if (d === 1) return g.map(x => [x]); for (const a of g) for (const b of g) pts.push([a, b]); return pts; },
  /* Unscrambled 2-D Sobol sequence (dim 1: van der Corput; dim 2: primitive polynomial x+1). Point 0 is the origin. */
  sobol(n, skip = 0) {

function Dg(host, w, h, aria) {

  mk.appendChild(svgEl('path', { d: 'M0,0L10,5L0,10Z', class: 'dg-arrowhead' })); defs.appendChild(mk); svg.appendChild(defs);
  host.innerHTML = ''; host.appendChild(svg);
  // Phones: keep diagram text readable by giving the SVG a minimum width and letting the reader swipe sideways
  const hw = hostWidth(host);
  if (hw > 0 && hw < w * 0.75) {
    svg.style.minWidth = Math.round(w * 0.88) + 'px'; host.classList.add('vis-scroll');
    host.setAttribute('tabindex', '0'); host.setAttribute('role', 'region'); host.setAttribute('aria-label', 'Diagram (scroll sideways)');
    if (!host.previousElementSibling || !host.previousElementSibling.classList.contains('swipe-hint')) host.parentNode && host.parentNode.insertBefore(U.el('div', { class: 'swipe-hint small muted', text: '↔ Swipe sideways to see the whole diagram.' }), host);
  }
  const api = {
    svg,
    box(x, y, bw, bh, lines, cls = 'dg-box', rx = 10) {
      svg.appendChild(svgEl('rect', { x, y, width: bw, height: bh, rx, class: cls }));
      const L = Array.isArray(lines) ? lines : [lines]; const lh = 17; const y0 = y + bh / 2 - (L.length - 1) * lh / 2 + 5;

    },
    t(x, y, s, cls = 'dg-t', anchor = 'middle') { const e = svgEl('text', { x, y, class: cls, 'text-anchor': anchor }, s); svg.appendChild(e); return e; },
    arrow(pts, label, lx, ly) { const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ',' + p[1]).join(''); svg.appendChild(svgEl('path', { d, class: 'dg-arrow', 'marker-end': `url(#${id})` })); if (label) api.t(lx, ly, label, 'dg-ts'); },

/* ===== visuals_b.js ===== */
/* ==========================================================================
   visuals_b.js — data plots and interactive demonstrations.
   Unless a caption says otherwise, results are computed live in the browser
   from the pedagogical heat-sink model using small JavaScript implementations.
   ========================================================================== */

/* ---- shared helpers ---- */
function ctrl(host) { const c = U.el('div', { class: 'controls' }); host.appendChild(c); return c; }
function slider(c, label, min, max, step, val, oninput, fmt) {
  const id = 'sl' + U.uid(); const out = U.el('output', { for: id, text: fmt ? fmt(val) : val });
  const inp = U.el('input', { type: 'range', id, min, max, step, value: val, 'aria-label': label });
  inp.addEventListener('input', () => { out.textContent = fmt ? fmt(+inp.value) : inp.value; oninput(+inp.value); });
  c.appendChild(U.el('label', { for: id }, label + ' ', inp, ' ', out)); return inp;
}
function select(c, label, opts, val, onchange) { const s = U.el('select', { 'aria-label': label }); opts.forEach(([v, t]) => s.appendChild(U.el('option', { value: v, text: t }))); s.value = val; s.onchange = () => onchange(s.value); c.appendChild(U.el('label', {}, label + ' ', s)); return s; }
function button(c, label, onclick, cls = 'btn small') { const b = U.el('button', { class: cls, type: 'button', text: label, onclick }); c.appendChild(b); return b; }
function readout(host) { const r = U.el('div', { class: 'readout', 'aria-live': 'polite' }); host.appendChild(r); return r; }
function note(host, txt) { host.appendChild(U.el('div', { class: 'disclose', text: txt })); }
const TSLICE = 0.6; // fin thickness used for 1-D slices (mm)
const S_LO = 0.8, S_HI = 3.0;
const toU1 = s => (s - S_LO) / (S_HI - S_LO);

/* Base map of the heat-sink design space */
function caseMap(host, o = {}) {
  const p = new Plot(host, { w: o.w || 640, h: o.h || 420, m: { l: 62, r: 70, t: 20, b: 50 }, xlim: [0.8, 3.0], ylim: [0.2, 1.5], xlabel: 'fin gap s (mm)', ylabel: 'fin thickness t (mm)', aria: o.aria || 'Map of thermal resistance over fin gap and fin thickness' });
  const f = o.f || ((s, t) => Math.log10(HS.R(s, t)));
  const r = p.heat(f, 90, o.range || [Math.log10(0.57), Math.log10(2.5)]);
  if (o.contours !== false) p.contour((s, t) => HS.R(s, t), o.levels || [0.6, 0.65, 0.7, 0.8, 0.9, 1.0, 1.2, 1.5, 2.0], 60, 'l-contour');
  if (o.constraints) {
    p.contour((s, t) => HS.eval(s, t).mass, [HS.limits.mass], 80, 'l-cons', false);
    p.contour((s, t) => HS.eval(s, t).dTair, [HS.limits.dTair], 80, 'l-cons2', false);
    const pid = 'hatch' + U.uid(); const pat = svgEl('pattern', { id: pid, width: 7, height: 7, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }); pat.appendChild(svgEl('rect', { width: 7, height: 7, fill: 'rgba(192,57,43,0.35)' })); pat.appendChild(svgEl('line', { x1: 0, y1: 0, x2: 0, y2: 7, stroke: 'rgba(255,255,255,0.75)', 'stroke-width': 2 })); p.defs.appendChild(pat);
    const g = svgEl('g'); const n = 45;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const s = 0.8 + 2.2 * (i + 0.5) / n, t = 0.2 + 1.3 * (j + 0.5) / n; if (!HS.feasible(s, t)) g.appendChild(svgEl('rect', { x: p.X(s - 1.1 / n), y: p.Y(t + 0.65 / n), width: p.pw / n + 0.3, height: p.ph / n + 0.3, fill: `url(#${pid})` })); }
    p.gData.insertBefore(g, p.gData.children[1] || null);
  }
  if (o.opt) p.pts([[HS.ref.s, HS.ref.t]], 'p-opt', 7, 'star');
  if (o.colorbar !== false) p.colorbar(0.57, 2.5, 'R (K/W), log');
  return p;
}
function caseLegend(p, extra = []) {
  p.legend([{ label: 'R contours (K/W)', cls: 'l-contour-ink', type: 'line' }, { label: 'mass = 0.070 kg', cls: 'l-cons', type: 'line' }, { label: 'ΔT_air = 12 K', cls: 'l-cons2', type: 'line' }, { label: 'infeasible region', cls: 'r-infeas', type: 'square' }, { label: 'constrained optimum', cls: 'p-opt', type: 'star' }, ...extra], 'tr');
}

    const etr = ST.rmse(tr.map(d => d[1]), tr.map(d => m.predict(d[0]))), eva = ST.rmse(va.map(d => d[1]), va.map(d => m.predict(d[0])));

function rbf1d(xs, ys) { const n = xs.length; const A = Array.from({ length: n + 2 }, () => new Array(n + 2).fill(0)); const b = new Array(n + 2).fill(0); for (let i = 0; i < n; i++) { for (let j = 0; j < n; j++) A[i][j] = Math.abs(xs[i] - xs[j]) ** 3; A[i][n] = A[n][i] = 1; A[i][n + 1] = A[n + 1][i] = xs[i]; b[i] = ys[i]; } const w = LA.solve(A, b); return x => { let s = w[n] + w[n + 1] * x; for (let i = 0; i < n; i++) s += w[i] * Math.abs(x - xs[i]) ** 3; return s; }; }

    const tv = xs.map(x => HS.slice(x, TSLICE)); r.textContent = `${n} equally spaced samples. RMSE vs true curve over the range: ${ST.rmse(tv, xs.map(f)).toFixed(4)} K/W\n${{ poly2: 'Smooth, few parameters; cannot follow the steep rise at small s.', poly4: 'More flexible; may wiggle between points.', rbf: 'Passes exactly through every sample; smooth between them.', gp: 'Passes through samples (noise-free) and provides an uncertainty band (shaded ±2σ).', forest: 'Piecewise-constant steps: not smooth, cannot extrapolate trends, gradients are zero almost everywhere.' }[kind]}`;

/* ---------------- Module 11: surrogate-based optimization demo ---------------- */
function fitSur(X, y, kind) { if (kind === 'poly2') return MODELS.poly2d(X, y, 2); if (kind === 'rbf') return MODELS.rbf(X, y); return MODELS.gp(X, y); }
const predMu = (m, u) => { const v = m.predict(u); return typeof v === 'object' ? v.mu : v; };
/* Optimize surrogate of log10 R and surrogate of log10 dTair, with exact (cheap) mass constraint. Penalty method. */
function optimizeSurrogate(mR, mT) {
  const pen = u => { const [s, t] = HS.fromUnit(u[0], u[1]); const e = HS.eval(s, t); const dT = 10 ** predMu(mT, u); return predMu(mR, u) + 50 * Math.max(0, e.mass - HS.limits.mass) / HS.limits.mass + 5 * Math.max(0, dT - HS.limits.dTair) / HS.limits.dTair; };
  return OPT.gridThenNM(pen, 61, 4);
}

/* Shared runner for convergence & repeat studies */
function runStudy(method, budget, seed) {
  const rng = RNG(seed); const evalU = u => { const [s, t] = HS.fromUnit(...u); const e = HS.eval(s, t); return { R: e.R, feas: HS.feasible(s, t) }; };
  const best = []; let bestF = Infinity; const rec = u => { const e = evalU(u); if (e.feas && e.R < bestF) bestF = e.R; best.push(bestF); };
  if (method === 'random') { for (let i = 0; i < budget; i++) rec([rng.random(), rng.random()]); return best; }
  const n0 = method === 'oneshot' ? budget - 1 : Math.min(8, budget); const X = SAMP.lhs(n0, 2, rng); X.forEach(rec);
  const fitBoth = () => [MODELS.gp(X, X.map(u => Math.log10(HS.R(...HS.fromUnit(...u))))), MODELS.gp(X, X.map(u => Math.log10(HS.eval(...HS.fromUnit(...u)).dTair)))];
  while (X.length < budget) {
    const [mR, mT] = fitBoth(); let u;
    if (method === 'oneshot' || method === 'sbo') u = optimizeSurrogate(mR, mT).x;
    else { // EI x probability of feasibility (dTair surrogate), exact mass
      let fb = Infinity; X.forEach(q => { const e = evalU(q); if (e.feas) fb = Math.min(fb, Math.log10(e.R)); }); if (!isFinite(fb)) fb = Math.max(...X.map(q => Math.log10(HS.R(...HS.fromUnit(...q)))));
      let bv = -1, bx = -1, ux = null; const g = 41; for (let i = 0; i < g; i++) for (let j = 0; j < g; j++) { const q = [i / (g - 1), j / (g - 1)]; if (X.some(z => Math.hypot(z[0] - q[0], z[1] - q[1]) < 1e-3)) continue; const [s, t] = HS.fromUnit(...q); if (HS.eval(s, t).mass > HS.limits.mass) continue; const pr = mR.predict(q), pt = mT.predict(q); const pof = ST.Phi((Math.log10(HS.limits.dTair) - pt.mu) / Math.max(pt.sd, 1e-9)); const v = ST.EI(pr.mu, pr.sd, fb) * pof; if (v > bv) { bv = v; u = q; } if (pr.sd * pof > bx) { bx = pr.sd * pof; ux = q; } }
      if (bv <= 1e-12 && ux) u = ux; // EI collapsed: explore the most uncertain feasible point
    }
    if (X.some(q => Math.hypot(q[0] - u[0], q[1] - u[1]) < 1e-4)) u = [rng.random(), rng.random()]; // avoid duplicate evaluations
    X.push(u); rec(u);
    if (method === 'oneshot') break;
  }
  while (best.length < budget) best.push(bestF);
  return best;
}

  p.band(xs, P.map(q => q.mu - 2 * q.sd), P.map(q => q.mu + 2 * q.sd)); p.line(xs, xs.map(MULTI), 'l-true-d'); p.line(xs, P.map(q => q.mu), 'l-sur'); p.pts(X.map((x, i) => [x, y[i]]), 'p-samp', 5);
  const iMu = P.reduce((b, q, i) => q.mu < P[b].mu ? i : b, 0), iSd = P.reduce((b, q, i) => q.sd > P[b].sd ? i : b, 0); const fb = Math.min(...y); const ei = P.map(q => ST.EI(q.mu, q.sd, fb)); const iEi = ei.indexOf(Math.max(...ei));
  p.vline(xs[iMu], 'l-sur'); p.vline(xs[iSd], 'l-acc'); p.vline(xs[iEi], 'l-ei');
  p.text(xs[iMu] + 0.01, 1.62, 'exploit: min μ', 'annot'); p.text(xs[iSd] + 0.01, 1.52, 'explore: max σ', 'annot'); p.text(xs[iEi] + 0.01, 1.42, 'EI balances both', 'annot');
  p.legend([{ label: 'GP mean', cls: 'l-sur', type: 'line' }, { label: '±2σ', cls: 'b-sur', type: 'band' }, { label: 'true (hidden in practice)', cls: 'l-true-d', type: 'line' }], 'bl');
  note(host, 'Synthetic 1-D test function chosen to have several minima. GP with fixed ℓ = 0.1; computed live.');
};

VIS['ei-demo'] = host => {
  const c = ctrl(host); const a = U.el('div'), b = U.el('div'); host.append(a, b); const r = readout(host);
  let fn = 'multi', xi = 0, X = [0.15, 0.5, 0.85], acq = 'ei', kappa = 2;
  const F = x => fn === 'multi' ? MULTI(x) : HS.slice(S_LO + (S_HI - S_LO) * x, 0.35);
  const draw = () => {
    const y = X.map(F); const g = MODELS.gp(X.map(x => [x]), y, { ls: [fn === 'multi' ? 0.1 : 0.25] }); const xs = U.linspace(0, 1, 301); const P = xs.map(x => g.predict([x])); const fb = Math.min(...y);
    const A = acq === 'ei' ? P.map(q => ST.EI(q.mu, q.sd, fb, xi)) : P.map(q => -(q.mu - kappa * q.sd)); const ia = A.indexOf(Math.max(...A));
    const lo = Math.min(...xs.map(F), ...P.map(q => q.mu - 2 * q.sd)), hi = Math.max(...xs.map(F), ...P.map(q => q.mu + 2 * q.sd));
    const p = new Plot(a, { w: 640, h: 300, m: { l: 62, r: 18, t: 16, b: 40 }, xlim: [0, 1], ylim: [Math.max(lo, fn === 'multi' ? 0 : 0.3), Math.min(hi, fn === 'multi' ? 2 : 3)], xlabel: fn === 'multi' ? 'x (scaled)' : 'fin gap, scaled (0 = 0.8 mm, 1 = 3.0 mm), t = 0.35 mm', ylabel: 'objective' });
    p.band(xs, P.map(q => q.mu - 2 * q.sd), P.map(q => q.mu + 2 * q.sd)); p.line(xs, xs.map(F), 'l-true-d'); p.line(xs, P.map(q => q.mu), 'l-sur'); p.pts(X.map((x, i) => [x, y[i]]), 'p-samp', 5); p.hline(fb, 'l-guide'); p.vline(xs[ia], 'l-ei');
    p.legend([{ label: 'GP mean', cls: 'l-sur', type: 'line' }, { label: '±2σ', cls: 'b-sur', type: 'band' }, { label: 'true (hidden)', cls: 'l-true-d', type: 'line' }, { label: 'next sample', cls: 'l-ei', type: 'line' }], 'tr');
    const amax = Math.max(...A), amin = Math.min(...A);
    const q = new Plot(b, { w: 640, h: 170, m: { l: 62, r: 18, t: 10, b: 40 }, xlim: [0, 1], ylim: [acq === 'ei' ? 0 : amin, amax > (acq === 'ei' ? 0 : amin) ? amax * 1.05 + (acq === 'ei' ? 0 : 0.01) : 1], xlabel: 'x', ylabel: acq === 'ei' ? 'EI(x)' : '−LCB(x)', yticks: 3 });
    q.band(xs, xs.map(() => acq === 'ei' ? 0 : amin), A, 'b-ei'); q.line(xs, A, 'l-ei'); q.vline(xs[ia], 'l-ei');
    r.textContent = `${X.length} evaluations; best observed f_best = ${fb.toFixed(4)}\nnext sample at x = ${xs[ia].toFixed(3)} (${acq === 'ei' ? `max EI = ${amax.toExponential(3)}, ξ = ${xi}` : `min LCB = μ − κσ with κ = ${kappa}`}). At existing samples σ ≈ 0, so EI ≈ max(f_best − μ − ξ, 0) ≈ 0 there.`;
    return xs[ia];
  };
  let next = 0;
  const redraw = () => { next = draw(); };
  select(c, 'Function', [['multi', 'Synthetic multimodal'], ['hs', 'Heat-sink slice (t = 0.35 mm)']], fn, v => { fn = v; X = [0.15, 0.5, 0.85]; redraw(); });
  select(c, 'Acquisition', [['ei', 'Expected improvement'], ['lcb', 'Lower confidence bound']], acq, v => { acq = v; redraw(); });
  slider(c, 'EI margin ξ', 0, 0.2, 0.005, xi, v => { xi = v; redraw(); }, v => v.toFixed(3)); slider(c, 'LCB κ', 0, 5, 0.1, kappa, v => { kappa = v; redraw(); }, v => v.toFixed(1));
  button(c, 'Evaluate next point', () => { X.push(next); redraw(); }, 'btn small primary'); button(c, 'Reset', () => { X = [0.15, 0.5, 0.85]; redraw(); }); redraw();
  note(host, 'Live 1-D Bayesian optimization: GP with fixed length scale, acquisition maximized on a 301-point grid. Larger ξ or κ → more exploration.');
};

VIS['constrained-ei'] = host => {
  const div = U.el('div'); host.appendChild(div); const xs = U.linspace(0, 1, 300);
  const X = [0.1, 0.35, 0.6, 0.9]; const y = X.map(MULTI); const g = MODELS.gp(X.map(x => [x]), y, { ls: [0.1] }); const fb = Math.min(...y);
  const cons = x => 0.55 - x; // feasible if g(x) <= 0 → x >= 0.55 (synthetic)
  const gc = MODELS.gp(X.map(x => [x]), X.map(cons), { ls: [0.3] });
  const ei = xs.map(x => { const q = g.predict([x]); return ST.EI(q.mu, q.sd, fb); }); const pof = xs.map(x => { const q = gc.predict([x]); return ST.Phi(-q.mu / Math.max(q.sd, 1e-9)); });
  const m = Math.max(...ei); const p = new Plot(div, { w: 640, h: 300, xlim: [0, 1], ylim: [0, 1.05], xlabel: 'x (scaled)', ylabel: 'normalized value' });
  p.line(xs, ei.map(v => v / m), 'l-ei'); p.line(xs, pof, 'l-acc'); const prod = ei.map((v, i) => v * pof[i]); const mp = Math.max(...prod); p.line(xs, prod.map(v => v / mp), 'l-sur');
  p.legend([{ label: 'EI (normalized)', cls: 'l-ei', type: 'line' }, { label: 'probability of feasibility', cls: 'l-acc', type: 'line' }, { label: 'EI × PoF (normalized)', cls: 'l-sur', type: 'line' }], 'tl');
  note(host, 'Synthetic illustration: objective and constraint each modelled by a GP; the constraint is feasible for x ≥ 0.55. Multiplying EI by the probability of feasibility discourages sampling where the constraint is probably violated.');
};

VIS['repeat-boxplot'] = host => {
  const div = U.el('div'); host.appendChild(div); const r = readout(host); const B = 16, reps = 12;
  const res = { random: [], sbo: [] }; for (const m of ['random', 'sbo']) for (let k = 0; k < reps; k++) { const h = runStudy(m, B, 500 + k); res[m].push(isFinite(h[B - 1]) ? h[B - 1] - HS.ref.R : NaN); }
  const p = new Plot(div, { w: 640, h: 300, xlim: [-0.5, 1.5], ylim: [0, 0.35], xlabel: '', ylabel: 'final gap R − R* (K/W)', xtickVals: [] });
  const stat = a => { const v = a.filter(isFinite).sort((x, y) => x - y); const q = f => v[Math.min(v.length - 1, Math.floor(f * (v.length - 1)))]; return { min: v[0], q1: q(0.25), med: q(0.5), q3: q(0.75), max: v[v.length - 1], n: v.length }; };
  [['random', 0, 'random search'], ['sbo', 1, 'sequential SBO (GP)']].forEach(([k, x, lab]) => { const s = stat(res[k]); p.rect(x - 0.2, s.q1, x + 0.2, s.q3, 'dg-box2'); p.seg(x - 0.2, s.med, x + 0.2, s.med, 'l-sur'); p.seg(x, s.min, x, s.q1, 'l-guide'); p.seg(x, s.q3, x, Math.min(s.max, 0.35), 'l-guide'); p.pts(res[k].filter(isFinite).map((v, i) => [x + 0.3 + 0.01 * (i % 5), Math.min(v, 0.35)]), 'p-samp', 2.5); p.text(x, 0.335, lab, 'annot', 'middle'); });
  const fm = a => a.filter(isFinite); r.textContent = `Budget ${B} evaluations, ${reps} seeds each.\nrandom search: median gap ${stat(res.random).med.toFixed(4)}, range ${stat(res.random).min.toFixed(4)}–${stat(res.random).max.toFixed(4)} (${fm(res.random).length}/${reps} found a feasible design)\nsequential SBO: median gap ${stat(res.sbo).med.toFixed(4)}, range ${stat(res.sbo).min.toFixed(4)}–${stat(res.sbo).max.toFixed(4)} (${fm(res.sbo).length}/${reps})`;
  note(host, 'Computed live with fixed seeds 500–511. Box = interquartile range, line = median, whiskers = min/max, dots = individual runs (values above 0.35 clipped). A single run of either method could mislead.');
};

COURSE.modules.push({
  id: 'm01', num: 1, title: 'AI and ML from the beginning', short: 'What AI, ML, deep learning and generative AI are; learning types; regression vs classification; when ML is (not) needed.', mins: 50,
  prereq: ['None — start here.'], prereqModules: [],
  objectives: ['Distinguish AI, conventional numerical methods, statistical ML, deep learning and generative AI.', 'Explain learning from examples versus programmed rules.', 'Classify a problem as supervised, unsupervised or reinforcement learning, and as regression or classification.', 'Use the terms feature, target, sample, parameter and prediction correctly.', 'Decide when ML is useful and when a physics model or simple numerical method is better.'],
  intro: '<p>Before any equations or code, we build a vocabulary. You will meet the heat-sink case study and see where “machine learning for surrogates” sits in the larger world of AI and engineering computation.</p>',
  labs: [],
  lessons: [
    { id: 'm01l1', title: 'What AI, ML, deep learning and generative AI mean', mins: 9, html: C({
      title: 'A family of ideas, not one technology',
      intuition: '<p><b>Artificial intelligence (AI)</b> is the broad goal of getting computers to perform tasks we associate with intelligence: reasoning, planning, recognizing, predicting. <b>Machine learning (ML)</b> is the part of AI in which the computer <i>learns</i> a rule from data rather than having every rule written by a programmer. <b>Deep learning</b> is ML that uses neural networks with many layers. <b>Generative AI</b> refers to (mostly deep-learning) models that produce new content — text, images, code — such as large language models.</p><p><b>Conventional numerical methods</b> — finite-element analysis (FEA), computational fluid dynamics (CFD), finite differences, ODE solvers — are not AI. They solve known governing equations (equilibrium, Navier–Stokes, energy conservation). In this course they are the <i>expensive simulators</i> whose results we want to approximate.</p>',
      visual: V('ai-nesting', 'AI contains ML, which contains deep learning; generative AI is one family within deep learning. Numerical methods sit outside AI and supply training data for surrogates.', 'Nested boxes: AI ⊃ ML ⊃ deep learning ⊃ generative AI. A separate box “Conventional numerical methods: FEA, CFD, finite differences, ODE solvers” is linked by an arrow labelled “generate training data” to a box “Surrogate modelling (this course)”, which points into the ML box.'),
      math: '<p>Most of this course uses <b>statistical ML</b>: we assume an unknown relationship <span class="iv">y</span> = <span class="iv">f</span>(<b>x</b>) and fit a model</p>' + EQ('<var>ŷ</var> = <var>f̂</var>(<b>x</b>; <b>θ</b>)') + SYM([['<b>x</b>', 'input vector (e.g., fin gap and thickness)', 'mixed (here mm)'], ['y', 'true output (e.g., thermal resistance)', 'K/W'], ['ŷ', 'model prediction of y', 'K/W'], ['θ', 'model parameters learned from data', 'depends on model']]),
      app: '<p>A CFD study of a heat sink might take an hour per design. A regression model fitted to 30 such runs predicts <span class="iv">R</span> for a new design in microseconds. That fitted model is a <b>surrogate</b>. A large language model, by contrast, could help you write code or a report, but it is not a surrogate of your heat sink and its text can be wrong.</p>',
      predict: ['Is a CFD solver that computes the airflow through a heat sink an example of machine learning?', 'No. CFD solves known conservation equations numerically; it does not learn its rules from data. It can, however, <i>generate</i> data from which an ML surrogate is trained.'],
      mis: ['“AI” and “ML” mean the same thing, and both mean neural networks.', 'ML is one approach within AI, and neural networks (deep learning) are one family within ML. Linear regression and Gaussian processes are ML too, and are often the best choice for small engineering datasets.'],
      tip: '<p>When someone says “we used AI”, ask: <i>which</i> model, trained on <i>what</i> data, validated <i>how</i>? Those three answers matter more than the label.</p>',
      take: 'AI ⊃ ML ⊃ deep learning ⊃ generative AI. Numerical solvers are not AI; they are the expensive models that surrogates approximate.'
    }) + C({
      title: 'When a physics model or simple numerical method is preferable',
      intuition: '<p>ML is not automatically an upgrade. If a trusted physics model is already fast enough, an ML model adds cost (data generation), risk (errors, extrapolation) and opacity. ML earns its place when the trusted model is too slow to call the hundreds or thousands of times that design exploration needs, or when no adequate physics model exists but good data do.</p>',
      visual: V('method-compare', 'Strengths and weaknesses of analytical physics models, numerical methods and ML surrogates.', 'Three boxes compare analytical physics models (fast, interpretable, limited by assumptions), numerical methods such as CFD/FEA (general and physics-based but slow), and ML surrogates (very fast once trained but without physics guarantees and unreliable outside data).'),
      math: '<p>A rough cost comparison for a study needing <span class="iv">M</span> model calls:</p>' + EQ('cost<sub>direct</sub> = <var>M</var> · <var>c</var><sub>sim</sub> &nbsp; vs. &nbsp; cost<sub>surrogate</sub> ≈ <var>n</var> · <var>c</var><sub>sim</sub> + <var>c</var><sub>fit</sub> + <var>M</var> · <var>c</var><sub>pred</sub> + <var>k</var> · <var>c</var><sub>sim</sub>') + SYM([['M', 'number of evaluations the study needs (e.g., by an optimizer)', 'count'], ['c<sub>sim</sub>', 'cost of one original simulation', 's'], ['n', 'training simulations', 'count'], ['c<sub>fit</sub>, c<sub>pred</sub>', 'cost to fit the surrogate, cost per prediction', 's'], ['k', 'verification runs of the original model', 'count']]) + '<p>A surrogate pays off when <span class="iv">n</span> + <span class="iv">k</span> ≪ <span class="iv">M</span> and <span class="iv">c</span><sub>pred</sub> ≪ <span class="iv">c</span><sub>sim</sub>.</p>',
      app: '<p>Sizing a shaft for torsion uses τ = <span class="iv">T r</span>/<span class="iv">J</span> — instant and exact enough; ML would be pointless. Optimizing the 3-D shape of a turbine blade with CFD costing hours per run is a classic surrogate application.</p>',
      predict: ['An optimizer needs M = 2 000 evaluations. Each CFD run costs 1 h. A surrogate needs n = 40 training runs and k = 5 verification runs. Roughly how many CFD hours does the surrogate route need?', 'About 45 h (40 + 5), versus 2 000 h directly — if the surrogate is accurate enough. The fitting and prediction cost is negligible by comparison.'],
      mis: ['If ML is faster, it is always better.', 'Speed is useless without adequate accuracy where it matters. If the physics model is already fast and validated, use it.'],
      tip: '<p>Before proposing ML, write down the time per evaluation of your trusted model and how many evaluations your study needs. If the product is small, skip ML.</p>',
      take: 'Use ML surrogates when trusted evaluations are expensive and many are needed; otherwise prefer the physics model.'
    }) },
    { id: 'm01l2', title: 'Learning from examples, and three kinds of learning', mins: 8, html: C({
      title: 'Explicit rules versus learned rules',
      intuition: '<p>A conventional program encodes rules the engineer wrote: “if the fin is thicker than 1 mm, then…”. A machine-learning program is given <b>examples</b> — pairs of inputs and correct outputs — plus a flexible model with adjustable <b>parameters</b>. A learning algorithm adjusts the parameters so the model reproduces the examples well, and (we hope) predicts well for new inputs.</p>',
      visual: V('rules-vs-data', 'Left: rules written by an engineer map inputs to outputs. Right: a learning algorithm derives the rule from examples, and the trained model then predicts for new inputs.', 'Two flowcharts. Programmed: inputs and engineer-written rules produce an output. ML: examples feed a learning algorithm that produces a trained model; a new input goes into the trained model to produce a prediction.'),
      math: '<p>“Learning” usually means choosing parameters θ to minimize a <b>loss</b> on the <span class="iv">n</span> training examples:</p>' + EQ('<b>θ̂</b> = arg min<sub><b>θ</b></sub> ' + FR('1', '<var>n</var>') + ' Σ<sub><var>i</var>=1</sub><sup><var>n</var></sup> ( <var>y</var><sub><var>i</var></sub> − <var>f̂</var>(<b>x</b><sub><var>i</var></sub>; <b>θ</b>) )<sup>2</sup>') + SYM([['(x<sub>i</sub>, y<sub>i</sub>)', 'the i-th training example', '—'], ['arg min', '“the value of θ that minimizes”', '—'], ['n', 'number of examples', 'count']]),
      app: '<p>A machining engineer has 60 test cuts with cutting speed, feed, depth and measured surface roughness <span class="iv">R</span><sub>a</sub> (µm). Instead of deriving a full tribological model, they fit a regression model to predict <span class="iv">R</span><sub>a</sub> for new settings inside the tested range.</p>',
      predict: ['If all 60 test cuts used feeds between 0.05 and 0.20 mm/rev, should you trust the model at 0.40 mm/rev?', 'No. That is extrapolation: the model has never seen that region, and nothing in the learning process constrains its behaviour there (Module 6).'],
      mis: ['A model that fits its training data perfectly has “learned the physics”.', 'It has learned a function that matches those examples. It may still be wrong between or beyond them. Validation on new data (Module 5) is needed.'],
      tip: '<p>Always ask what the examples cover. The range of the training data is the model’s comfort zone.</p>',
      take: 'ML replaces hand-written rules with parameters fitted to examples by minimizing a loss.'
    }) + C({
      title: 'Supervised, unsupervised and reinforcement learning',
      intuition: '<p><b>Supervised learning</b>: every example has a known output (label/target); learn x → y. <b>Unsupervised learning</b>: only inputs; find structure such as clusters or low-dimensional patterns. <b>Reinforcement learning</b>: an agent takes actions, receives rewards and learns a policy by trial and error. Surrogate modelling is supervised regression.</p>',
      visual: V('learning-types', 'Three learning paradigms with engineering examples.', 'Three boxes. Supervised: inputs and outputs known, learn x to y, e.g. predict thermal resistance from geometry. Unsupervised: inputs only, find groups, e.g. cluster vibration signatures. Reinforcement: agent acts and receives reward, e.g. tune a controller in simulation.'),
      math: '<p>Supervised data: {(<b>x</b><sub>i</sub>, <span class="iv">y</span><sub>i</sub>)}<sub>i=1..n</sub>. Unsupervised data: {<b>x</b><sub>i</sub>} only. Reinforcement learning maximizes expected cumulative reward Σ<sub>k</sub> γ<sup>k</sup> <span class="iv">r</span><sub>k</sub> (γ ∈ (0,1] a discount factor) — introduced here only for recognition.</p>',
      app: '<p>Supervised: predict pump efficiency from impeller blade angles using CFD runs. Unsupervised: group 5 000 bearing-vibration spectra into “normal” and unusual families without labels. Reinforcement: learn a valve-control policy in a process simulator.</p>',
      predict: ['You have 200 FEA runs of a bracket, each with plate thickness, fillet radius and maximum von Mises stress. Which paradigm?', 'Supervised learning (regression): inputs and the numerical output are known for every run.'],
      mis: ['Unsupervised learning is supervised learning with less effort.', 'They answer different questions. Without targets, unsupervised methods cannot predict a specific output such as stress.'],
      tip: '<p>Identify the paradigm by asking: “for each example, do I know the answer I want the model to produce?”</p>',
      take: 'Surrogates are supervised learning: examples come with simulator outputs.'
    }) },
    { id: 'm01l3', title: 'Regression vs classification; features, targets, samples, parameters', mins: 9, html: C({
      title: 'The vocabulary of a dataset',
      intuition: '<p>Picture a table. Each <b>row</b> is a <b>sample</b> (one simulation run, one test). The input columns are <b>features</b> (also called inputs, predictors or, in design, <b>design variables</b>). The column we want to predict is the <b>target</b> (output, response). Fitting adjusts the model’s <b>parameters</b>. Applying the fitted model to new inputs gives <b>predictions</b>.</p>',
      visual: V('dataset-table', 'A small heat-sink dataset: features s and t, target R; each row is one run of the model.', 'A table with columns run, s (mm), t (mm), R (K/W). The s and t columns are highlighted as features, the R column as target, and one row is outlined as a single sample. Beside it: model ŷ = f(x; θ), θ are parameters learned in fitting, ŷ is the prediction for new x.'),
      math: '<p>We store features in a matrix <b>X</b> of shape <span class="iv">n</span> × <span class="iv">d</span> (samples × features) and targets in a vector <b>y</b> of length <span class="iv">n</span>.</p>' + EQ('<b>X</b> = [ <b>x</b><sub>1</sub><sup>T</sup> ; … ; <b>x</b><sub><var>n</var></sub><sup>T</sup> ] ∈ ℝ<sup><var>n</var>×<var>d</var></sup>, &nbsp; <b>y</b> ∈ ℝ<sup><var>n</var></sup>') + '<p>For the heat sink, <span class="iv">d</span> = 2 (s, t) and <span class="iv">y</span> = <span class="iv">R</span> in K/W.</p>',
      app: '<p>In a structural study the features might be plate thickness (mm) and rib height (mm); the target the tip deflection (mm). Parameters are internal to the model (e.g., regression coefficients) — they are <i>not</i> design variables.</p>',
      predict: ['In the heat-sink table, is the fin thickness t a parameter or a feature?', 'A feature (and design variable). Parameters are the numbers inside the fitted model, such as polynomial coefficients.'],
      mis: ['“Parameters” and “design variables” are interchangeable.', 'In this course, design variables are inputs you choose; parameters are fitted model coefficients. (Some texts use “design parameters” for inputs — always check the context.)'],
      tip: '<p>Put units in column names (<code>s_mm</code>, <code>R_KperW</code>). It prevents the most common engineering ML bug: mixed units.</p>',
      take: 'Rows = samples; input columns = features/design variables; output column = target; fitted coefficients = parameters.'
    }) + C({
      title: 'Regression versus classification',
      intuition: '<p><b>Regression</b> predicts a continuous number (thermal resistance, stress, efficiency). <b>Classification</b> predicts a category (feasible/infeasible, defect/no defect, failure mode). Surrogates of simulator outputs are almost always regression; feasibility can be treated either way.</p>',
      visual: V('reg-vs-class', 'Left: regression predicts R as a number. Right: classification labels designs as feasible or infeasible.', 'Left plot: a smooth curve of thermal resistance versus fin gap with sample points. Right plot: scattered designs in the s–t plane marked as feasible (circles) or infeasible (crosses).'),
      math: '<p>Regression: <span class="iv">ŷ</span> ∈ ℝ, often trained with squared-error loss. Classification: <span class="iv">ŷ</span> ∈ {class 1, …, class K}, often trained to output class probabilities.</p>',
      app: '<p>Heat sink: predicting <span class="iv">R</span> is regression. Predicting whether a design meets the mass limit is classification — but since mass is a simple formula we compute it exactly instead. Machining: predicting <span class="iv">R</span><sub>a</sub> (µm) is regression; predicting chatter / no chatter is classification.</p>',
      predict: ['Predicting the number of cycles to fatigue failure of a welded joint — regression or classification?', 'Regression (a positive number, often modelled on a log scale). Predicting “survives 10⁶ cycles: yes/no” would be classification.'],
      mis: ['If outputs are integers, it must be classification.', 'Counts like cycles to failure are numbers with order and magnitude; regression is appropriate.'],
      tip: '<p>If a constraint can be predicted as a continuous margin (e.g., stress − allowable), regress the margin rather than a yes/no label: you keep information about how close to the limit you are.</p>',
      take: 'Number → regression; category → classification. Surrogate optimization is mainly regression.'
    }) },
    { id: 'm01l4', title: 'When ML is useful — and when it is unnecessary', mins: 7, html: C({

const PY_EX3 = `def heat_sink(s_mm, t_mm):
    """Pedagogical plate-fin heat-sink model. Inputs in mm.
    Returns thermal resistance R (K/W), mass (kg) and air temperature rise (K)."""
    W, L, H, tb = 0.050, 0.050, 0.040, 0.004          # m
    ks, rho_al = 150.0, 2700.0                         # W/(m K), kg/m^3
    rho, mu, cp, ka = 1.16, 1.85e-5, 1007.0, 0.026     # air properties
    dp, Q, Nu = 5.0, 30.0, 7.54                        # Pa, W, -
    s, t = s_mm * 1e-3, t_mm * 1e-3                    # mm -> m  (check units!)
    N = W / (s + t)
    u = dp * s**2 / (12 * mu * L)
    mdot = rho * u * s * H * N
    h = Nu * ka / (2 * s)
    m = np.sqrt(2 * h / (ks * t))
    eta = np.tanh(m * H) / (m * H)
    UA = h * N * L * (2 * H * eta + s)
    NTU = UA / (mdot * cp)
    R = 1 / (mdot * cp * (1 - np.exp(-NTU))) + tb / (ks * W * L)
    mass = rho_al * (N * t * H * L + W * L * tb)
    dT_air = Q / (mdot * cp)
    return {"R": R, "mass": mass, "dT_air": dT_air}

print(heat_sink(2.0, 0.8))`;

  quiz: [
    [MC('q1a', 'Execution order', 'Cell A sets <code>s_mm = 1.5</code>; cell B computes <code>N = 50/(s_mm + 0.5)</code>. You run A, then B, then edit A to <code>s_mm = 2.0</code> and run only A. What is N?', ['25.0 (computed with s_mm = 1.5)', '20.0 (computed with s_mm = 2.0)', 'An error, because B is out of date', 'Undefined'], 0, 'N keeps the value from when B last ran: 50/(1.5 + 0.5) = 25.', ['Correct.', 'B has not been re-run.', 'Notebooks do not detect stale cells.', 'N was defined when B ran.']),
     MC('q1b', 'Execution order', 'What is the most reliable way to check that a notebook’s results do not depend on hidden state?', ['Restart the kernel and run all cells from the top', 'Run the last cell twice', 'Save the notebook', 'Check that execution counters are increasing'], 0, 'A clean restart and full run removes hidden state.', ['Correct.', 'Does not remove earlier state.', 'Saving does not re-execute anything.', 'Counters can increase even with out-of-order edits.'])],
    [MC('q2a', 'Array shapes', 'You have 40 designs, each with fin gap and fin thickness. What should <code>X.shape</code> be for scikit-learn?', ['(40, 2)', '(2, 40)', '(40,)', '(80,)'], 0, 'Rows are samples, columns are features.', ['Correct.', 'Transposed.', 'This would be a single feature or the target.', 'Flattened data lose the sample/feature structure.']),
     MC('q2b', 'Array shapes', 'A single feature is stored in <code>s</code> with shape (25,). What should you pass to <code>model.fit</code> as X?', ['<code>s.reshape(-1, 1)</code>, shape (25, 1)', '<code>s</code> unchanged', '<code>s.T</code>', '<code>s.reshape(1, -1)</code>, shape (1, 25)'], 0, 'Features must be 2-D with samples as rows.', ['Correct.', 'scikit-learn raises an error for 1-D X.', 'Transposing a 1-D array does nothing.', 'That is one sample with 25 features.'])],
    [MC('q3a', 'Libraries', 'Which library provides Latin hypercube and Sobol samplers in <code>stats.qmc</code>?', ['SciPy', 'pandas', 'matplotlib', 'scikit-learn'], 0, 'scipy.stats.qmc provides quasi-Monte Carlo samplers.', ['Correct.', 'pandas handles tables.', 'matplotlib plots.', 'scikit-learn provides models and validation tools.']),
     MC('q3b', 'Libraries', 'Which library would you use to read a CSV file of test results into a table with named columns?', ['pandas', 'matplotlib', 'SciPy', 'NumPy random'], 0, 'pandas.read_csv returns a DataFrame.', ['Correct.', 'Plotting only.', 'SciPy is for scientific algorithms.', 'Random number generation only.'])],
    [MC('q4a', 'Seeds', 'Two students run the same notebook with <code>default_rng(7)</code> on the same package versions. What do they get?', ['Identical random samples and results', 'Different samples, because randomness cannot be controlled', 'Identical samples only on the same computer', 'Different results unless they also set a CPU seed'], 0, 'The same seed and generator produce the same sequence.', ['Correct.', 'Pseudo-random generators are deterministic given the seed.', 'Seeded generators are platform-independent for the same library version.', 'No additional seed is needed for NumPy’s generator.']),
     MC('q4b', 'Seeds', 'You obtain an excellent surrogate with seed 3 but poor ones with seeds 1, 2, 4 and 5. What should you report?', ['Results for all seeds (e.g., median and range), noting the variability', 'Only seed 3, because it is reproducible', 'Only the average, without mentioning variability', 'Nothing until you find more lucky seeds'], 0, 'Reproducible is not representative; report the spread.', ['Correct.', 'Selective reporting misleads.', 'Variability is important information.', 'Seed hunting is a form of bias.'])],
    [MC('q5a', 'Errors', 'You get <code>NameError: name \'t_mm\' is not defined</code>. The most likely cause is…', ['the cell defining t_mm has not been run (or the name is misspelled)', 'NumPy is not installed', 'the array has the wrong shape', 'the kernel has too little memory'], 0, 'NameError means Python does not know the name.', ['Correct.', 'That would be ModuleNotFoundError.', 'Shape problems usually give ValueError.', 'Memory problems give MemoryError or a kernel crash.']),
     MC('q5b', 'Errors', 'Which error type typically signals mismatched array shapes in model fitting?', ['ValueError', 'NameError', 'ModuleNotFoundError', 'SyntaxError'], 0, 'scikit-learn raises ValueError for inconsistent shapes.', ['Correct.', 'Unknown name.', 'Missing package.', 'Malformed code.'])],

     GEN('q6h', 'Unit checks', rng => { const s = [1.0, 1.5, 2.0][rng.int(3)]; const u = 5 * (s * 1e-3) ** 2 / (12 * 1.85e-5 * 0.05); return { stem: `The channel velocity is u = Δp·s²/(12·μ·L) with Δp = 5 Pa, μ = 1.85×10⁻⁵ Pa·s, L = 0.050 m. Compute u for s = ${s} mm (convert to metres first).`, answer: u, tolRel: 0.02, unit: 'm/s', explain: `s = ${s}×10⁻³ m → u = 5 × (${s}e-3)² / (12 × 1.85e-5 × 0.05) = ${u.toFixed(3)} m/s. Leaving s in mm would give a value 10⁶ times larger.` }; })],
    [MC('q7a', 'Silent errors', 'A notebook predicts a heat-sink resistance of 0.0006 K/W without any error message. What is the best next step?', ['Check units and input ranges; compare with a known reference value', 'Report it as a breakthrough design', 'Increase the polynomial degree', 'Change the random seed'], 0, 'Implausible values usually indicate unit or data errors.', ['Correct.', 'Extraordinary claims need checking.', 'Model complexity is unrelated to a unit error.', 'Seeds do not fix unit errors.']),
     MC('q7b', 'Silent errors', 'Which check would most quickly reveal that fin gaps were entered in metres instead of millimetres?', ['Print the min and max of each input column and compare with the stated bounds', 'Plot a histogram of the residuals', 'Compute R² on training data', 'Restart the kernel'], 0, 'Range checks against known bounds expose unit errors.', ['Correct.', 'Residuals might look fine for consistently wrong units.', 'R² can still be high.', 'Restarting does not change the data.'])]
