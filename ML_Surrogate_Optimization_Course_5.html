/* ---------------- Module 3 ---------------- */
COURSE.modules.push({
  id: 'm03', num: 3, title: 'Mathematics and data intuition', short: 'Functions, vectors, matrices and gradients; mean, variance, noise and outliers; correlation vs causation; scaling; sensitivity.', mins: 55,
  prereq: ['Elementary calculus (derivatives)', 'Module 1'], prereqModules: ['m01'],
  objectives: ['Interpret a design response as a function of a vector of design variables.', 'Compute and interpret a gradient and a local sensitivity with units.', 'Compute mean, variance and standard deviation; recognize noise and outliers.', 'Explain why correlation does not establish causation.', 'Apply min–max and standard scaling and explain why they matter.'],
  intro: '<p>This module gives just enough mathematics to understand surrogate models: functions of several variables, gradients, a little statistics, and scaling. Every symbol is defined and every example has units.</p>',
  labs: ['lab01'],
  lessons: [
    { id: 'm03l1', title: 'Functions, vectors, matrices and gradients', mins: 10, html: C({
      title: 'A design response is a function of a vector',
      intuition: '<p>The heat sink’s thermal resistance depends on two numbers: <span class="iv">R</span> = <span class="iv">f</span>(<span class="iv">s</span>, <span class="iv">t</span>). Collect them into a <b>vector</b> <b>x</b> = (<span class="iv">s</span>, <span class="iv">t</span>). The set of all allowed <b>x</b> is the <b>design space</b>. A colour map of <span class="iv">R</span> over the design space is the <b>response surface</b>. The <b>gradient</b> ∇<span class="iv">R</span> points uphill; −∇<span class="iv">R</span> points in the direction of fastest decrease.</p>',
      visual: V('gradient-field', 'Thermal resistance over the design space, with arrows showing the direction of steepest decrease (−∇R in scaled variables).', 'Colour map of R over fin gap and fin thickness, with white arrows. At small gaps arrows point strongly toward larger gaps; near the valley around s ≈ 1.9 mm arrows are short or point toward thinner fins.'),
      math: EQ('∇<var>R</var>(<b>x</b>) = ( ' + FR('∂<var>R</var>', '∂<var>s</var>') + ', ' + FR('∂<var>R</var>', '∂<var>t</var>') + ' )') + SYM([['x', 'design vector (s, t)', 'mm'], ['∂R/∂s', 'change of R per unit change of s with t fixed', 'K/(W·mm)'], ['∇R', 'gradient vector', 'K/(W·mm)']]) + '<p>A <b>matrix</b> is a 2-D array of numbers; the dataset <b>X</b> (n × d) is one. A linear model computes <b>ŷ</b> = <b>X</b><b>β</b> — a matrix–vector product: each prediction is a weighted sum of the features. Derivatives can be approximated numerically: ∂<span class="iv">R</span>/∂<span class="iv">s</span> ≈ [<span class="iv">R</span>(<span class="iv">s</span>+<span class="iv">h</span>, <span class="iv">t</span>) − <span class="iv">R</span>(<span class="iv">s</span>−<span class="iv">h</span>, <span class="iv">t</span>)]/(2<span class="iv">h</span>).</p>',
      app: '<p>At <span class="iv">s</span> = 1.0 mm, <span class="iv">t</span> = 0.6 mm the model gives ∂<span class="iv">R</span>/∂<span class="iv">s</span> ≈ ' + U.fmt((HS.R(1.0001, 0.6) - HS.R(0.9999, 0.6)) / 0.0002, 3) + ' K/(W·mm): widening the gap by 0.1 mm lowers <span class="iv">R</span> by about ' + U.fmt(-0.1 * (HS.R(1.0001, 0.6) - HS.R(0.9999, 0.6)) / 0.0002, 2) + ' K/W. Gradient-based optimizers (Module 10) follow such derivatives.</p>',
      predict: ['Near the bottom of the valley in R, what is the magnitude of the gradient?', 'Close to zero: at an interior minimum the slope in every direction vanishes (∇R = 0). Constrained optima are an exception — the gradient need not vanish there (Module 10).'],
      mis: ['The gradient points toward the minimum.', 'It points uphill, in the direction of steepest <i>increase</i>. Its negative points downhill — and only locally; the true minimum may lie elsewhere.'],
      tip: '<p>Compare sensitivities only after scaling or normalizing (next lessons); ∂R/∂s and ∂R/∂t share units here, but in general variables have different units and ranges.</p>',
      take: 'R = f(x) over a design space; the gradient gives local slopes, with units of output per unit input.'
    }) },
    { id: 'm03l2', title: 'Mean, variance, measurement noise and outliers', mins: 9, html: C({
      title: 'Summarizing repeated measurements',
      intuition: '<p>Real tests scatter: repeating a wind-tunnel measurement of <span class="iv">R</span> gives slightly different numbers each time because of sensor noise, ambient changes and setup. The <b>mean</b> summarizes the centre; the <b>variance</b> and <b>standard deviation</b> summarize the spread. An <b>outlier</b> is a point far from the rest — maybe a real effect, maybe a mistake. Our pedagogical model is deterministic: it has no noise. Noise is added only in clearly labelled exercises.</p>',
      visual: V('noise-demo', 'Interactive: synthetic noisy repeat measurements around a model value; adjust noise and add an outlier.', 'Twelve scattered points around a horizontal dashed line (model value). A blue line shows their mean and a band shows mean ± one standard deviation. Adding an outlier shifts the mean and widens the band, while the median barely changes.'),
      math: EQ('<var>ȳ</var> = ' + FR('1', '<var>n</var>') + ' Σ <var>y</var><sub><var>i</var></sub>, &nbsp; <var>s</var><sup>2</sup> = ' + FR('1', '<var>n</var> − 1') + ' Σ (<var>y</var><sub><var>i</var></sub> − <var>ȳ</var>)<sup>2</sup>, &nbsp; SE = ' + FR('<var>s</var>', '√<var>n</var>')) + SYM([['ȳ', 'sample mean', 'same as y (K/W)'], ['s²', 'sample variance', '(K/W)²'], ['s', 'sample standard deviation', 'K/W'], ['SE', 'standard error of the mean', 'K/W']]) + '<p>A simple noise model: <span class="iv">y</span><sub>i</sub> = <span class="iv">f</span>(<b>x</b>) + ε<sub>i</sub>, with ε<sub>i</sub> ~ N(0, σ²) — independent Gaussian errors of standard deviation σ.</p>',
      app: '<p>Additive-manufacturing coupons printed with identical settings show porosity scatter of several tenths of a percent. A surrogate should not chase that scatter (overfitting); it should capture the trend. Machining: three repeat cuts per setting give a direct estimate of σ for roughness.</p>',
      predict: ['Five measurements: 0.70, 0.72, 0.71, 0.69, 0.98 K/W. Will the mean or the median be more affected by 0.98?', 'The mean (0.760) is pulled up; the median (0.71) is barely affected. Investigate 0.98 before deleting it — it may be a real effect or a recording error.'],
      mis: ['Outliers should always be deleted.', 'Remove a point only with a documented physical reason (e.g., sensor fault). Otherwise report it, and consider robust metrics or models.'],
      tip: '<p>If you can, repeat a few design points. Repeats estimate noise directly and tell you the best accuracy any surrogate can honestly achieve.</p>',
      take: 'Mean = centre, standard deviation = spread (same units as data). Deterministic simulators have no measurement noise.'
    }) },
    { id: 'm03l3', title: 'Correlation versus causation', mins: 7, html: C({
      title: 'Variables can move together without one causing the other',
      intuition: '<p><b>Correlation</b> measures how strongly two variables move together in data. <b>Causation</b> means changing one would change the other. A hidden common cause (a <b>confounder</b>) can produce correlation without causation.</p>',
      visual: V('confounder', 'Cutting speed raises both coolant temperature and roughness; the two are correlated in data although neither causes the other.', 'Left: a causal diagram with cutting speed pointing to coolant temperature and to surface roughness. Right: a scatter plot of roughness versus coolant temperature showing positive correlation, with the Pearson coefficient printed.'),
      math: EQ('<var>r</var> = ' + FR('Σ(<var>x</var><sub><var>i</var></sub> − <var>x̄</var>)(<var>y</var><sub><var>i</var></sub> − <var>ȳ</var>)', '√[Σ(<var>x</var><sub><var>i</var></sub> − <var>x̄</var>)<sup>2</sup> Σ(<var>y</var><sub><var>i</var></sub> − <var>ȳ</var>)<sup>2</sup>]')) + '<p>The Pearson coefficient <span class="iv">r</span> ∈ [−1, 1] is dimensionless and measures only <i>linear</i> association.</p>',
      app: '<p>In historical shop-floor data, high coolant temperature correlates with poor roughness. Cooling the coolant would not fix roughness if cutting speed drives both. In simulation-based surrogates, inputs are set by the designer and independently varied, so correlation in a well-designed sample does reflect the simulator’s cause–effect structure — one advantage of designed experiments (Module 7) over observational data.</p>',
      predict: ['A dataset shows r = 0.0 between fin gap and R across the full range. Does that mean fin gap does not affect R?', 'No. R first falls and then rises with s (a U-shape); a strong nonlinear dependence can have near-zero linear correlation.'],
      mis: ['High correlation proves that one variable controls the other.', 'Correlation can come from confounders, coincidence or reverse causation. Controlled variation (experiments) is needed to establish cause.'],
      tip: '<p>Prefer designed experiments, where you set inputs independently, over mining historical data, whenever the goal is design decisions.</p>',
      take: 'Correlation ≠ causation; designed sampling lets data reflect causal effects of the inputs.'
    }) },
    { id: 'm03l4', title: 'Scaling, normalization and sensitivity', mins: 10, html: C({
      title: 'Why scale variables?',
      intuition: '<p>Many methods use distances between designs (nearest neighbours, RBFs, Gaussian processes) or penalize coefficient sizes. If one variable is measured in millimetres (range 2.2) and another in kilograms (range 0.1), the larger-range variable dominates the distance purely because of units. <b>Scaling</b> puts variables on comparable ranges.</p>',
      visual: V('scaling-demo', 'Interactive: the nearest neighbour of a query design changes after both variables are scaled to [0, 1].', 'Scatter of six designs in fin gap (mm) versus mass (kg) with a query point. In raw units the nearest neighbour is chosen almost entirely by fin gap. After min–max scaling, a different neighbour is closest because both variables count.'),
      math: EQ('min–max: &nbsp; <var>z</var> = ' + FR('<var>x</var> − <var>x</var><sub>min</sub>', '<var>x</var><sub>max</sub> − <var>x</var><sub>min</sub>') + ' ∈ [0, 1], &nbsp;&nbsp; standardization: &nbsp; <var>z</var> = ' + FR('<var>x</var> − <var>μ</var>', '<var>σ</var>')) + SYM([['x<sub>min</sub>, x<sub>max</sub>', 'design-variable bounds (preferred for design spaces)', 'units of x'], ['μ, σ', 'mean and standard deviation of the TRAINING data', 'units of x'], ['z', 'scaled variable', 'dimensionless']]) + '<p>For bounded design spaces, scaling by the bounds is natural and does not depend on data. For data-based scaling, compute μ, σ from training data only (Module 5: leakage).</p>',
      app: '<p>The heat sink in scaled units: <span class="iv">z</span><sub>s</sub> = (<span class="iv">s</span> − 0.8)/2.2, <span class="iv">z</span><sub>t</sub> = (<span class="iv">t</span> − 0.2)/1.3. All surrogates in this course are fitted in these scaled units.</p>',
      predict: ['Does scaling change which design has the lowest R?', 'No. Scaling is a change of coordinates; the physical optimum is the same. It changes how methods that use distances or step sizes behave.'],
      mis: ['Scaling is cosmetic and never changes results.', 'It changes distance-based models (GP, RBF, k-NN), regularized regression and optimizer step sizes — often dramatically.'],
      tip: '<p>Keep the scaling in your model pipeline and record it; reverse it when reporting designs in physical units.</p>',
      take: 'Scale inputs (by bounds or training statistics) before distance-based modelling; report results in physical units.'
    }) + C({
      title: 'Sensitivity of an engineering response',
      intuition: '<p><b>Local sensitivity</b> asks: if I nudge one variable, how much does the response change? Raw derivatives depend on units; <b>elasticities</b> (percentage change per percentage change) or <b>range-scaled</b> derivatives allow fair comparison.</p>',
      visual: V('sensitivity', 'Interactive: elasticities and range-scaled sensitivities of R to s and t at a chosen design.', 'Bar chart with four bars: elasticity with respect to s and t, and range-scaled sensitivities. Sliders choose s and t. At small gaps, R is very sensitive to s; near the valley, sensitivity to s is small.'),
      math: EQ('elasticity &nbsp; <var>E</var><sub><var>x</var></sub> = ' + FR('∂<var>R</var>', '∂<var>x</var>') + ' · ' + FR('<var>x</var>', '<var>R</var>') + ', &nbsp;&nbsp; range-scaled &nbsp; <var>S</var><sub><var>x</var></sub> = ' + FR('∂<var>R</var>', '∂<var>x</var>') + ' · (<var>x</var><sub>max</sub> − <var>x</var><sub>min</sub>)') + '<p><span class="iv">E</span><sub>x</sub> is dimensionless; <span class="iv">S</span><sub>x</sub> has the units of <span class="iv">R</span> (K/W).</p>',
      app: '<p>Structural design: tip deflection of a cantilever, δ = <span class="iv">F L</span>³/(3<span class="iv">EI</span>), has elasticity 3 with respect to length and −1 with respect to modulus: a 1% longer beam deflects about 3% more. Such insight tells you which tolerances matter.</p>',
      predict: ['For δ = F L³/(3 E I), what is the elasticity of δ with respect to F?', 'Exactly 1: deflection is proportional to load, so a 1% load increase gives 1% more deflection.'],
      mis: ['A large derivative always means an important variable.', 'Importance depends on how much the variable can actually vary (its range or tolerance). Multiply by the range, or use elasticities.'],
      tip: '<p>Sensitivities are local: they change across the design space. Evaluate them at several points or use global methods (beyond this course).</p>',
      take: 'Use elasticities or range-scaled derivatives to compare sensitivities across variables with different units and ranges.'
    }) }
  ],
  flashcards: [
    FC('What does the gradient ∇R represent and what are its units for the heat sink?', 'The vector of partial derivatives (∂R/∂s, ∂R/∂t), pointing in the direction of steepest increase; units K/(W·mm).', 'Gradient-based optimizers step along −∇R.'),
    FC('What is ∇R at an interior unconstrained minimum?', 'Zero (all partial derivatives vanish).', 'At a constrained optimum the gradient generally is not zero.'),
    FC('Give the central-difference approximation of ∂R/∂s.', '[R(s+h, t) − R(s−h, t)] / (2h) for a small step h.', 'Used to check analytical derivatives.'),
    FC('Why divide by n − 1 in the sample variance?', 'It corrects the bias from estimating the mean from the same data.', 'Matters for small numbers of repeat tests.'),
    FC('What is the standard error of a mean, and how does it scale with n?', 's/√n — quadrupling the repeats halves it.', 'Planning repeat tests in a lab.'),
    FC('Does the pedagogical heat-sink model contain measurement noise?', 'No — it is deterministic; noise appears only in labelled exercises.', 'CFD is also (nearly) deterministic; experiments are noisy.'),
    FC('Why can r ≈ 0 coexist with a strong dependence?', 'Pearson r measures only linear association; a U-shaped relation can have r ≈ 0.', 'R vs fin gap across the full range.'),
    FC('Define a confounder.', 'A hidden variable that influences both of two correlated variables, creating correlation without direct causation.', 'Cutting speed affecting both coolant temperature and roughness.'),
    FC('Write min–max scaling to [0, 1].', 'z = (x − x_min)/(x_max − x_min).', 'Heat sink: z_s = (s − 0.8)/2.2.'),
    FC('Which models are most affected by unscaled inputs?', 'Distance- or penalty-based ones: GP, RBF, k-NN, regularized regression; also optimizer step sizes.', 'A GP length scale is meaningful only in scaled units.'),
    FC('Define elasticity and give its units.', 'E = (∂R/∂x)(x/R): percent change in R per percent change in x; dimensionless.', 'Cantilever deflection has elasticity 3 w.r.t. length.')
  ],
  quiz: [
    [MC('q1a', 'Gradients', 'At a design point, ∂R/∂s = −0.40 K/(W·mm) and ∂R/∂t = +0.10 K/(W·mm). To reduce R fastest (locally), you should…', ['increase s and decrease t', 'decrease s and increase t', 'increase both', 'decrease both'], 0, 'Move along −∇R = (+0.40, −0.10): increase s, decrease t.', ['Correct.', 'That is the steepest-increase direction.', 'Increasing t increases R here.', 'Decreasing s increases R here.']),

function lsq1(xs, ys) { const n = xs.length, mx = ST.mean(xs), my = ST.mean(ys); const b1 = xs.reduce((s, x, i) => s + (x - mx) * (ys[i] - my), 0) / xs.reduce((s, x) => s + (x - mx) ** 2, 0); return [my - b1 * mx, b1]; }

  id: 'm04', num: 4, title: 'Your first regression model', short: 'Linear regression and least squares; residuals and loss; MAE, RMSE, R²; coefficients with units; baselines.', mins: 45,

    { id: 'm04l1', title: 'Linear regression, residuals and least squares', mins: 10, html: C({
      title: 'Fitting a line by minimizing squared residuals',
      intuition: '<p>On a test bench, a heater dissipates power <span class="iv">P</span> into a heat sink and we measure the temperature rise Δ<span class="iv">T</span>. Physics suggests Δ<span class="iv">T</span> ≈ <span class="iv">R P</span>. Measurements scatter. Linear regression finds the line that best follows the points. Each vertical gap between a point and the line is a <b>residual</b>. <b>Least squares</b> chooses the line that makes the sum of squared residuals as small as possible.</p>',
      visual: V('residuals', 'Interactive: adjust intercept and slope; residuals (dashed red) and error metrics update; snap to the least-squares solution.', 'Scatter of temperature rise versus heater power with a fitted line and vertical dashed residual segments. Sliders set intercept and slope; the readout shows SSE, MAE, RMSE, R² and the least-squares coefficients.'),

    [MC('q6a', 'Baselines', 'Why compare a regression model against a constant baseline?', ['To check that the model adds predictive value beyond predicting the mean', 'Because the baseline is usually more accurate', 'To compute the training error', 'Because scikit-learn requires it'], 0, 'A model that cannot beat the mean is not useful.', ['Correct.', 'Usually not — but it must be checked.', 'Baselines are compared on test data.', 'It is good practice, not a software requirement.']),
     MC('q6b', 'Baselines', 'A neural network predicts test ΔT with RMSE 1.10 K; a physics estimate ΔT = 0.65 P has RMSE 1.15 K. Which conclusion is most reasonable?', ['The physics estimate is nearly as good and simpler; the network adds little', 'The network is clearly superior', 'The physics estimate is wrong because it has no intercept', 'Neither can be compared because they are different model types'], 0, 'A 0.05 K improvement rarely justifies a black-box model.', ['Correct.', 'The improvement is marginal.', 'Small bias may be acceptable; it is still nearly as accurate.', 'Same test data and metric make them comparable.'])],
    [MC('q7a', 'Plot interpretation', 'In a parity plot (predicted vs measured), the constant-baseline points form a horizontal band. Why?', ['It predicts the same value for every input', 'It has the largest residuals at low ΔT only', 'It is overfitted', 'It extrapolates'], 0, 'A constant predictor gives identical predictions regardless of the measured value.', ['Correct.', 'Its errors are large at both ends.', 'It has one parameter; it cannot overfit.', 'Not related.']),
     MC('q7b', 'Plot interpretation', 'Residuals plotted against P show a clear U-shape. What does this suggest?', ['The straight-line model misses curvature; a nonlinear term may be needed', 'The model is perfect', 'The data contain only random noise', 'The intercept should be removed'], 0, 'Systematic residual patterns indicate model inadequacy.', ['Correct.', 'Patterned residuals are not random.', 'Noise would show no pattern.', 'Removing the intercept does not add curvature.'])]
  ]
});

/* ---------------- Module 5 ---------------- */
COURSE.modules.push({
  id: 'm05', num: 5, title: 'Generalization and trustworthy validation', short: 'Train/validation/test sets; under- and overfitting; bias–variance; cross-validation; learning curves; leakage; group splits; accuracy near the optimum.', mins: 60,
  prereq: ['Module 4'], prereqModules: ['m04'],
  objectives: ['Use separate training, validation and test data correctly.', 'Diagnose underfitting and overfitting and explain the bias–variance trade-off.', 'Apply k-fold cross-validation and read learning curves.', 'Prevent data leakage with pipelines and group-aware splits.', 'Explain why average accuracy can be insufficient near an optimum.'],
  intro: '<p>A model is only useful if it predicts well on <b>new</b> inputs. This module is about measuring that honestly.</p>',
  labs: ['lab03'],
  lessons: [
    { id: 'm05l1', title: 'Training, validation and test sets', mins: 9, html: C({
      title: 'Never grade a model on its own homework',
      intuition: '<p>A model can memorize training data. To estimate performance on new data, hold some data back. The <b>training set</b> fits parameters; the <b>validation set</b> chooses between models or settings (e.g., polynomial degree); the <b>test set</b> is used once, at the end, for an unbiased estimate.</p>',
      visual: V('split-diagram', 'Roles of training, validation and test data.', 'A bar divided into a large training portion, a smaller validation portion, and a test portion used once at the end, with explanations of each role.'),
      math: '<p>Generalization error is the expected loss on new data from the same distribution:</p>' + EQ('<var>E</var><sub>gen</sub> = 𝔼<sub>(<b>x</b>, <var>y</var>)</sub> [ (<var>y</var> − <var>f̂</var>(<b>x</b>))<sup>2</sup> ] ≈ ' + FR('1', '<var>n</var><sub>test</sub>') + ' Σ<sub>test</sub> (<var>y</var><sub><var>i</var></sub> − <var>f̂</var>(<b>x</b><sub><var>i</var></sub>))<sup>2</sup>') + '<p>The approximation is unbiased only if the test data played no part in fitting or choosing the model.</p>',
      app: '<p>With a simulator, you can generate an independent validation set cheaply in teaching (our model is fast). In real CFD studies validation runs cost as much as training runs — which motivates cross-validation (Lesson 3).</p>',
      predict: ['You try 12 polynomial degrees and pick the one with the lowest <i>test</i> error. Is that test error an unbiased estimate?', 'No. You used the test set for selection, so it is now part of model building; the reported error is optimistic. Select with validation data; test once.'],
      mis: ['Low training error means the model will predict well.', 'Training error measures fit to seen data. Only data not used in fitting or selection estimate generalization.'],
      tip: '<p>Decide the split before looking at results, record the seed, and keep the test set untouched until the final report.</p>',
      take: 'Train to fit, validate to choose, test once to report.'
    }) },
    { id: 'm05l2', title: 'Underfitting, overfitting and the bias–variance trade-off', mins: 12, html: C({
      title: 'Too simple, about right, too flexible',
      intuition: '<p>An <b>underfitted</b> model is too simple to follow the true trend (high error everywhere). An <b>overfitted</b> model is so flexible that it follows noise or wiggles between samples (low training error, high validation error). The goal is the flexibility that minimizes validation error.</p>',
      visual: V('fit-trio', 'The same nine noisy samples fitted with degree 1 (underfit), 3 (suitable) and 8 (overfit) polynomials.', 'Three panels. Degree 1: a straight line missing the U-shaped trend. Degree 3: a smooth curve close to the true response. Degree 8: a wiggly curve passing near every point but oscillating between them.') + V('polyfit-demo', 'Interactive: change polynomial degree, number of samples and noise; compare training and validation RMSE.', 'Plot of the true response R(s) at t = 0.6 mm, training samples, validation samples and a polynomial fit. Sliders control degree (1–12), sample size (4–40) and synthetic noise; the readout shows training and validation RMSE and a verdict.'),
      math: '<p>For a model trained on random data, the expected squared error at <b>x</b> decomposes as</p>' + EQ('𝔼[(<var>y</var> − <var>f̂</var>)<sup>2</sup>] = (bias)<sup>2</sup> + variance + σ<sup>2</sup><sub>noise</sub>') + SYM([['bias', 'systematic error: average prediction minus truth', 'units of y'], ['variance', 'how much predictions change with different training sets', '(units of y)²'], ['σ²<sub>noise</sub>', 'irreducible noise (zero for a deterministic simulator)', '(units of y)²']]) + '<p>More flexibility lowers bias but raises variance. A polynomial of degree <span class="iv">p</span> in one variable has <span class="iv">p</span> + 1 coefficients; if <span class="iv">p</span> + 1 ≥ <span class="iv">n</span>, it can pass through every point.</p>' + V('bias-variance', 'Fifteen fits to different random samples for three degrees: spread = variance, offset = bias.', 'Three panels with many faint blue curves: degree 1 curves agree with each other but miss the truth (bias); degree 3 curves cluster around the truth; degree 9 curves scatter widely (variance).'),
      app: '<p>For a deterministic simulator, σ²<sub>noise</sub> = 0 and an interpolating model (passing through all samples) is not automatically overfitting; the danger then is wild behaviour <i>between</i> samples. For noisy experiments (machining tests, AM coupons), interpolating the noise is overfitting.</p>',
      predict: ['With 6 noise-free samples, a degree-5 polynomial passes exactly through all of them. Is its training RMSE meaningful evidence of accuracy?', 'No — it is zero by construction (6 coefficients, 6 points). Only validation points between the samples reveal its real error, which may be large (oscillation).'],
      mis: ['Overfitting only happens with noisy data.', 'With noise-free data the risk becomes oscillation between samples. Validation is needed either way.'],
      tip: '<p>Increase model flexibility only while validation error keeps dropping; stop when it rises.</p>',
      take: 'Choose flexibility by validation error; bias falls and variance rises with complexity.'
    }) },
    { id: 'm05l3', title: 'Cross-validation and learning curves', mins: 10, html: C({
      title: 'Reusing scarce data for validation',
      intuition: '<p>When data are expensive, setting aside a large validation set hurts. <b>k-fold cross-validation</b> splits the data into k parts (folds); each fold takes a turn as validation while the rest train; the k scores are averaged. <b>Learning curves</b> plot validation error against training-set size to show whether more data would help.</p>',
      visual: V('kfold', '5-fold cross-validation: each fold is the validation set exactly once.', 'Five rows of five blocks; in each row a different block is highlighted orange as validation, the others blue for training. Each row yields a score; the CV score is their mean.') + V('learning-curve', 'Learning curves (computed live): validation error versus number of training samples for three polynomial degrees.', 'Three falling curves of log validation RMSE versus n. The degree-7 curve starts highest at small n and falls fastest; with enough data it beats degree 2, whose curve flattens at a higher error.'),
      math: EQ('CV<sub><var>k</var></sub> = ' + FR('1', '<var>k</var>') + ' Σ<sub><var>j</var>=1</sub><sup><var>k</var></sup> RMSE<sub><var>j</var></sub> &nbsp; (or mean of squared errors across folds)') + '<p><span class="iv">k</span> = <span class="iv">n</span> is leave-one-out CV. A model refit on each fold costs <span class="iv">k</span> fits — cheap for surrogates, since the expensive part (simulation) is already done.</p>',
      app: '<p>With 30 CFD runs of a heat-exchanger design, 5-fold CV lets every run serve for both training and validation, comparing polynomial and GP surrogates without spending runs on a separate validation set.</p>',
      predict: ['A learning curve for a GP has flattened at validation RMSE 0.002 K/W from n = 20 to n = 40. Will doubling the data again help much?', 'Probably little — the curve has plateaued. Improvement now needs a different model, different sampling (e.g., near the optimum), or better data, not just more of the same.'],
      mis: ['Cross-validation removes the need for a final test set.', 'CV is used for selection; if you select using CV, a separate untouched test set (or a careful nested CV) still gives the unbiased final estimate.'],
      tip: '<p>Use 5- or 10-fold CV for model selection with small data; shuffle with a recorded seed — unless data are grouped (next lesson).</p>',
      take: 'k-fold CV reuses data for validation; learning curves show whether more data would help.'
    }) },
    { id: 'm05l4', title: 'Data leakage, pipelines and group-aware splits', mins: 12, html: C({
      title: 'Leakage: when the test answer sneaks into training',
      intuition: '<p><b>Data leakage</b> means information from validation or test data influences training, making errors look smaller than they really are. Classic examples: scaling with statistics computed on all data before splitting; selecting features using all data; near-duplicate samples in both sets; using future measurements to predict the past.</p>',
      visual: V('leakage', 'Leaky preprocessing (left) versus a pipeline (right).', 'Left column in red: compute mean and standard deviation on all data, scale everything, then split — test score looks better than reality. Right column in green: split first, fit scaler on training data only, apply the same scaler to test data, then score.'),
      math: '<p>A <b>pipeline</b> bundles preprocessing and model so that, inside each CV fold, every fitted quantity (means, standard deviations, polynomial feature scalings) is computed from that fold’s training part only:</p><pre data-copy>from sklearn.pipeline import make_pipeline\nfrom sklearn.preprocessing import StandardScaler, PolynomialFeatures\nfrom sklearn.linear_model import LinearRegression\nfrom sklearn.model_selection import cross_val_score\nmodel = make_pipeline(StandardScaler(), PolynomialFeatures(3), LinearRegression())\nscores = cross_val_score(model, X, y, cv=5, scoring="neg_root_mean_squared_error")</pre>',
      app: '<p>Scaling by fixed design-variable <b>bounds</b> (known before any data) cannot leak; scaling by data statistics can. With small datasets (20–40 runs), leakage effects are larger than many students expect.</p>',
      predict: ['You standardize all 40 runs, then do 5-fold CV. Is this leakage?', 'Yes — mild but real: each fold’s validation data influenced the mean and standard deviation used in training. Put the scaler inside a pipeline.'],
      mis: ['Leakage only matters for big-data applications.', 'It matters most for small datasets, where each point strongly affects fitted statistics and scores.'],
      tip: '<p>Rule: anything “fitted” — scalers, feature selection, hyperparameter tuning — must be inside the cross-validation loop.</p>',
      take: 'Fit every preprocessing step on training data only; pipelines enforce this.'
    }) + C({
      title: 'Splitting related observations by group',
      intuition: '<p>Rows are often not independent: repeated tests on the same specimen, several time steps from one simulation run, measurements from one machine, or data ordered in time. Random row splitting puts near-identical rows in both training and test, so the model appears to generalize when it is really recognizing the group.</p>',
      visual: V('group-split', 'Random row split versus group split.', 'Left: coloured dots for four specimens, with test points (dark outline) scattered among all specimens. Right: one entire specimen held out as the test group.'),
      math: '<p>Group <span class="iv">k</span>-fold: partition the set of <b>groups</b> (not rows) into folds. In scikit-learn: <code>GroupKFold(n_splits=5)</code> with a <code>groups</code> array (specimen ID, run ID, machine ID). For time-ordered data, train on the past and test on the future (<code>TimeSeriesSplit</code>).</p>',
      app: '<p><b>Fatigue tests:</b> several strain-gauge readings per specimen → split by specimen. <b>Transient CFD:</b> 200 time steps per run → split by run. <b>Machining:</b> data from three lathes → hold out a whole lathe to check transfer to an unseen machine.</p>',
      predict: ['A random split of 1 000 rows from 10 specimens gives test RMSE 2 MPa; a split by specimen gives 9 MPa. Which reflects performance on a new specimen?', 'The group split (9 MPa). The random split was inflated by within-specimen similarity.'],
      mis: ['Random splitting is always the fair default.', 'It is fair only if rows are independent. Otherwise split by the unit you want to generalize to.'],
      tip: '<p>Ask: “What will be new when the model is used?” — a new design, specimen, machine, or time period — and split by that.</p>',
      take: 'Split by specimen/run/machine/time when rows are related; random row splits can be badly optimistic.'
    }) },
    { id: 'm05l5', title: 'Why good average accuracy may be insufficient near an optimum', mins: 8, html: C({
      title: 'Average accuracy vs accuracy where decisions are made',
      intuition: '<p>Validation metrics average over the whole design space. Optimization, however, cares about a small region — near the best designs — where differences between candidates may be tiny. A surrogate can have a fine global RMSE yet misplace the optimum or misjudge its value.</p>',
      visual: V('local-error', 'A cubic fit with acceptable global error places its minimum away from the true minimum on a 1-D slice.', 'Plot of true R versus fin gap at t = 0.35 mm, a cubic fit from six samples, the region near the optimum shaded green, the true minimum as a star and the fit’s minimum as a hollow circle. The readout compares global and local RMSE and the true R at the fitted minimum.'),
      math: '<p>Let <b>x</b>* minimize the true <span class="iv">f</span> and <b>x̂</b>* minimize the surrogate <span class="iv">f̂</span>. What matters is the verified gap</p>' + EQ('Δ = <var>f</var>(<b>x̂</b>*) − <var>f</var>(<b>x</b>*) ≥ 0') + '<p>which depends on surrogate error <i>near</i> the optima, not on its average error elsewhere.</p>',
      app: '<p>In the heat sink, <span class="iv">R</span> ranges from about 0.57 to over 4 K/W across the bounds, but feasible designs near the optimum differ by only a few thousandths of a K/W. An error of 0.01 K/W can reorder those candidates.</p>',
      predict: ['Surrogate A has global RMSE 0.02 K/W; surrogate B 0.04 K/W, but B is much more accurate within 0.2 mm of the optimum. Which is better for optimization?', 'Probably B. Optimization quality depends on accuracy where the optimizer will look. Always verify the candidate either way.'],
      mis: ['If validation RMSE is small, the surrogate optimum is close to the true optimum.', 'Not necessarily; local errors and flat objectives can mislead. Verification with the original model (Module 11) is required.'],
      tip: '<p>Report errors separately for the region of good designs (e.g., best 20% of validation points) as well as globally — and verify candidates.</p>',
      take: 'Good average accuracy ≠ good optimum; check local error and verify.'
    }) }
  ],
  flashcards: [
    FC('State the roles of training, validation and test sets.', 'Training fits parameters; validation chooses models/settings; test gives a one-time unbiased estimate.', 'Choosing a polynomial degree uses validation, not test.'),
    FC('Describe underfitting and overfitting in terms of training and validation error.', 'Underfit: both high. Overfit: training low, validation high.', 'Degree 1 vs degree 8 polynomial on the heat-sink slice.'),
    FC('Write the bias–variance decomposition.', 'E[(y − f̂)²] = bias² + variance + σ²_noise.', 'σ²_noise = 0 for a deterministic simulator.'),
    FC('Is an interpolating model always overfitting?', 'No; for noise-free simulators it may be appropriate — but it can oscillate between samples, so validation is still needed.', 'RBF and noise-free GP surrogates interpolate.'),
    FC('What does k-fold cross-validation do?', 'Splits data into k folds; each serves once as validation; scores are averaged.', 'Uses all 30 CFD runs for both training and validation.'),
    FC('What does a flat learning curve tell you?', 'More of the same data will help little; change the model, sampling region or data quality.', 'Add samples near the optimum instead.'),
    FC('Define data leakage.', 'Information from validation/test data influencing training, making performance look better than reality.', 'Scaling with all-data statistics before splitting.'),
    FC('How does a pipeline prevent leakage?', 'It fits preprocessing steps (e.g., scalers) on each training fold only and applies them to the validation fold.', 'make_pipeline(StandardScaler(), PolynomialFeatures(3), LinearRegression()).'),
    FC('When should you split by group?', 'When rows are related (same specimen, run, machine or time series); split by the unit you want to generalize to.', 'GroupKFold by specimen ID in fatigue tests.'),
    FC('Why can good average test accuracy be insufficient for optimization?', 'Optimization depends on accuracy near the optimum, where candidate differences are small; global metrics average over irrelevant regions.', 'Heat-sink candidates differ by ~0.001–0.01 K/W.'),
    FC('Why does scaling by design bounds not cause leakage?', 'Bounds are fixed before any data are seen; no data statistic is used.', 'z = (s − 0.8)/2.2.')
  ],
  quiz: [
    [MC('q1a', 'Data splits', 'You compare five surrogate families and choose the best one using the test set, then report its test RMSE. What is wrong?', ['The reported error is optimistically biased because the test set was used for selection', 'Nothing; this is standard practice', 'You should have used the training error instead', 'Five families are too many to compare'], 0, 'Selection must use validation data or CV; the test set is used once.', ['Correct.', 'It is a common but flawed practice.', 'Training error is even more optimistic.', 'The number is not the issue.']),
     MC('q1b', 'Data splits', 'Which dataset is used to choose the polynomial degree?', ['Validation set (or cross-validation on training data)', 'Test set', 'Training set error alone', 'Any of them equally'], 0, 'Validation data choose model settings.', ['Correct.', 'Test data are reserved for the final estimate.', 'Training error always favours the highest degree.', 'They have distinct roles.'])],
    [MC('q2a', 'Under/overfitting', 'Training RMSE 0.001 K/W, validation RMSE 0.20 K/W. Diagnosis?', ['Overfitting', 'Underfitting', 'Good fit', 'Data leakage, certainly'], 0, 'Large gap between training and validation error indicates overfitting.', ['Correct.', 'Underfitting shows high training error too.', 'Validation error is high.', 'Leakage typically makes validation error look too low, not too high.']),
     MC('q2b', 'Under/overfitting', 'Training RMSE 0.30 K/W, validation RMSE 0.31 K/W, while R varies only between 0.6 and 1.5 K/W. Diagnosis?', ['Underfitting: the model is too simple', 'Overfitting', 'Ideal fit', 'Leakage'], 0, 'Both errors are high and similar.', ['Correct.', 'Overfitting shows a large train–validation gap.', 'Errors are large relative to the range of R.', 'No evidence of leakage.'])],
    [MS('q3a', 'Bias–variance', 'Select ALL statements that are true.', ['Increasing model flexibility usually reduces bias', 'Increasing model flexibility usually increases variance', 'For a deterministic simulator, the noise term σ² is zero', 'More training data increases variance'], [0, 1, 2], 'More data usually reduces variance.', ['Correct.', 'Correct.', 'Correct.', 'More data typically reduces variance.']),
     MS('q3b', 'Bias–variance', 'Select ALL signs of high variance.', ['Fits change a lot when the training sample changes', 'Large gap between training and validation error', 'Fits from different samples agree but are all offset from the truth', 'Wild oscillations between training points'], [0, 1, 3], 'Consistent offset is bias, not variance.', ['Correct.', 'Correct.', 'That is bias.', 'Correct.'])],
    [GEN('q4g', 'Cross-validation', rng => { const s = [0.012, 0.018, 0.015, 0.021, 0.009].map(v => +(v * (1 + 0.1 * rng.int(4))).toFixed(4)); return { stem: `5-fold CV RMSEs (K/W): ${s.join(', ')}. What is the mean CV RMSE?`, answer: ST.mean(s), tolAbs: 0.0002, unit: 'K/W', explain: `Mean = (${s.join(' + ')})/5 = ${ST.mean(s).toFixed(5)} K/W.` }; }),
     GEN('q4h', 'Cross-validation', rng => { const n = [20, 30, 40, 60][rng.int(4)], k = [4, 5, 10][rng.int(3)]; return { stem: `In ${k}-fold CV on ${n} samples (equal folds), how many samples are used for training in each fold?`, answer: n - n / k, tolAbs: 0.01, unit: 'samples', explain: `Each fold holds out n/k = ${n / k}; training uses ${n} − ${n / k} = ${n - n / k}.` }; })],
    [MC('q5a', 'Leakage', 'Which procedure is free of leakage?', ['Split the data; fit the scaler on the training part only; apply it to the test part', 'Scale all data with their overall mean and std, then split', 'Select the most correlated features using all data, then cross-validate', 'Tune the GP length scale on the full dataset, then report CV error with that length scale'], 0, 'Only the first fits everything on training data alone.', ['Correct.', 'Test data influenced the scaling.', 'Feature selection used validation data.', 'Hyperparameter tuning used validation data.']),
     MC('q5b', 'Leakage', 'A team scales inputs by the design bounds (known before sampling) and then runs CV. Is this leakage?', ['No — the bounds do not depend on the data', 'Yes — any scaling before CV is leakage', 'Only if the bounds are wide', 'Only for Gaussian processes'], 0, 'Bound-based scaling uses no data statistics.', ['Correct.', 'Only data-dependent preprocessing can leak.', 'Width is irrelevant.', 'Model type is irrelevant.'])],
    [MC('q6a', 'Group splits', 'Fatigue data: 12 specimens, each with 40 cycle-count measurements at different stress levels. You want accuracy for new specimens. How should you split?', ['By specimen (GroupKFold), keeping all of a specimen’s rows together', 'Randomly by row', 'By stress level only', 'Use the first 400 rows for training regardless of specimen'], 0, 'Generalization target is new specimens.', ['Correct.', 'Leaks specimen identity across sets.', 'Specimens would still appear in both sets.', 'Arbitrary and may still mix specimens.']),
     MC('q6b', 'Group splits', 'Sensor data from a machine are recorded hourly over 6 months; you want to forecast next month. Which validation is appropriate?', ['Train on earlier periods and validate on later periods', 'Random row split', 'Leave-one-out CV over all rows', 'Validate on a random 10% of hours'], 0, 'Time order must be respected.', ['Correct.', 'Leaks future information.', 'Same issue.', 'Same issue.'])],
    [MC('q7a', 'Optimum accuracy', 'Two surrogates: A has global validation RMSE 0.010 K/W but RMSE 0.020 K/W among the best 10% of designs; B has 0.015 K/W globally and 0.004 K/W among the best designs. For optimization, prefer…', ['B, because accuracy near good designs matters most', 'A, because its global RMSE is lower', 'Either; global RMSE decides', 'Neither can be used without a neural network'], 0, 'Decisions are made among the best designs.', ['Correct.', 'Global average is less relevant.', 'Global RMSE alone is insufficient.', 'Irrelevant.']),
     MC('q7b', 'Optimum accuracy', 'Why might a surrogate with excellent average accuracy still recommend a poor design?', ['Small local errors can reorder near-optimal candidates when the objective is flat near the optimum', 'Average accuracy is always misleading', 'Optimizers ignore surrogate predictions', 'Because R² is dimensionless'], 0, 'Flat objectives and local errors interact.', ['Correct.', 'Too strong — it is often informative.', 'They rely on them entirely.', 'Not the reason.'])]
  ]
});
COURSE.glossary.push(['Generalization', 'Performance of a model on new data not used for fitting.'], ['Validation set', 'Data used to choose models or settings.'], ['Test set', 'Data used once at the end for an unbiased performance estimate.'], ['Overfitting', 'Fitting noise or idiosyncrasies; low training error, high validation error.'], ['Underfitting', 'Model too simple; high error on both training and validation data.'], ['Bias–variance trade-off', 'More flexibility reduces bias but increases variance.'], ['Cross-validation', 'Rotating validation folds to estimate generalization from limited data.'], ['Learning curve', 'Validation error versus training-set size.'], ['Data leakage', 'Information from evaluation data influencing training.'], ['Pipeline', 'Chain of preprocessing and model fitted together, preventing leakage.'], ['Group split', 'Splitting by specimen, run, machine or time instead of by row.']);

/* ---------------- Module 6 ---------------- */
COURSE.modules.push({
  id: 'm06', num: 6, title: 'What engineering surrogates are', short: 'Expensive models; surrogates as input–output approximations; design variables, objectives, constraints; interpolation vs extrapolation; the SBO workflow; limitations.', mins: 50,
  prereq: ['Modules 4–5'], prereqModules: ['m05'],
  objectives: ['Explain what a surrogate is and how it differs from the original simulator.', 'Define design variables, response surface, objective and constraints for a problem.', 'Distinguish interpolation from extrapolation, and global from local accuracy.', 'Describe the surrogate-assisted optimization workflow.', 'State the scientific limitations of simplified teaching models.'],
  intro: '<p>Now we connect ML to design. A surrogate is a regression model of a simulator’s input–output behaviour, built to be cheap enough for exploration and optimization.</p>',
  labs: [],
  lessons: [
    { id: 'm06l1', title: 'Expensive models and their surrogates', mins: 10, html: C({
      title: 'A fast approximation of a slow input–output relationship',
      intuition: '<p>An <b>expensive model</b> — a CFD or FEA simulation, or a physical test — maps design variables to responses. A <b>surrogate</b> (also: metamodel, response surface, emulator) is a fitted function that imitates that mapping using a limited number of evaluated designs. It is <i>not</i> the simulator: it knows nothing beyond the samples and its own assumptions.</p>',
      visual: V('true-vs-surrogate', 'Interactive: the true model (left) and a surrogate fitted to sampled designs (right). Change model family and sample size.', 'Two colour maps over fin gap and thickness. Left: true log thermal resistance. Right: the surrogate prediction with sample points; contour shapes resemble the true ones more closely as samples increase. The readout gives validation RMSE and maximum error.') + V('cost-bar', 'Illustrative orders of magnitude of evaluation time.', 'Horizontal bars on a log time axis: trained surrogate and analytical model microseconds; coarse CFD/FEA minutes; fine conjugate CFD hours. Labelled as illustrative, not measured.'),
      math: EQ('<var>y</var> = <var>f</var>(<b>x</b>) &nbsp;(expensive) &nbsp;&nbsp; ≈ &nbsp;&nbsp; <var>ŷ</var> = <var>f̂</var>(<b>x</b>; <b>θ</b>) &nbsp;(cheap), &nbsp; fitted to 𝒟 = {(<b>x</b><sub><var>i</var></sub>, <var>f</var>(<b>x</b><sub><var>i</var></sub>))}<sub><var>i</var>=1</sub><sup><var>n</var></sup>') + '<p>In this course <span class="iv">f</span> is the analytical heat-sink model, and surrogates are fitted to log₁₀<span class="iv">R</span> because the logarithm varies more smoothly across the space.</p>',
      app: '<p><b>Heat exchangers:</b> surrogate of effectiveness and pressure drop vs tube pitch and fin density from 3-D CFD. <b>Structures:</b> surrogate of peak stress vs rib dimensions from FEA. <b>Fluid machinery:</b> surrogate of pump efficiency vs blade angles.</p>',
      predict: ['A surrogate was trained on heat-sink CFD with Δp = 5 Pa. Can it predict performance at Δp = 10 Pa?', 'No. Δp was fixed during sampling; it is not an input of the surrogate. The surrogate only represents the conditions under which its data were generated.'],
      mis: ['The surrogate is a faster version of the simulator.', 'It is an approximation fitted to some simulator outputs. Its errors, valid range and assumptions are its own.'],
      tip: '<p>Write down for every surrogate: inputs and ranges, fixed conditions, output transforms (e.g., log), training data source and size.</p>',
      take: 'Surrogate = cheap regression model of an expensive model, valid only for its inputs, ranges and fixed conditions.'
    }) },
    { id: 'm06l2', title: 'Design variables, response surfaces, objectives and constraints', mins: 9, html: C({
      title: 'Formulating the design problem',
      intuition: '<p><b>Design variables</b> are what you choose (here <span class="iv">s</span>, <span class="iv">t</span>), within <b>bounds</b>. The <b>objective</b> is what you minimize or maximize (here <span class="iv">R</span>). <b>Constraints</b> are requirements a design must satisfy (mass ≤ 0.070 kg; Δ<span class="iv">T</span><sub>air</sub> ≤ 12 K). Designs satisfying all constraints are <b>feasible</b>.</p>',
      visual: V('case-map', 'The heat-sink design space: objective contours, infeasible regions and the constrained optimum.', 'Colour map of R with contours. Red shading marks infeasible designs: thick fins or many fins violate the mass limit (solid red line), very small gaps violate the air-temperature limit (dashed red line). A star marks the constrained optimum on the mass-limit line near s = 1.85 mm, t = 0.35 mm.', { probe: true }),
      math: EQ('min<sub><b>x</b></sub> &nbsp;<var>R</var>(<b>x</b>) &nbsp; s.t. &nbsp; <var>g</var><sub>1</sub>(<b>x</b>) = <var>m</var>(<b>x</b>) − 0.070 kg ≤ 0, &nbsp; <var>g</var><sub>2</sub>(<b>x</b>) = Δ<var>T</var><sub>air</sub>(<b>x</b>) − 12 K ≤ 0, &nbsp; <b>x</b><sub>L</sub> ≤ <b>x</b> ≤ <b>x</b><sub>U</sub>') + SYM([['x = (s, t)', 'design vector', 'mm'], ['x<sub>L</sub>, x<sub>U</sub>', 'bounds (0.8, 0.2) and (3.0, 1.5)', 'mm'], ['g<sub>j</sub>(x) ≤ 0', 'inequality constraints written in standard form', 'kg, K']]),
      app: '<p>Constraints can be <b>cheap</b> (mass from geometry) or <b>expensive</b> (Δ<span class="iv">T</span><sub>air</sub> needs the flow solution). Model only the expensive ones with surrogates; compute cheap ones exactly. Structural example: minimize mass s.t. deflection ≤ limit (expensive, FEA) and plate thickness ≥ 2 mm (bound).</p>',
      predict: ['Why is the constrained optimum not at the unconstrained minimum of R?', 'The unconstrained minimum (≈0.570 K/W at t ≈ 0.49 mm) weighs about 0.083 kg, violating the 0.070 kg limit; the best feasible design therefore lies on the mass-limit boundary with thinner fins.'],
      mis: ['Constraints are added after optimization by discarding infeasible results.', 'They must be part of the formulation; the optimizer needs to know them to search the feasible region effectively.'],
      tip: '<p>Write constraints as <span class="iv">g</span>(<b>x</b>) ≤ 0 with units, and normalize them (e.g., divide by the limit) when combining them in penalties.</p>',

    { id: 'm06l3', title: 'Interpolation vs extrapolation; global vs local accuracy', mins: 10, html: C({
      title: 'Where can you trust a surrogate?',
      intuition: '<p><b>Interpolation</b>: predicting inside the region covered by training samples. <b>Extrapolation</b>: predicting outside it. Surrogates are usually far less reliable when extrapolating, because nothing in the data constrains them there. <b>Global accuracy</b> is error averaged over the whole design space; <b>local accuracy</b> is error in a particular region (e.g., near the optimum).</p>',
      visual: V('extrap-demo', 'Interactive: training data only cover 1.3–2.3 mm; move the prediction point into the extrapolation regions and compare models.', 'Plot of R versus fin gap with six training points in a green interpolation band; red-shaded extrapolation regions on both sides. A slider moves a query point; the readout labels it interpolation or extrapolation and gives prediction, truth and error. The GP option shows an uncertainty band that widens outside the data.'),
      math: '<p>In several dimensions, “inside” is subtler than “within the bounds of each variable”. A useful working definition is the <b>convex hull</b> of the samples; even inside the hull, large empty regions behave like local extrapolation. The fill distance (largest distance from any design to its nearest sample) measures how big those holes are (Module 7).</p>',
      app: '<p>A machining roughness surrogate fitted for feeds 0.05–0.2 mm/rev should not be used at 0.4 mm/rev. In heat-sink optimization, an optimizer may push the design to a corner of the space where samples are sparse — local extrapolation.</p>',
      predict: ['A GP and a cubic polynomial agree closely at s = 1.8 mm but disagree strongly at s = 0.9 mm. What does the disagreement suggest?', 'That 0.9 mm is outside or far from the data, where each model is following its own assumptions. Disagreement between plausible models is a useful warning sign.'],
      mis: ['If a point lies within the variable bounds, the surrogate is interpolating.', 'Samples may not cover all of the bounded box; corners and gaps can still be extrapolation in effect.'],
      tip: '<p>Before trusting a prediction, check its distance to the nearest training sample and, if available, its predictive uncertainty.</p>',

    { id: 'm06l4', title: 'The surrogate-assisted optimization workflow, and limitations', mins: 9, html: C({
      title: 'Fit → optimize → verify → update',
      intuition: '<p>The standard workflow: sample the design space; run the expensive model; fit a surrogate; optimize the cheap surrogate; <b>verify</b> the candidate with the expensive model; add the result to the data, refit, and repeat until a stopping rule is met. The verified results, not the predictions, are the evidence.</p>',
      visual: V('sao-loop', 'The sequential surrogate-based optimization loop.', 'Cycle of six boxes: initial design sampling; run original model; fit or update surrogate; optimize surrogate or acquisition function; verify candidate with original model; stop or continue, adding the verified point to the data.'),
      math: EQ('<b>x</b><sub>new</sub> = arg min<sub><b>x</b> ∈ feasible</sub> <var>f̂</var>(<b>x</b>), &nbsp; evaluate <var>f</var>(<b>x</b><sub>new</sub>), &nbsp; 𝒟 ← 𝒟 ∪ {(<b>x</b><sub>new</sub>, <var>f</var>(<b>x</b><sub>new</sub>))}'),
      app: '<p>An aerodynamic duct study might start with 20 CFD runs, then add 1–3 verified candidates per iteration for 10 iterations: 30–50 CFD runs in total instead of thousands.</p>',
      predict: ['After optimizing a surrogate, its predicted optimum is R̂ = 0.560 K/W. The verified value is 0.585 K/W. Which value goes in your report as the design’s performance?', 'The verified 0.585 K/W (with the prediction and its error reported too). The prediction is a hypothesis; the verification is evidence — about the model you verified with.'],
      mis: ['The surrogate’s optimum is the design’s performance.', 'It is a prediction. Verification with the original model is mandatory.'],
      tip: '<p>Budget verification runs from the start (e.g., 20–30% of the total evaluations).</p>',
      take: 'Surrogate-based optimization alternates cheap prediction and expensive verification.'
    }) + C({
      title: 'Scientific limitations of simplified teaching models',
      intuition: '<p>Our heat-sink model is a <b>pedagogical model</b>: physically reasonable, transparent and fast, but simplified (fully developed laminar flow, constant fan pressure, no bypass, continuous fin count). Results about it are results about the model, not about a real heat sink.</p>',
      math: '<p>Three levels of error stack up in practice:</p>' + EQ('<var>f̂</var>(<b>x</b>) − <var>y</var><sub>real</sub> = [<var>f̂</var>(<b>x</b>) − <var>f</var>(<b>x</b>)] + [<var>f</var>(<b>x</b>) − <var>y</var><sub>real</sub>]') + '<p>The first bracket is surrogate error (this course measures it); the second is model-form error of the simulator itself (requires experimental validation).</p>',
      app: '<p>A real heat-sink study would validate the CFD model against wind-tunnel measurements before trusting any surrogate built on it. In our model the thermal entrance length is comparable to the flow length at wider gaps, so the fully developed Nusselt number underestimates heat transfer there.</p>',

      mis: ['A very accurate surrogate makes the conclusions physically accurate.', 'It can be no more trustworthy than the model it imitates.'],
      tip: '<p>In reports, state clearly which model produced the “verified” values and what validation that model has.</p>',
      take: 'Surrogate accuracy and physical accuracy are different claims; state both levels honestly.'

/* Modules 7–9 */
function binom(n, k) { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); }
COURSE.modules.push({
  id: 'm07', num: 7, title: 'Sampling and design of experiments', short: 'Bounded design spaces; full factorial and the curse of dimensionality; random, Latin hypercube and Sobol sampling; space-filling; validation points; budgets.', mins: 50,
  prereq: ['Module 3 (scaling)', 'Module 6'], prereqModules: ['m06'],
  objectives: ['Define a bounded design space and scale it to the unit hypercube.', 'Compute the size of a full-factorial design and explain the curse of dimensionality.', 'Generate and compare random, Latin hypercube and Sobol samples.', 'Assess space-filling quality with simple distance measures.', 'Plan an initial design and validation points under a limited simulation budget.'],
  intro: '<p>A surrogate can only be as good as the designs it learned from. <b>Design of experiments (DoE)</b> chooses where to run the expensive model so that limited evaluations teach the most.</p>',
  labs: ['lab04'],
  lessons: [
    { id: 'm07l1', title: 'Bounded design spaces, full factorial designs and the curse of dimensionality', mins: 10, html: C({
      title: 'Grids grow explosively with dimension',
      intuition: '<p>A <b>bounded design space</b> is a box: each variable has a lower and upper bound. The most obvious plan is a <b>full-factorial grid</b>: choose <span class="iv">L</span> levels per variable and run every combination. With 2 variables and 5 levels that is 25 runs — fine. With 8 variables it is 390 625 runs — impossible with CFD. This explosive growth is the <b>curse of dimensionality</b>.</p>',
      visual: V('factorial-growth', 'Number of full-factorial runs (log scale) versus number of variables, for 3, 5 and 10 levels.', 'Three straight lines on a log scale rising with dimension: 3^d, 5^d and 10^d runs. A horizontal line marks a budget of 1 000 runs, crossed at about d = 6, 4 and 3 respectively.'),
      math: EQ('<var>N</var><sub>runs</sub> = <var>L</var><sup><var>d</var></sup>, &nbsp; scaled coordinates &nbsp; <var>z</var><sub><var>j</var></sub> = ' + FR('<var>x</var><sub><var>j</var></sub> − <var>x</var><sub><var>j</var>,L</sub>', '<var>x</var><sub><var>j</var>,U</sub> − <var>x</var><sub><var>j</var>,L</sub>') + ' ∈ [0, 1]') + SYM([['L', 'levels per variable', 'count'], ['d', 'number of design variables', 'count'], ['z<sub>j</sub>', 'scaled j-th variable', '—']]) + '<p>Another face of the curse: to keep the same spacing <span class="iv">h</span> between samples in each direction, the number of samples grows like (1/<span class="iv">h</span>)<sup><span class="iv">d</span></sup>.</p>',
      app: '<p>A machining study with speed, feed and depth at 3 levels each needs 27 runs — practical. A turbine-blade study with 10 shape parameters at 3 levels needs 59 049 CFD runs — impractical; space-filling designs and dimension reduction are used instead.</p>',
      predict: ['How many runs for a full factorial with 4 levels in each of 5 variables?', '4⁵ = 1 024 runs.'],
      mis: ['A grid is always the most thorough design.', 'Grids waste runs: in each 1-D projection only L distinct values are tested, and the count explodes with d.'],
      tip: '<p>Always sample in scaled coordinates [0, 1]<sup>d</sup> and map back to physical units only for running the model.</p>',
      take: 'Full factorial cost L^d grows exponentially with d — the curse of dimensionality.'
    }) },
    { id: 'm07l2', title: 'Random, Latin hypercube and Sobol sampling', mins: 12, html: C({
      title: 'Spreading points evenly with few runs',
      intuition: '<p><b>Random (Monte Carlo) sampling</b> draws each point independently and uniformly — simple, but points clump and leave holes. <b>Latin hypercube sampling (LHS)</b> divides each variable’s range into <span class="iv">n</span> equal strata and puts exactly one point in each stratum per variable — every 1-D projection is evenly covered. <b>Sobol sequences</b> are deterministic low-discrepancy sequences that fill space evenly and can be extended point by point (best balanced at <span class="iv">n</span> = 2<sup>m</sup>).</p>',
      visual: V('sampling-compare', 'Interactive comparison of full factorial, random, Latin hypercube and Sobol samples; red ticks show 1-D projections.', 'Four square panels of points in the unit square. Factorial points form a grid with only a few distinct projection values. Random points clump with visible gaps. LHS points have exactly one tick per stratum on each axis. Sobol points look evenly spread. The readout lists minimum pairwise distance and fill distance for each.'),
      math: '<p>LHS construction for <span class="iv">n</span> points in <span class="iv">d</span> dimensions:</p>' + EQ('<var>z</var><sub><var>ij</var></sub> = ' + FR('<var>π</var><sub><var>j</var></sub>(<var>i</var>) + <var>u</var><sub><var>ij</var></sub>', '<var>n</var>') + ', &nbsp; <var>i</var> = 0, …, <var>n</var>−1') + SYM([['π<sub>j</sub>', 'a random permutation of 0…n−1, independent for each variable j', '—'], ['u<sub>ij</sub>', 'uniform random number in [0, 1) (use 0.5 for stratum centres)', '—']]) + '<p>Space-filling measures: <b>minimum pairwise distance</b> (larger = less clumping; “maximin” designs maximize it) and <b>fill distance</b> (the largest distance from any point of the space to its nearest sample; smaller = no big holes).</p>',
      app: '<p>Additive manufacturing: 16 coupons over (laser power, scan speed) via LHS test 16 distinct power levels and 16 distinct speeds, unlike a 4×4 grid with only 4 of each. In SciPy: <code>qmc.LatinHypercube(d=2, seed=1).random(16)</code> and <code>qmc.Sobol(d=2, scramble=True, seed=1).random_base2(m=4)</code>.</p>',
      predict: ['With LHS of n = 10 points, how many points fall in the stratum 0.3 ≤ z₁ < 0.4?', 'Exactly one — that is the defining property of LHS in every variable.'],
      mis: ['LHS guarantees a good 2-D spread.', 'It guarantees even 1-D projections only; a bad permutation can still line points up diagonally. Optimized (maximin) LHS or several seeds help.'],
      tip: '<p>For an initial surrogate design, a common rule of thumb is about 10 × <span class="iv">d</span> points (here ~20) — then add points sequentially where needed (Modules 11–12). Treat it as a starting point, not a law.</p>',
      take: 'LHS covers each variable evenly; Sobol fills space evenly and extends nicely; random is simplest but clumpy.'
    }) },
    { id: 'm07l3', title: 'Scaling, validation points and practical choices under a budget', mins: 10, html: C({
      title: 'Where errors land depends on where samples land',
      intuition: '<p>Surrogate error is usually small near samples and larger in holes and in steep regions. A good initial design spreads points; a good validation set is <b>separate</b> (not used for fitting) and also spread over the space. With a fixed budget, you trade initial samples, validation runs and later verification/infill runs.</p>',
      visual: V('error-map', 'Interactive: GP surrogate error maps for random versus LHS designs of the same size.', 'Two diverging colour maps of signed surrogate error (blue under-prediction, red over-prediction) over the design space with sample points. Errors concentrate in empty regions and near the steep small-gap edge; LHS usually shows smaller worst-case error, though not for every seed.'),
      math: '<p>A simple budget split for total budget <span class="iv">B</span> original-model runs:</p>' + EQ('<var>B</var> = <var>n</var><sub>initial</sub> + <var>n</var><sub>validation</sub> + <var>n</var><sub>infill/verify</sub>') + '<p>If validation runs are too costly, use cross-validation on the initial design instead of a separate set, and rely on verification of candidates as extra validation near the optimum.</p>',
      app: '<p>With <span class="iv">B</span> = 40 CFD runs for a two-variable heat-exchanger study: 20 LHS initial + 0 separate validation (5-fold CV instead) + 20 sequential infill/verification runs is a typical choice. In this course, the analytical model is cheap, so we often use large separate validation sets purely for teaching.</p>',
      predict: ['Should validation points be chosen near the training points to check the surrogate carefully?', 'No — points next to training samples will look accurate by construction. Validation points should be spread over the region of interest, ideally independently sampled.'],
      mis: ['Including the validation points in training afterwards invalidates the whole study.', 'Once the validation is reported, refitting on all data for the final surrogate is common and sensible — but report the validation that was done before merging.'],
      tip: '<p>Record the sampler, seed, bounds and scaling in your notebook so the design can be regenerated exactly.</p>',
      take: 'Spread samples, keep validation separate (or use CV), and plan the budget for later infill and verification.'
    }) }
  ],

COURSE.modules.push({
  id: 'm08', num: 8, title: 'Surrogate model families', short: 'Polynomial response surfaces, radial basis functions, trees and random forests, Gaussian processes, neural networks; strengths, costs, smoothness; a worked comparison.', mins: 55,
  prereq: ['Modules 4, 5 and 7'], prereqModules: ['m07'],
  objectives: ['Describe how polynomial, RBF, tree/forest, GP and neural-network surrogates represent a response.', 'Compare their data requirements, computational cost, smoothness and differentiability.', 'Explain why a more complex model is not automatically better.', 'Run and interpret a fair comparison on shared data.'],
  intro: '<p>There is no best surrogate for every problem. This module gives you a toolbox and the judgement to choose.</p>',
  labs: ['lab05'],
  lessons: [
    { id: 'm08l1', title: 'Polynomial response surfaces and radial basis functions', mins: 11, html: C({
      title: 'Two classic surrogate families',
      intuition: '<p>A <b>polynomial response surface</b> fits a low-order polynomial (typically quadratic) by least squares: smooth, few parameters, easy to interpret, but cannot follow complicated shapes. A <b>radial basis function (RBF)</b> model places a “bump” function at each sample and combines them so that the surface passes exactly through all samples: flexible and accurate for smooth deterministic data, but no built-in uncertainty.</p>',
      visual: V('family-1d', 'Interactive: five model families fitted to the same 1-D heat-sink samples.', 'One-dimensional plot of R versus fin gap with equally spaced samples. A dropdown switches between quadratic and quartic polynomials, cubic RBF, Gaussian process (with uncertainty band) and a simplified random forest (stepped curve). The readout reports error against the true curve and a short characterization.'),
      math: '<p>Quadratic response surface in <span class="iv">d</span> variables:</p>' + EQ('<var>ŷ</var> = <var>β</var><sub>0</sub> + Σ<sub><var>j</var></sub> <var>β</var><sub><var>j</var></sub><var>z</var><sub><var>j</var></sub> + Σ<sub><var>j</var>≤<var>k</var></sub> <var>β</var><sub><var>jk</var></sub><var>z</var><sub><var>j</var></sub><var>z</var><sub><var>k</var></sub>, &nbsp; number of terms = ' + FR('(<var>d</var>+1)(<var>d</var>+2)', '2')) + '<p>Cubic RBF with linear tail:</p>' + EQ('<var>ŷ</var>(<b>z</b>) = Σ<sub><var>i</var>=1</sub><sup><var>n</var></sup> <var>w</var><sub><var>i</var></sub> ‖<b>z</b> − <b>z</b><sub><var>i</var></sub>‖<sup>3</sup> + <var>c</var><sub>0</sub> + <b>c</b><sup>T</sup><b>z</b>') + '<p>The weights solve an (<span class="iv">n</span> + <span class="iv">d</span> + 1)-dimensional linear system that enforces <span class="iv">ŷ</span>(<b>z</b><sub>i</sub>) = <span class="iv">y</span><sub>i</sub>. A polynomial of total degree <span class="iv">p</span> in <span class="iv">d</span> variables has C(<span class="iv">d</span>+<span class="iv">p</span>, <span class="iv">p</span>) terms.</p>',
      app: '<p>Quadratic response surfaces are the long-standing workhorse of experimental design in manufacturing (e.g., roughness vs speed and feed) because they are robust with noisy data and give interpretable effects. RBFs are popular for deterministic CFD/FEA surrogates in aerospace and turbomachinery.</p>',
      predict: ['How many coefficients does a full quadratic in 3 variables have, and can you fit it to 8 samples?', '(3+1)(3+2)/2 = 10 coefficients — more than 8 samples, so least squares is under-determined. You need at least 10, preferably 15–20.'],
      mis: ['Interpolating models are always more accurate than regression models.', 'With noisy data, interpolation reproduces noise. Even with noise-free data, interpolants can oscillate between samples.'],
      tip: '<p>Start with a quadratic polynomial as a baseline surrogate; it tells you how much nonlinearity more flexible models must capture.</p>',
      take: 'Polynomials: smooth, few parameters, limited shape. RBFs: interpolate samples, flexible, no uncertainty.'
    }) },
    { id: 'm08l2', title: 'Trees, random forests and neural networks', mins: 10, html: C({
      title: 'Piecewise models and layered networks',
      intuition: '<p>A <b>regression tree</b> splits the design space with yes/no questions (“is <span class="iv">s</span> ≤ 1.4 mm?”) and predicts a constant in each final region. A <b>random forest</b> averages many trees trained on bootstrap resamples, reducing variance. Forests handle many variables and mixed data well but produce <b>piecewise-constant</b> surfaces: not smooth, zero gradients almost everywhere, and flat beyond the data. A <b>neural network</b> composes many weighted sums and nonlinear activations; it can represent very complex functions but usually needs much more data and careful tuning.</p>',
      visual: V('tree-steps', 'Left: a small regression tree. Right: its piecewise-constant prediction versus the true smooth curve.', 'Left: tree diagram with splits on s and t leading to constant predictions. Right: plot of true R versus s with a staircase-shaped tree prediction.') + V('nn-diagram', 'A small feed-forward neural network with two inputs, two hidden layers of five nodes and one output.', 'Network diagram: two input nodes (s, t), two hidden layers of five nodes each, one output node, all connected; caption counts 51 trainable parameters.'),
      math: '<p>Forest prediction: <span class="iv">ŷ</span>(<b>x</b>) = (1/<span class="iv">B</span>) Σ<sub>b</sub> <span class="iv">T</span><sub>b</sub>(<b>x</b>), averaging <span class="iv">B</span> trees. One hidden layer of a network: <b>h</b> = σ(<b>W</b><b>x</b> + <b>b</b>), with σ an activation such as tanh or ReLU. Parameter count for layer sizes (2, 5, 5, 1): 2·5 + 5·5 + 5·1 weights + 5 + 5 + 1 biases = 51.</p>',
      app: '<p>Forests are effective for process data with many categorical settings (machine, tool type) and noise, e.g., predicting tool wear. Neural networks shine with large datasets — thousands of CFD fields — or images. For 20–50 expensive simulations of a smooth response, GPs, RBFs or polynomials are usually better choices.</p>',
      predict: ['Why is a random forest awkward as a surrogate for gradient-based optimization?', 'Its prediction is piecewise constant, so gradients are zero almost everywhere and undefined at split boundaries; gradient-based optimizers have no direction to follow.'],
      mis: ['Deep learning is the state of the art, so it must be best for surrogates.', 'With small data, simpler models often generalize better. Complexity must be justified by validation evidence.'],
      tip: '<p>Count parameters versus samples: a 51-parameter network fitted to 20 runs is heavily under-determined without strong regularization.</p>',
      take: 'Forests: robust, many variables, but non-smooth. Networks: flexible but data-hungry. Choose by data size and smoothness needs.'
    }) },
    { id: 'm08l3', title: 'Gaussian processes, comparison table and a worked comparison', mins: 14, html: C({
      title: 'Choosing a surrogate family',
      intuition: '<p>A <b>Gaussian process (GP)</b> treats the unknown function as random with a specified correlation structure: nearby designs have similar outputs. It interpolates noise-free data, is smooth, and gives a <b>predictive uncertainty</b> (Module 9). Its cost grows as <span class="iv">n</span>³, which is negligible for tens or hundreds of samples. No model wins everywhere; compare candidates on the same data with the same validation.</p>',
      visual: '<div class="tbl-wrap"><table><thead><tr><th>Family</th><th>Data needed (smooth, d ≈ 2–10)</th><th>Fit cost</th><th>Smooth / differentiable</th><th>Uncertainty</th><th>Typical use</th></tr></thead><tbody><tr><td>Polynomial (quadratic)</td><td>≥ (d+1)(d+2)/2, ideally 1.5–2×</td><td>very low</td><td>yes</td><td>only via statistics of residuals</td><td>baseline; noisy experiments; interpretable effects</td></tr><tr><td>RBF interpolant</td><td>10–20 per dimension</td><td>low (solve n×n)</td><td>yes (cubic: twice differentiable)</td><td>no</td><td>deterministic simulators</td></tr><tr><td>Random forest</td><td>moderate–large</td><td>low–moderate</td><td>no (piecewise constant)</td><td>rough (tree spread)</td><td>many variables, categorical, noisy data</td></tr><tr><td>Gaussian process</td><td>10–20 per dimension</td><td>O(n³), fine to ~10³</td><td>yes (SE kernel: infinitely)</td><td>yes (model-based)</td><td>expensive simulators, Bayesian optimization</td></tr><tr><td>Neural network</td><td>large (hundreds–thousands+)</td><td>moderate–high, tuning-heavy</td><td>yes with smooth activations</td><td>not by default</td><td>large datasets, fields, images</td></tr></tbody></table></div><p class="small muted">General guidance from common practice, not universal rules.</p>' + V('model-compare-2d', 'Worked comparison (computed live): five families trained on the same Latin-hypercube samples of the heat sink, scored on 300 validation designs with three error measures.', 'A table lists, for quadratic and cubic polynomials, cubic RBF, Gaussian process and simplified random forest: RMSE over all validation designs, median absolute error, RMSE among good designs (R below 0.7 K/W), maximum error, fit time and prediction time. A diverging error map shows where the selected model errs; the largest errors sit in the steep corner of small gaps and thick fins.') + V('add-samples', 'Interactive: tap or click to add samples and watch the GP surrogate and its error map change.', 'Left: GP surrogate map with sample points; clicking adds a sample. Right: signed error map. Errors shrink where samples are added.'),
      math: '<p>Fair comparison protocol: same training samples, same validation data, same output transform (log₁₀<span class="iv">R</span> here), metrics in engineering units back-transformed (<span class="iv">R̂</span> = 10<sup>prediction</sup>), and report both accuracy and cost (fit + prediction time, number of expensive runs).</p>',
      app: '<p>What the demo typically shows with 20 LHS samples (author’s check over 10 seeds): the <b>cubic polynomial</b> often has the lowest overall RMSE (≈0.05 K/W), because overall RMSE is dominated by a few validation points in the steep corner (small gaps, thick fins) where R reaches 2–4 K/W; the <b>GP and cubic RBF</b> have the smallest <b>median</b> errors (≈0.006 K/W) and are usually most accurate among good designs; the quadratic is limited by its shape; the forest is worst on every measure. Lesson: the metric and the region you evaluate decide the ranking — for optimization, accuracy among good designs matters most. Lab 5 shows the same pattern with scikit-learn.</p>',
      predict: ['Going from 20 to 30 samples roughly halves the GP’s typical error in the demo. What do 10 extra samples cost in a real CFD study, and in GP fitting?', 'In CFD: 10 more expensive runs (hours each). GP fitting cost rises by about (30/20)³ ≈ 3.4× (n³ scaling) but remains milliseconds — negligible compared with the simulations.'],
      mis: ['The model with lowest training error is best.', 'Interpolating models have zero training error by construction. Compare on validation data.'],
      tip: '<p>Keep a quadratic polynomial and a GP in every comparison: one robust baseline and one flexible, uncertainty-aware model.</p>',
      take: 'Choose by validation accuracy where it matters, smoothness needs, uncertainty needs and data size — not by fashion.'
    }) }
  ],
  flashcards: [

  quiz: [
    [GEN('q1g', 'Polynomial terms', rng => { const d = 2 + rng.int(5); return { stem: `How many coefficients does a full quadratic response surface (all linear, squared and two-way interaction terms plus intercept) have in d = ${d} variables?`, answer: (d + 1) * (d + 2) / 2, tolAbs: 0.01, unit: 'coefficients', explain: `(d+1)(d+2)/2 = ${d + 1}·${d + 2}/2 = ${(d + 1) * (d + 2) / 2}.` }; }),
