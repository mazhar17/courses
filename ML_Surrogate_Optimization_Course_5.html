el → Restart Kernel and Run All Cells*.\n","\n","**Dependencies.** numpy, pandas, matplotlib, scipy, scikit-learn, jupyterlab. The exact configuration in which the reference notebooks were executed is given in the downloadable environment specification on the course’s Labs page (and in the testing-status cell below). Minimum versions: SciPy ≥ 1.8 is required (Lab 10 uses `LatinHypercube(optimization=\"random-cd\")`, which first appears in SciPy 1.8.0 — checked against the SciPy release source); scikit-learn ≥ 1.0 and Python ≥ 3.10 are expected to work but lower versions were **not** executed.\n","\n","**About the model.** The heat-sink function below is a simplified *pedagogical* analytical model standing in for an expensive CFD simulation. Results describe this model, not real hardware."]},{"cell_type":"markdown","metadata":{},"source":["**Testing status.** For course version 3.0.0 this reference notebook was executed top-to-bottom without errors on 2026-10-06 by the course maintainer, in a freshly created virtual environment (python 3.13.16, numpy 2.5.3, pandas 3.0.5, matplotlib 3.11.2, scipy 1.18.1, scikit-learn 1.9.1; Linux-6.18.44-fc-v70-x86_64-with-glibc2.39); wall time 5 s. Other package versions were not tested; numerical outputs may differ slightly.\n","\n","**Starter notebooks** intentionally stop at the first unfinished `# TODO` (they raise `NotImplementedError`). Every code cell of both versions is checked to be valid Python syntax, but starters were not executed end-to-end."]},{"cell_type":"markdown","metadata":{},"source":["> **Reference solution.** This version contains worked solutions. Try the starter notebook first."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Setup: imports, versions and reproducibility\n","import sys, time\n","import numpy as np\n","import pandas as pd\n","import matplotlib.pyplot as plt\n","import scipy, sklearn\n","print(\"Python\", sys.version.split()[0], \"| numpy\", np.__version__, \"| pandas\", pd.__version__,\n","      \"| scipy\", scipy.__version__, \"| scikit-learn\", sklearn.__version__)\n","SEED = 7                                  # change this to test sensitivity to sampling luck\n","rng = np.random.default_rng(SEED)         # one generator for the whole notebook\n","plt.rcParams[\"figure.figsize\"] = (6.4, 4.2)\n","# Gaussian-process hyperparameter fits on small deterministic datasets often emit ConvergenceWarnings from the\n","# L-BFGS optimizer. We silence them to keep output readable and judge models by validation instead.\n","# Remove this filter if you want to see them.\n","import warnings\n","from sklearn.exceptions import ConvergenceWarning\n","warnings.filterwarnings(\"ignore\", category=ConvergenceWarning)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Pedagogical plate-fin heat-sink model: a transparent stand-in for an expensive CFD simulation.\n","# Inputs: fin gap s_mm and fin thickness t_mm (millimetres). Deterministic: no measurement noise.\n","BOUNDS = np.array([[0.8, 3.0],    # s_mm: fin gap (mm)\n","                   [0.2, 1.5]])   # t_mm: fin thickness (mm)\n","MASS_MAX_KG = 0.070               # constraint g1: mass <= 0.070 kg  (cheap: geometry only)\n","DTAIR_MAX_K = 12.0                # constraint g2: air temperature rise <= 12 K (needs flow solution)\n","\n","def heat_sink(s_mm, t_mm):\n","    \"\"\"Return dict with R (K/W), mass (kg), dT_air (K), Re (-). Accepts scalars or NumPy arrays.\"\"\"\n","    W, L, H, tb = 0.050, 0.050, 0.040, 0.004          # base width, flow length, fin height, base thickness (m)\n","    ks, rho_al = 150.0, 2700.0                         # aluminium alloy: W/(m K), kg/m^3\n","    rho, mu, cp, ka = 1.16, 1.85e-5, 1007.0, 0.026     # air: kg/m^3, Pa s, J/(kg K), W/(m K)\n","    dp, Q, Nu = 5.0, 30.0, 7.54                        # fan pressure (Pa), heat load (W), Nusselt (-)\n","    s = np.asarray(s_mm, dtype=float) * 1e-3           # mm -> m  (unit conversion!)\n","    t = np.asarray(t_mm, dtype=float) * 1e-3\n","    N = W / (s + t)                                    # number of fins (continuous)\n","    u = dp * s**2 / (12 * mu * L)                      # laminar parallel-plate channel velocity (m/s)\n","    mdot = rho * u * s * H * N                         # air mass flow (kg/s)\n","    h = Nu * ka / (2 * s)                              # heat-transfer coefficient (W/m^2 K)\n","    m = np.sqrt(2 * h / (ks * t))                      # fin parameter (1/m)\n","    eta = np.tanh(m * H) / (m * H)                     # fin efficiency (-)\n","    UA = h * N * L * (2 * H * eta + s)                 # conductance (W/K)\n","    NTU = UA / (mdot * cp)\n","    R = 1 / (mdot * cp * (1 - np.exp(-NTU))) + tb / (ks * W * L)\n","    mass = rho_al * (N * t * H * L + W * L * tb)\n","    dT_air = Q / (mdot * cp)\n","    Re = rho * u * 2 * s / mu\n","    return {\"R\": R, \"mass\": mass, \"dT_air\": dT_air, \"Re\": Re}\n","\n","def to_unit(X_mm):\n","    \"\"\"Scale physical designs (n, 2) in mm to the unit square using the bounds.\"\"\"\n","    return (np.asarray(X_mm) - BOUNDS[:, 0]) / (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","def from_unit(Z):\n","    \"\"\"Map unit-square points (n, 2) back to physical designs in mm.\"\"\"\n","    return BOUNDS[:, 0] + np.asarray(Z) * (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","R_STAR, S_STAR, T_STAR = 0.57705, 1.8525, 0.3509   # reference constrained optimum (teaching only)\n","assert abs(heat_sink(2.0, 0.8)[\"R\"] - 0.58738853) < 1e-6, \"model check failed - did you edit the model?\"\n","print(\"Model OK. Example: s=2.0 mm, t=0.8 mm ->\", {k: round(float(v), 4) for k, v in heat_sink(2.0, 0.8).items()})"]},{"cell_type":"markdown","metadata":{},"source":["## 1. Expected improvement for minimization\n","EI = (f_best − μ − ξ)Φ(z) + σφ(z), z = (f_best − μ − ξ)/σ for σ > 0; EI = max(f_best − μ − ξ, 0) for σ = 0."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from scipy.stats import norm\n","def expected_improvement(mu, sigma, f_best, xi=0.0):\n","    mu, sigma = np.asarray(mu, float), np.asarray(sigma, float)\n","    imp = f_best - mu - xi\n","    ei = np.maximum(imp, 0.0)                       # sigma = 0 case\n","    pos = sigma > 1e-12\n","    z = imp[pos] / sigma[pos]\n","    ei[pos] = imp[pos] * norm.cdf(z) + sigma[pos] * norm.pdf(z)\n","    return ei\n","\n","# Unit tests (should pass silently)\n","assert np.isclose(expected_improvement([0.6], [0.0], 0.62)[0], 0.02)\n","assert np.isclose(expected_improvement([0.7], [0.0], 0.62)[0], 0.0)\n","assert np.isclose(expected_improvement([1.0], [0.2], 1.0)[0], 0.2 * norm.pdf(0))\n","assert np.all(expected_improvement(np.linspace(0, 2, 50), np.full(50, 0.1), 1.0) >= 0)\n","print(\"EI tests passed.\")"]},{"cell_type":"markdown","metadata":{},"source":["## 2. 1-D BO on a synthetic multimodal function (not the heat sink)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from sklearn.gaussian_process import GaussianProcessRegressor\n","from sklearn.gaussian_process.kernels import ConstantKernel, RBF\n","f = lambda x: 0.9 + 0.35 * np.sin(11 * x) * np.exp(-0.5 * x) + 0.4 * (x - 0.65) ** 2   # synthetic test function\n","xg = np.linspace(0, 1, 501)\n","X1 = np.array([0.15, 0.5, 0.85]); y1 = f(X1)\n","for it in range(8):\n","    gp = GaussianProcessRegressor(ConstantKernel() * RBF(0.1, (1e-2, 1)), normalize_y=True, alpha=1e-8, n_restarts_optimizer=2, random_state=0).fit(X1[:, None], y1)\n","    mu, sd = gp.predict(xg[:, None], return_std=True)\n","    ei = expected_improvement(mu, sd, y1.min(), xi=0.01)\n","    x_next = xg[np.argmax(ei)]\n","    X1, y1 = np.append(X1, x_next), np.append(y1, f(x_next))\n","print(\"best found:\", round(float(X1[np.argmin(y1)]), 3), round(float(y1.min()), 4), \"| true min on grid:\", round(float(xg[np.argmin(f(xg))]), 3), round(float(f(xg).min()), 4))\n","fig, ax = plt.subplots(2, 1, figsize=(6.4, 5), sharex=True)\n","ax[0].plot(xg, f(xg), \"k--\"); ax[0].plot(xg, mu); ax[0].fill_between(xg, mu - 2 * sd, mu + 2 * sd, alpha=0.3); ax[0].plot(X1, y1, \"o\")\n","ax[1].plot(xg, ei); ax[1].set_xlabel(\"x\"); ax[0].set_ylabel(\"f\"); ax[1].set_ylabel(\"EI\"); plt.show()"]},{"cell_type":"markdown","metadata":{},"source":["## 3. Constrained BO on the heat sink\n","EI on log10 R × probability that log10 ΔT_air ≤ log10 12; mass excluded exactly; acquisition maximized on a 61×61 grid."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from scipy.stats import qmc\n","def fit_gp(Z, y):\n","    return GaussianProcessRegressor(ConstantKernel() * RBF([0.3, 0.3], (1e-2, 1e2)), normalize_y=True, n_restarts_optimizer=2, random_state=0).fit(Z, y)\n","Zg = np.array([[a, b] for a in np.linspace(0, 1, 61) for b in np.linspace(0, 1, 61)])\n","Xg = from_unit(Zg); mass_feasible = heat_sink(Xg[:, 0], Xg[:, 1])[\"mass\"] <= MASS_MAX_KG\n","\n","def run_bo(budget=24, n0=8, seed=SEED, xi=0.0):\n","    Z = qmc.LatinHypercube(d=2, seed=seed).random(n0); X = from_unit(Z); o = heat_sink(X[:, 0], X[:, 1])\n","    yR, yT = np.log10(o[\"R\"]), np.log10(o[\"dT_air\"]); ok = (o[\"mass\"] <= MASS_MAX_KG) & (o[\"dT_air\"] <= DTAIR_MAX_K)\n","    hist = [np.min(np.where(ok, 10 ** yR, np.inf)[:k + 1]) for k in range(n0)]\n","    while len(Z) < budget:\n","        gR, gT = fit_gp(Z, yR), fit_gp(Z, yT)\n","        mR, sR = gR.predict(Zg, return_std=True); mT, sT = gT.predict(Zg, return_std=True)\n","        f_best = yR[ok].min() if ok.any() else yR.max()\n","        pof = norm.cdf((np.log10(DTAIR_MAX_K) - mT) / np.maximum(sT, 1e-12))\n","        acq = expected_improvement(mR, sR, f_best, xi) * pof\n","        acq[~mass_feasible] = 0.0\n","        near = np.min(np.linalg.norm(Zg[:, None, :] - Z[None, :, :], axis=2), axis=1) < 1e-3\n","        acq[near] = 0.0                                        # never re-propose an evaluated design\n","        if acq.max() <= 1e-12:                                 # EI has collapsed: explore where sigma is largest\n","            acq = sR * pof; acq[~mass_feasible | near] = 0.0\n","        z = Zg[np.argmax(acq)]\n","        if np.min(np.linalg.norm(Z - z, axis=1)) < 1e-9: z = np.random.default_rng(len(Z)).random(2)\n","        x = from_unit(z); oz = heat_sink(x[0], x[1])\n","        Z = np.vstack([Z, z]); yR = np.append(yR, np.log10(oz[\"R\"])); yT = np.append(yT, np.log10(oz[\"dT_air\"]))\n","        ok = np.append(ok, (oz[\"mass\"] <= MASS_MAX_KG) and (oz[\"dT_air\"] <= DTAIR_MAX_K))\n","        hist.append(np.min(np.where(ok, 10 ** yR, np.inf)))\n","    return Z, np.array(hist)\n","\n","Zbo, hbo = run_bo()\n","print(f\"best verified feasible R = {hbo[-1]:.5f} K/W  (gap {100 * (hbo[-1] - R_STAR) / R_STAR:.2f}% to R*)\")\n","plt.plot(np.arange(1, len(hbo) + 1), hbo - R_STAR, \"o-\"); plt.yscale(\"log\"); plt.xlabel(\"original-model evaluations\"); plt.ylabel(\"best feasible R − R* (K/W)\"); plt.show()"]},{"cell_type":"markdown","metadata":{},"source":["**Expected output:** the gap typically drops to well below 1% within 24 evaluations (seed dependent). The grid limits precision to its spacing (~0.017 in scaled units)."]},{"cell_type":"markdown","metadata":{},"source":["## Exercises\n","1. Rerun section 2 with `xi=0.0` and `xi=0.1`. How do the sampled locations change?\n","2. In section 3, set the grid to 31×31. What happens to the final gap and why?\n","3. Which uncertainty does PoF rely on, and what happens if the ΔT_air GP is overconfident near the constraint?"]},{"cell_type":"markdown","metadata":{},"source":["**Reference answers.** (1) Larger ξ spreads samples into unexplored valleys before refining. (2) The candidate can only be a grid point; a coarser grid limits how closely the optimum can be approached. (3) The GP’s predictive σ for ΔT_air; overconfidence makes PoF too close to 0 or 1, so infeasible designs may be proposed or promising boundary designs skipped."]},{"cell_type":"markdown","metadata":{},"source":["##  time\n","import numpy as np\n","import pandas as pd\n","import matplotlib.pyplot as plt\n","import scipy, sklearn\n","print(\"Python\", sys.version.split()[0], \"| numpy\", np.__version__, \"| pandas\", pd.__version__,\n","      \"| scipy\", scipy.__version__, \"| scikit-learn\", sklearn.__version__)\n","SEED = 7                                  # change this to test sensitivity to sampling luck\n","rng = np.random.default_rng(SEED)         # one generator for the whole notebook\n","plt.rcParams[\"figure.figsize\"] = (6.4, 4.2)\n","# Gaussian-process hyperparameter fits on small deterministic datasets often emit ConvergenceWarnings from the\n","# L-BFGS optimizer. We silence them to keep output readable and judge models by validation instead.\n","# Remove this filter if you want to see them.\n","import warnings\n","from sklearn.exceptions import ConvergenceWarning\n","warnings.filterwarnings(\"ignore\", category=ConvergenceWarning)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Pedagogical plate-fin heat-sink model: a transparent stand-in for an expensive CFD simulation.\n","# Inputs: fin gap s_mm and fin thickness t_mm (millimetres). Deterministic: no measurement noise.\n","BOUNDS = np.array([[0.8, 3.0],    # s_mm: fin gap (mm)\n","                   [0.2, 1.5]])   # t_mm: fin thickness (mm)\n","MASS_MAX_KG = 0.070               # constraint g1: mass <= 0.070 kg  (cheap: geometry only)\n","DTAIR_MAX_K = 12.0                # constraint g2: air temperature rise <= 12 K (needs flow solution)\n","\n","def heat_sink(s_mm, t_mm):\n","    \"\"\"Return dict with R (K/W), mass (kg), dT_air (K), Re (-). Accepts scalars or NumPy arrays.\"\"\"\n","    W, L, H, tb = 0.050, 0.050, 0.040, 0.004          # base width, flow length, fin height, base thickness (m)\n","    ks, rho_al = 150.0, 2700.0                         # aluminium alloy: W/(m K), kg/m^3\n","    rho, mu, cp, ka = 1.16, 1.85e-5, 1007.0, 0.026     # air: kg/m^3, Pa s, J/(kg K), W/(m K)\n","    dp, Q, Nu = 5.0, 30.0, 7.54                        # fan pressure (Pa), heat load (W), Nusselt (-)\n","    s = np.asarray(s_mm, dtype=float) * 1e-3           # mm -> m  (unit conversion!)\n","    t = np.asarray(t_mm, dtype=float) * 1e-3\n","    N = W / (s + t)                                    # number of fins (continuous)\n","    u = dp * s**2 / (12 * mu * L)                      # laminar parallel-plate channel velocity (m/s)\n","    mdot = rho * u * s * H * N                         # air mass flow (kg/s)\n","    h = Nu * ka / (2 * s)                              # heat-transfer coefficient (W/m^2 K)\n","    m = np.sqrt(2 * h / (ks * t))                      # fin parameter (1/m)\n","    eta = np.tanh(m * H) / (m * H)                     # fin efficiency (-)\n","    UA = h * N * L * (2 * H * eta + s)                 # conductance (W/K)\n","    NTU = UA / (mdot * cp)\n","    R = 1 / (mdot * cp * (1 - np.exp(-NTU))) + tb / (ks * W * L)\n","    mass = rho_al * (N * t * H * L + W * L * tb)\n","    dT_air = Q / (mdot * cp)\n","    Re = rho * u * 2 * s / mu\n","    return {\"R\": R, \"mass\": mass, \"dT_air\": dT_air, \"Re\": Re}\n","\n","def to_unit(X_mm):\n","    \"\"\"Scale physical designs (n, 2) in mm to the unit square using the bounds.\"\"\"\n","    return (np.asarray(X_mm) - BOUNDS[:, 0]) / (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","def from_unit(Z):\n","    \"\"\"Map unit-square points (n, 2) back to physical designs in mm.\"\"\"\n","    return BOUNDS[:, 0] + np.asarray(Z) * (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","R_STAR, S_STAR, T_STAR = 0.57705, 1.8525, 0.3509   # reference constrained optimum (teaching only)\n","assert abs(heat_sink(2.0, 0.8)[\"R\"] - 0.58738853) < 1e-6, \"model check failed - did you edit the model?\"\n","print(\"Model OK. Example: s=2.0 mm, t=0.8 mm ->\", {k: round(float(v), 4) for k, v in heat_sink(2.0, 0.8).items()})"]},{"cell_type":"markdown","metadata":{},"source":["> **Assessment note.** This notebook is self-assessed: the browser course cannot run it, so rate it yourself with the rubric on the course page *Capstone: notebook project*, then compare it with the reference notebook. Replace every TODO, keep all text sections, and run *Restart Kernel and Run All* before you self-assess."]},{"cell_type":"markdown","metadata":{},"source":["## 0. Plan (write before running anything)\n","*TODO in the starter: edit this cell.*\n","\n","| Item | Your choice | Reason |\n","|---|---|---|\n","| Budget split | 16 initial + 14 infill = 30 | |\n","| Initial sampler and seed | | |\n","| Validation strategy | | |\n","| Candidate surrogates | | |\n","| Optimizer and constraint handling | | |\n","| Infill strategy (must suit the chosen surrogate) | | |\n","| Stopping rule (≥ 2 verified infill cycles required) | | |\n","| Number of repeat seeds | | |"]},{"cell_type":"markdown","metadata":{},"source":["## 1. Problem definition\n","Variables: s (0.8–3.0 mm), t (0.2–1.5 mm). Objective: minimize R (K/W). Constraints: mass ≤ 0.070 kg (cheap, exact), ΔT_air ≤ 12 K (treated as expensive). Original model: pedagogical analytical model (not validated product data)."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from scipy.stats import qmc\n","from scipy.optimize import minimize\n","from scipy.interpolate import RBFInterpolator\n","from scipy.stats import norm\n","from sklearn.gaussian_process import GaussianProcessRegressor\n","from sklearn.gaussian_process.kernels import ConstantKernel, RBF\n","from sklearn.pipeline import make_pipeline\n","from sklearn.preprocessing import PolynomialFeatures\n","from sklearn.linear_model import LinearRegression\n","from sklearn.model_selection import KFold, cross_val_predict\n","\n","BUDGET = 30\n","class Simulator:\n","    \"\"\"Counts original-model evaluations and refuses to exceed the budget.\"\"\"\n","    def __init__(self, budget): self.n, self.budget = 0, budget\n","    def __call__(self, Z):\n","        Z = np.atleast_2d(Z)\n","        if self.n + len(Z) > self.budget: raise RuntimeError(\"evaluation budget exceeded\")\n","        self.n += len(Z); X = from_unit(Z); return heat_sink(X[:, 0], X[:, 1])"]},{"cell_type":"markdown","metadata":{},"source":["## 2. Initial sampling"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["sim = Simulator(BUDGET)\n","# TODO: Create a 16-point space-filling initial design Z0 (scaled), evaluate with sim, store yR = log10 R and yT = log10 dT_air\n","# (replace the next line with your code)\n","raise NotImplementedError('TODO: Create a 16-point space-filling initial design Z0 (scaled), evaluate w')\n","X0 = from_unit(Z0)\n","plt.plot(X0[:, 0], X0[:, 1], \"o\"); plt.xlim(*BOUNDS[0]); plt.ylim(*BOUNDS[1]); plt.xlabel(\"s (mm)\"); plt.ylabel(\"t (mm)\"); plt.title(\"Initial design\"); plt.show()\n","print(\"evaluations used:\", sim.n)"]},{"cell_type":"markdown","metadata":{},"source":["## 3–5. Baseline, surrogate comparison and validation (5-fold CV on the initial design)\n","Model choice uses **only** 5-fold cross-validation on the 16 initial designs — affordable under a tight budget because it needs no extra simulations.\n","\n","The 300-design **AUDIT set** below is a *teaching-only* extra: the analytical model is cheap, so we can afford to check how honest the CV estimates were. In a real study these runs would cost as much as the budget itself. They are **not** counted in the 30-evaluation budget and must **not** be used to choose the model."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["class RBFModel:\n","    \"\"\"scipy RBF interpolant with a fit/predict interface.\"\"\"\n","    def fit(self, Z, y): self.f = RBFInterpolator(Z, y, kernel=\"cubic\", degree=1); return self\n","    def predict(self, Z): return self.f(Z)\n","class ConstantBaseline:\n","    \"\"\"Predicts the mean of the training targets. Targets are log10(R), so in K/W the baseline predicts\n","    10**mean(log10 R) = the geometric mean of the training R values.\"\"\"\n","    def fit(self, Z, y): self.c = float(np.mean(y)); return self\n","    def predict(self, Z): return np.full(len(Z), self.c)\n","def gp_model():\n","    return GaussianProcessRegressor(ConstantKernel() * RBF([0.3, 0.3], (1e-2, 1e2)), normalize_y=True, n_restarts_optimizer=3, random_state=0)\n","makers = {\"constant baseline (geometric mean of R)\": ConstantBaseline,\n","          \"quadratic\": lambda: make_pipeline(PolynomialFeatures(2), LinearRegression()),\n","          \"cubic RBF\": RBFModel, \"Gaussian process\": gp_model}\n","cv = KFold(5, shuffle=True, random_state=SEED)\n","# Teaching-only AUDIT set: NOT part of the budget, NOT used for model choice\n","Z_audit = np.random.default_rng(999).random((300, 2)); X_audit = from_unit(Z_audit); R_audit = heat_sink(X_audit[:, 0], X_audit[:, 1])[\"R\"]\n","rows = {}\n","for name, make in makers.items():\n","    # TODO: Step A — cross-validation: for each of the 5 folds fit make() on Z0[tr], yR[tr] and collect errors 10**pred − 10**yR[va] in K/W\n","    #   Hint: errs_k has shape (len(va),); after the loop np.concatenate gives shape (16,)\n","    #   Then compute CV RMSE, CV MAE and CV max |error| from the concatenated errors\n","    # (replace the next line with your code)\n","    raise NotImplementedError('TODO: Step A')\n","    # TODO: Step B — audit only: refit on all of Z0 and compute the RMSE on the audit set (K/W)\n","    #   Hint: e_audit = 10**m.predict(Z_audit) − R_audit has shape (300,)\n","    # (replace the next line with your code)\n","    raise NotImplementedError('TODO: Step B')\n","    rows[name] = {\"CV RMSE (K/W)\": np.sqrt(np.mean(errs ** 2)), \"CV MAE (K/W)\": np.mean(np.abs(errs)), \"CV max |err| (K/W)\": np.abs(errs).max(),\n","                  \"AUDIT RMSE (K/W, teaching only)\": np.sqrt(np.mean(e_audit ** 2))}\n","pd.DataFrame(rows).T.round(4)"]},{"cell_type":"markdown","metadata":{},"source":["**Write here:** which surrogate you choose for optimization and why — base the choice on the **CV columns** only (accuracy, smoothness, uncertainty). Then comment on whether the audit RMSE agrees with the CV estimate.\n","\n","**How this choice is assessed.** Any surrogate that is defensible on the CV evidence is acceptable; the *reasoning* is marked, not the model. A strong answer (1) cites only the CV columns, (2) says whether the differences between the best models are larger than 16 points can resolve, and (3) explains how the chosen model supports the infill step. The loop below uses expected improvement, which needs a predictive standard deviation. If you choose a model **without** one (cubic RBF, polynomial, random forest without a calibrated spread), you must replace expected improvement with an infill rule that does not need σ — for example, minimize the prediction plus a distance-based exploration term, or exploit the predicted minimum subject to a minimum distance from existing samples — and justify it. Using the audit set or any later verification result to make the choice is penalized."]},{"cell_type":"markdown","metadata":{},"source":["## 6–7. Optimization with verification and sequential infill (constrained EI)\n","The loop body is split into five steps. Shapes: `Zg` is the (6561, 2) candidate grid in scaled units; `mR, sR, mT, sT` each have shape (6561,)."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["Zg = np.array([[a, b] for a in np.linspace(0, 1, 81) for b in np.linspace(0, 1, 81)])   # (6561, 2)\n","mass_ok_g = heat_sink(*from_unit(Zg).T)[\"mass\"] <= MASS_MAX_KG                          # (6561,) exact, cheap constraint\n","def ei(mu, sd, fb):\n","    \"\"\"Expected improvement for minimization, with the sigma = 0 limit handled explicitly.\"\"\"\n","    imp = fb - mu; out = np.maximum(imp, 0.0); p = sd > 1e-12; z = imp[p] / sd[p]\n","    out[p] = imp[p] * norm.cdf(z) + sd[p] * norm.pdf(z); return out\n","Z, ok = Z0.copy(), (o0[\"mass\"] <= MASS_MAX_KG) & (o0[ n__, \"| pandas\", pd.__version__,\n","      \"| scipy\", scipy.__version__, \"| scikit-learn\", sklearn.__version__)\n","SEED = 7                                  # change this to test sensitivity to sampling luck\n","rng = np.random.default_rng(SEED)         # one generator for the whole notebook\n","plt.rcParams[\"figure.figsize\"] = (6.4, 4.2)\n","# Gaussian-process hyperparameter fits on small deterministic datasets often emit ConvergenceWarnings from the\n","# L-BFGS optimizer. We silence them to keep output readable and judge models by validation instead.\n","# Remove this filter if you want to see them.\n","import warnings\n","from sklearn.exceptions import ConvergenceWarning\n","warnings.filterwarnings(\"ignore\", category=ConvergenceWarning)"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["# Pedagogical plate-fin heat-sink model: a transparent stand-in for an expensive CFD simulation.\n","# Inputs: fin gap s_mm and fin thickness t_mm (millimetres). Deterministic: no measurement noise.\n","BOUNDS = np.array([[0.8, 3.0],    # s_mm: fin gap (mm)\n","                   [0.2, 1.5]])   # t_mm: fin thickness (mm)\n","MASS_MAX_KG = 0.070               # constraint g1: mass <= 0.070 kg  (cheap: geometry only)\n","DTAIR_MAX_K = 12.0                # constraint g2: air temperature rise <= 12 K (needs flow solution)\n","\n","def heat_sink(s_mm, t_mm):\n","    \"\"\"Return dict with R (K/W), mass (kg), dT_air (K), Re (-). Accepts scalars or NumPy arrays.\"\"\"\n","    W, L, H, tb = 0.050, 0.050, 0.040, 0.004          # base width, flow length, fin height, base thickness (m)\n","    ks, rho_al = 150.0, 2700.0                         # aluminium alloy: W/(m K), kg/m^3\n","    rho, mu, cp, ka = 1.16, 1.85e-5, 1007.0, 0.026     # air: kg/m^3, Pa s, J/(kg K), W/(m K)\n","    dp, Q, Nu = 5.0, 30.0, 7.54                        # fan pressure (Pa), heat load (W), Nusselt (-)\n","    s = np.asarray(s_mm, dtype=float) * 1e-3           # mm -> m  (unit conversion!)\n","    t = np.asarray(t_mm, dtype=float) * 1e-3\n","    N = W / (s + t)                                    # number of fins (continuous)\n","    u = dp * s**2 / (12 * mu * L)                      # laminar parallel-plate channel velocity (m/s)\n","    mdot = rho * u * s * H * N                         # air mass flow (kg/s)\n","    h = Nu * ka / (2 * s)                              # heat-transfer coefficient (W/m^2 K)\n","    m = np.sqrt(2 * h / (ks * t))                      # fin parameter (1/m)\n","    eta = np.tanh(m * H) / (m * H)                     # fin efficiency (-)\n","    UA = h * N * L * (2 * H * eta + s)                 # conductance (W/K)\n","    NTU = UA / (mdot * cp)\n","    R = 1 / (mdot * cp * (1 - np.exp(-NTU))) + tb / (ks * W * L)\n","    mass = rho_al * (N * t * H * L + W * L * tb)\n","    dT_air = Q / (mdot * cp)\n","    Re = rho * u * 2 * s / mu\n","    return {\"R\": R, \"mass\": mass, \"dT_air\": dT_air, \"Re\": Re}\n","\n","def to_unit(X_mm):\n","    \"\"\"Scale physical designs (n, 2) in mm to the unit square using the bounds.\"\"\"\n","    return (np.asarray(X_mm) - BOUNDS[:, 0]) / (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","def from_unit(Z):\n","    \"\"\"Map unit-square points (n, 2) back to physical designs in mm.\"\"\"\n","    return BOUNDS[:, 0] + np.asarray(Z) * (BOUNDS[:, 1] - BOUNDS[:, 0])\n","\n","R_STAR, S_STAR, T_STAR = 0.57705, 1.8525, 0.3509   # reference constrained optimum (teaching only)\n","assert abs(heat_sink(2.0, 0.8)[\"R\"] - 0.58738853) < 1e-6, \"model check failed - did you edit the model?\"\n","print(\"Model OK. Example: s=2.0 mm, t=0.8 mm ->\", {k: round(float(v), 4) for k, v in heat_sink(2.0, 0.8).items()})"]},{"cell_type":"markdown","metadata":{},"source":["> **Assessment note.** This notebook is self-assessed: the browser course cannot run it, so rate it yourself with the rubric on the course page *Capstone: notebook project*, then compare it with the reference notebook. Replace every TODO, keep all text sections, and run *Restart Kernel and Run All* before you self-assess."]},{"cell_type":"markdown","metadata":{},"source":["## 0. Plan (write before running anything)\n","*TODO in the starter: edit this cell.*\n","\n","| Item | Your choice | Reason |\n","|---|---|---|\n","| Budget split | 16 initial + 14 infill = 30 | |\n","| Initial sampler and seed | | |\n","| Validation strategy | | |\n","| Candidate surrogates | | |\n","| Optimizer and constraint handling | | |\n","| Infill strategy (must suit the chosen surrogate) | | |\n","| Stopping rule (≥ 2 verified infill cycles required) | | |\n","| Number of repeat seeds | | |"]},{"cell_type":"markdown","metadata":{},"source":["## 1. Problem definition\n","Variables: s (0.8–3.0 mm), t (0.2–1.5 mm). Objective: minimize R (K/W). Constraints: mass ≤ 0.070 kg (cheap, exact), ΔT_air ≤ 12 K (treated as expensive). Original model: pedagogical analytical model (not validated product data)."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["from scipy.stats import qmc\n","from scipy.optimize import minimize\n","from scipy.interpolate import RBFInterpolator\n","from scipy.stats import norm\n","from sklearn.gaussian_process import GaussianProcessRegressor\n","from sklearn.gaussian_process.kernels import ConstantKernel, RBF\n","from sklearn.pipeline import make_pipeline\n","from sklearn.preprocessing import PolynomialFeatures\n","from sklearn.linear_model import LinearRegression\n","from sklearn.model_selection import KFold, cross_val_predict\n","\n","BUDGET = 30\n","class Simulator:\n","    \"\"\"Counts original-model evaluations and refuses to exceed the budget.\"\"\"\n","    def __init__(self, budget): self.n, self.budget = 0, budget\n","    def __call__(self, Z):\n","        Z = np.atleast_2d(Z)\n","        if self.n + len(Z) > self.budget: raise RuntimeError(\"evaluation budget exceeded\")\n","        self.n += len(Z); X = from_unit(Z); return heat_sink(X[:, 0], X[:, 1])"]},{"cell_type":"markdown","metadata":{},"source":["## 2. Initial sampling"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["sim = Simulator(BUDGET)\n","Z0 = qmc.LatinHypercube(d=2, optimization=\"random-cd\", seed=SEED).random(16)\n","o0 = sim(Z0)\n","yR, yT = np.log10(o0[\"R\"]), np.log10(o0[\"dT_air\"])\n","X0 = from_unit(Z0)\n","plt.plot(X0[:, 0], X0[:, 1], \"o\"); plt.xlim(*BOUNDS[0]); plt.ylim(*BOUNDS[1]); plt.xlabel(\"s (mm)\"); plt.ylabel(\"t (mm)\"); plt.title(\"Initial design\"); plt.show()\n","print(\"evaluations used:\", sim.n)"]},{"cell_type":"markdown","metadata":{},"source":["## 3–5. Baseline, surrogate comparison and validation (5-fold CV on the initial design)\n","Model choice uses **only** 5-fold cross-validation on the 16 initial designs — affordable under a tight budget because it needs no extra simulations.\n","\n","The 300-design **AUDIT set** below is a *teaching-only* extra: the analytical model is cheap, so we can afford to check how honest the CV estimates were. In a real study these runs would cost as much as the budget itself. They are **not** counted in the 30-evaluation budget and must **not** be used to choose the model."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["class RBFModel:\n","    \"\"\"scipy RBF interpolant with a fit/predict interface.\"\"\"\n","    def fit(self, Z, y): self.f = RBFInterpolator(Z, y, kernel=\"cubic\", degree=1); return self\n","    def predict(self, Z): return self.f(Z)\n","class ConstantBaseline:\n","    \"\"\"Predicts the mean of the training targets. Targets are log10(R), so in K/W the baseline predicts\n","    10**mean(log10 R) = the geometric mean of the training R values.\"\"\"\n","    def fit(self, Z, y): self.c = float(np.mean(y)); return self\n","    def predict(self, Z): return np.full(len(Z), self.c)\n","def gp_model():\n","    return GaussianProcessRegressor(ConstantKernel() * RBF([0.3, 0.3], (1e-2, 1e2)), normalize_y=True, n_restarts_optimizer=3, random_state=0)\n","makers = {\"constant baseline (geometric mean of R)\": ConstantBaseline,\n","          \"quadratic\": lambda: make_pipeline(PolynomialFeatures(2), LinearRegression()),\n","          \"cubic RBF\": RBFModel, \"Gaussian process\": gp_model}\n","cv = KFold(5, shuffle=True, random_state=SEED)\n","# Teaching-only AUDIT set: NOT part of the budget, NOT used for model choice\n","Z_audit = np.random.default_rng(999).random((300, 2)); X_audit = from_unit(Z_audit); R_audit = heat_sink(X_audit[:, 0], X_audit[:, 1])[\"R\"]\n","rows = {}\n","for name, make in makers.items():\n","    errs = []\n","    for tr, va in cv.split(Z0):\n","        m = make().fit(Z0[tr], yR[tr])                       # fitted on the training fold only (baseline too)\n","        errs.append(10 ** m.predict(Z0[va]) - 10 ** yR[va])\n","    errs = np.concatenate(errs)\n","    m = make().fit(Z0, yR); e_audit = 10 ** m.predict(Z_audit) - R_audit\n","    rows[name] = {\"CV RMSE (K/W)\": np.sqrt(np.mean(errs ** 2)), \"CV MAE (K/W)\": np.mean(np.abs(errs)), \"CV max |err| (K/W)\": np.abs(errs).max(),\n","                  \"AUDIT RMSE (K/W, teaching only)\": np.sqrt(np.mean(e_audit ** 2))}\n","pd.DataFrame(rows).T.round(4)"]},{"cell_type":"markdown","metadata":{},"source":["**Write here:** which surrogate you choose for optimization and why — base the choice on the **CV columns** only (accuracy, smoothness, uncertainty). Then comment on whether the audit RMSE agrees with the CV estimate.\n","\n","**How this choice is assessed.** Any surrogate that is defensible on the CV evidence is acceptable; the *reasoning* is marked, not the model. A strong answer (1) cites only the CV columns, (2) says whether the differences between the best models are larger than 16 points can resolve, and (3) explains how the chosen model supports the infill step. The loop below uses expected improvement, which needs a predictive standard deviation. If you choose a model **without** one (cubic RBF, polynomial, random forest without a calibrated spread), you must replace expected improvement with an infill rule that does not need σ — for example, minimize the prediction plus a distance-based exploration term, or exploit the predicted minimum subject to a minimum distance from existing samples — and justify it. Using the audit set or any later verification result to make the choice is penalized."]},{"cell_type":"markdown","metadata":{},"source":["*Reference discussion:* every surrogate clearly beats the constant baseline in CV. On CV alone the cubic RBF and the GP are close (CV RMSE ≈ 0.24 vs 0.25 K/W — a difference well within what 16 points can resolve). The GP is chosen because the sequential infill below needs a predictive standard deviation, which the RBF does not provide. The audit set — looked at only *after* the choice — happens to show the GP as most accurate; that check must not be used to make the choice."]},{"cell_type":"markdown","metadata":{},"source":["## 6–7. Optimization with verification and sequential infill (constrained EI)\n","The loop body is split into five steps. Shapes: `Zg` is the (6561, 2) candidate grid in scaled units; `mR, sR, mT, sT` each have shape (6561,)."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["Zg = np.array([[a, b] for a in np.linspace(0, 1, 81) for b in np.linspace(0, 1, 81)])   # (6561, 2)\n","mass_ok_g = heat_sink(*from_unit(Zg).T)[\"mass\"] <= MASS_MAX_KG                          # (6561,) exact, cheap constraint\n","def ei(mu, sd, fb):\n","    \"\"\"Expected improvement for minimization, with the sigma = 0 limit handled explicitly.\"\"\"\n","    imp = fb - mu; out = np.maximum(imp, 0.0); p = sd > 1e-12; z = imp[p] / sd[p]\n","    out[p] = imp[p] * norm.cdf(z) + sd[p] * norm.pdf(z); return out\n","Z, ok = Z0.copy(), (o0[\"mass\"] <= MASS_MAX_KG) & (o0[\"dT_air\"] <= DTAIR_MAX_K)\n","log = []\n","while sim.n < BUDGET:\n","    gR, gT = gp_model().fit(Z, yR), gp_model().fit(Z, yT)\n","    mR, sR = gR.predict(Zg, return_std=True); mT, sT = gT.predict(Zg, return_std=True)\n","    EI_R = ei(mR, sR, yR[ok].min())\n","    PoF = norm.cdf((np.log10(DTAIR_MAX_K) - mT) / np.maximum(sT, 1e-12))\n","    acq = EI_R * PoF\n","    near = np.min(np.linalg.norm(Zg[:, None, :] - Z[None, :, :], axis=2), axis=1) < 1e-3\n","    acq[~mass_ok_g | near] = 0\n","    if acq.max() <= 1e-12:                    # EI collapsed (converged): explore the most uncertain mass-feasible design\n","        acq = sR * PoF; acq[~mass_ok_g | near] = 0\n","    z = Zg[int(np.argmax(acq))]\n","    o = sim(z)\n","    Z = np.vstack([Z, z]); yR = np.append(yR, np.log10(o[\"R\"])); yT = np.append(yT, np.log10(o[\"dT_air\"]))\n","    ok = np.append(ok, (o[\"mass\"][0] <= MASS_MAX_KG) and (o[\"dT_air\"][0] <= DTAIR_MAX_K))\n","    x = from_unit(z); log.append(dict(evals=sim.n, s_mm=x[0], t_mm=x[1], R_pred=10 ** gR.predict(z[None])[0], R_verified=o[\"R\"][0],\n","                                      dT_pred=10 ** gT.predict(z[None])[0], dT_verified=o[\"dT_air\"][0], mass_kg=o[\"mass\"][0], feasible=bool(ok[-1])))\n","log = pd.DataFrame(log); display(log.round(4))\n","print(\"evaluations used:\", sim.n)"]},{"cell_type":"markdown","metadata":{},"source":["## 7b. Stopping decision (required)\n","The capstone requires **at least two verified surrogate optimize → verify cycles** (infill evaluations) **and** a written justification of when you stopped. The cell below counts your cycles and shows when a simple stagnation rule (Lab 8: relative improvement of the best verified feasible R below `TOL` over the last `WINDOW` evaluations) *would* have stopped the loop."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["n_cycles = len(log)\n","print(\"verified surrogate optimize -> verify cycles:\", n_cycles)\n","assert n_cycles >= 2, \"The capstone requires at least two verified optimize -> verify cycles.\"\n","WINDOW, TOL = 5, 1e-3\n","bh = np.minimum.accumulate(np.where(ok, 10 ** yR, np.inf))           # best verified feasible R after each evaluation\n","stop_at = None\n","for k in range(16 + WINDOW - 1, len(bh)):                            # only infill evaluations can trigger the rule\n","    if np.isfinite(bh[k - WINDOW]) and (bh[k - WINDOW] - bh[k]) / bh[k - WINDOW] < TOL:\n","        stop_at = k + 1; break\n","print(f\"stagnation rule (window {WINDOW}, tol {TOL:g}) would have stopped after evaluation:\", stop_at if stop_at else \"not triggered\")\n","if stop_at: print(f\"  evaluations that rule would have saved: {len(bh) - stop_at}; best R then {bh[stop_at - 1]:.5f} vs final {bh[-1]:.5f} K/W\")"]},{"cell_type":"markdown","metadata":{},"source":["**Write here:** which stopping rule you would defend for this study (budget exhausted, expected improvement below a threshold, or stagnation) and why. Use the numbers above: how many evaluations would an earlier stop have saved, and what would it have cost in final R?"]},{"cell_type":"markdown","metadata":{},"source":["*Reference note (based on the reference execution recorded in this notebook’s testing-status cell):* the first few infill points converge onto the mass boundary near s ≈ 1.85 mm, t ≈ 0.35 mm. After that EI collapses (the GP is nearly certain no grid point improves), and the fallback spends the remaining budget exploring uncertain feasible regions. Section 7b quantifies how many evaluations a stagnation rule would have saved — discuss this in your report."]},{"cell_type":"markdown","metadata":{},"source":["## 8. Result and progress"]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["Rall = 10 ** yR; best_i = np.argmin(np.where(ok, Rall, np.inf)); xb = from_unit(Z[best_i]); ob = heat_sink(*xb)\n","print(f\"BEST VERIFIED FEASIBLE DESIGN: s = {xb[0]:.3f} mm, t = {xb[1]:.3f} mm\")\n","print(f\"  R = {ob['R']:.5f} K/W, mass = {ob['mass']:.4f} kg (margin {MASS_MAX_KG - ob['mass']:.4f}), dT_air = {ob['dT_air']:.2f} K (margin {DTAIR_MAX_K - ob['dT_air']:.2f})\")\n","print(f\"  gap to teaching reference R*: {100 * (ob['R'] - R_STAR) / R_STAR:.2f}%\")\n","best_hist = np.minimum.accumulate(np.where(ok, Rall, np.inf))\n","plt.plot(np.arange(1, len(best_hist) + 1), best_hist, \"o-\"); plt.axhline(R_STAR, ls=\"--\", c=\"k\")\n","plt.xlabel(\"original-model evaluations\"); plt.ylabel(\"best verified feasible R (K/W)\"); plt.show()"]},{"cell_type":"markdown","metadata":{},"source":["## 9. Repeats over seeds\n","*Wrap sections 2–8 in a function and repeat for at least 3 seeds; report median and range of the final gap. Compare with random search at the same budget.*"]},{"cell_type":"markdown","metadata":{},"source":["*Reference note:* because the acquisition is maximized on a fixed 81×81 grid, different seeds can end at the same grid node and report identical gaps. A continuous optimizer of the acquisition (multi-start L-BFGS-B) would remove this resolution limit."]},{"cell_type":"code","execution_count":null,"metadata":{},"outputs":[],"source":["def study(seed):\n","    s = Simulator(BUDGET); Zs = qmc.LatinHypercube(d=2, optimization=\"random-cd\", seed=seed).random(16); o = s(Zs)\n","    a, b = np.log10(o[\"R\"]), np.log10(o[\"dT_air\"]); okk = (o[\"mass\"] <= MASS_MAX_KG) & (o[\"dT_air\"] <= DTAIR_MAX_K)\n","    while s.n < BUDGET:\n","        gR, gT = gp_model().fit(Zs, a), gp_model().fit(Zs, b)\n","        mR, sR = gR.predict(Zg, return_std=True); mT, sT = gT.predict(Zg, return_std=True)\n","        acq = ei(mR, sR, a[okk].min() if okk.any() else a.max()) * norm.cdf((np.log10(DTAIR_MAX_K) - mT) / np.maximum(sT, 1e-12)); acq[~mass_ok_g] = 0\n","        near = np.min(np.linalg.norm(Zg[:, None, :] - Zs[None, :, :], axis=2), axis=1) < 1e-3; acq[near] = 0\n","        if acq.max() <= 1e-12: acq = sR * norm.cdf((np.log10(DTAIR_MAX_K) - mT) / np.maximum(sT, 1e-12)); acq[~mass_ok_g | near] = 0\n","        z = Zg[int(np.argmax(acq))]\n","        if np.min(np.linalg.norm(Zs - z, axis=1)) < 1e-9: z = np.random.default_rng(s.n + seed).random(2)\n","        oz = s(z); Zs = np.vstack([Zs, z]); a = np.append(a, np.log10(oz[\"R\"])); b = np.append(b, np.log10(oz[\"dT_air\"]))\n","        okk = np.append(okk, (oz[\"mass\"][0] <= MASS_MAX_KG) and (oz[\"dT_air\"][0] <= DTAIR_MAX_K))\n","    return 100 * (np.min(np.where(okk, 10 ** a, np.inf)) - R_STAR) / R_STAR\n","def random_search(seed):\n","    o = heat_sink(*from_unit(np.random.default_rng(seed).random((BUDGET, 2))).T)\n","    return 100 * (np.min(np.where((o[\"mass\"] <= MASS_MAX_KG) & (o[\"dT_air\"] <= DTAIR_MAX_K), o[\"R\"], np.inf)) - R_STAR) / R_STAR\n","rep = pd.DataFrame({\"constrained BO gap (%)\": [study(sd) for sd in range(3)], \"random search gap (%)\": [random_search(sd) for sd in range(3)]}, index=[f\"seed {sd}\" for sd in range(3)])\n","display(rep.round(3)); print(rep.median().round(3))"]},{"cell_type":"markdown","metadata":{},"source":["## 10. Report (write in this cell)\n","*Replace with ~800–1 200 words:* summary of the plan; surrogate comparison and validation (with table/figure references) and the reasoning behind your model choice; verification table discussion (predicted vs verified, optimism); stopping decision; final design with margins; repeats and comparison with random search; **limitations** (pedagogical model assumptions, extrapolation, uncertainty calibration, budget, grid resolution of the acquisition search); what evidence would be needed for a real heat sink."]},{"cell_type":"markdown","metadata":{},"source":["## 11. Reproducibility record and AI-use statement\n","*Fill in:* package versions (printed at the top), seeds used, budget, any deviations from the plan, and how (if at all) AI tools were used, following any rules that apply to you."]},{"cell_type":"markdown","metadata":{},"source":["### Debugging tips\n","- `NameError`: a cell above was not run (run all cells from the top) or a name is misspelled.\n","- `ValueError` about shapes: print `.shape`; scikit-learn needs `X` with shape `(n_samples, n_features)` — us const modById = id => COURSE.modules.find(m => m.id === id);
function allCards() { return COURSE.modules.flatMap(m => m.flashcards.map((c, i) => Object.assign({ id: m.id + 'c' + (i + 1), mod: m.id }, c))); }
function quizRec(key) { if (key === 'final') return P.final; if (!P.quizzes[key]) P.quizzes[key] = { attempts: [] }; return P.quizzes[key]; }
function bestLatest(rec) { const a = rec && rec.attempts || []; if (!a.length) return { best: null, latest: null, n: 0 }; return { best: Math.max(...a.map(x => x.score)), latest: a[a.length - 1].score, n: a.length }; }
/* Capstone: only attempts with at least one verified surrogate optimize→verify cycle ("practical" attempts) count */
function capBest() { const a = P.capstone.attempts || []; const v = a.filter(x => x.practical); return { best: v.length ? Math.max(...v.map(x => x.score)) : null, latest: a.length ? a[a.length - 1].score : null, n: a.length, nValid: v.length }; }
function lessonsDone(m) { return m.lessons.filter(l => P.lessons[l.id]).length; }
function modStatus(m) { const bl = bestLatest(P.quizzes[m.id]); const ld = lessonsDone(m); if (bl.best !== null && bl.best >= CONFIG.passMark) return 'done'; if (bl.n > 0 && bl.best < CONFIG.passMark) return 'fail'; if (ld > 0) return 'part'; return ''; }

/* ---------------- Grading (transparent, unrounded) ---------------- */
function computeGrade() {
  const mods = COURSE.modules.map(m => { const bl = bestLatest(P.quizzes[m.id]); return { id: m.id, num: m.num, title: m.title, best: bl.best, latest: bl.latest, attempts: bl.n, passed: bl.best !== null && bl.best >= CONFIG.passMark }; });
  const quizAvg = mods.reduce((s, m) => s + (m.best || 0), 0) / mods.length;
  const fb = bestLatest(P.final); const cb = capBest();
  const finalBest = fb.best || 0, capB = cb.best || 0;
  const overall = CONFIG.weights.quizzes * quizAvg + CONFIG.weights.final * finalBest + CONFIG.weights.capstone * capB;
  const band = gradeBand(overall);
  const checks = [
    { label: 'Every module quiz passed at ' + CONFIG.passMark + '% or above', ok: mods.every(m => m.passed) },
    { label: 'Final assessment passed at ' + CONFIG.passMark + '% or above', ok: fb.best !== null && fb.best >= CONFIG.passMark },
    { label: 'Interactive capstone exercise passed at ' + CONFIG.passMark + '% or above in an attempt containing at least one completed surrogate optimize → original-model verify cycle', ok: cb.best !== null && cb.best >= CONFIG.passMark },
    { label: 'Overall accomplishment grade at least ' + CONFIG.passMark + '%', ok: overall >= CONFIG.passMark }
  ];
  return { mods, quizAvg, final: fb, capstone: cb, overall, band, checks, eligible: checks.every(c => c.ok) };
}
function gradeBand(x) { for (const b of CONFIG.bands) if (x >= b.min) return b.name; return 'Not yet completed'; }

/* ---------------- Quiz engine ---------------- */
function instantiate(slots, seed) {
  const master = RNG(seed);
  return slots.map((variants, i) => {
    const pick = master.int(variants.length);
    const base = variants[pick]; const rng = RNG((seed ^ ((i + 1) * 2654435761)) >>> 0);
    let q;
    if (base.type === 'gen') { const g = base.gen(rng); q = Object.assign({ id: base.id, concept: base.concept, type: 'num', tolAbs: 0, tolRel: 0 }, g); }
    else q = Object.assign({}, base);
    if (q.type === 'mc' || q.type === 'ms') q.order = q.noShuffle ? q.options.map((_, k) => k) : rng.shuffle(q.options.map((_, k) => k));
    q.pick = pick; return q;
  });
}
/* Multiple-select score: max(0, TP/C − FP/I), with C = number of correct options and I = number of incorrect options.
   Selections are deduplicated and invalid indices ignored. If an item had no incorrect options (I = 0), the score is TP/C. */
function msScore(q, given) {
  if (!Array.isArray(given)) return 0;
  const ans = new Set(q.answer); const n = Array.isArray(q.options) ? q.options.length : Math.max(-1, ...q.answer, ...given.filter(Number.isInteger)) + 1;
  const sel = [...new Set(given.filter(x => Number.isInteger(x) && x >= 0 && x < n))]; if (!sel.length) return 0;
  const C = ans.size, I = n - C; let tp = 0, fp = 0; for (const g of sel) ans.has(g) ? tp++ : fp++;
  const s = I > 0 ? tp / C - fp / I : tp / C;
  return U.clamp(s, 0, 1);
}
function gradeQ(q, given) {
  if (q.type === 'mc') return (given === q.answer) ? 1 : 0;
  if (q.type === 'ms') return msScore(q, given);
  if (q.type === 'num') { const x = parseNum(given); if (x === null || !isFinite(q.answer)) return 0; const tol = Math.max(q.tolAbs || 0, (q.tolRel || 0) * Math.abs(q.answer)); return Math.abs(x - q.answer) <= tol * (1 + 1e-9) + 1e-12 ? 1 : 0; }
  return 0;
}
function parseNum(s) { if (s == null) return null; const t = String(s).trim().replace(/\s+/g, '').replace(/−/g, '-'); if (!/^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(t)) return null; const v = parseFloat(t); return isFinite(v) ? v : null; }
function isAnswered(q, given) { if (q.type === 'mc') return Number.isInteger(given); if (q.type === 'ms') return Array.isArray(given) && given.length > 0; return given != null && String(given).trim() !== ''; }
function tolText(q) { const parts = []; if (q.tolAbs) parts.push('±' + U.fmt(q.tolAbs, 4) + (q.unit ? ' ' + q.unit : '')); if (q.tolRel) parts.push('±' + (q.tolRel * 100).toFixed(1).replace(/\.0$/, '') + '% of the correct value'); return parts.length ? 'Accepted if within ' + parts.join(' or ') + ' (whichever is larger).' : 'Exact value required.'; }
/* Rounding guidance shown before submission: enough digits that rounding cannot push a correct answer outside the tolerance */
function roundingHint(q) {
  if (!isFinite(q.answer)) return '';
  const tol = Math.max(q.tolAbs || 0, (q.tolRel || 0) * Math.abs(q.answer)); if (!(tol > 0)) return 'Give the exact value.';
  const dp = Math.max(0, Math.ceil(-Math.log10(tol / 5)));
  return dp === 0 ? 'Rounding to whole numbers is fine; keep full precision in intermediate steps.' : `Round your final answer to at least ${dp} decimal place${dp > 1 ? 's' : ''} (keep full precision in intermediate steps).`;
}
function answerText(q, given) {
  if (q.type === 'mc') return Number.isInteger(given) && given < q.options.length ? q.options[given] : '<i>no answer</i>';
  if (q.type === 'ms') return Array.isArray(given) && given.length ? [...new Set(given)].filter(i => i < q.options.length).map(i => q.options[i]).join('; ') : '<i>no answer</i>';
  return given != null && String(given).trim() !== '' ? U.esc(given) + (q.unit ? ' ' + U.esc(q.unit) : '') : '<i>no answer</i>';
}
function correctText(q) { if (q.type === 'mc') return q.options[q.answer] ?? '—'; if (q.type === 'ms') return q.answer.map(i => q.options[i]).join('; '); return isFinite(q.answer) ? U.fmt(q.answer, 4) + (q.unit ? ' ' + q.unit : '') : '—'; }

const GRADING_RULES = `<ul class="small">
<li><b>Multiple choice (one answer):</b> 1 point if correct, otherwise 0.</li>
<li><b>Multiple select (“select all that apply”):</b> score = max(0, TP/C − FP/I), where TP = correct options you selected, C = number of correct options, FP = incorrect options you selected and I = number of incorrect options. Every item has at least one incorrect option, so selecting every option gives TP/C − FP/I = 1 − 1 = 0; selecting nothing also gives 0. Example: 2 correct and 3 incorrect options; you pick both correct and one incorrect → 2/2 − 1/3 = 0.67 point.</li>
<li><b>Numerical:</b> enter a plain number (decimal point, optional exponent such as 2.5e-3) in the unit shown. The tolerance and recommended rounding are shown under each question <i>before</i> you submit. 1 point if within the tolerance (boundary values are accepted), otherwise 0.</li>
<li>Unanswered questions score 0. Quiz score = total points ÷ number of questions × 100. Pass mark: ${CONFIG.passMark}%.</li>
<li>Each attempt draws one variant for each question slot. Variants in a slot are written to test the same concept at a similar level; this is an authoring intention, not a statistically verified equivalence. All attempts are kept; your <b>best</b> attempt counts towards the course grade.</li></ul>`;

   <div class="stat"><span class="muted small">Best (counts)</span><b>${bl.best === null ? '—' : U.fixed(bl.best, 1) + '%'}</b></div><div class="stat"><span class="muted small">Latest</span><b>${bl.latest === null ? '—' : U.fixed(bl.latest, 1) + '%'}</b></div><div class="stat"><span class="muted small">Attempts</span><b>${bl.n}</b></div></div>

}

function startAttempt(container, key, slots, meta) {
  if (!P.drafts[key] || P.drafts[key].bank !== BANK_VERSION) { P.drafts[key] = { seed: (Math.random() * 4294967295) >>> 0, bank: BANK_VERSION, answers: new Array(slots.length).fill(null) }; save(); }
  const d = P.drafts[key]; const qs = instantiate(slots, d.seed);
  container.innerHTML = '';
  container.appendChild(U.el('div', { class: 'notice', html: `<b>${meta.title}</b> — ${slots.length} questions. Answers are saved as you go. Solutions are shown only after you submit. <details><summary>Grading rules</summary>${GRADING_RULES}</details>` }));
  const form = U.el('form', { novalidate: true, onsubmit: e => e.preventDefault() });
  qs.forEach((q, i) => form.appendChild(questionEl(q, i, d.answers[i], v => { d.answers[i] = v; save(); const qe = form.querySelector(`[data-qi="${i}"]`); if (qe && isAnswered(q, v)) qe.classList.remove('unanswered'); })));
  container.appendChild(form);
  const status = U.el('p', { class: 'small muted', 'aria-live': 'polite' });
  const submit = U.el('button', { class: 'btn primary', type: 'button', text: 'Submit answers', onclick: () => {
    const un = qs.map((q, i) => isAnswered(q, d.answers[i]) ? -1 : i).filter(i => i >= 0);
    form.querySelectorAll('.q').forEach(e => e.classList.remove('unanswered'));
    un.forEach(i => form.querySelector(`[data-qi="${i}"]`).classList.add('unanswered'));
    const go = () => finishAttempt(container, key, slots, meta, qs, d);
    if (un.length) confirmModal(`You have ${un.length} unanswered question${un.length > 1 ? 's' : ''}: ${un.map(i => 'Q' + (i + 1)).join(', ')}. Unanswered questions score 0. They are highlighted in the quiz.`, 'Submit anyway', go, 'Keep working');
    else confirmModal('Submit this attempt for grading? You cannot change answers after submission.', 'Submit', go, 'Cancel');
  } });
  container.appendChild(U.el('div', { class: 'btnrow' }, submit, U.el('button', { class: 'btn', type: 'button', text: 'Back to quiz overview', onclick: () => renderQuiz(container, key, slots, meta) })));
  container.appendChild(status);
  container.querySelector('.q input, .q button')?.focus();
}

function questionEl(q, i, given, onChange, review) {
  const box = U.el('div', { class: 'q', 'data-qi': i });
  const typeLabel = { mc: 'Multiple choice — choose one', ms: 'Multiple select — choose all that apply', num: 'Numerical answer' }[q.type];
  box.appendChild(U.el('div', { class: 'qhead' }, U.el('span', { text: 'Question ' + (i + 1) + ' · ' + typeLabel }), U.el('span', { text: q.concept })));
  const fs = U.el('fieldset'); const lg = U.el('legend', { html: q.stem }); fs.appendChild(lg);
  if (q.visual) { const f = U.el('div', { html: q.visual }); fs.appendChild(f); setTimeout(() => mountVisuals(f), 0); }
  const name = 'q' + i + '_' + Math.random().toString(36).slice(2, 7);
  if (q.type === 'mc' || q.type === 'ms') {
    const sel = q.type === 'mc' ? given : (Array.isArray(given) ? given.slice() : []);
    q.order.forEach(oi => {
      const inp = U.el('input', { type: q.type === 'mc' ? 'radio' : 'checkbox', name, value: oi, disabled: !!review });
      if (q.type === 'mc' ? sel === oi : sel.includes(oi)) inp.checked = true;
      const lab = U.el('label', { class: 'opt' }, inp, U.el('span', { html: q.options[oi] }));
      if (review) {
        const isAns = q.type === 'mc' ? q.answer === oi : q.answer.includes(oi);
        if (inp.checked && isAns) lab.classList.add('correct'); else if (inp.checked && !isAns) lab.classList.add('wrong'); else if (!inp.checked && isAns) lab.classList.add('missed');
      }
      inp.addEventListener('change', () => {
        if (q.type === 'mc') onChange(oi);
        else { const cur = [...fs.querySelectorAll('input:checked')].map(e => +e.value); onChange(cur); }
      });
      fs.appendChild(lab);
      if (review && q.fbs && q.fbs[oi]) fs.appendChild(U.el('div', { class: 'optfb', html: (q.type === 'mc' ? (q.answer === oi ? '✓ ' : '✗ ') : (q.answer.includes(oi) ? '✓ ' : '✗ ')) + q.fbs[oi] }));
    });
  } else {
    const id = name + 'n';
    const inp = U.el('input', { type: 'text', inputmode: 'decimal', id, value: given == null ? '' : given, disabled: !!review, 'aria-describedby': id + 'h', autocomplete: 'off' });
    inp.addEventListener('input', () => onChange(inp.value));
    fs.appendChild(U.el('div', { class: 'numrow' }, U.el('label', { for: id, text: 'Answer:' }), inp, U.el('span', { text: q.unit || '(dimensionless)' })));
    fs.appendChild(U.el('div', { class: 'small muted', id: id + 'h', text: 'Enter a number in the unit shown. ' + tolText(q) + ' ' + (review ? '' : roundingHint(q)) }));
  }
  box.appendChild(fs);
  return box;
}

function finishAttempt(container, key, slots, meta, qs, d) {
  const points = qs.map((q, i) => gradeQ(q, d.answers[i]));
  const score = 100 * points.reduce((s, v) => s + v, 0) / qs.length;
  const att = { ts: new Date().toISOString(), seed: d.seed, bank: BANK_VERSION, picks: qs.map(q => q.pick), answers: d.answers.slice(), points, score, passed: score >= CONFIG.passMark };
  quizRec(key).attempts.push(att); delete P.drafts[key]; save();
  showResult(container, key, slots, meta, att, quizRec(key).attempts.length - 1);
}

function showResult(container, key, slots, meta, att, idx) {

   <div class="scorebox"><div class="bigscore">${U.fixed(att.score, 1)}%</div><div>${att.score >= CONFIG.passMark ? '<span class="pill ok">Passed</span>' : '<span class="pill bad">Not yet passed</span>'} <span class="pill">Pass mark ${CONFIG.passMark}%</span><br>
   <span class="small muted">Best: ${U.fixed(bl.best, 1)}% (counts towards grade) · Latest: ${U.fixed(bl.latest, 1)}% · Attempts: ${bl.n}</span></div></div>
   ${Object.keys(weak).length ? `<h4>Concepts to review</h4><p>${Object.entries(weak).map(([c, n]) => `<span class="pill warn">${U.esc(c)}${n > 1 ? ' ×' + n : ''}</span>`).join(' ')}</p>` : '<p class="notice ok">All questions fully correct.</p>'}
   ${meta.reviewLink ? `<p class="small">Revisit the lessons: ${meta.reviewLink}</p>` : ''}`;
  container.appendChild(head);

    qe.appendChild(fb); container.appendChild(qe);

    U.el('button', { class: 'btn', text: 'Back to quiz overview', onclick: () => renderQuiz(container, key, slots, meta) }),
    U.el('a', { class: 'btn', href: '#/mistakes', text: 'Review all mistakes' })));
  container.scrollIntoView({ block: 'start' });
}

/* ---------------- Modal / toast ---------------- */
function confirmModal(msg, okText, onOk, cancelText = 'Cancel', danger = false) {
  const prev = document.activeElement;
  const back = U.el('div', { class: 'modal-back' }); const m = U.el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'mdlT', 'aria-describedby': 'mdlD' });
  m.appendChild(U.el('h3', { id: 'mdlT', text: 'Please confirm', style: 'margin-top:0' })); m.appendChild(U.el('p', { id: 'mdlD', text: msg }));
  // isolate the background: everything else becomes inert (not focusable, hidden from assistive technology) while the dialog is open
  const others = [...document.body.children].filter(e => e !== back && !e.hasAttribute('inert'));
  others.forEach(e => e.setAttribute('inert', ''));
  const close = () => { others.forEach(e => e.removeAttribute('inert')); back.remove(); prev && prev.focus && prev.focus(); };
  const ok = U.el('button', { class: 'btn ' + (danger ? 'danger' : 'primary'), text: okText, onclick: () => { close(); onOk(); } });
  const cancel = U.el('button', { class: 'btn', text: cancelText, onclick: close });
  m.appendChild(U.el('div', { class: 'btnrow' }, ok, cancel)); back.appendChild(m); document.body.appendChild(back);
  back.addEventListener('keydown', e => { if (e.key === 'Escape') close(); if (e.key === 'Tab') { const f = [ok, cancel]; const i = f.indexOf(document.activeElement); e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + 2) % 2].focus(); } });
  cancel.focus();
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------------- Visual mounting ---------------- */
function mountVisuals(root) {
  root.querySelectorAll('figure.vis[data-vis]').forEach(fig => {
    if (fig.dataset.mounted) return; fig.dataset.mounted = '1';
    const id = fig.dataset.vis; const host = fig.querySelector('.vis-host'); let opts = {};
    try { opts = fig.dataset.opts ? JSON.parse(fig.dataset.opts) : {}; } catch (e) { opts = {}; }
    const fn = VIS[id];
    if (!fn) { host.textContent = 'Visual "' + id + '" unavailable.'; return; }
    try { fn(host, opts); } catch (e) { host.textContent = 'This visual could not be drawn in this browser: ' + e.message; console.warn(e); }
  });
  root.querySelectorAll('[data-reveal]').forEach(b => {
    if (b.dataset.bound) return; b.dataset.bound = '1';
    b.addEventListener('click', () => { const a = document.getElementById(b.dataset.reveal); const open = a.classList.toggle('hide') === false; b.setAttribute('aria-expanded', open); b.textContent = open ? 'Hide answer' : 'Reveal answer'; });
  });
  root.querySelectorAll('pre[data-copy]').forEach(pre => {
    if (pre.dataset.bound) return; pre.dataset.bound = '1';
    if (!pre.hasAttribute('tabindex')) { pre.setAttribute('tabindex', '0'); pre.setAttribute('role', 'region'); pre.setAttribute('aria-label', 'Code listing (scrollable)'); }
    const wrap = U.el('div', { class: 'code' }); pre.parentNode.insertBefore(wrap, pre); wrap.appendChild(pre);
    wrap.appendChild(U.el('button', { class: 'btn small copy', type: 'button', text: 'Copy code', 'aria-label': 'Copy code to clipboard', onclick: async () => { const ok = await U.copy(pre.textContent); toast(ok ? 'Code copied to clipboard.' : 'Copy failed — select the code and copy manually.'); } }));
  });
}

/* ---------------- Router & layout ---------------- */
const main = () => document.getElementById('main');
function setTitle(t) { document.title = t + ' · ' + CONFIG.shortTitle; }
function routeTo(h) { location.hash = h; }

function renderSidebar() {
  const nav = document.getElementById('nav'); nav.innerHTML = '';

    wrap.appendChild(U.el('p', { class: 'small muted', html: 'Keys: <kbd>Space</kbd>/<kbd>Enter</kbd> flip · <kbd>1</kbd> Again · <kbd>2</kbd> Hard · <kbd>3</kbd> Good · <kbd>S</kbd> shuffle · <kbd>→</kbd> skip' }));

/* Tiny, safe markdown subset for notebook previews (input is course-authored) */
function mdLite(s) {
  const esc = U.esc(s);
  return esc.split(/\n{2,}/).map(b => {
    if (/^#{1,4} /.test(b)) { const n = b.match(/^#+/)[0].length; return `<h${n + 2}>${inl(b.replace(/^#+ /, ''))}</h${n + 2}>`; }
    if (/^(- |\* )/m.test(b) && b.split('\n').every(x => /^(- |\* |  )/.test(x))) return '<ul>' + b.split('\n').filter(x => /^(- |\* )/.test(x)).map(x => '<li>' + inl(x.slice(2)) + '</li>').join('') + '</ul>';
    if (/^\d+\. /.test(b)) return '<ol>' + b.split('\n').filter(x => /^\d+\. /.test(x)).map(x => '<li>' + inl(x.replace(/^\d+\. /, '')) + '</li>').join('') + '</ol>';
    return '<p>' + inl(b).replace(/\n/g, '<br>') + '</p>';
  }).join('');
  function inl(t) { return t.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*]+)\*/g, '<i>$1</i>').replace(/\$([^$]+)\$/g, '<i>$1</i>'); }
}

function scoreCapstone(w) {

function nbSelfMinsMet(s) { return !!s && s.mins.length === NB_MINIMUMS.length && s.mins.every(Boolean); }
function sanitizeNbSelf(o) {
